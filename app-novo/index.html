<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>7entidos · App novo (prévia)</title>
<meta name="robots" content="noindex">
<link rel="icon" href="mandala-icone.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Manrope:wght@400;600;700;800&family=Space+Mono&display=swap" rel="stylesheet">
<script src="/pesquisa/config.js"></script>
<style>
/* ===== APP NOVO 7ENTIDOS · Fase 1 (a partir da pesquisa "Monte o app") ===== */
:root{--noite:#0a1128;--noite2:#111b3d;--ouro:#f5c542;--creme:#f4ecdc;--azul:#a9b3d1;--linha:rgba(169,179,209,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--noite);color:var(--creme);font-family:Manrope,system-ui,sans-serif;font-size:19px;line-height:1.45}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse at 50% -10%,#1d2b6b 0%,#111b3d 38%,#0a1128 72%) fixed;overflow-x:hidden;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(169,179,209,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(169,179,209,.05) 1px,transparent 1px);background-size:52px 52px;-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 15%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 20%,#000 15%,transparent 70%)}
body::after{content:"";position:fixed;left:50%;top:38%;width:620px;height:620px;margin:-310px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,var(--glow,rgba(245,197,66,.10)),transparent 65%);transition:background 1s}
button{font-family:inherit}
.topo{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;pointer-events:none;background:linear-gradient(rgba(10,17,40,.92),rgba(10,17,40,.6) 70%,transparent)}
.marca{display:flex;align-items:center;pointer-events:auto}
.marca img{height:52px;width:auto;display:block}
/* MANDALA OFICIAL DO LOGO (imagem mandala.webp). As luzes são os PRÓPRIOS CÍRCULOS da mandala:
   8 círculos em volta (os 7 primeiros, um por sentido, em sentido horário a partir do de cima; o 8º acende quando os 7 estão acesos) + o miolo com o 7 */
.mdl{position:relative;display:inline-block;flex:none;border-radius:50%;transition:box-shadow .8s}
.mdl img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;transition:transform .9s cubic-bezier(.3,1.35,.5,1),filter .7s,opacity .7s}
.mdl .bs{filter:brightness(.36) saturate(.55)}
.mdl.cheia .bs{filter:none}
.mdl .c.fora{transform:translate(var(--tx),var(--ty)) scale(.85);filter:grayscale(.9) brightness(.35);opacity:.55}
.mdl .c.lugar{filter:grayscale(.55) brightness(.55)}
.mdl .c.luz{filter:brightness(1.12) saturate(1.2)}
.mdl .mi{filter:brightness(1.12) saturate(1.15)}
.mdl .mi.apag{filter:grayscale(.6) brightness(.5)}
.mdl .hl{position:absolute;width:36%;height:36%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,var(--c) 0,transparent 68%);opacity:0;transition:opacity .9s;pointer-events:none}
.mdl .hl.mh{width:58%;height:58%}
.mdl .hl.on{opacity:.8}
.mdl.brilha{box-shadow:0 0 26px 4px rgba(245,197,66,.3)}
.mdl.pulsa{animation:mpulsa 1.6s ease-out}
@keyframes mpulsa{0%{box-shadow:0 0 0 0 rgba(245,197,66,.9)}40%{box-shadow:0 0 50px 18px rgba(245,197,66,.55)}100%{box-shadow:0 0 26px 4px rgba(245,197,66,.3)}}
.const .xde7 b.pal{display:block;font:600 19px Fraunces,serif;color:var(--creme);letter-spacing:0;text-transform:none}
.const .xde7 b.pal em{font-style:normal;color:var(--ouro)}
.const .mdl{margin-right:6px}
/* entrada: mandala grande + nome + duração */
.entramdl{display:flex;justify-content:center}
.marcatxt{text-align:center;margin-top:-10px}
.marcatxt b{display:block;font:600 clamp(40px,12vw,56px)/1 Fraunces,serif;color:var(--creme)}
.marcatxt b em{font-style:normal;color:var(--ouro)}
.marcatxt span{display:block;margin-top:8px;color:var(--azul);font-size:17px}
.duracao{font:700 17px "Space Mono",monospace;color:var(--ouro);letter-spacing:.06em;margin:-14px 0 0}
/* tela 3: nome + número numa tela só */
.escmdl{display:flex;flex-direction:column;align-items:center;gap:8px;margin:0 auto 14px}
.nmshow{font:600 26px Fraunces,serif;color:var(--ouro);min-height:34px;transition:opacity .4s}
.escbloco{transition:opacity .6s,transform .6s}
.escbloco.apagado{opacity:.32;transform:translateY(14px)}
.escala.e11{grid-template-columns:repeat(6,1fr);max-width:400px}
.escala.e11 button{font-size:22px}
.escala.e11 button.antes{border:2px dashed rgba(169,179,209,.75);opacity:.6;position:relative}
.escala.e11 button.antes::after{content:"chegada";position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font:400 11px "Space Mono",monospace;color:var(--azul);white-space:nowrap}
.escmdl .mdl{margin-bottom:4px}
.palavra{min-height:34px;margin-top:22px;font-size:19px;font-weight:800;color:var(--azul)}
.palavra b{font:400 30px Fraunces,serif;color:var(--creme);margin-right:6px}
/* constelação de progresso (7 luzes, uma por sentido) */
.const{display:flex;align-items:center;gap:12px;pointer-events:auto;transition:opacity .5s}
.const[hidden]{display:none}
.const .estrelas{position:relative;display:flex;gap:14px;align-items:center;padding:4px 2px}
.const .estrelas::before{content:"";position:absolute;left:10px;right:10px;top:50%;height:1px;background:linear-gradient(90deg,rgba(245,197,66,.35),rgba(169,179,209,.25))}
.const i{position:relative;width:18px;height:18px;border-radius:50%;background:#1d2654;border:1.5px solid #34407a;transition:all .6s}
.const i.on{background:var(--c);border-color:var(--c);box-shadow:0 0 12px 3px var(--c)}
.const i.agora{animation:pulsa 1.8s ease-in-out infinite}
@keyframes pulsa{50%{box-shadow:0 0 22px 7px var(--c)}}
.const .xde7{font:700 16px "Space Mono",monospace;color:var(--ouro);white-space:nowrap}
.const .xde7 small{display:block;font-weight:400;font-size:12px;color:var(--azul);letter-spacing:.08em;text-transform:uppercase}
.voltar{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;all:unset;cursor:pointer;color:var(--azul);font-size:16px;padding:10px 14px;border-radius:999px}
.voltar:hover{color:var(--creme)}
/* PULAR: discreto, no canto de baixo à direita, em todas as telas que pedem resposta ou jogo */
.pularbtn{all:unset;position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;cursor:pointer;color:var(--azul);font-size:16px;padding:10px 14px;border-radius:999px;opacity:.8}
.pularbtn:hover,.pularbtn:focus-visible{color:var(--creme);opacity:1;outline:2px solid rgba(245,197,66,.4)}
.pularbtn[hidden]{display:none}
#porque{position:fixed;inset:0;z-index:60;background:rgba(3,6,18,.6);display:flex;align-items:flex-end;justify-content:center;animation:abrePerto .2s ease-out}
#porque .pq{width:100%;max-width:460px;background:#111a44;border-top:2px solid rgba(245,197,66,.5);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
#porque p{margin:0 0 4px;font-weight:800;font-size:19px;text-align:center}
#porque button{all:unset;cursor:pointer;text-align:center;padding:14px;border-radius:14px;background:rgba(255,255,255,.06);border:1.5px solid rgba(169,179,209,.3);font-weight:800;font-size:17px}
#porque button.volta{background:none;border:none;color:var(--azul);font-weight:600;font-size:15px;padding:6px}

#palco{position:relative;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:128px 18px 130px}
.cena{width:100%;max-width:560px;text-align:center}
.cena.entra{animation:entra .6s cubic-bezier(.2,.8,.2,1) both}
.cena.sai{animation:sai .45s ease-in both}
@keyframes entra{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
@keyframes sai{to{opacity:0;transform:translateY(-70px)}}

.rot{font:400 15px "Space Mono",monospace;color:var(--ouro);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:500;margin:0 0 12px;line-height:1.08}
h1{font-size:clamp(36px,9vw,54px)}
h2{font-size:clamp(28px,7vw,40px)}
h1 em,h2 em{color:var(--ouro)}
.sub{color:var(--azul);font-size:19px;margin:0 0 20px}
.fala{font-family:Fraunces,serif;font-size:clamp(24px,6vw,30px);line-height:1.25;margin:0 0 10px}
.fala2{color:var(--azul);font-size:19px;margin:0 0 26px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:0 34px;border-radius:999px;background:var(--ouro);color:#15110a;font-weight:800;font-size:20px;box-shadow:0 14px 34px -12px rgba(245,197,66,.6);transition:transform .2s}
.btn:active{transform:scale(.97)}
.btn.sec{background:transparent;color:var(--creme);border:1.5px solid rgba(169,179,209,.45);box-shadow:none}
.btn[disabled]{opacity:.35;pointer-events:none}
.miud{font-size:15px;color:var(--azul);margin-top:16px}
.miud.mini{font-size:12px;line-height:1.35;opacity:.85;max-width:340px;margin:14px auto 64px}
.miud a{color:var(--azul)}

/* anel de 7 luzes */
.anel{position:relative;width:200px;height:200px;margin:0 auto 22px}
.anel::before{content:"";position:absolute;inset:14px;border-radius:50%;border:1px solid rgba(245,197,66,.3)}
.anel i{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:var(--c);box-shadow:0 0 12px 3px var(--c);transform:rotate(var(--a)) translateY(-86px);transition:all .8s}
.anel.respira i{animation:respira 3s ease-in-out infinite;animation-delay:var(--d)}
@keyframes respira{0%,100%{opacity:.4;box-shadow:0 0 5px 1px var(--c)}50%{opacity:1;box-shadow:0 0 20px 7px var(--c)}}
.anel i.apag{opacity:.18;box-shadow:none}
.anel i.acesa{width:30px;height:30px;margin:-15px;opacity:1;box-shadow:0 0 26px 10px var(--c),0 0 70px 20px var(--c);animation:acende 1.2s ease-out}
@keyframes acende{from{width:10px;height:10px;margin:-5px;opacity:.2}}
.anel.comfoto{width:250px;height:250px}
.anel.comfoto i{transform:rotate(var(--a)) translateY(-111px)}
.anel.comfoto img{position:absolute;inset:26px;width:calc(100% - 52px);height:calc(100% - 52px);border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px rgba(245,197,66,.55),0 0 50px rgba(245,197,66,.35),0 20px 40px rgba(0,0,0,.6)}
.anel .centro{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:40px}
.nomesent{font:700 16px "Space Mono",monospace;letter-spacing:.14em;text-transform:uppercase}

/* opções (texto) */
.opts{display:grid;gap:12px;margin:0 auto;max-width:440px}
.opt{all:unset;cursor:pointer;display:block;padding:18px 22px;border-radius:18px;background:rgba(32,48,100,.5);border:1.5px solid var(--linha);font-weight:700;font-size:20px;transition:.25s;text-align:center}
.opt:hover{border-color:rgba(245,197,66,.55)}
.opt.sel{border-color:var(--ouro);background:rgba(245,197,66,.16);box-shadow:0 0 0 3px rgba(245,197,66,.25)}

/* vaso */
.vaso{width:min(300px,82vw);height:auto;border-radius:18px;box-shadow:0 26px 50px -18px rgba(0,0,0,.8);margin:6px auto 18px;display:block}

/* escala 0 a 10 */
.regua{display:flex;gap:14px;align-items:center;justify-content:center;max-width:460px;margin:8px auto 0}
.regua .escala{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;flex:0 0 auto;width:min(56vw,210px);margin:0}
.regua .escala button{font-size:22px;border-color:color-mix(in srgb,var(--k) 55%,transparent)!important}
.regua .escala button.sel{background:var(--k)!important;color:#0b1020;box-shadow:0 0 24px var(--k)!important}
.visor{flex:1;min-width:120px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.visor .orbe{--k:#2a3a7a;--f:.3;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff8,var(--k) 45%,transparent 72%);opacity:var(--f);box-shadow:0 0 calc(var(--f)*60px) calc(var(--f)*18px) var(--k);transform:scale(calc(.75 + var(--f)*.35));transition:all .45s cubic-bezier(.3,1.4,.5,1)}
.visor b{font:400 44px/1 Fraunces,serif;color:#f4ecdc}
.visor span:last-child{font-size:17px;font-weight:800;color:var(--azul);min-height:2.4em;transition:color .3s}
.visor.on span:last-child{color:#f4ecdc}
.escala{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;max-width:440px;margin:6px auto 0}
.escala button{all:unset;cursor:pointer;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:Fraunces,serif;font-size:24px;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.08),rgba(17,27,61,.9));border:1.5px solid var(--linha);transition:.25s}
.escala button:hover{border-color:var(--ouro)}
.escala button.sel{background:var(--ouro);color:#15110a;box-shadow:0 0 22px rgba(245,197,66,.7)}
.escala .pontas{grid-column:1/-1;display:flex;justify-content:space-between;font-size:15px;color:var(--azul);margin-top:2px}

/* grade 2x2 de fotos */
.g22{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:480px;margin:0 auto}
.foto{all:unset;cursor:pointer;position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/3.4;background:#111b3d;border:2px solid transparent;box-shadow:0 14px 30px -14px rgba(0,0,0,.8);transition:.25s}
.foto img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.foto:hover img{transform:scale(1.05)}
.foto .nm{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;font-weight:800;font-size:17px;line-height:1.2;text-align:left;background:linear-gradient(transparent,rgba(5,8,22,.92))}
.foto.sel{border-color:var(--ouro);box-shadow:0 0 0 3px rgba(245,197,66,.35),0 0 30px rgba(245,197,66,.4)}
.ouvir{position:absolute;right:8px;top:8px;all:unset;cursor:pointer;position:absolute;right:8px;top:8px;padding:8px 12px;border-radius:999px;background:rgba(5,8,22,.75);border:1px solid rgba(245,197,66,.6);font-weight:800;font-size:14px;color:var(--ouro)}
.ouvir.tocando{background:var(--ouro);color:#15110a}

/* jogos */
.dica{color:var(--azul);font-size:18px;margin:0 0 18px}
.missao{font-size:16px;line-height:1.35;color:#f4ecdc;background:rgba(255,255,255,.05);border-left:4px solid var(--c);border-radius:10px;padding:8px 12px;margin:0 auto 10px;max-width:440px;text-align:left}
.missao b{color:var(--c)}
.luzes{display:flex;justify-content:center;gap:14px;margin:14px 0 4px}
.luzes i{width:18px;height:18px;border-radius:50%;border:2px solid rgba(169,179,209,.45);background:transparent;transition:background .3s,box-shadow .3s,border-color .3s}
.luzes i.on{background:var(--c);border-color:var(--c);box-shadow:0 0 14px var(--c)}
.luzes i.off{border-color:rgba(169,179,209,.18)}
.luzes i.pop{animation:luzpop .45s ease-out}
@keyframes luzpop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.bonusq{font-size:22px;margin:16px 0 10px}
/* modo foco: durante o jogo, topo e botões quase somem; bordas escurecem com a cor do sentido */
body.foco .topo,body.foco #pularbtn,body.foco #voltar{opacity:.14;transition:opacity .5s}
body.foco .topo:hover,body.foco #pularbtn:focus-visible,body.foco #voltar:focus-visible{opacity:.6}
#vinheta{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .6s;box-shadow:inset 0 0 120px 40px rgba(3,6,18,.92),inset 0 0 220px 60px var(--foco,transparent)}
body.foco #vinheta{opacity:.55}
.brisafrase{font-family:Fraunces,serif;font-style:italic;font-size:18px;line-height:1.35;color:#f4ecdc;opacity:.9;margin:0 auto 8px;max-width:440px}
.brisafrase::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);margin-right:8px;vertical-align:middle}
.aro{position:relative;width:190px;height:190px;margin:4px auto 10px}
.aro svg{width:100%;height:100%;transform:rotate(-90deg)}
.aro .trilho{fill:none;stroke:rgba(169,179,209,.14);stroke-width:5}
.aro .fecha{fill:none;stroke:var(--c);stroke-width:5;stroke-linecap:round;stroke-dasharray:578;stroke-dashoffset:578;filter:drop-shadow(0 0 6px var(--c));animation:aroFecha var(--seg) linear forwards}
@keyframes aroFecha{to{stroke-dashoffset:0}}
.escuro{background:radial-gradient(circle,rgba(3,6,18,.2),rgba(3,6,18,.92) 70%);border-radius:28px;padding:16px 10px 12px;margin:0 auto 6px;max-width:420px}
.luzverde{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border-radius:50%;background:radial-gradient(circle,#c9f7d8 0%,var(--c) 40%,transparent 72%);box-shadow:0 0 40px 12px var(--c);animation:respiraLuz 5s ease-in-out infinite}
@keyframes respiraLuz{0%,100%{transform:scale(.55);opacity:.55}50%{transform:scale(1.25);opacity:1}}
.mosaico{display:flex;justify-content:center;gap:6px;margin:0 auto 12px;max-width:380px}
.mosaico .pc{flex:1;aspect-ratio:3/4;border-radius:8px;border:1.5px solid rgba(169,179,209,.25);background:rgba(255,255,255,.04);overflow:hidden;position:relative}
.mosaico .pc.agora{border-color:var(--c);box-shadow:0 0 10px var(--c);animation:pulsaPc 1.6s ease-in-out infinite}
@keyframes pulsaPc{50%{box-shadow:0 0 2px var(--c)}}
.mosaico .pc.cheio{border-color:var(--c);box-shadow:0 0 8px -1px var(--c)}
.mosaico .pc img{width:100%;height:100%;object-fit:cover;display:block}
.mosaico.grande{max-width:470px;gap:8px;flex-wrap:wrap;margin:6px auto 20px}
.mosaico.grande .pc{flex:0 0 calc(25% - 6px);border-radius:14px;border-width:2px}
.mosaico.grande .pc span{font-family:Manrope,system-ui,sans-serif;position:absolute;left:0;right:0;bottom:0;padding:14px 4px 5px;font-size:12px;font-weight:800;line-height:1.15;background:linear-gradient(transparent,rgba(5,8,22,.92))}
.voa{position:fixed;z-index:30;object-fit:cover;border-radius:18px;pointer-events:none;transition:all .6s cubic-bezier(.5,0,.2,1)}
.perto{position:fixed;inset:0;z-index:40;background:rgba(3,6,18,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;animation:abrePerto .25s ease-out}
.perto img{max-width:100%;max-height:72vh;border-radius:20px;border:2px solid var(--c);box-shadow:0 0 40px -6px var(--c)}
.perto span{font-weight:800;font-size:22px}.perto small{color:var(--azul);font-size:15px}
@keyframes abrePerto{from{opacity:0;transform:scale(.96)}}
.foto,.foto img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.denovojogo{all:unset;cursor:pointer;display:block;margin:14px auto 0;color:var(--azul);text-decoration:underline;font-size:16px}
.fundobtn{all:unset;cursor:pointer;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;font-size:14px;color:var(--azul);padding:8px 14px;border-radius:999px;background:rgba(10,17,40,.85);border:1px solid rgba(169,179,209,.3);white-space:nowrap}
.fundobtn[hidden]{display:none}.fundobtn[disabled]{opacity:.6;cursor:default}
.pisca2{animation:pisca2 1.4s ease-in-out infinite;color:var(--ouro)!important;font-size:16px}
@keyframes pisca2{50%{opacity:.25}}
.retratotit{font-size:clamp(40px,11vw,54px)!important;line-height:1.05;margin:6px 0 10px}
.jtit{margin:4px 0 6px}
.dica.curta{font-size:18px;margin:0 0 12px}
.sons .som{position:relative}
.som .nsom{position:absolute;top:8px;left:10px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px}
.som.um{border-color:#4aa8ff!important;background:rgba(74,168,255,.14)!important}.som.um .nsom{background:#4aa8ff;color:#0b1020}
.som.dois{border-color:#f5c542!important;background:rgba(245,197,66,.12)!important;border-radius:20px 6px 20px 6px!important}.som.dois .nsom{background:#f5c542;color:#0b1020}
.trava{max-width:440px;margin:6px auto 0;padding:18px 16px;border-radius:22px;background:rgba(18,27,72,.7);border:1.5px solid rgba(245,197,66,.4)}
.trava .cadeado{font-size:34px}.trava h2{margin:4px 0 6px}
#aviso{display:flex;flex-direction:column;gap:10px;margin-top:8px}
#aviso input[type=text],#aviso input:not([type]),#aviso input[type=email]{font:600 18px Manrope,system-ui,sans-serif;color:#f4ecdc;background:#0b1236;border:1.5px solid rgba(169,179,209,.35);border-radius:14px;padding:13px 14px}
#aviso .lgpd{display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:14px;line-height:1.4;color:var(--azul)}
#aviso .lgpd input{width:22px;height:22px;flex:0 0 22px;margin-top:1px;accent-color:#f5c542}
#aviso .lgpd a{color:var(--azul)}
.averr{color:#ff9aa6;font-size:15px;min-height:1em}
.avok{font-size:20px;font-weight:800;color:var(--ouro)}
.rodada{font:400 15px "Space Mono",monospace;color:var(--azul);margin-bottom:10px}
.grade4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:400px;margin:0 auto}
.grade4 button{all:unset;cursor:pointer;aspect-ratio:1;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.grade4 button.ok{box-shadow:0 0 0 4px #9be7b0}
.grade4 button.bad{box-shadow:0 0 0 4px #ff8a80}
.res{min-height:30px;margin-top:14px;font-weight:700}
.res .bom{color:#9be7b0}.res .nao{color:#ffb3ab}

.sons{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:440px;margin:0 auto 18px}
.som{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 10px;border-radius:20px;background:rgba(32,48,100,.5);border:1.5px solid var(--linha);font-weight:800;font-size:18px}
.som .onda{width:72px;height:36px}
.som.tocando{border-color:#4aa8ff;box-shadow:0 0 24px rgba(74,168,255,.5)}

/* carinho */
.texturas{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:460px;margin:0 auto}
.tex{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;border:2px solid transparent;box-shadow:0 14px 30px -14px rgba(0,0,0,.8);cursor:grab}
.tex img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tex .nm{position:absolute;left:0;right:0;bottom:0;padding:20px 12px 10px;font-weight:800;font-size:17px;text-align:left;background:linear-gradient(transparent,rgba(5,8,22,.9));pointer-events:none}
.tex .barra{position:absolute;left:10px;right:10px;top:10px;height:6px;border-radius:9px;background:rgba(5,8,22,.6);overflow:hidden;pointer-events:none}
.tex .barra b{display:block;height:100%;width:0;background:#ff8a3d;box-shadow:0 0 10px #ff8a3d;transition:width .15s}
.tex.feita{border-color:#ff8a3d}
.tex.feita::after{content:"✓";position:absolute;right:10px;top:22px;width:30px;height:30px;border-radius:50%;background:#ff8a3d;color:#2a1103;font-weight:800;display:grid;place-items:center;font-size:18px}
.dica2{color:var(--creme);font-size:19px;font-weight:700;margin:-4px 0 16px}
.mao{position:absolute;left:18%;top:42%;width:58px;height:58px;pointer-events:none;z-index:2;animation:desliza 1.8s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.mao svg{width:100%;height:100%}
.mao::before{content:"";position:absolute;left:6px;top:4px;width:18px;height:18px;border-radius:50%;background:rgba(255,200,150,.55);animation:toque 1.8s ease-in-out infinite}
@keyframes desliza{0%{transform:translateX(0)}50%{transform:translateX(90%)}100%{transform:translateX(0)}}
@keyframes toque{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}
.texturas.tocou .mao{display:none}
.tex .rastro{position:absolute;width:44px;height:44px;margin:-22px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,200,150,.6),transparent 70%);opacity:0;transition:opacity .3s}

/* prato */
.mesa{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:0 auto 16px;border-radius:50%;
 background:radial-gradient(circle,#f6f1e8 52%,#ddd5c6 53%,#f1ebdf 61%,#cfc4b2 64%,rgba(0,0,0,0) 65%);filter:drop-shadow(0 22px 30px rgba(0,0,0,.7))}
.mesa .ing{position:absolute;width:34%;aspect-ratio:1;animation:cai .55s cubic-bezier(.3,1.4,.5,1) both}
.mesa .ing img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
@keyframes cai{from{transform:translateY(-60px) scale(1.3);opacity:0}}
.mesa.pronto{animation:brilha 1.6s ease-in-out}
@keyframes brilha{50%{filter:drop-shadow(0 0 40px rgba(245,197,66,.8))}}
.ingr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:460px;margin:0 auto}
.ingr button{all:unset;cursor:pointer;border-radius:14px;padding:8px 4px 6px;background:rgba(32,48,100,.5);border:1.5px solid var(--linha);font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.ingr button img{width:56px;height:56px;object-fit:contain}
.ingr button.sel{border-color:#ff5a6e;background:rgba(255,90,110,.15)}
.ingr button[disabled]{opacity:.4}
.pratonome{min-height:28px;font-family:Fraunces,serif;font-size:21px;margin-bottom:12px}

/* pares de cheiros */
.pares{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:0 auto}
.carta{all:unset;cursor:pointer;display:block;width:100%;aspect-ratio:3/4;border-radius:16px;perspective:600px}
.carta .in{display:block;position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.carta.vira .in{transform:rotateY(180deg)}
.carta .f,.carta .v{display:block;position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.carta .f{background:radial-gradient(circle at 50% 40%,#203064,#0d1534);border:1.5px solid rgba(92,207,138,.45);display:grid;place-items:center}
.carta .f svg{width:46%}
.carta .v{transform:rotateY(180deg);background:#111b3d}
.carta .v img{width:100%;height:100%;object-fit:cover}
.carta .v span{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 6px;font-size:13px;font-weight:800;background:linear-gradient(transparent,rgba(5,8,22,.92))}
.carta.ok .v{box-shadow:inset 0 0 0 3px #5ccf8a}

/* segure firme */
.firme{position:relative;width:190px;height:190px;margin:0 auto 10px;touch-action:none;user-select:none;-webkit-user-select:none}
.firme svg{width:100%;height:100%}
.firme .alvo{position:absolute;inset:47px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#c9a8ff,#6b45c9 70%);box-shadow:0 0 40px rgba(180,140,255,.55);display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;cursor:pointer}
.firme.segurando .alvo{transform:scale(.96);box-shadow:0 0 60px rgba(180,140,255,.9)}

/* pular este jogo (aparece discreto depois de 2 tentativas que não deram certo) */
.pular{all:unset;cursor:pointer;display:block;margin:14px auto 0;padding:10px 18px;font-size:16px;color:var(--azul);text-decoration:underline;text-underline-offset:4px;border-radius:999px;animation:entra .5s both}
.pular:hover,.pular:focus-visible{color:#f4ecdc;outline:2px solid rgba(245,197,66,.5);outline-offset:2px}
.legenda .pulado{color:var(--azul);font-style:italic}

/* corpo que acende */
.corpo{width:min(250px,64vw);margin:0 auto 10px;display:block}
.corpo .parte{fill:rgba(63,214,208,0);stroke:none;cursor:pointer;transition:fill .4s}
.corpo .parte.on{fill:rgba(63,214,208,.55);filter:url(#brilho)}
.corpo .linha{fill:none;stroke:#f5c542;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:url(#luz);pointer-events:none}
.partes{min-height:26px;color:var(--azul);font-size:17px;margin-bottom:12px}

/* Caça aos cheiros (Olfato) */
.olhos{font:400 15px "Space Mono",monospace;color:var(--azul);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:480px;margin:0 auto 14px}
.chips button{all:unset;cursor:pointer;padding:13px 18px;border-radius:999px;font-weight:700;font-size:18px;background:rgba(32,48,100,.5);border:1.5px solid var(--linha);transition:.2s}
.chips button.sel{background:rgba(92,207,138,.2);border-color:#5ccf8a;color:#d6ffe4}
.chips button[disabled]{opacity:.35}
.outro{display:flex;gap:8px;max-width:420px;margin:0 auto 12px}
.outro input{flex:1;min-height:52px;padding:0 16px;border-radius:14px;border:1.5px solid var(--linha);background:rgba(10,17,40,.8);color:var(--creme);font:600 18px Manrope,sans-serif}
.outro input:focus{outline:none;border-color:#5ccf8a}
.outro button{all:unset;cursor:pointer;padding:0 18px;border-radius:14px;background:rgba(92,207,138,.2);border:1.5px solid #5ccf8a;font-weight:800}
.conta{font:700 16px "Space Mono",monospace;color:#5ccf8a;margin-bottom:12px}
.campeao{font-family:Fraunces,serif;font-size:clamp(38px,11vw,52px);color:#5ccf8a;margin:6px 0 8px;text-shadow:0 0 30px rgba(92,207,138,.45)}
/* Mapa do agora (Noção do corpo) */
.sentes{display:none;flex-wrap:wrap;gap:8px;justify-content:center;max-width:460px;margin:0 auto 12px;padding:12px;border-radius:18px;background:rgba(10,17,40,.7);border:1px solid var(--linha)}
.sentes.on{display:flex}
.sentes p{width:100%;margin:0 0 4px;font-weight:800;font-size:18px}
.sentes button{all:unset;cursor:pointer;padding:12px 18px;border-radius:999px;font-weight:800;font-size:18px;border:1.5px solid var(--k);color:var(--k)}
.corpo .parte.on{fill:var(--k,rgba(63,214,208,.55))}
.gesto{font-family:Fraunces,serif;font-size:clamp(26px,7vw,34px);line-height:1.25;margin:4px 0 10px}
/* Saborear: olhe, respire, guarde */
.saborear .dentro{text-shadow:0 2px 14px rgba(0,0,0,.9),0 0 4px rgba(0,0,0,.8)}
.saborear .dentro .fala{font-size:clamp(30px,8vw,38px)}
.saborear .fundo::after{background:radial-gradient(ellipse at 50% 50%,rgba(10,17,40,.55),rgba(10,17,40,.9) 80%)!important}
.saborear .passo3{font-size:17px!important;font:400 15px "Space Mono",monospace;color:var(--ouro);letter-spacing:.12em;text-transform:uppercase}
.saborear .bola{width:170px;height:170px;border-radius:50%;margin:8px auto;border:4px solid #f5c542;background:radial-gradient(circle,rgba(245,197,66,.25),transparent 70%);box-shadow:0 0 40px rgba(245,197,66,.35) inset,0 0 40px rgba(245,197,66,.25);transform:scale(.6);transition:transform 4s ease-in-out}
.saborear .bola.cheia{transform:scale(1)}
.saborear .carta{position:relative;width:170px;aspect-ratio:3/4;margin:8px auto;border-radius:18px;overflow:hidden;border:3px solid #f5c542;box-shadow:0 0 40px rgba(245,197,66,.5);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;transition:transform .6s}
.saborear .carta img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.saborear .carta .enche{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(transparent,rgba(245,197,66,.75));pointer-events:none}
.saborear .carta.guardada{transform:rotateY(360deg) scale(1.05);box-shadow:0 0 60px 10px rgba(245,197,66,.6)}
.saborear .carta.guardada::after{content:"Guardada";position:absolute;left:0;right:0;bottom:12px;text-align:center;font:800 18px Manrope,sans-serif;color:#15110a}
.dourada{display:grid;justify-items:center;gap:8px}
.dourada .carta2{width:150px;aspect-ratio:3/4;border-radius:16px;overflow:hidden;border:3px solid #f5c542;box-shadow:0 0 40px rgba(245,197,66,.45)}
.dourada .carta2 img{width:100%;height:100%;object-fit:cover;display:block}

/* Vídeo da Brisa (vertical) */
.vbrisa{position:relative;height:min(60vh,640px);max-width:92vw;aspect-ratio:9/16;margin:0 auto 14px;border-radius:24px;overflow:hidden;border:2px solid rgba(245,197,66,.55);box-shadow:0 0 40px rgba(245,197,66,.25),0 30px 50px -20px rgba(0,0,0,.9);background:#05081a}
.vbrisa video{width:100%;height:100%;object-fit:cover;display:block}
.vbrisa .vslot,.vbrisa .vslot video{width:100%;height:100%}
.vbrisa video{cursor:pointer}
.legfora{max-width:min(94vw,440px);margin:0 auto 12px;min-height:2.7em;font-size:22px;font-weight:700;line-height:1.3;text-align:center;color:var(--creme)}
.legfora[hidden]{display:none}
.vbotoes .ouvirb.on{background:rgba(245,197,66,.18);color:var(--ouro)}
.vbotoes .ouvirb.on::after{content:" ✓"}
.vbotoes{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:12px}
.entrar{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.entrarlogo{width:min(84vw,360px);height:auto}
.vbrisa .teste{position:absolute;left:8px;top:8px;padding:4px 10px;border-radius:999px;background:rgba(245,197,66,.9);color:#15110a;font:700 12px "Space Mono",monospace}
.ouvirb{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;border:2px solid var(--ouro);color:var(--ouro);font-weight:800;font-size:19px;margin:0 0 14px;background:rgba(245,197,66,.08)}
.ouvirb.on{background:var(--ouro);color:#15110a}
.denovo{all:unset;cursor:pointer;display:block;margin:0 auto 12px;color:var(--azul);text-decoration:underline;font-size:16px}
.denovo[hidden]{display:none}
.vbotoes .ouvirb{min-height:34px;padding:0 14px;font-size:14px;font-weight:700;border:1px solid var(--linha);color:var(--azul);background:transparent;margin:0;opacity:.75}
.vbotoes .ouvirb.on{background:transparent;color:var(--creme);border-color:rgba(245,197,66,.4)}
.btn.cta{min-height:68px;padding:0 46px;font-size:23px;box-shadow:0 0 0 0 rgba(245,197,66,.6),0 16px 40px -10px rgba(245,197,66,.75);animation:ctapulsa 2.2s ease-in-out infinite}
@keyframes ctapulsa{0%,100%{box-shadow:0 0 0 0 rgba(245,197,66,.55),0 16px 40px -10px rgba(245,197,66,.75)}50%{box-shadow:0 0 0 12px rgba(245,197,66,0),0 16px 40px -10px rgba(245,197,66,.75)}}
.legfora.menor{font-size:17px;font-weight:600;min-height:2.6em}
.logocom{display:block;width:min(80vw,340px);height:auto;margin:-46px auto 18px}
/* nome na tela da escala */
.nome{max-width:420px;margin:0 auto 26px;text-align:left}
.nome label{display:block;font-family:Fraunces,serif;font-size:clamp(26px,7vw,32px);margin-bottom:10px;text-align:center}
.nome input{width:100%;min-height:58px;padding:0 18px;border-radius:16px;border:1.5px solid var(--linha);background:rgba(10,17,40,.8);color:var(--creme);font:600 21px Manrope,sans-serif;text-align:center}
.nome input:focus{outline:none;border-color:var(--ouro);box-shadow:0 0 0 4px rgba(245,197,66,.18)}
.nome small{display:block;text-align:center;color:var(--azul);font-size:15px;margin-top:6px}

/* curtiu */
.curtiu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:440px;margin:0 auto}
.curtiu button{all:unset;cursor:pointer;padding:18px 6px;border-radius:18px;background:rgba(32,48,100,.5);border:1.5px solid var(--linha);font-weight:800;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.curtiu button .lz{display:flex;gap:4px}.curtiu button .lz i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.curtiu button.sel{border-color:var(--ouro);background:rgba(245,197,66,.14)}

.curtiu-in{margin-top:22px;padding-top:18px;border-top:1px solid var(--linha);animation:entra .5s cubic-bezier(.2,.8,.2,1) both}
.curtiu-in h3{font-family:Fraunces,serif;font-weight:500;font-size:24px;margin:0 0 12px}

/* fim da Fase 1: retrato rápido */
.retrato{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:460px;margin:6px auto 20px}
.retrato .r{width:calc(25% - 6px);position:relative;border-radius:14px;overflow:hidden;aspect-ratio:3/4;border:2px solid var(--c);box-shadow:0 0 14px -2px var(--c),0 12px 24px -12px rgba(0,0,0,.8)}
.retrato .r img{width:100%;height:100%;object-fit:cover;display:block}
.retrato .r span{position:absolute;left:0;right:0;bottom:0;padding:14px 4px 5px;font-size:11.5px;font-weight:800;line-height:1.15;background:linear-gradient(transparent,rgba(5,8,22,.92))}
@media (min-width:420px){.retrato .r span{font-size:13px}}

/* saborear */
.saborear{position:fixed;inset:0;z-index:4;display:grid;place-items:center;text-align:center;padding:24px}
.saborear .fundo{position:absolute;inset:0;background-size:cover;background-position:center;animation:zoomlento 22s linear both}
.saborear .fundo::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(10,17,40,.25),rgba(10,17,40,.85) 80%)}
@keyframes zoomlento{from{transform:scale(1)}to{transform:scale(1.08)}}
.saborear .dentro{position:relative;display:grid;justify-items:center;gap:6px;max-width:520px}
.saborear .seg{font:400 15px "Space Mono",monospace;color:var(--azul);margin-top:8px}

/* revelação */
.grande{font-family:Fraunces,serif;font-size:clamp(84px,24vw,140px);line-height:1;color:var(--ouro);text-shadow:0 0 40px rgba(245,197,66,.45);margin:4px 0 0}
.unid{font-family:Fraunces,serif;font-size:26px;margin-bottom:22px}
.pisca{font-family:Fraunces,serif;font-style:italic;font-size:clamp(26px,6.5vw,34px);margin:0 0 28px;animation:pisc 1.6s ease-in-out infinite}
@keyframes pisc{0%,100%{opacity:1;text-shadow:0 0 18px rgba(245,197,66,.6)}50%{opacity:.25;text-shadow:none}}

/* gráfico */
.graf{position:relative;width:min(340px,86vw);aspect-ratio:1;margin:0 auto 14px}
.graf .l{position:absolute;border-radius:50%;background:var(--c);transform:translate(-50%,-50%);transition:all 1.2s cubic-bezier(.2,.8,.2,1)}
.graf .t{position:absolute;font-size:14px;font-weight:700;color:var(--azul);transform:translate(-50%,-50%);white-space:nowrap;text-align:center;line-height:1.1}
.graf .meio{position:absolute;inset:31%;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,rgba(17,27,61,.9),rgba(10,17,40,0) 72%)}
.gcard{display:none;padding:26px 20px 22px;border-radius:26px;background:linear-gradient(160deg,rgba(35,50,110,.7),rgba(17,27,61,.85));border:1px solid var(--linha);box-shadow:0 30px 60px -30px rgba(0,0,0,.9);margin:0 auto 18px;max-width:460px}
.gcard.on{display:block;animation:entra .5s cubic-bezier(.2,.8,.2,1) both}
.gcard .titc{font:400 15px "Space Mono",monospace;color:var(--azul);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.gcard .forte{font-family:Fraunces,serif;font-size:clamp(44px,13vw,60px);line-height:1.02;margin:10px 0 8px}
.gcard .luzg{width:64px;height:64px;border-radius:50%;margin:8px auto 14px;background:var(--c);box-shadow:0 0 30px 10px var(--c);animation:pulsa 2.4s ease-in-out infinite}
.gcard .txt{font-size:21px;line-height:1.4}
.gcard .graf .t{font-size:15px}
.jxj{display:grid;gap:10px;text-align:left;margin:4px 0 0}
.jxj div{display:flex;align-items:center;gap:12px;font-size:21px;padding:10px 4px;border-bottom:1px solid var(--linha)}
.jxj div:last-child{border-bottom:none}
.jxj i{width:16px;height:16px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:none}
.jxj b{font-weight:800;flex:1}
.jxj span{color:var(--azul);font-size:19px}
.jxj span.pulado{font-style:italic}
.gpontos{display:flex;gap:10px;justify-content:center;margin:0 0 18px}
.gpontos button{all:unset;cursor:pointer;width:12px;height:12px;border-radius:50%;background:#2a3570}

<script>

   e troque as legendas abaixo pelas falas exatas do vídeo (segundo de início, segundo de fim, texto). */

/* legenda do vídeo 3: fica vazia até o Daniel confirmar o texto exato do vídeo (sem legenda, o botão "Legenda" não aparece) */
const LEG3 = [];
const LEG1 = [[0.8,3.0,"Oi! Eu sou a Brisa."],[3.0,6.9,"Aqui não tem resposta certa nem errada, só o que você sente."],[6.9,9.6,"A cada passo, a gente te conhece melhor:"],[9.6,13.6,"suas escolhas, seus desafios, suas sensações."],[13.6,17.5,"Com as suas respostas e com base em muito estudo e pesquisa,"],[17.5,19.5,"o app encontra os seus padrões"],[19.5,23.1,"e te propõe coisas novas, que você nem imaginava,"],[23.1,24.4,"para sentir o que te faz bem."],[24.4,27.0,"Por isso, responda com o coração."],[27.0,28.9,"Vamos começar?"]];
const LEG2 = [[1.0,3.0,"Você já me contou do que gosta."],[3.0,4.7,"Agora vem a outra metade:"],[4.7,7.3,"desafios rápidos para os seus sentidos, um para cada."],[7.3,10.9,"Eles mostram como você sente, e não só o que escolhe."],[10.9,13.3,"Cada um revela um pouco mais de você."],[13.3,15.9,"Se entregue, e repare no que acontece."],[15.9,17.5,"Vamos?"]];
const PREVIA = !/^(www\.)?7entidos\.com\.br$/i.test(location.hostname) || /[?&]previa/.test(location.search) || location.pathname.indexOf("/app-novo")===0;

const SENT = [
 {id:"visao", missao:"achar o quadrado de cor diferente · 3 rodadas · revela o quanto seus olhos pegam detalhes.", s:"Visão", cor:"#f5c542", q:"O que te faz bem de olhar?", o:["Pôr do sol na praia","Céu estrelado","Um mural colorido de grafite","Fotos antigas de família"], brisa:"Comece pelos olhos.", jogo:"Olho de águia"},
 {id:"audicao", missao:"dizer qual som é mais fino · 3 rodadas · revela o quanto seu ouvido separa sons parecidos.", s:"Audição", cor:"#4aa8ff", q:"O que te faz bem ouvir?", o:["Som do mar","Música ao vivo","Chuva no telhado","Silêncio total"], sons:["mar","musica","chuva","silencio"], brisa:"Agora, feche os olhos e escute.", jogo:"Qual som é mais fino?"},
 {id:"tato", missao:"fazer carinho nas 4 fotos · 1 passada em cada · revela que toque a sua pele prefere.", s:"Tato", cor:"#ff8a3d", q:"O que te faz bem de sentir na pele?", o:["Areia nos pés","Cobertor macio","Água gelada","Abraço apertado"], brisa:"Sinta com a ponta dos dedos.", jogo:"Carinho"},
 {id:"paladar", missao:"montar um prato com 3 ingredientes · 1 prato · revela as combinações que te atraem.", s:"Paladar", cor:"#ff5a6e", q:"Que sabor te faz bem?", o:["Comida de vó","Doce de padaria","Fruta fresca","Café passado na hora"], brisa:"Pense no sabor que te acolhe.", jogo:"Monte o seu prato"},
 {id:"olfato", missao:"achar 3 cheiros à sua volta · 1 rodada · revela o quanto você nota o ar ao seu redor.", s:"Olfato", cor:"#5ccf8a", q:"Que cheiro te faz bem?", o:["Terra molhada","Pão saindo do forno","Perfume de alguém querido","Cheiro de café"], brisa:"Respire fundo. O cheiro também lembra.", jogo:"Caça aos cheiros"},
 {id:"equilibrio", missao:"segurar firme até a luz fechar · até conseguir · revela a sua firmeza.", s:"Equilíbrio", cor:"#b48cff", q:"Que movimento te faz bem?", o:["Dançar","Balançar numa rede","Andar de bicicleta","Ficar de pé numa prancha"], brisa:"Encontre o seu centro.", jogo:"Segure firme"},
 {id:"corpo", missao:"marcar onde você sente algo agora · até 3 lugares · revela como o seu corpo está neste momento.", s:"Noção do corpo", cor:"#3fd6d0", q:"O que te faz bem no corpo?", o:["Alongar","Correr","Nadar","Deitar e respirar fundo"], brisa:"Por último, perceba o seu corpo.", jogo:"Mapa do agora"}
];
const foto = (sid,i) => IMG+sid+"-"+(i+1)+".jpg";
const TEMPOS = ["Menos de 3 minutos","De 3 a 6 minutos","De 6 a 10 minutos","10 minutos ou mais"];
const TEMPO_LIM = [3,6,10,Infinity];

/* ============ ROTEIRO (uma tela por vez) ============ */
/* FASE 1: Brisa, vaso, nota de chegada e as 7 perguntas de gosto.
   FASE 2: passagem da Brisa, os 7 jogos (com o "quanto curtiu" na própria tela), saborear, nota de saída, chute, revelação e gráfico. */
const R = [{t:"brisa",f:1},{t:"escala",id:"chegada",f:1},{t:"vaso",f:1}];
SENT.forEach((s,i)=>{ R.push({t:"gosto",i,f:1}); });
R.push({t:"fim1",f:1});
R.push({t:"abre2",f:2});
SENT.forEach((s,i)=>{ R.push({t:"jogo",i,f:2}); });
R.push({t:"saborear",f:2},{t:"escala",id:"saida",f:2},{t:"chute",f:2},{t:"revela",f:2},{t:"grafico",f:2},{t:"trava3",f:2});

let pos=0, resp={}, inicio=null, inicio2=null, ocupado=false;
const palco=document.getElementById("palco");
const esc=t=>String(t).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

/* ============ SOM E VIBRAÇÃO ============ */
let ac=null;
function somPronto(){ try{ if(navigator.audioSession&&navigator.audioSession.type!=="playback") navigator.audioSession.type="playback"; }catch(e){}
  if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); const b=ac.createBuffer(1,1,22050), s=ac.createBufferSource(); s.buffer=b; s.connect(ac.destination); s.start(0); }catch(e){ return Promise.reject(); } }
  if(ac.state!=="running"){ try{ return ac.resume().then(()=>ac,()=>ac); }catch(e){} } return Promise.resolve(ac); }
/* pisca clássico de carro: o mesmo som dos toques da Jornada */
function click(){ somPronto().then(c=>{ try{ const t=c.currentTime, o=c.createOscillator(), f=c.createBiquadFilter(), g=c.createGain(); o.type="square"; o.frequency.setValueAtTime(150,t); f.type="lowpass"; f.frequency.value=900; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.2,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+.07); o.connect(f).connect(g).connect(c.destination); o.start(t); o.stop(t+.08); }catch(e){} }).catch(()=>{}); }
function tom(f,dur=.7){ somPronto().then(c=>{ try{ const t=c.currentTime, o=c.createOscillator(), g=c.createGain(); o.type="sine"; o.frequency.value=f; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.28,t+.04); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05); }catch(e){} }).catch(()=>{}); }
/* Tons da Audição tocados por um <audio> com um arquivo de som criado no próprio app.
   No celular isso é mais confiável que o outro jeito (Web Audio), que às vezes fica mudo. */
const WAVS={};
function wavTom(f,dur){ const k=f+"_"+dur; if(WAVS[k]) return WAVS[k];
  const sr=44100, n=Math.floor(sr*dur), buf=new ArrayBuffer(44+n*2), v=new DataView(buf), w=(o,t)=>{ for(let i=0;i<t.length;i++) v.setUint8(o+i,t.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){ const t=i/sr, ataque=Math.min(1,t/.03), solta=Math.min(1,(dur-t)/.12), a=.55*Math.max(0,Math.min(ataque,solta)); v.setInt16(44+i*2, Math.round(a*Math.sin(2*Math.PI*f*t)*32767), true); }
  return WAVS[k]=URL.createObjectURL(new Blob([buf],{type:"audio/wav"})); }
let audTom=null;
function tocaTom(f,dur=.8){ try{ if(audTom){ audTom.pause(); } audTom=new Audio(wavTom(f,dur)); audTom.volume=1; const pr=audTom.play(); if(pr&&pr.catch) pr.catch(()=>tom(f,dur)); return audTom; }catch(e){ tom(f,dur); return null; } }
function vibra(ms){ try{ navigator.vibrate&&navigator.vibrate(ms); }catch(e){} }
function ruido(c,seg,tipo){ const n=Math.floor(c.sampleRate*seg), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0); let u=0; for(let i=0;i<n;i++){ const w=Math.random()*2-1; if(tipo==="marrom"){ u=(u+.02*w)/1.02; d[i]=u*3.5; } else d[i]=w; } return b; }
function corda(c,f,q,dest){ const sr=c.sampleRate,n=Math.floor(sr*2.2),b=c.createBuffer(1,n,sr),d=b.getChannelData(0),p=Math.round(sr/f); for(let i=0;i<p;i++) d[i]=Math.random()*2-1; for(let i=p;i<n;i++) d[i]=.996*.5*(d[i-p]+d[i-p+1]); const s=c.createBufferSource(); s.buffer=b; const g=c.createGain(); g.gain.value=.35; s.connect(g).connect(dest); s.start(q); return s; }
let somAtual=null;
function pararSom(){ if(!somAtual) return; try{ somAtual.parar(); }catch(e){} somAtual=null; document.querySelectorAll(".ouvir.tocando").forEach(b=>{ b.classList.remove("tocando"); b.textContent="Ouvir"; }); }
function tocarAmbiente(qual,btn){
  const era=btn.classList.contains("tocando"); pararSom(); if(era) return;
  somPronto().then(c=>{ const t0=c.currentTime, dur=5, m=c.createGain(); m.gain.setValueAtTime(0,t0); m.gain.linearRampToValueAtTime(.9,t0+.4); m.gain.setValueAtTime(.9,t0+dur-.6); m.gain.linearRampToValueAtTime(0,t0+dur); m.connect(c.destination); const F=[];
    if(qual==="mar"){ const s=c.createBufferSource(); s.buffer=ruido(c,dur,"marrom"); const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=700; const g=c.createGain(); g.gain.setValueAtTime(.15,t0); [0,2.4].forEach(o=>{ g.gain.linearRampToValueAtTime(1,t0+o+1.1); g.gain.linearRampToValueAtTime(.18,t0+o+2.4); }); s.connect(lp).connect(g).connect(m); s.start(t0); F.push(s); }
    if(qual==="chuva"){ const s=c.createBufferSource(); s.buffer=ruido(c,dur,"branco"); const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=2600; bp.Q.value=.5; const g=c.createGain(); g.gain.value=.35; s.connect(bp).connect(g).connect(m); s.start(t0); F.push(s);
      for(let i=0;i<70;i++){ const o=c.createOscillator(), gg=c.createGain(), q=t0+Math.random()*dur; o.frequency.value=1800+Math.random()*2600; gg.gain.setValueAtTime(0,q); gg.gain.linearRampToValueAtTime(.06,q+.003); gg.gain.exponentialRampToValueAtTime(.0001,q+.05); o.connect(gg).connect(m); o.start(q); o.stop(q+.06); F.push(o); } }
    if(qual==="musica"){ const p=c.createBufferSource(); p.buffer=ruido(c,dur,"marrom"); const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=500; const gp=c.createGain(); gp.gain.value=.25; p.connect(bp).connect(gp).connect(m); p.start(t0); F.push(p);
      [[196,247,294,392],[220,262,330,440],[175,220,262,349],[196,247,294,392]].forEach((a,ai)=>a.forEach((f,ni)=>F.push(corda(c,f,t0+.3+ai*1.1+ni*.05,m)))); }
    btn.classList.add("tocando"); btn.textContent = qual==="silencio" ? "Silêncio…" : "Parar";
    const tm=setTimeout(pararSom,dur*1000); somAtual={parar(){ clearTimeout(tm); F.forEach(f=>{ try{ f.stop(); }catch(e){} }); try{ m.disconnect(); }catch(e){} }};
  }).catch(()=>{});
}
/* SOM DOS JOGOS (Sala do Flow): "seta de carro moderno", tic-tac suave em dupla. As fotos da Fase 1 seguem com o pisca clássico (click). */
function somJogo(){ somPronto().then(c=>{ try{ const t=c.currentTime; [[0,3200,1500,.22],[.16,2600,1150,.16]].forEach(([d,bp,f,v])=>{ const n=c.createBuffer(1,c.sampleRate*.01,c.sampleRate), x=n.getChannelData(0); for(let i=0;i<x.length;i++) x[i]=(Math.random()*2-1)*(1-i/x.length); const sb=c.createBufferSource(); sb.buffer=n; const b=c.createBiquadFilter(); b.type="bandpass"; b.frequency.value=bp; b.Q.value=3; const o=c.createOscillator(); o.type="sine"; o.frequency.value=f; const g=c.createGain(); g.gain.setValueAtTime(.0001,t+d); g.gain.exponentialRampToValueAtTime(v,t+d+.003); g.gain.exponentialRampToValueAtTime(.0001,t+d+.045); sb.connect(b).connect(g); o.connect(g); g.connect(c.destination); sb.start(t+d); o.start(t+d); o.stop(t+d+.05); }); }catch(e){} }).catch(()=>{}); }
/* aviso suave de fim (sem números na tela): dois tons que sobem + vibração */
function avisoFim(){ tom(660,.6); setTimeout(()=>tom(880,.9),220); vibra([15,60,15]); }
/* aro de luz que se fecha devagar (no lugar dos segundos) */
function aroLuz(cor,seg,miolo){ return `<div class="aro" style="--c:${cor};--seg:${seg}s"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" class="trilho"/><circle cx="100" cy="100" r="92" class="fecha"/></svg>${miolo||""}</div>`; }
/* SOM DE FUNDO dos jogos (bem baixinho); liga/desliga vale para todos. Na Audição fica pausado para não atrapalhar a comparação dos sons. */
let fundoOn=true; try{ fundoOn=localStorage.getItem("7e_fundo")!=="0"; }catch(e){}
function fundo(s){ if(fundoOn && s && s.id!=="audicao") somSuave(s.cor,.035); }
function botaoFundo(s){ const b=document.getElementById("fundobtn"); if(!b) return; b.hidden=!s; if(!s) return; b.textContent="♪ Som de fundo: "+(s.id==="audicao"?"pausado neste jogo":fundoOn?"ligado":"desligado"); b.disabled=s.id==="audicao";
  b.onclick=()=>{ fundoOn=!fundoOn; try{ localStorage.setItem("7e_fundo",fundoOn?"1":"0"); }catch(e){} if(fundoOn) fundo(s); else pararSom(); botaoFundo(s); }; }
/* som suave e contínuo (acorde) na cor do sentido: para os momentos de olhos fechados e de saborear */
function somSuave(cor,vol=.09){ pararSom(); const BASE={"#f5c542":[262,330,392],"#4aa8ff":[220,277,330],"#ff8a3d":[196,247,294],"#ff5a6e":[233,294,349],"#5ccf8a":[247,311,370],"#b48cff":[208,262,311],"#3fd6d0":[185,233,277]}[cor]||[220,277,330];
  somPronto().then(c=>{ const t=c.currentTime, m=c.createGain(); m.gain.setValueAtTime(0,t); m.gain.linearRampToValueAtTime(vol,t+1.5); m.connect(c.destination); const F=[];
    BASE.forEach((f,i)=>{ const o=c.createOscillator(), g=c.createGain(), l=c.createOscillator(), lg=c.createGain(); o.type="sine"; o.frequency.value=f; g.gain.value=.5; l.frequency.value=.15+i*.07; lg.gain.value=.25; l.connect(lg).connect(g.gain); o.connect(g).connect(m); o.start(t); l.start(t); F.push(o,l); });
    somAtual={parar(){ try{ const t2=c.currentTime; m.gain.cancelScheduledValues(t2); m.gain.setValueAtTime(m.gain.value,t2); m.gain.linearRampToValueAtTime(0,t2+.4); }catch(e){} setTimeout(()=>{ F.forEach(f=>{ try{ f.stop(); }catch(e){} }); try{ m.disconnect(); }catch(e){} },450); }};
  }).catch(()=>{}); }
/* som suave de cada textura do Carinho */
const TEXSOM = {
  areia(c,t,g){ const s=c.createBufferSource(); s.buffer=ruido(c,.12,"branco"); const f=c.createBiquadFilter(); f.type="highpass"; f.frequency.value=3500; s.connect(f).connect(g); s.start(t); },
  cobertor(c,t,g){ const s=c.createBufferSource(); s.buffer=ruido(c,.25,"marrom"); const f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.value=400; s.connect(f).connect(g); s.start(t); },
  agua(c,t,g){ const o=c.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(500+Math.random()*300,t); o.frequency.exponentialRampToValueAtTime(1100,t+.09); o.connect(g); o.start(t); o.stop(t+.12); },
  abraco(c,t,g){ [220,277].forEach(fq=>{ const o=c.createOscillator(); o.type="sine"; o.frequency.value=fq; o.connect(g); o.start(t); o.stop(t+.3); }); }
};
let texUlt=0;
function somTextura(k){ const agora=Date.now(); if(agora-texUlt<120) return; texUlt=agora; vibra(8);
  somPronto().then(c=>{ try{ const t=c.currentTime, g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.12,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.3); g.connect(c.destination); TEXSOM[k](c,t,g); }catch(e){} }).catch(()=>{}); }

/* ============ NAVEGAÇÃO ============ */
function mostra(html, depois){
  const velho=palco.querySelector(".cena");
  if(GV && velho && velho.contains(GV)){ try{ GV.pause(); }catch(e){} }
  const poe=()=>{ palco.innerHTML=`<div class="cena entra">${html}</div>`; window.scrollTo(0,0); if(depois) depois(palco.querySelector(".cena")); ocupado=false; };
  if(velho){ velho.classList.remove("entra"); velho.classList.add("sai"); setTimeout(poe,430); } else poe();
}
function avanca(){ if(ocupado) return; ocupado=true; pararSom(); salvaLocal(); if(pos<R.length-1){ pos++; desenha(); } }
function voltar(){ pararSom(); if(pos>0){ pos--; while(pos>0 && (R[pos].t==="passagem"||R[pos].t==="abre2"||R[pos].t==="saborear")) pos--; desenha(); } }
const PULAVEIS=["brisa","abre2","vaso","escala","gosto","jogo","saborear","chute"];
/* ao tocar em "pular", pergunta rapidinho por quê (guarda em pulou_motivo_…) e depois pula */
function pular(){ const p=R[pos]; if(!p||!PULAVEIS.includes(p.t)||document.getElementById("porque")) return; click();
  const k=p.t==="jogo"||p.t==="gosto"?p.t+"_"+SENT[p.i].id:p.t==="escala"?"escala_"+p.id:p.t;
  const d=document.createElement("div"); d.id="porque"; d.innerHTML=`<div class="pq"><p>Antes de pular: por quê?</p>${["Achei chato","Não entendi","Não quero responder"].map(t=>`<button type="button">${t}</button>`).join("")}<button type="button" class="volta">Voltar</button></div>`;
  document.body.appendChild(d);
  d.querySelectorAll(".pq button").forEach(b=>b.onclick=()=>{ d.remove(); if(b.classList.contains("volta")) return; resp["pulou_motivo_"+k]=b.textContent; pularMesmo(); });
  d.onclick=e=>{ if(e.target===d) d.remove(); }; }
function pularMesmo(){ const p=R[pos]; if(!p) return; click(); pararSom(); clearInterval(saborTm); clearTimeout(saborTm);
  if(audTom){ try{ audTom.pause(); }catch(e){} }
  if(p.t==="brisa"){ comecar(); return; }
  if(p.t==="abre2"){ avanca(); return; }
  if(p.t==="jogo"){ const s=SENT[p.i]; resp["jogo_"+s.id]="pulado"; delete resp["curtiu_"+s.id]; }
  else { const k=p.t==="escala"?"escala_"+p.id:p.t==="gosto"?"gosto_"+SENT[p.i].id:p.t; resp["pulou_"+k]=true; }
  avanca(); }
function ir(n){ if(n<0){ entrou=false; n=0; } pos=n; fechaPainel(); desenha(); }
/* ===== MANDALA OFICIAL ===== montar(tam): cria a mandala; poeMandala(el,{pos,luz,miolo}): pedaços no lugar (pos), acesos (luz), miolo aceso */
const MC=[0,1,2,3,4,5,6,7].map(k=>{ const a=(-90+k*45)*Math.PI/180; return [50+34*Math.cos(a),50+34*Math.sin(a),a]; });
function mandala(tam,id){ let h=`<span class="mdl" ${id?`id="${id}"`:""} style="width:${tam}px;height:${tam}px"><img class="bs" src="${MANDALA}" alt="Mandala do 7entidos"><span class="hl mh" style="left:50%;top:50%;--c:rgba(245,197,66,.95)"></span>`;
  MC.forEach(([x,y],k)=>{ h+=`<span class="hl" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%;--c:${k<7?SENT[k].cor:"#f5c542"}"></span>`; });
  h+=`<img class="mi apag" src="${MANDALA}" alt="" style="clip-path:circle(19% at 50% 50%);-webkit-clip-path:circle(19% at 50% 50%)">`;
  MC.forEach(([x,y,a],k)=>{ const cp=`circle(12.4% at ${x.toFixed(1)}% ${y.toFixed(1)}%)`; h+=`<img class="c lugar" src="${MANDALA}" alt="" style="clip-path:${cp};-webkit-clip-path:${cp};--tx:${(Math.cos(a)*tam*.32).toFixed(0)}px;--ty:${(Math.sin(a)*tam*.32).toFixed(0)}px">`; });
  return h+`</span>`; }
/* poeMandala(el,{pos,luz,miolo}): pos = círculos no lugar (os outros ficam quebrados, fora do lugar); luz = círculos acesos; miolo = o 7 aceso.
   Quando os 7 sentidos estão acesos, o 8º círculo acende junto e a mandala fica inteira e brilhante. */
function poeMandala(el,o){ if(!el) return; o=o||{}; let pos=o.pos||[], luz=(o.luz||[]).slice();
  const cheia=[0,1,2,3,4,5,6].every(i=>luz.includes(i)) && o.miolo; if(cheia&&!luz.includes(7)) luz.push(7);
  el.querySelector(".mi").classList.toggle("apag",!o.miolo); el.classList.toggle("brilha",!!o.miolo); el.classList.toggle("cheia",cheia);
  const hl=el.querySelectorAll(".hl"); hl[0].classList.toggle("on",!!o.miolo);
  el.querySelectorAll(".c").forEach((c,k)=>{ const no=pos.includes(k)||luz.includes(k)||(k===7&&pos.length>=7); c.classList.toggle("fora",!no); c.classList.toggle("lugar",no&&!luz.includes(k)); c.classList.toggle("luz",luz.includes(k)); hl[k+1].classList.toggle("on",luz.includes(k)); }); }
const TODOS=[0,1,2,3,4,5,6];
/* topo: a mandala começa QUEBRADA; na Fase 1 cada sentido escolhido faz o seu pedaço voar e encaixar;
   na Fase 2 cada jogo feito acende o seu pedaço na cor do sentido; no fim da Fase 2 ela fica completa e acesa.
   O miolo (o 7) acende no fim do vídeo da Brisa. */
function desenhaMini(){
  const p=R[pos], el=document.getElementById("const");
  if(!p || (p.t==="brisa"&&!entrou) || p.t==="vaso"){ el.hidden=true; return; }
  el.hidden=false;
  if(!document.getElementById("mtopo")){ el.innerHTML=mandala(58,"mtopo")+`<span class="xde7" id="xde7"></span>`; }
  const f=p.f;
  const fez1=s=>resp["gosto_"+s.id]!=null||resp["pulou_gosto_"+s.id];
  const fez2=s=>resp["curtiu_"+s.id]!=null||resp["jogo_"+s.id]==="pulado";
  let lug=SENT.map((s,i)=>fez1(s)?i:-1).filter(i=>i>=0), luz=[];
  if(f===2){ lug=TODOS; luz=SENT.map((s,i)=>fez2(s)?i:-1).filter(i=>i>=0); if(["saborear","escala","chute","revela","grafico","trava3"].includes(p.t)) luz=TODOS; }
  else if(p.t==="fim1") lug=TODOS;
  const m=document.getElementById("mtopo");
  requestAnimationFrame(()=>requestAnimationFrame(()=>poeMandala(m,{pos:lug,luz,miolo:!!resp.local_luz0})));
  const comeco=p.t==="brisa"||p.t==="vaso"||(p.t==="escala"&&p.id==="chegada");
  document.getElementById("xde7").innerHTML=`<b class="pal"><em>7</em>entidos</b>${p.t==="brisa"?"":`<small>Fase ${f}</small>${comeco?"começando":(f===2?luz.length:lug.length)+" de 7"}`}`;
}
/* fim do vídeo 1 da Brisa (ou "Começar"): acende a primeira luz, o miolo da mandala */
function acendeLuz0(){ if(resp.local_luz0) return; resp.local_luz0=true; const m=document.getElementById("mtopo"); desenhaMini(); if(m){ m.classList.remove("pulsa"); void m.offsetWidth; m.classList.add("pulsa"); } vibra(20); }
function brilho(cor){ document.body.style.setProperty("--glow", cor?cor+"26":"rgba(245,197,66,.10)"); }
function anel(cls="respira", acesa=-1, feitos=[], img=""){ return `<div class="anel ${cls}">${img?`<img src="${img}" alt="Brisa">`:""}${SENT.map((s,i)=>`<i style="--c:${s.cor};--a:${i*360/7}deg;--d:${i*.35}s" class="${acesa<0?"":(i===acesa?"acesa":(feitos.includes(i)?"":"apag"))}"></i>`).join("")}</div>`; }

function desenha(){
  document.querySelectorAll("body > .saborear").forEach(e=>e.remove());
  foco(null); botaoFundo(null);
  const p=R[pos]; document.getElementById("voltar").hidden = pos===0 || ["revela","grafico","abre2","saborear"].includes(p.t);
  /* "pular" aparece nas telas que pedem resposta ou jogo; nas outras o próprio botão já segue */
  document.getElementById("pularbtn").hidden = !PULAVEIS.includes(p.t);
  desenhaMini(); brilho(p.i!=null?SENT[p.i].cor:null);
  ({brisa,vaso,escala,passagem,gosto,fim1,abre2,jogo,saborear,chute,revela,grafico,trava3})[p.t](p);
}

/* ============ NOME (fica SÓ no celular da pessoa; nunca vai para a planilha) ============ */
function NOME(){ let n=resp.local_nome; if(n==null){ try{ n=localStorage.getItem("7e_nome")||""; }catch(e){ n=""; } } return String(n||"").trim().split(" ")[0].slice(0,20); }
const comNome=(com,sem)=>NOME()?com.replace("{n}",esc(NOME())):sem;
function guardaNome(v){ v=String(v||"").replace(/\s+/g," ").trim().slice(0,30); resp.local_nome=v; try{ if(v) localStorage.setItem("7e_nome",v); else localStorage.removeItem("7e_nome"); }catch(e){} }

/* ============ VÍDEO DA BRISA ============ */
/* Um único vídeo para o app todo: ele é "destravado" no toque em "Entrar" (e no "Começar a Fase 2"),
   e assim começa já COM SOM, sem outro botão. Legenda começa desligada, fica EMBAIXO do vídeo (fora do rosto).
   Se o celular não deixar tocar com som, o vídeo toca sem som, a legenda liga sozinha e um toque no vídeo põe o som. */
let GV=null, legOn=false, entrou=false;
function pegaVideo(){ if(!GV){ GV=document.createElement("video"); GV.id="vid"; GV.setAttribute("playsinline",""); GV.setAttribute("webkit-playsinline",""); GV.preload="auto"; } return GV; }
function destravaVideo(src){ const v=pegaVideo(); try{ v.muted=false; if(!v.src.endsWith(src.split("/").pop())){ v.src=src; v.poster=src.replace(/\.mp4$/,".jpg"); } const p=v.play(); v.pause(); if(p&&p.catch) p.catch(()=>{}); }catch(e){} }
function videoBrisa(src,leg,legcls){ return `<div class="vbrisa" id="vb"><div class="vslot" id="vslot"></div>${VIDEO_TESTE&&PREVIA?'<span class="teste">vídeo de teste</span>':""}</div>
  <div class="legfora ${legcls||""}" id="leg" ${legOn?"":"hidden"}></div>
  <div class="vbotoes"><button class="ouvirb ${legOn?"on":""}" id="legbtn" type="button" aria-pressed="${legOn}">💬 Legenda</button><button class="denovo" id="denovo" type="button" hidden>▶ Ver de novo</button></div>`; }
function ligaVideo(c,leg,falha,src){ const lg=c.querySelector("#leg"), lb=c.querySelector("#legbtn"), dn=c.querySelector("#denovo"), slot=c.querySelector("#vslot"); if(!slot) return;
  if(!leg.length){ lb.style.display="none"; lg.hidden=true; }
  const v=pegaVideo(); slot.appendChild(v);
  if(!v.src.endsWith(src.split("/").pop())){ v.src=src; v.poster=src.replace(/\.mp4$/,".jpg"); }
  const poeLeg=()=>{ const t=v.currentTime, l=leg.find(x=>t>=x[0]&&t<x[1]); lg.textContent=l?l[2]:""; };
  const ligaLeg=on=>{ if(!leg.length) return; legOn=on; lg.hidden=!on; lb.classList.toggle("on",on); lb.setAttribute("aria-pressed",on); poeLeg(); };
  v.ontimeupdate=poeLeg;
  v.onended=()=>{ dn.hidden=false; lg.textContent=""; if(src===VID1) acendeLuz0(); };
  v.onerror=()=>{ const vb=c.querySelector("#vb"); if(vb) vb.outerHTML=anel("respira comfoto",-1,[],BRISA); lb.remove(); dn.remove(); lg.remove(); if(falha) falha(); };
  v.onclick=()=>{ if(v.muted){ v.muted=false; v.currentTime=0; v.play().catch(()=>{}); resp.ouviu_brisa=true; } };
  lb.onclick=()=>{ click(); ligaLeg(!legOn); };
  dn.onclick=()=>{ click(); dn.hidden=true; v.muted=false; v.currentTime=0; v.play().catch(()=>{}); };
  try{ v.currentTime=0; }catch(e){}
  v.muted=false;
  const pr=v.play();
  if(pr&&pr.then) pr.then(()=>{ resp.ouviu_brisa=true; }).catch(()=>{ v.muted=true; v.play().catch(()=>{}); ligaLeg(true); }); }

/* ============ TELAS ============ */
function brisa(){
  if(!entrou){
    document.getElementById("pularbtn").hidden=true;
    mostra(`<div class="entrar"><div class="entramdl">${mandala(Math.round(Math.min(innerWidth*.66,280)),"mentra")}</div><div class="marcatxt"><b><em>7</em>entidos</b><span>A vida é feita de boas sensações.</span></div><p class="duracao">2 fases · uns 7 minutos</p><button class="btn" onclick="entrar()">Entrar</button></div>`, c=>poeMandala(c.querySelector("#mentra"),{pos:TODOS,luz:TODOS,miolo:true}));
    return;
  }
  mostra(`${videoBrisa(VID1,LEG1)}
    <div id="semvideo" hidden><p class="fala">Oi, eu sou a Brisa. Aqui não tem resposta certa nem errada. Só o que você sente.</p>
    <p class="fala2">Vamos descobrir, sentido por sentido, o que te faz bem?</p></div>
    <button class="btn cta" onclick="comecar()">Começar</button>
    <p class="miud mini">Suas respostas são anônimas: sem nome e sem telefone. Elas ajudam o estudo do 7entidos. Ao começar, você concorda com isso. <a href="/privacidade.html" target="_blank" rel="noopener">Privacidade</a></p>`,
    c=>ligaVideo(c,LEG1,()=>{ c.querySelector("#semvideo").hidden=false; },VID1));
}
function entrar(){ click(); entrou=true; destravaVideo(VID1); document.getElementById("pularbtn").hidden=false; desenhaMini(); brisa(); }
function comecar(){ click(); if(!inicio){ inicio=Date.now(); resp.inicio=new Date().toISOString(); } resp.consentiu=true; if(resp.local_nome==null){ const n=NOME(); if(n) resp.local_nome=n; } acendeLuz0(); avanca(); }

const VASO=`<svg class="vaso" viewBox="0 0 300 230" role="img" aria-label="Figura: um vaso dourado ou dois rostos de perfil">
  <defs><pattern id="km" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#d9a520"/><rect x="1.5" y="1.5" width="6" height="6" fill="#f6d36b"/><rect x="9" y="9" width="5.5" height="5.5" fill="#b9821a"/><circle cx="12" cy="4" r="2.2" fill="none" stroke="#7a4f12" stroke-width="1"/><circle cx="4" cy="12" r="1.6" fill="#fff3c4"/></pattern>
  <pattern id="kd" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#15193f"/><path d="M11 4a7 7 0 1 1-6 9 4 4 0 1 1 6-5" fill="none" stroke="#2c3a86" stroke-width="1.6"/><rect x="2" y="2" width="4" height="4" fill="#23307a"/></pattern></defs>
  <rect width="300" height="230" fill="url(#kd)"/>
  <path d="M112 0h76c-6 14-18 22-18 36 0 12 14 14 14 24 0 6-10 8-10 14 0 8 12 6 12 16 0 8-12 10-12 18 0 14 22 18 22 38 0 22-26 30-26 56v28h-40v-28c0-26-26-34-26-56 0-20 22-24 22-38 0-8-12-10-12-18 0-10 12-8 12-16 0-6-10-8-10-14 0-10 14-12 14-24 0-14-12-22-18-36z" fill="url(#km)"/>
  <path d="M112 0c-6 14-18 22-18 36 0 12 14 14 14 24 0 6-10 8-10 14 0 8 12 6 12 16 0 8-12 10-12 18 0 14 22 18 22 38 0 22-26 30-26 56v28M188 0c6 14 18 22 18 36 0 12-14 14-14 24 0 6 10 8 10 14 0 8-12 6-12 16 0 8 12 10 12 18 0 14-22 18-22 38 0 22 26 30 26 56v28" fill="none" stroke="#f6d36b" stroke-width="2.5"/></svg>`;
function vaso(){
  mostra(`<img class="logocom" src="${LOGO}" alt="7entidos · A vida é feita de boas sensações"><div class="rot">Olhe rapidinho</div>${VASO}<h2>O que você viu primeiro?</h2>
    <div class="opts">${["Um vaso","Dois rostos","Os dois juntos"].map(o=>`<button class="opt ${resp.vaso===o?"sel":""}" onclick="escolheOpt(this,'vaso','${o}')">${o}</button>`).join("")}</div>
    <p class="miud">Não tem resposta certa. É só o seu olhar.</p>`);
}
function escolheOpt(b,k,v){ resp[k]=v; click(); b.parentNode.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); setTimeout(avanca,420); }

/* palavras da régua do Daniel (10 = Êxtase … 1 = Péssimo) */
const PALAVRA=["Vazio","Péssimo","Ruim","Desconfortável","Regular","Indiferente","Legal","Muito legal","Felicidade","Muita felicidade","Êxtase"];
const corNum=n=>`hsl(${215-n*16.5},${55+n*3}%,${45+n*2}%)`;
function escala(p){
  const k="escala_"+p.id, v=resp[k], ch=p.id==="chegada", antes=resp.escala_chegada;
  const topo=`<div class="escmdl">${mandala(ch?170:200,"mesc")}${ch?`<div class="nmshow" id="nmshow">${esc(NOME())}</div>`:""}</div>`;
  const campoNome = ch ? `<div class="nome"><label for="nm">Como posso te chamar?</label><input id="nm" maxlength="30" autocomplete="given-name" placeholder="Seu nome ou apelido" value="${esc(NOME())}" oninput="guardaNome(this.value);nomeVivo()"><small>Se não quiser, é só pular. Seu nome fica só no seu celular.</small></div>` : "";
  const apag = ch && !NOME() && v==null;
  mostra(`${topo}${campoNome}<div class="escbloco ${apag?"apagado":""}" id="escbloco"><div class="rot">${ch?"Antes de começar":"Depois dos 7 sentidos"}</div>
    <h2>${ch?"Como estão seus sentidos agora?":"E agora, como estão seus sentidos?"}</h2>
    <p class="sub">${ch?"É o seu ponto de partida. Toque num número de 0 a 10.":(antes!=null?`Você chegou com ${antes}. Toque no número de agora.`:"Toque num número de 0 a 10.")}</p>
    <div class="escala e11">${Array.from({length:11},(_,n)=>`<button class="${v===n?"sel":""} ${!ch&&antes===n?"antes":""}" style="--k:${corNum(n)}" onpointerenter="visor(${n})" onclick="escolheNum(this,'${k}',${n})" aria-label="${n}: ${PALAVRA[n]}">${n}</button>`).join("")}</div>
    <div class="palavra" id="vpal"></div></div>`, c=>{ poeMandala(c.querySelector("#mesc"),{pos:TODOS,luz:[],miolo:false}); if(v!=null) visor(v); });
}
/* o nome aparece embaixo da mandala; quando há nome, a escala sobe acesa */
function nomeVivo(){ const n=NOME(), sh=document.getElementById("nmshow"), eb=document.getElementById("escbloco"); if(sh) sh.textContent=n; if(eb&&n) eb.classList.remove("apagado"); }
/* as luzes da mandala acendem até o número (0 a 10 → 0 a 7 pedaços) */
/* 0 = tudo apagado; cada número acende mais círculos: primeiro o 7 do meio, depois os círculos em volta; 10 = mandala inteira acesa */
function visor(n){ const m=document.getElementById("mesc"); if(m){ const k=Math.round(n*9/10); poeMandala(m,{pos:TODOS,luz:[0,1,2,3,4,5,6,7].slice(0,Math.max(0,k-1)),miolo:k>=1}); }
  const eb=document.getElementById("escbloco"); if(eb) eb.classList.remove("apagado");
  const vp=document.getElementById("vpal"); if(vp) vp.innerHTML=`<b>${n}</b>${PALAVRA[n]}`; }
function escolheNum(b,k,n){ resp[k]=n; click(); visor(n); vibra(8+n); b.parentNode.querySelectorAll("button").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); setTimeout(avanca,1100); }

function passagem(p){
  const s=SENT[p.i], chave=p.f===1?"gosto_":"curtiu_", feitos=SENT.map((x,i)=>resp[chave+x.id]!=null?i:-1).filter(i=>i>=0);
  const fala = p.f===1 ? (p.i===0&&NOME()?"Boa, "+NOME()+"! "+s.brisa:p.i===6&&NOME()?NOME()+", "+s.brisa.charAt(0).toLowerCase()+s.brisa.slice(1):s.brisa) : `Agora, o jogo ${["tato","paladar","olfato","equilibrio"].includes(s.id)?"do":"da"} ${s.s}: ${s.jogo}${/\?$/.test(s.jogo)?"":"."}`;
  mostra(`${anel("", p.i, feitos)}<div class="nomesent" style="color:${s.cor}">${p.i+1} · ${s.s}</div><p class="fala" style="margin-top:12px">${esc(fala)}</p>`);
  setTimeout(()=>{ if(R[pos]===p) avanca(); }, 2600);
}

/* MOSAICO de 7 pedaços (Fase 1): cada escolha voa para o seu pedaço; no fim vira o retrato rápido */
function mosaico(grande,atual=-1){ return `<div class="mosaico ${grande?"grande":""}">${SENT.map((x,i)=>{ const j=x.o.indexOf(resp["gosto_"+x.id]); return `<div class="pc ${j>=0?"cheio":""} ${i===atual?"agora":""}" data-i="${i}" style="--c:${x.cor}">${j>=0?`<img src="${foto(x.id,j)}" alt="">`:""}${grande&&j>=0?`<span>${esc(x.o[j])}</span>`:""}</div>`; }).join("")}</div>`; }
function gosto(p){
  const s=SENT[p.i], k="gosto_"+s.id;
  mostra(`${mosaico(false,p.i)}<p class="brisafrase" style="--c:${s.cor}">${esc(fraseGosto(s,p.i))}</p><div class="rot" style="color:${s.cor}">${s.s}</div><h2>${s.q}</h2><p class="sub">Escolha uma. Segure para olhar de perto.</p>
    <div class="g22">${s.o.map((o,j)=>`<button class="foto ${resp[k]===o?"sel":""}" data-j="${j}" onclick="escolheFoto(this,'${k}',${p.i},${j})"><img src="${foto(s.id,j)}" alt="" loading="lazy" draggable="false"><span class="nm">${esc(o)}</span>${s.sons?`<span class="ouvir" role="button" onclick="event.stopPropagation();tocarAmbiente('${s.sons[j]}',this)">Ouvir</span>`:""}</button>`).join("")}</div>`, c=>ligaPerto(c,s));
}
/* OLHAR DE PERTO: segurar meio segundo abre a foto em tela cheia (na Audição, com o som); soltar volta sem escolher */
let segurou=false;
function ligaPerto(c,s){ c.querySelectorAll(".foto").forEach(b=>{ const j=+b.dataset.j; let tm=null, aberto=null;
  const abre=()=>{ segurou=true; vibra(10); aberto=document.createElement("div"); aberto.className="perto"; aberto.style.setProperty("--c",s.cor);
    aberto.innerHTML=`<img src="${foto(s.id,j)}" alt=""><span>${esc(s.o[j])}</span><small>Solte para voltar</small>`; document.body.appendChild(aberto);
    if(s.sons){ const d=document.createElement("span"); d.className="ouvir"; tocarAmbiente(s.sons[j],d); }
    const k="segurou_"+s.id; resp[k]=[...new Set([...(resp[k]||[]),s.o[j]])]; };
  const fecha=()=>{ clearTimeout(tm); tm=null; if(aberto){ aberto.remove(); aberto=null; pararSom(); } };
  b.addEventListener("pointerdown",e=>{ if(e.target.closest(".ouvir")) return; segurou=false; try{ b.setPointerCapture(e.pointerId); }catch(_){} tm=setTimeout(abre,500); });
  ["pointerup","pointercancel"].forEach(ev=>b.addEventListener(ev,fecha));
  b.addEventListener("pointerleave",()=>{ if(!aberto){ clearTimeout(tm); tm=null; } });
  b.oncontextmenu=e=>e.preventDefault(); }); }
function escolheFoto(b,k,i,j){ if(segurou){ segurou=false; return; } resp[k]=SENT[i].o[j]; click(); pararSom(); b.parentNode.querySelectorAll(".foto").forEach(x=>x.classList.remove("sel")); b.classList.add("sel");

 ["a3","A3 · Como estão seus sentidos?","A mandala que acende","A mandala começa apagada; a cada número acendem mais círculos: primeiro o 7 do meio, depois os círculos em volta. 10 = ela inteira acesa.",R.findIndex(x=>x.t==="escala"&&x.id==="chegada")],

 ["a5","A5 · Vídeo da Fase 2","Legenda menor","Ligue a legenda para conferir o tamanho.",R.findIndex(x=>x.t==="abre2")]
];
const REVISAR=["Mudar o visual","Mudar o texto","Mudar como funciona","Tirar do app"];
let val={}, vdb=null, VDOC=null;
function painel(){
  let el=document.getElementById("vp"); if(!el){ el=document.createElement("div"); el.id="vp"; el.className="vpainel"; document.body.appendChild(el); }
  const nv=ITENS.filter(x=>val[x[0]]&&val[x[0]].s==="validado").length;
  el.innerHTML=`<div class="vcaixa"><div class="rot">Prévia · app novo · ajustes do Bloco 1 · Parte A</div><h2>Validar item por item</h2><p class="sub">${nv} de ${ITENS.length} validados. "Ver" leva direto para a tela do item.</p>
    ${ITENS.map(([id,num,tt,ds,alvo])=>{ const v=val[id]||{}; return `<div class="vitem"><div class="rot" style="margin:0">${num}</div><div class="tt">${tt}</div><div class="ds">${ds}</div>
      <div class="bb"><button class="v ${v.s==="validado"?"on":""}" onclick="marca('${id}','validado')">Validado</button><button class="r ${v.s==="revisar"?"on":""}" onclick="marca('${id}','revisar')">Revisar</button><button class="ir" onclick="ir(${alvo})">Ver</button></div>
      <div class="rev ${v.s==="revisar"?"on":""}">${REVISAR.map(o=>`<button class="${v.o===o?"on":""}" onclick="marcaRev('${id}','${o}')">${o}</button>`).join("")}</div></div>`; }).join("")}
    <p class="vsalvo" id="vsalvo">${VDOC?"As marcações ficam guardadas: o Claude lê direto.":"As marcações ficam guardadas neste aparelho."}</p>
    <button class="btn" onclick="fechaPainel()">Voltar ao app</button></div>`;
  el.classList.add("on");
}
function fechaPainel(){ const el=document.getElementById("vp"); if(el) el.classList.remove("on"); }
function marca(id,s){ val[id]={...(val[id]||{}),s}; if(s==="validado") delete val[id].o; salvaVal(); painel(); }
function marcaRev(id,o){ val[id]={s:"revisar",o}; salvaVal(); painel(); }
function salvaVal(){ try{ localStorage.setItem("7e_app_novo_val_s2b1a",JSON.stringify(val)); }catch(e){}
  if(VDOC) VDOC.set({atualizado:new Date().toISOString(), itens:ITENS.map(x=>({id:x[0],item:x[1]+" · "+x[2],situacao:(val[x[0]]||{}).s||null,revisar:(val[x[0]]||{}).o||null}))}).catch(()=>{}); }

/* ============ INÍCIO ============ */
try{ const s=JSON.parse(localStorage.getItem("7e_app_novo")||"null"); if(s&&s.resp&&s.pos>0&&s.pos<R.length-2){ resp=s.resp; pos=s.pos; inicio=s.inicio||Date.now(); inicio2=s.inicio2||null; } }catch(e){}
try{ val=JSON.parse(localStorage.getItem("7e_app_novo_val_s2b1a")||"{}")||{}; }catch(e){}
if(PREVIA){ const b=document.createElement("button"); b.className="vbtn"; b.type="button"; b.textContent="Validar a prévia"; b.onclick=()=>{ click(); painel(); }; document.body.appendChild(b); }
desenha();
if(PREVIA && window.claude && claude.use){ claude.use("db").then(db=>{ if(!db) return; VDOC=db.doc("validacao/app-novo-s2-b1a"); return VDOC.get().then(sn=>{ const d=sn&&(sn.data?sn.data():sn); if(d&&d.itens&&!Object.keys(val).length){ d.itens.forEach(x=>{ if(x.situacao) val[x.id]={s:x.situacao,o:x.revisar||undefined}; }); } }); }).catch(()=>{}); }
