<style>
/* ===== APP NOVO 7ENTIDOS · Fase 1 (a partir da pesquisa "Monte o app") ===== */
:root{--noite:#0a1128;--noite2:#111b3d;--ouro:#f5c542;--creme:#f4ecdc;--azul:#a9b3d1;--linha:rgba(169,179,209,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--noite);color:var(--creme);font-family:Manrope,system-ui,sans-serif;font-size:19px;line-height:1.45}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse at 50% -10%,#1d2b6b 0%,#111b3d 38%,#0a1128 72%) fixed;overflow-x:hidden;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(169,179,209,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(169,179,209,.05) 1px,transparent 1px);background-size:52px 52px;-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 15%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 20%,#000 15%,transparent 70%)}
body::after{content:"";position:fixed;left:50%;top:38%;width:620px;height:620px;margin:-310px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,var(--glow,rgba(245,197,66,.10)),transparent 65%);transition:background 1s}
button{font-family:inherit}
.topo{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;pointer-events:none;background:linear-gradient(rgba(10,17,40,.92),rgba(10,17,40,.6) 70%,transparent)}
.marca{display:flex;align-items:center;pointer-events:auto}
.marca img{height:52px;width:auto;display:block}
/* MANDALA OFICIAL DO 7ENTIDOS (imagem mandala-7.webp, a mesma de app/icones/fonte-mandala.png). As luzes são os PRÓPRIOS CÍRCULOS:
   7 círculos em volta (um por sentido, em sentido horário a partir do de cima) + o miolo com o 7 */
.mdl{position:relative;display:inline-block;flex:none;border-radius:50%;transition:box-shadow .8s}
.mdl img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;transition:transform .9s cubic-bezier(.3,1.35,.5,1),filter .7s,opacity .7s}
.mdl .bs{filter:brightness(.36) saturate(.55)}
.mdl.cheia .bs{filter:none}
.mdl .c.fora{transform:translate(var(--tx),var(--ty)) scale(.85);filter:grayscale(.9) brightness(.35);opacity:.55}
.mdl .c.lugar{filter:grayscale(.55) brightness(.55)}
.mdl .c.luz{filter:brightness(1.12) saturate(1.2)}
.mdl .mi{filter:brightness(1.12) saturate(1.15)}
.mdl .mi.apag{filter:grayscale(.6) brightness(.5)}
.mdl .hl{position:absolute;width:36%;height:36%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,var(--c) 0,transparent 68%);opacity:0;transition:opacity .9s;pointer-events:none}
.mdl .hl.mh{width:58%;height:58%}
.mdl .hl.on{opacity:.8}
.mdl.brilha{box-shadow:0 0 26px 4px rgba(245,197,66,.3)}
.mdl.pulsa{animation:mpulsa 1.6s ease-out}
@keyframes mpulsa{0%{box-shadow:0 0 0 0 rgba(245,197,66,.9)}40%{box-shadow:0 0 50px 18px rgba(245,197,66,.55)}100%{box-shadow:0 0 26px 4px rgba(245,197,66,.3)}}
.const .xde7 b.pal{display:block;font:600 24px Fraunces,serif;color:var(--creme);letter-spacing:0;text-transform:none}
.const .xde7 b.pal em{font-style:normal;color:var(--ouro)}
.const .mdl{margin-right:6px}
/* entrada: mandala grande + nome + duração */
.entramdl{display:flex;justify-content:center}
.marcatxt{text-align:center;margin-top:-10px}
.marcatxt b{display:block;font:600 clamp(40px,12vw,56px)/1 Fraunces,serif;color:var(--creme)}
.marcatxt b em{font-style:normal;color:var(--ouro)}
.marcatxt span{display:block;margin-top:8px;color:var(--azul);font-size:17px}
.duracao{font:700 17px "Space Mono",monospace;color:var(--ouro);letter-spacing:.06em;margin:-14px 0 0}
/* Bloco A: frase da marca pisca devagar; "2 fases" + frase-gatilho */
.marcatxt span.piscadev{animation:piscadev 3.6s ease-in-out infinite}
@keyframes piscadev{0%,100%{opacity:1}50%{opacity:.3}}
.gatilho{margin:-26px 0 0;font:600 20px/1.3 Fraunces,serif;color:var(--creme);text-align:center;max-width:320px}
/* tela 3: nome + número numa tela só */
.escmdl{display:flex;flex-direction:column;align-items:center;gap:8px;margin:0 auto 14px}
.nmshow{font:600 26px Fraunces,serif;color:var(--ouro);min-height:34px;transition:opacity .4s}
.escbloco{transition:opacity .6s,transform .6s}
.escbloco.apagado{opacity:.32;transform:translateY(14px)}
.escala.e11{grid-template-columns:repeat(6,1fr);max-width:400px}
.escala.e11 button{font-size:22px}
.escala.e11 button.antes{border:2px dashed rgba(169,179,209,.75);opacity:.6;position:relative}
.escala.e11 button.antes::after{content:"chegada";position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font:400 11px "Space Mono",monospace;color:var(--azul);white-space:nowrap}
.escmdl .mdl{margin-bottom:4px}
.palavra{min-height:34px;margin-top:22px;font-size:19px;font-weight:800;color:var(--azul)}
.palavra b{font:400 30px Fraunces,serif;color:var(--creme);margin-right:6px}
/* constelação de progresso (7 luzes, uma por sentido) */
.const{display:flex;align-items:center;gap:12px;pointer-events:auto;transition:opacity .5s}
.const[hidden]{display:none}
.const .estrelas{position:relative;display:flex;gap:14px;align-items:center;padding:4px 2px}
.const .estrelas::before{content:"";position:absolute;left:10px;right:10px;top:50%;height:1px;background:linear-gradient(90deg,rgba(245,197,66,.35),rgba(169,179,209,.25))}
.const i{position:relative;width:18px;height:18px;border-radius:50%;background:#1d2654;border:1.5px solid #34407a;transition:all .6s}
.const i.on{background:var(--c);border-color:var(--c);box-shadow:0 0 12px 3px var(--c)}
.const i.agora{animation:pulsa 1.8s ease-in-out infinite}
@keyframes pulsa{50%{box-shadow:0 0 22px 7px var(--c)}}
.const .xde7{font:700 16px "Space Mono",monospace;color:var(--ouro);white-space:nowrap}
.const .xde7 small{display:block;font-weight:400;font-size:12px;color:var(--azul);letter-spacing:.08em;text-transform:uppercase}
.voltar{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;all:unset;cursor:pointer;color:var(--azul);font-size:16px;padding:10px 14px;border-radius:999px}
.voltar:hover{color:var(--creme)}
/* PULAR: discreto, no canto de baixo à direita, em todas as telas que pedem resposta ou jogo */
.pularbtn{all:unset;position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;cursor:pointer;color:var(--azul);font-size:16px;padding:10px 14px;border-radius:999px;opacity:.8}
.pularbtn:hover,.pularbtn:focus-visible{color:var(--creme);opacity:1;outline:2px solid rgba(245,197,66,.4)}
.pularbtn[hidden]{display:none}
#porque{position:fixed;inset:0;z-index:60;background:rgba(3,6,18,.6);display:flex;align-items:flex-end;justify-content:center;animation:abrePerto .2s ease-out}
#porque .pq{width:100%;max-width:460px;background:#111a44;border-top:2px solid rgba(245,197,66,.5);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
#porque p{margin:0 0 4px;font-weight:800;font-size:19px;text-align:center}
#porque button{all:unset;cursor:pointer;text-align:center;padding:14px;border-radius:14px;background:rgba(255,255,255,.06);border:1.5px solid rgba(169,179,209,.3);font-weight:800;font-size:17px}
#porque button.volta{background:none;border:none;color:var(--azul);font-weight:600;font-size:15px;padding:6px}

#palco{position:relative;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:128px 18px 130px}
.cena{width:100%;max-width:560px;text-align:center}
.cena.entra{animation:entra .6s cubic-bezier(.2,.8,.2,1) both}
.cena.sai{animation:sai .45s ease-in both}
@keyframes entra{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
@keyframes sai{to{opacity:0;transform:translateY(-70px)}}

.rot{font:400 15px "Space Mono",monospace;color:var(--ouro);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:500;margin:0 0 12px;line-height:1.08}
h1{font-size:clamp(36px,9vw,54px)}
h2{font-size:clamp(28px,7vw,40px)}
h1 em,h2 em{color:var(--ouro)}
.sub{color:var(--azul);font-size:19px;margin:0 0 20px}
.fala{font-family:Fraunces,serif;font-size:clamp(24px,6vw,30px);line-height:1.25;margin:0 0 10px}
.fala2{color:var(--azul);font-size:19px;margin:0 0 26px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:0 34px;border-radius:999px;background:var(--ouro);color:#15110a;font-weight:800;font-size:20px;box-shadow:0 14px 34px -12px rgba(245,197,66,.6);transition:transform .2s}
.btn:active{transform:scale(.97)}
.btn.sec{background:transparent;color:var(--creme);border:1.5px solid rgba(169,179,209,.45);box-shadow:none}
.btn[disabled]{opacity:.35;pointer-events:none}
.miud{font-size:15px;color:var(--azul);margin-top:16px}
.miud.mini{font-size:12px;line-height:1.35;opacity:.85;max-width:340px;margin:14px auto 64px}
.miud.priv{font-size:11px;line-height:1.3;max-width:300px}
.miud a{color:var(--azul)}

/* anel de 7 luzes */
.anel{position:relative;width:200px;height:200px;margin:0 auto 22px}
.anel::before{content:"";position:absolute;inset:14px;border-radius:50%;border:1px solid rgba(245,197,66,.3)}
.anel i{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:var(--c);box-shadow:0 0 12px 3px var(--c);transform:rotate(var(--a)) translateY(-86px);transition:all .8s}
.anel.respira i{animation:respira 3s ease-in-out infinite;animation-delay:var(--d)}
@keyframes respira{0%,100%{opacity:.4;box-shadow:0 0 5px 1px var(--c)}50%{opacity:1;box-shadow:0 0 20px 7px var(--c)}}
.anel i.apag{opacity:.18;box-shadow:none}
.anel i.acesa{width:30px;height:30px;margin:-15px;opacity:1;box-shadow:0 0 26px 10px var(--c),0 0 70px 20px var(--c);animation:acende 1.2s ease-out}
@keyframes acende{from{width:10px;height:10px;margin:-5px;opacity:.2}}
.anel.comfoto{width:300px;height:300px}
.anel.comfoto i{transform:rotate(var(--a)) translateY(-136px)}
.anel.comfoto img{position:absolute;inset:26px;width:calc(100% - 52px);height:calc(100% - 52px);border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px rgba(245,197,66,.55),0 0 50px rgba(245,197,66,.35),0 20px 40px rgba(0,0,0,.6)}
.anel .centro{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:40px}
.nomesent{font:700 16px "Space Mono",monospace;letter-spacing:.14em;text-transform:uppercase}

/* opções (texto) */
.opts{display:grid;gap:12px;margin:0 auto;max-width:440px}
/* 19/11 · boas-vindas de volta */
.bvolta{text-align:center;padding-top:6vh}
.bvmand{width:min(46vw,190px);display:block;margin:0 auto 18px;filter:drop-shadow(0 0 26px rgba(245,197,66,.45));animation:bvgira 40s linear infinite}
@keyframes bvgira{to{transform:rotate(360deg)}}
.bvolta h2{font-size:clamp(30px,8vw,40px)}
.bvonde{font-size:17px;color:#c9d2ee;margin:6px 0 22px}
.bvonde b{color:var(--ouro)}
@media (prefers-reduced-motion:reduce){.bvmand{animation:none}}
/* 19/11 · Viagem do cheiro: botões com foto realista (praia e estante de livros) */
.viagens{display:grid;gap:16px;margin:6px auto 0;max-width:440px}
.opt.viag{position:relative;padding:0;overflow:hidden;aspect-ratio:16/9;border-radius:22px;border:2px solid rgba(255,255,255,.18);box-shadow:0 6px 0 rgba(0,0,0,.35),0 14px 30px -10px rgba(0,0,0,.7)}
.opt.viag img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.opt.viag span{position:absolute;left:0;right:0;bottom:0;padding:30px 16px 14px;font-size:21px;font-weight:800;color:#fff;text-align:left;background:linear-gradient(transparent,rgba(5,10,30,.85));text-shadow:0 2px 6px rgba(0,0,0,.7)}
.opt.viag:hover img,.opt.viag:active img{transform:scale(1.05)}
.opt.viag:active{transform:translateY(3px)}
.viagens.duas{grid-template-columns:1fr 1fr;gap:12px}
.viagens.duas .opt.viag{aspect-ratio:1}
.viagens.duas .opt.viag span{font-size:19px;text-align:center;padding:26px 8px 12px}
.opt{all:unset;cursor:pointer;display:block;padding:18px 22px;border-radius:18px;background:rgba(32,48,100,.5);border:1.5px solid var(--linha);font-weight:700;font-size:20px;transition:.25s;text-align:center}
.opt:hover{border-color:rgba(245,197,66,.55)}
.opt.sel{border-color:var(--ouro);background:rgba(245,197,66,.16);box-shadow:0 0 0 3px rgba(245,197,66,.25)}

/* vaso */
.vaso{width:min(300px,82vw);height:auto;border-radius:18px;box-shadow:0 26px 50px -18px rgba(0,0,0,.8);margin:6px auto 18px;display:block}

/* escala 0 a 10 */
.regua{display:flex;gap:14px;align-items:center;justify-content:center;max-width:460px;margin:8px auto 0}
.regua .escala{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;flex:0 0 auto;width:min(56vw,210px);margin:0}
.regua .escala button{font-size:22px;border-color:color-mix(in srgb,var(--k) 55%,transparent)!important}
.regua .escala button.sel{background:var(--k)!important;color:#0b1020;box-shadow:0 0 24px var(--k)!important}
.visor{flex:1;min-width:120px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.visor .orbe{--k:#2a3a7a;--f:.3;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff8,var(--k) 45%,transparent 72%);opacity:var(--f);box-shadow:0 0 calc(var(--f)*60px) calc(var(--f)*18px) var(--k);transform:scale(calc(.75 + var(--f)*.35));transition:all .45s cubic-bezier(.3,1.4,.5,1)}
.visor b{font:400 44px/1 Fraunces,serif;color:#f4ecdc}
.visor span:last-child{font-size:17px;font-weight:800;color:var(--azul);min-height:2.4em;transition:color .3s}
.visor.on span:last-child{color:#f4ecdc}
.escala{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;max-width:440px;margin:6px auto 0}
.escala button{all:unset;cursor:pointer;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:Fraunces,serif;font-size:24px;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.08),rgba(17,27,61,.9));border:1.5px solid var(--linha);transition:.25s}
.escala button:hover{border-color:var(--ouro)}
.escala button.sel{background:var(--ouro);color:#15110a;box-shadow:0 0 22px rgba(245,197,66,.7)}
.escala .pontas{grid-column:1/-1;display:flex;justify-content:space-between;font-size:15px;color:var(--azul);margin-top:2px}

/* grade 2x2 de fotos */
.g22{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:480px;margin:0 auto}
.foto{all:unset;cursor:pointer;position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/3.4;background:#111b3d;border:2px solid transparent;box-shadow:0 14px 30px -14px rgba(0,0,0,.8);transition:.25s}
.foto img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.foto:hover img{transform:scale(1.05)}
.foto .nm{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;font-weight:800;font-size:17px;line-height:1.2;text-align:left;background:linear-gradient(transparent,rgba(5,8,22,.92))}
.foto.sel{border-color:var(--ouro);box-shadow:0 0 0 3px rgba(245,197,66,.35),0 0 30px rgba(245,197,66,.4)}
.ouvir{position:absolute;right:8px;top:8px;all:unset;cursor:pointer;position:absolute;right:8px;top:8px;padding:8px 12px;border-radius:999px;background:rgba(5,8,22,.75);border:1px solid rgba(245,197,66,.6);font-weight:800;font-size:14px;color:var(--ouro)}
.ouvir.tocando{background:var(--ouro);color:#15110a}

/* jogos */
.dica{color:var(--azul);font-size:18px;margin:0 0 18px}
.missao{font-size:16px;line-height:1.35;color:#f4ecdc;background:rgba(255,255,255,.05);border-left:4px solid var(--c);border-radius:10px;padding:8px 12px;margin:0 auto 10px;max-width:440px;text-align:left}
.missao b{color:var(--c)}
.luzes{display:flex;justify-content:center;gap:14px;margin:14px 0 4px}
.luzes i{width:18px;height:18px;border-radius:50%;border:2px solid rgba(169,179,209,.45);background:transparent;transition:background .3s,box-shadow .3s,border-color .3s}
.luzes i.on{background:var(--c);border-color:var(--c);box-shadow:0 0 14px var(--c)}
.luzes i.off{border-color:rgba(169,179,209,.18)}
.luzes i.pop{animation:luzpop .45s ease-out}
@keyframes luzpop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.bonusq{font-size:22px;margin:16px 0 10px}
/* modo foco: durante o jogo, topo e botões quase somem; bordas escurecem com a cor do sentido */
body.foco .topo,body.foco #pularbtn,body.foco #voltar{opacity:.14;transition:opacity .5s}
body.foco .topo:hover,body.foco #pularbtn:focus-visible,body.foco #voltar:focus-visible{opacity:.6}
#vinheta{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .6s;box-shadow:inset 0 0 120px 40px rgba(3,6,18,.92),inset 0 0 220px 60px var(--foco,transparent)}
body.foco #vinheta{opacity:.55}
.brisafrase{font-family:Fraunces,serif;font-style:italic;font-size:18px;line-height:1.35;color:#f4ecdc;opacity:.9;margin:0 auto 8px;max-width:440px}
.brisafrase::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);margin-right:8px;vertical-align:middle}
.aro{position:relative;width:190px;height:190px;margin:4px auto 10px}
/* 18/11 · mandala em perspectiva do "Sinta o corpo" */
.mcorpo{position:relative;width:240px;height:200px;margin:0 auto 6px;perspective:620px;display:flex;align-items:center;justify-content:center}
.mcgira{transform-style:preserve-3d;transform:rotateX(52deg);animation:mcgira 22s linear infinite}
.mcgira .mdl{box-shadow:0 0 34px 6px color-mix(in srgb,var(--c) 45%,transparent)}
@keyframes mcgira{from{transform:rotateX(52deg) rotateZ(0)}to{transform:rotateX(52deg) rotateZ(360deg)}}
.mcchao{position:absolute;left:50%;bottom:6px;width:190px;height:34px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,color-mix(in srgb,var(--c) 55%,transparent) 0,transparent 70%);filter:blur(6px);animation:mcrespira 4s ease-in-out infinite}
@keyframes mcrespira{0%,100%{opacity:.45;transform:translateX(-50%) scale(.9)}50%{opacity:.9;transform:translateX(-50%) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.mcgira{animation:none}.mcchao{animation:none}}
.aro svg{width:100%;height:100%;transform:rotate(-90deg)}
.aro .trilho{fill:none;stroke:rgba(169,179,209,.14);stroke-width:5}
.aro .fecha{fill:none;stroke:var(--c);stroke-width:5;stroke-linecap:round;stroke-dasharray:578;stroke-dashoffset:578;filter:drop-shadow(0 0 6px var(--c));animation:aroFecha var(--seg) linear forwards}
@keyframes aroFecha{to{stroke-dashoffset:0}}
.escuro{background:radial-gradient(circle,rgba(3,6,18,.2),rgba(3,6,18,.92) 70%);border-radius:28px;padding:16px 10px 12px;margin:0 auto 6px;max-width:420px}
.luzverde{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border-radius:50%;background:radial-gradient(circle,#c9f7d8 0%,var(--c) 40%,transparent 72%);box-shadow:0 0 40px 12px var(--c);animation:respiraLuz 5s ease-in-out infinite}
@keyframes respiraLuz{0%,100%{transform:scale(.55);opacity:.55}50%{transform:scale(1.25);opacity:1}}
.mosaico{display:flex;justify-content:center;gap:6px;margin:0 auto 12px;max-width:380px}
.mosaico .pc{flex:1;aspect-ratio:3/4;border-radius:8px;border:1.5px solid rgba(169,179,209,.25);background:rgba(255,255,255,.04);overflow:hidden;position:relative}
.mosaico .pc.agora{border-color:var(--c);box-shadow:0 0 10px var(--c);animation:pulsaPc 1.6s ease-in-out infinite}
@keyframes pulsaPc{50%{box-shadow:0 0 2px var(--c)}}
.mosaico .pc.cheio{border-color:var(--c);box-shadow:0 0 8px -1px var(--c)}
.mosaico .pc img{width:100%;height:100%;object-fit:cover;display:block}
.mosaico.grande{max-width:470px;gap:8px;flex-wrap:wrap;margin:6px auto 20px}
.mosaico.grande .pc{flex:0 0 calc(25% - 6px);border-radius:14px;border-width:2px}
.mosaico.grande .pc span{font-family:Manrope,system-ui,sans-serif;position:absolute;left:0;right:0;bottom:0;padding:14px 4px 5px;font-size:12px;font-weight:800;line-height:1.15;background:linear-gradient(transparent,rgba(5,8,22,.92))}
.voa{position:fixed;z-index:30;object-fit:cover;border-radius:18px;pointer-events:none;transition:all .6s cubic-bezier(.5,0,.2,1)}
.perto{position:fixed;inset:0;z-index:40;background:rgba(3,6,18,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;animation:abrePerto .25s ease-out}
.perto img{max-width:100%;max-height:72vh;border-radius:20px;border:2px solid var(--c);box-shadow:0 0 40px -6px var(--c)}
.perto span{font-weight:800;font-size:22px}.perto small{color:var(--azul);font-size:15px}
@keyframes abrePerto{from{opacity:0;transform:scale(.96)}}
.foto,.foto img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.denovojogo{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;width:100%;max-width:340px;min-height:54px;margin:18px auto 0;padding:12px 20px;border-radius:999px;border:2px solid var(--ouro);color:var(--ouro);background:rgba(245,197,66,.12);font:800 19px Manrope,system-ui,sans-serif;box-shadow:0 0 22px rgba(245,197,66,.25);transition:transform .12s}
.denovojogo:active{transform:scale(.97)}
.basegesto{margin:2px 0 0;opacity:.8}
/* Pare a ampulheta */
.amp{position:relative;width:150px;height:230px;margin:14px auto 6px}
.amp svg{width:100%;height:100%;overflow:visible}
.amp .vidro{fill:rgba(255,255,255,.04);stroke:rgba(245,197,66,.55);stroke-width:2.5}
.amp .areia{fill:#f5c542;filter:drop-shadow(0 0 10px rgba(245,197,66,.8))}
.amp .fio{stroke:#f5c542;stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 6px #f5c542)}
.ampnum{font-family:Fraunces,serif;font-size:clamp(46px,13vw,64px);line-height:1;color:var(--ouro);text-shadow:0 0 30px rgba(245,197,66,.45);margin:4px 0 0}
.ampnum small{font-size:.38em;margin-left:6px;color:var(--txt,#f4ecdc)}
.revela2{font-family:Fraunces,serif;font-size:clamp(24px,6.4vw,30px);line-height:1.3;margin:6px 0 4px}
.revela2 b{color:var(--ouro)}
/* Saborear: imagem montada com as preferências */
.sabcol{position:relative;width:min(78vw,330px);aspect-ratio:9/13;margin:4px auto 6px;border-radius:22px;overflow:hidden;border:3px solid #f5c542;box-shadow:0 0 50px rgba(245,197,66,.45);background:#0a1128;display:grid;gap:3px;grid-template-columns:repeat(6,1fr);grid-auto-rows:1fr;animation:entra .9s cubic-bezier(.2,.8,.2,1) both}
.sabcol .ph{position:relative;background-size:cover;background-position:center;grid-column:span 2}
.sabcol .ph.big{grid-column:1/-1;grid-row:span 2}
.sabcol .ph.meio{grid-column:span 3}
.sabcol .ph.big1{grid-column:1/-1}
.sabcol .ph i{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--c)}
.sabcol .ph span{position:absolute;left:0;right:0;bottom:4px;padding:16px 6px 4px;font:800 11px Manrope,sans-serif;line-height:1.15;color:#fff;background:linear-gradient(transparent,rgba(5,8,22,.9));text-shadow:none}
.sabcol .marca{position:absolute;left:0;right:0;top:0;padding:8px;font:400 11px "Space Mono",monospace;letter-spacing:.12em;color:#f5c542;background:linear-gradient(rgba(5,8,22,.85),transparent);text-shadow:none}
.saborear .frasebela{font-family:Fraunces,serif;font-style:italic;font-size:clamp(21px,5.6vw,26px);line-height:1.3;margin:6px 0 0;max-width:420px}
.fundobtn{all:unset;cursor:pointer;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;font-size:14px;color:var(--azul);padding:8px 14px;border-radius:999px;background:rgba(10,17,40,.85);border:1px solid rgba(169,179,209,.3);white-space:nowrap}
.fundobtn[hidden]{display:none}.fundobtn[disabled]{opacity:.6;cursor:default}
.pisca2{animation:pisca2 1.4s ease-in-out infinite;color:var(--ouro)!important;font-size:16px}
@keyframes pisca2{50%{opacity:.25}}
.retratotit{font-size:clamp(40px,11vw,54px)!important;line-height:1.05;margin:6px 0 10px}
.jtit{margin:4px 0 6px}
.dica.curta{font-size:18px;margin:0 0 12px}
.sons .som{position:relative}
.som .nsom{position:absolute;top:8px;left:10px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px}
.som.um{border-color:#4aa8ff!important;background:rgba(74,168,255,.14)!important}.som.um .nsom{background:#4aa8ff;color:#0b1020}
.som.dois{border-color:#f5c542!important;background:rgba(245,197,66,.12)!important;border-radius:20px 6px 20px 6px!important}.som.dois .nsom{background:#f5c542;color:#0b1020}
/* Fases 3 e 4: cartão de vidro "Falta pouco" */
.trava{position:relative;max-width:440px;margin:10px auto 0;padding:22px 18px;border-radius:26px;overflow:hidden;
  background:linear-gradient(140deg,rgba(255,255,255,.16),rgba(255,255,255,.05) 55%,rgba(245,197,66,.08));
  -webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);
  border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 24px 50px -24px rgba(0,0,0,.9)}
.trava::before{content:"";position:absolute;inset:-40% -20% auto;height:70%;background:radial-gradient(ellipse,rgba(255,255,255,.18),transparent 70%);pointer-events:none}
.trava>*{position:relative}
.trava h2{margin:2px 0 6px;font-size:clamp(34px,9vw,42px)}
.trava .sub{margin-bottom:6px}
.trava .opc{font-size:14px;color:var(--azul);margin:0 0 6px}
/* imagem do Saborear para baixar */
.sabbaixa{max-width:440px;margin:6px auto 4px;text-align:center}
.sabbaixa img{display:block;width:min(56vw,220px);height:auto;margin:0 auto 12px;border-radius:14px;border:1.5px solid rgba(245,197,66,.5);box-shadow:0 14px 34px -14px rgba(0,0,0,.9)}
.sabbaixa .btn[disabled]{opacity:.55}
.sabbaixa .exnota{font-size:14px;color:var(--azul);margin:-4px 0 10px}
/* Entenda o Flow: link discreto que abre por cima */
.linkflow{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;margin-top:20px;padding:11px 20px;border-radius:999px;border:1.5px solid rgba(245,197,66,.6);color:var(--ouro);font-size:18px;font-weight:800;background:rgba(245,197,66,.08)}
.linkflow::before{content:"i";display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ouro);color:#0a1128;font:800 14px Fraunces,serif}
.flowov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px;background:rgba(5,8,26,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .3s ease-out}
@keyframes fade{from{opacity:0}}
.flowcx{position:relative;width:100%;max-width:440px;max-height:88vh;overflow:auto;padding:22px 16px 18px;border-radius:24px;text-align:center;background:rgba(18,27,72,.94);border:1.5px solid rgba(245,197,66,.4)}
.flowcx .fx{all:unset;cursor:pointer;position:absolute;top:10px;right:12px;width:40px;height:40px;display:grid;place-items:center;font-size:20px;color:var(--azul)}
#aviso{display:flex;flex-direction:column;gap:10px;margin-top:8px}
#aviso input[type=text],#aviso input:not([type]),#aviso input[type=email]{font:600 18px Manrope,system-ui,sans-serif;color:#f4ecdc;background:#0b1236;border:1.5px solid rgba(169,179,209,.35);border-radius:14px;padding:13px 14px}
#aviso .lgpd{display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:14px;line-height:1.4;color:var(--azul)}
#aviso .lgpd input{width:22px;height:22px;flex:0 0 22px;margin-top:1px;accent-color:#f5c542}
#aviso .lgpd a{color:var(--azul)}
.averr{color:#ff9aa6;font-size:15px;min-height:1em}
.avok{font-size:20px;font-weight:800;color:var(--ouro)}
/* 26/11: PORTA TRANCADA da Fase 3 (fim da Fase 2) — alegre e chamativa; abre só na prévia até a Fase 3 ficar pronta */
.porta3{max-width:440px;margin:6px auto 0;text-align:center}
.pt-cena{position:relative;width:min(78vw,320px);margin:6px auto 18px}
.pt-luz{position:absolute;inset:-6% -14%;background:radial-gradient(closest-side,rgba(245,197,66,.40),transparent);filter:blur(8px);animation:ptPulsa 3.2s ease-in-out infinite}
.pt-img{position:relative;display:block;width:100%;height:auto;border-radius:18px;box-shadow:0 26px 50px -22px rgba(0,0,0,.9);animation:ptEntra .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes ptPulsa{50%{opacity:.55;transform:scale(.95)}}
@keyframes ptEntra{from{opacity:0;transform:translateY(16px) scale(.96)}}
.porta3 .pt-rot{font:700 14px "Space Mono",monospace;letter-spacing:.12em;color:var(--ouro);text-transform:uppercase}
.porta3 h2{margin:6px 0 8px;font-size:clamp(30px,8vw,38px)}
.porta3 .pt-txt{font-size:19px;line-height:1.5;margin:0 0 6px}
@media (prefers-reduced-motion:reduce){.pt-luz,.pt-img{animation:none}}
.rodada{font:400 15px "Space Mono",monospace;color:var(--azul);margin-bottom:10px}
.grade4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:400px;margin:0 auto}
.grade4 button{all:unset;cursor:pointer;aspect-ratio:1;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.grade4 button.ok{box-shadow:0 0 0 4px #9be7b0}
.grade4 button.bad{box-shadow:0 0 0 4px #ff8a80}
.res{min-height:30px;margin-top:14px;font-weight:700}
.res .bom{color:#9be7b0}.res .nao{color:#ffb3ab}
.nivel{display:inline-flex;align-items:center;gap:10px;font:700 16px "Space Mono",monospace;color:var(--creme);background:rgba(74,168,255,.12);border:1px solid rgba(74,168,255,.45);border-radius:999px;padding:8px 18px;margin:4px 0 10px}
.nivel small{font:400 13px Manrope,sans-serif;color:var(--azul)}
.fimnivel{margin-top:16px;padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--linha)}
.fimnivel b{display:block;font:400 30px Fraunces,serif;color:var(--ouro)}
.fimnivel p{margin:6px 0 0;font-size:19px;color:var(--creme)}
.volta{margin:14px auto 0;font:400 22px/1.35 Fraunces,serif;color:var(--ouro);min-height:30px;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
.volta.on{opacity:1;transform:none}
.faltam{display:inline-block;margin:0 auto 8px;padding:6px 16px;border-radius:999px;background:rgba(245,197,66,.14);border:1px solid rgba(245,197,66,.55);color:var(--ouro);font:700 15px "Space Mono",monospace;animation:faltapisca 1.6s ease-in-out 3}
@keyframes faltapisca{50%{box-shadow:0 0 22px rgba(245,197,66,.6)}}
.mapaex{max-width:440px;margin:14px auto 6px;font-size:18px;line-height:1.45;color:var(--creme)}
.pista{max-width:440px;margin:10px auto 18px;padding:12px 16px;border-radius:16px;background:rgba(245,197,66,.08);border-left:4px solid var(--ouro);text-align:left;font-size:17px;color:var(--creme)}
.pista b{color:var(--ouro)}
.prontos{font:400 clamp(24px,6.5vw,30px)/1.25 Fraunces,serif;color:var(--creme);margin:0 0 14px}
.prontos em{color:var(--ouro)}

.sons{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:440px;margin:0 auto 18px}
.som{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 10px;border-radius:20px;background:rgba(32,48,100,.5);border:1.5px solid var(--linha);font-weight:800;font-size:18px}
.som .onda{width:72px;height:36px}
.som.tocando{border-color:#4aa8ff;box-shadow:0 0 24px rgba(74,168,255,.5)}

/* carinho */
.texturas{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:460px;margin:0 auto}
.tex{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;border:2px solid transparent;box-shadow:0 14px 30px -14px rgba(0,0,0,.8);cursor:grab}
.tex img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tex .nm{position:absolute;left:0;right:0;bottom:0;padding:20px 12px 10px;font-weight:800;font-size:17px;text-align:left;background:linear-gradient(transparent,rgba(5,8,22,.9));pointer-events:none}
.tex .barra{position:absolute;left:10px;right:10px;top:10px;height:6px;border-radius:9px;background:rgba(5,8,22,.6);overflow:hidden;pointer-events:none}
.tex .barra b{display:block;height:100%;width:0;background:#ff8a3d;box-shadow:0 0 10px #ff8a3d;transition:width .15s}
.tex.feita{border-color:#ff8a3d}
.tex.feita::after{content:"✓";position:absolute;right:10px;top:22px;width:30px;height:30px;border-radius:50%;background:#ff8a3d;color:#2a1103;font-weight:800;display:grid;place-items:center;font-size:18px}
.dica2{color:var(--creme);font-size:19px;font-weight:700;margin:-4px 0 16px}
.mao{position:absolute;left:18%;top:42%;width:58px;height:58px;pointer-events:none;z-index:2;animation:desliza 1.8s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.mao svg{width:100%;height:100%}
.mao::before{content:"";position:absolute;left:6px;top:4px;width:18px;height:18px;border-radius:50%;background:rgba(255,200,150,.55);animation:toque 1.8s ease-in-out infinite}
@keyframes desliza{0%{transform:translateX(0)}50%{transform:translateX(90%)}100%{transform:translateX(0)}}
@keyframes toque{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}
.texturas.tocou .mao{display:none}
.tex .rastro{position:absolute;width:44px;height:44px;margin:-22px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,200,150,.6),transparent 70%);opacity:0;transition:opacity .3s}

/* prato */
.mesa{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:0 auto 16px;border-radius:50%;
 background:radial-gradient(circle,#f6f1e8 52%,#ddd5c6 53%,#f1ebdf 61%,#cfc4b2 64%,rgba(0,0,0,0) 65%);filter:drop-shadow(0 22px 30px rgba(0,0,0,.7))}
.mesa .ing{position:absolute;width:34%;aspect-ratio:1;animation:cai .55s cubic-bezier(.3,1.4,.5,1) both}
.mesa .ing img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
@keyframes cai{from{transform:translateY(-60px) scale(1.3);opacity:0}}
.mesa.pronto{animation:brilha 1.6s ease-in-out}
@keyframes brilha{50%{filter:drop-shadow(0 0 40px rgba(245,197,66,.8))}}
.ingr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:460px;margin:0 auto}
.ingr button{all:unset;cursor:pointer;border-radius:14px;padding:8px 4px 6px;background:rgba(32,48,100,.5);border:1.5px solid var(--linha);font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.ingr button img{width:56px;height:56px;object-fit:contain}
.ingr button.sel{border-color:#ff5a6e;background:rgba(255,90,110,.15)}
.ingr button[disabled]{opacity:.4}
.pratonome{min-height:28px;font-family:Fraunces,serif;font-size:21px;margin-bottom:12px}

/* pares de cheiros */
.pares{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:0 auto}
.carta{all:unset;cursor:pointer;display:block;width:100%;aspect-ratio:3/4;border-radius:16px;perspective:600px}
.carta .in{display:block;position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.carta.vira .in{transform:rotateY(180deg)}
.carta .f,.carta .v{display:block;position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.carta .f{background:radial-gradient(circle at 50% 40%,#203064,#0d1534);border:1.5px solid rgba(92,207,138,.45);display:grid;place-items:center}
.carta .f svg{width:46%}
.carta .v{transform:rotateY(180deg);background:#111b3d}
.carta .v img{width:100%;height:100%;object-fit:cover}
.carta .v span{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 6px;font-size:13px;font-weight:800;background:linear-gradient(transparent,rgba(5,8,22,.92))}
.carta.ok .v{box-shadow:inset 0 0 0 3px #5ccf8a}

/* segure firme */
.firme{position:relative;width:190px;height:190px;margin:0 auto 10px;touch-action:none;user-select:none;-webkit-user-select:none}
.firme svg{width:100%;height:100%}
.firme .alvo{position:absolute;inset:47px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#c9a8ff,#6b45c9 70%);box-shadow:0 0 40px rgba(180,140,255,.55);display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;cursor:pointer}
.firme.segurando .alvo{transform:scale(.96);box-shadow:0 0 60px rgba(180,140,255,.9)}

/* pular este jogo (aparece discreto depois de 2 tentativas que não deram certo) */
.pular{all:unset;cursor:pointer;display:block;margin:14px auto 0;padding:10px 18px;font-size:16px;color:var(--azul);text-decoration:underline;text-underline-offset:4px;border-radius:999px;animation:entra .5s both}
.pular:hover,.pular:focus-visible{color:#f4ecdc;outline:2px solid rgba(245,197,66,.5);outline-offset:2px}
.legenda .pulado{color:var(--azul);font-style:italic}

/* corpo que acende */
.corpo{width:min(250px,64vw);margin:0 auto 10px;display:block}
.corpo .parte{fill:rgba(63,214,208,0);stroke:none;cursor:pointer;transition:fill .4s}
.corpo .parte.on{fill:rgba(63,214,208,.55);filter:url(#brilho)}
.corpo .linha{fill:none;stroke:#f5c542;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:url(#luz);pointer-events:none}
.partes{min-height:26px;color:var(--azul);font-size:17px;margin-bottom:12px}

/* Caça aos cheiros (Olfato) */
.olhos{font:400 15px "Space Mono",monospace;color:var(--azul);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:480px;margin:0 auto 14px}
.chips button{all:unset;cursor:pointer;padding:13px 18px;border-radius:999px;font-weight:700;font-size:18px;background:rgba(32,48,100,.5);border:1.5px solid var(--linha);transition:.2s}
.chips button.sel{background:rgba(92,207,138,.2);border-color:#5ccf8a;color:#d6ffe4}
.chips button[disabled]{opacity:.35}
.outro{display:flex;gap:8px;max-width:420px;margin:0 auto 12px}
.outro input{flex:1;min-height:52px;padding:0 16px;border-radius:14px;border:1.5px solid var(--linha);background:rgba(10,17,40,.8);color:var(--creme);font:600 18px Manrope,sans-serif}
.outro input:focus{outline:none;border-color:#5ccf8a}
.outro button{all:unset;cursor:pointer;padding:0 18px;border-radius:14px;background:rgba(92,207,138,.2);border:1.5px solid #5ccf8a;font-weight:800}
.conta{font:700 16px "Space Mono",monospace;color:#5ccf8a;margin-bottom:12px}

let ac=null;
function somPronto(){ try{ if(navigator.audioSession&&navigator.audioSession.type!=="playback") navigator.audioSession.type="playback"; }catch(e){}
  if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); const b=ac.createBuffer(1,1,22050), s=ac.createBufferSource(); s.buffer=b; s.connect(ac.destination); s.start(0); }catch(e){ return Promise.reject(); } }
  if(ac.state!=="running"){ try{ return ac.resume().then(()=>ac,()=>ac); }catch(e){} } return Promise.resolve(ac); }

function click(){ somPronto().then(c=>{ try{ const t=c.currentTime, o=c.createOscillator(), f=c.createBiquadFilter(), g=c.createGain(); o.type="square"; o.frequency.setValueAtTime(150,t); f.type="lowpass"; f.frequency.value=900; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.2,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+.07); o.connect(f).connect(g).connect(c.destination); o.start(t); o.stop(t+.08); }catch(e){} }).catch(()=>{}); }
function tom(f,dur=.7){ somPronto().then(c=>{ try{ const t=c.currentTime, o=c.createOscillator(), g=c.createGain(); o.type="sine"; o.frequency.value=f; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.28,t+.04); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05); }catch(e){} }).catch(()=>{}); }
/* Tons da Audição tocados por um <audio> com um arquivo de som criado no próprio app.
   No celular isso é mais confiável que o outro jeito (Web Audio), que às vezes fica mudo. */
const WAVS={};
function wavTom(f,dur){ const k=f+"_"+dur; if(WAVS[k]) return WAVS[k];
  const sr=44100, n=Math.floor(sr*dur), buf=new ArrayBuffer(44+n*2), v=new DataView(buf), w=(o,t)=>{ for(let i=0;i<t.length;i++) v.setUint8(o+i,t.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){ const t=i/sr, ataque=Math.min(1,t/.03), solta=Math.min(1,(dur-t)/Math.min(.12,dur*.35)), a=.55*Math.max(0,Math.min(ataque,solta)); v.setInt16(44+i*2, Math.round(a*Math.sin(2*Math.PI*f*t)*32767), true); }
  return WAVS[k]=URL.createObjectURL(new Blob([buf],{type:"audio/wav"})); }
let audTom=null;
function tocaTom(f,dur=.8){ try{ if(audTom){ audTom.pause(); } audTom=new Audio(wavTom(f,dur)); audTom.volume=1; const pr=audTom.play(); if(pr&&pr.catch) pr.catch(()=>tom(f,dur)); return audTom; }catch(e){ tom(f,dur); return null; } }

function ruido(c,seg,tipo){ const n=Math.floor(c.sampleRate*seg), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0); let u=0; for(let i=0;i<n;i++){ const w=Math.random()*2-1; if(tipo==="marrom"){ u=(u+.02*w)/1.02; d[i]=u*3.5; } else d[i]=w; } return b; }
function corda(c,f,q,dest){ const sr=c.sampleRate,n=Math.floor(sr*2.2),b=c.createBuffer(1,n,sr),d=b.getChannelData(0),p=Math.round(sr/f); for(let i=0;i<p;i++) d[i]=Math.random()*2-1; for(let i=p;i<n;i++) d[i]=.996*.5*(d[i-p]+d[i-p+1]); const s=c.createBufferSource(); s.buffer=b; const g=c.createGain(); g.gain.value=.35; s.connect(g).connect(dest); s.start(q); return s; }
let somAtual=null;
function pararSom(){ if(!somAtual) return; try{ somAtual.parar(); }catch(e){} somAtual=null; document.querySelectorAll(".ouvir.tocando").forEach(b=>{ b.classList.remove("tocando"); b.textContent="Ouvir"; }); }
function tocarAmbiente(qual,btn){
  const era=btn.classList.contains("tocando"); pararSom(); if(era) return;
  somPronto().then(c=>{ const t0=c.currentTime, dur=5, m=c.createGain(); m.gain.setValueAtTime(0,t0); m.gain.linearRampToValueAtTime(.9,t0+.4); m.gain.setValueAtTime(.9,t0+dur-.6); m.gain.linearRampToValueAtTime(0,t0+dur); m.connect(c.destination); const F=[];
    if(qual==="mar"){ const s=c.createBufferSource(); s.buffer=ruido(c,dur,"marrom"); const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=700; const g=c.createGain(); g.gain.setValueAtTime(.15,t0); [0,2.4].forEach(o=>{ g.gain.linearRampToValueAtTime(1,t0+o+1.1); g.gain.linearRampToValueAtTime(.18,t0+o+2.4); }); s.connect(lp).connect(g).connect(m); s.start(t0); F.push(s); }
    if(qual==="chuva"){ const s=c.createBufferSource(); s.buffer=ruido(c,dur,"branco"); const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=2600; bp.Q.value=.5; const g=c.createGain(); g.gain.value=.35; s.connect(bp).connect(g).connect(m); s.start(t0); F.push(s);
      for(let i=0;i<70;i++){ const o=c.createOscillator(), gg=c.createGain(), q=t0+Math.random()*dur; o.frequency.value=1800+Math.random()*2600; gg.gain.setValueAtTime(0,q); gg.gain.linearRampToValueAtTime(.06,q+.003); gg.gain.exponentialRampToValueAtTime(.0001,q+.05); o.connect(gg).connect(m); o.start(q); o.stop(q+.06); F.push(o); } }
    if(qual==="musica"){ const p=c.createBufferSource(); p.buffer=ruido(c,dur,"marrom"); const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=500; const gp=c.createGain(); gp.gain.value=.25; p.connect(bp).connect(gp).connect(m); p.start(t0); F.push(p);
      [[196,247,294,392],[220,262,330,440],[175,220,262,349],[196,247,294,392]].forEach((a,ai)=>a.forEach((f,ni)=>F.push(corda(c,f,t0+.3+ai*1.1+ni*.05,m)))); }
    btn.classList.add("tocando"); btn.textContent = qual==="silencio" ? "Silêncio…" : "Parar";
    const tm=setTimeout(pararSom,dur*1000); somAtual={parar(){ clearTimeout(tm); F.forEach(f=>{ try{ f.stop(); }catch(e){} }); try{ m.disconnect(); }catch(e){} }};
  }).catch(()=>{});
}
/* SOM DOS JOGOS (Sala do Flow): "seta de carro moderno", tic-tac suave em dupla. As fotos da Fase 1 seguem com o pisca clássico (click). */
function somJogo(){ somPronto().then(c=>{ try{ const t=c.currentTime; [[0,3200,1500,.22],[.16,2600,1150,.16]].forEach(([d,bp,f,v])=>{ const n=c.createBuffer(1,c.sampleRate*.01,c.sampleRate), x=n.getChannelData(0); for(let i=0;i<x.length;i++) x[i]=(Math.random()*2-1)*(1-i/x.length); const sb=c.createBufferSource(); sb.buffer=n; const b=c.createBiquadFilter(); b.type="bandpass"; b.frequency.value=bp; b.Q.value=3; const o=c.createOscillator(); o.type="sine"; o.frequency.value=f; const g=c.createGain(); g.gain.setValueAtTime(.0001,t+d); g.gain.exponentialRampToValueAtTime(v,t+d+.003); g.gain.exponentialRampToValueAtTime(.0001,t+d+.045); sb.connect(b).connect(g); o.connect(g); g.connect(c.destination); sb.start(t+d); o.start(t+d); o.stop(t+d+.05); }); }catch(e){} }).catch(()=>{}); }

/* 19/11: o som de fundo deixou de ser o "zumbido" de tons puros. Agora é uma trilha gravada, calma e quente (pad + sininhos), em loop.
   somSuave continua com o mesmo nome para valer em todos os lugares que já o usavam (jogos, viagens, Sinta o corpo). */
function tocaTrilha(arq,vol,loop){ if(loop && somAtual && somAtual.arq===arq && !somAtual.parou) return; /* mesma trilha em loop já tocando: continua sem recomeçar */ pararSom(); try{ const au=new Audio(arq); au.loop=!!loop; au.volume=0; au.play().catch(()=>{});
    let v=0; const alvo=Math.min(1,vol), sobe=setInterval(()=>{ v=Math.min(alvo,v+alvo/15); au.volume=v; if(v>=alvo) clearInterval(sobe); },100);
    somAtual={arq,parar(){ this.parou=true; clearInterval(sobe); let vv=au.volume; const desce=setInterval(()=>{ vv=Math.max(0,vv-.08); au.volume=vv; if(vv<=0){ clearInterval(desce); au.pause(); } },40); }};
  }catch(e){} }

/* ===== MANDALA OFICIAL ===== montar(tam): cria a mandala; poeMandala(el,{pos,luz,miolo}): pedaços no lugar (pos), acesos (luz), miolo aceso */
/* centro de cada um dos 7 círculos na imagem oficial (em %), em sentido horário a partir do de cima */
const MC=[[50.5,15.8],[75.6,27.2],[84.6,52.2],[69.2,77.5],[31.6,77.2],[16.0,51.2],[25.6,26.2]].map(([x,y])=>[x,y,Math.atan2(y-50,x-50)]);
function mandala(tam,id){ let h=`<span class="mdl" ${id?`id="${id}"`:""} style="width:${tam}px;height:${tam}px"><img class="bs" src="${MANDALA}" alt="Mandala do 7entidos"><span class="hl mh" style="left:50%;top:50%;--c:rgba(245,197,66,.95)"></span>`;
  MC.forEach(([x,y],k)=>{ h+=`<span class="hl" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%;--c:${SENT[k].cor}"></span>`; });
  h+=`<img class="mi apag" src="${MANDALA}" alt="" style="clip-path:circle(20.5% at 50% 50%);-webkit-clip-path:circle(20.5% at 50% 50%)">`;
  MC.forEach(([x,y,a],k)=>{ const cp=`circle(13.2% at ${x.toFixed(1)}% ${y.toFixed(1)}%)`; h+=`<img class="c lugar" src="${MANDALA}" alt="" style="clip-path:${cp};-webkit-clip-path:${cp};--tx:${(Math.cos(a)*tam*.32).toFixed(0)}px;--ty:${(Math.sin(a)*tam*.32).toFixed(0)}px">`; });
  return h+`</span>`; }
/* poeMandala(el,{pos,luz,miolo}): pos = círculos no lugar (os outros ficam quebrados, fora do lugar); luz = círculos acesos; miolo = o 7 aceso.
   Quando os 7 sentidos e o miolo estão acesos, a mandala fica inteira e brilhante. */
function poeMandala(el,o){ if(!el) return; o=o||{}; let pos=o.pos||[], luz=(o.luz||[]).slice();
  const cheia=[0,1,2,3,4,5,6].every(i=>luz.includes(i)) && o.miolo;

/* versão mais clara da cor do sentido, para textos pequenos ficarem legíveis sobre o fundo da mesma cor */
function claro(h){ const a=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); return "#"+a.map(x=>Math.round(x+(255-x)*.5).toString(16).padStart(2,"0")).join(""); }
function mixCor(h,t){ const a=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)), b=[10,17,40]; return "rgb("+a.map((x,k)=>Math.round(x*t+b[k]*(1-t))).join(",")+")"; }
function rgba(h,al){ return "rgba("+[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)).join(",")+","+al+")"; }

   Se o celular não deixar tocar com som, o vídeo toca sem som, a legenda liga sozinha e um toque no vídeo põe o som. */
let GV=null, legOn=false, entrou=false;
function pegaVideo(){ if(!GV){ GV=document.createElement("video"); GV.id="vid"; GV.setAttribute("playsinline",""); GV.setAttribute("webkit-playsinline",""); GV.preload="auto"; } return GV; }
function destravaVideo(src){ const v=pegaVideo(); try{ v.muted=false; if(!v.src.endsWith(src.split("/").pop())){ v.src=src; v.poster=src.replace(/\.mp4(\?.*)?$/,".jpg"); } const p=v.play(); v.pause(); if(p&&p.catch) p.catch(()=>{}); }catch(e){} }
function videoBrisa(src,leg,legcls){ return `<div class="vbrisa" id="vb"><div class="vslot" id="vslot"></div>${VIDEO_TESTE&&PREVIA?'<span class="teste">vídeo de teste</span>':""}</div>
  <div class="legfora ${legcls||""}" id="leg" ${legOn?"":"hidden"}></div>
  <div class="vbotoes"><button class="ouvirb ${legOn?"on":""}" id="legbtn" type="button" aria-pressed="${legOn}">💬 Legenda</button><button class="denovo" id="denovo" type="button" hidden>▶ Ver de novo</button></div>`; }
function ligaVideo(c,leg,falha,src){ const lg=c.querySelector("#leg"), lb=c.querySelector("#legbtn"), dn=c.querySelector("#denovo"), slot=c.querySelector("#vslot"); if(!slot) return;
  if(!leg.length){ lb.style.display="none"; lg.hidden=true; }
  const v=pegaVideo(); slot.appendChild(v);
  if(!v.src.endsWith(src.split("/").pop())){ v.src=src; v.poster=src.replace(/\.mp4(\?.*)?$/,".jpg"); }
  const poeLeg=()=>{ const t=v.currentTime, l=leg.find(x=>t>=x[0]&&t<x[1]); lg.textContent=l?l[2]:""; };
  const ligaLeg=on=>{ if(!leg.length) return; legOn=on; lg.hidden=!on; lb.classList.toggle("on",on); lb.setAttribute("aria-pressed",on); poeLeg(); };
  v.ontimeupdate=poeLeg;
  v.onended=()=>{ dn.hidden=false; lg.textContent=""; if(src===VID1) acendeLuz0(); };
  v.onerror=()=>{ const vb=c.querySelector("#vb"); if(vb) vb.outerHTML=anel("respira comfoto",-1,[],BRISA); lb.remove(); dn.remove(); lg.remove(); if(falha) falha(); };
  v.onclick=()=>{ if(v.muted){ v.muted=false; v.currentTime=0; v.play().catch(()=>{}); resp.ouviu_brisa=true; } };
  lb.onclick=()=>{ click(); ligaLeg(!legOn); };
  dn.onclick=()=>{ click(); dn.hidden=true; v.muted=false; v.currentTime=0; v.play().catch(()=>{}); };
  try{ v.currentTime=0; }catch(e){}
  v.muted=false;
  const pr=v.play();
  if(pr&&pr.then) pr.then(()=>{ resp.ouviu_brisa=true; }).catch(()=>{ v.muted=true; v.play().catch(()=>{}); ligaLeg(true); }); }

/* Bloco 4 · sentimentos por faixa da nota (vocabulário próprio do 7entidos, inspirado na PANAS-BR e na Escala de Afetos de Zanon, sem copiar).
   5 faixas iguais às cores do calendário. Cada faixa sugere 3 palavras mais calmas e 3 mais agitadas; qualquer palavra pode ser escolhida ou escrita. */
const FAIXAS=[
 {de:0,ate:2, calmas:["Cansaço","Tristeza","Desânimo"],             agitadas:["Preocupação","Irritação","O dia está pesado"]},
 {de:3,ate:4, calmas:["Tédio","Moleza","Falta de vontade"],          agitadas:["Inquietação","Pressa","Tensão"]},
 {de:5,ate:6, calmas:["Tranquilidade","No automático","Sossego"],    agitadas:["Correria","Distração","Muita coisa pra fazer"]},
 {de:7,ate:8, calmas:["Alívio","Conforto","Paz"],                    agitadas:["Animação","Bom humor","Disposição"]},
 {de:9,ate:10,calmas:["Gratidão","Plenitude","Realização"],          agitadas:["Alegria","Empolgação","Entusiasmo"]}
];
const faixaDe=n=>FAIXAS.find(f=>n>=f.de&&n<=f.ate);
/* índice nota ↔ sentimento: fica só no celular; com o tempo o app aprende o padrão de cada pessoa */
function indice(){ try{ return JSON.parse(localStorage.getItem("7e_indice")||"[]"); }catch(e){ return []; } }
function guardaIndice(nota,palavra,onde){ const l=indice(); l.push({nota,palavra,onde,quando:new Date().toISOString()}); try{ localStorage.setItem("7e_indice",JSON.stringify(l.slice(-500))); }catch(e){} }
/* padrão aprendido: a palavra que a pessoa mais escolhe para aquele número (só aparece com 3 ou mais vezes) */
function padraoDe(n){ const c={}; indice().filter(x=>x.nota===n).forEach(x=>{ c[x.palavra]=(c[x.palavra]||0)+1; }); const t=Object.entries(c).sort((a,b)=>b[1]-a[1])[0]; return t&&t[1]>=3?t[0]:null; }
function sentimentos(n,k,todas){ const f=faixaDe(n), sel=resp["sent_"+k]&&resp["sent_"+k].nota===n?resp["sent_"+k].palavra:null, pd=padraoDe(n);
  const lista=todas?FAIXAS:[f];
  const col=(t,arr)=>`<div class="scol"><small>${t}</small>${arr.map(w=>`<button type="button" class="${sel===w?"sel":""}" onclick="escolheSent(this,'${k}',${n},'${w.replace(/'/g,"\\'")}')">${w}</button>`).join("")}</div>`;
  return `<div class="sentbox entra"><h3>Por que você escolheu esse número?</h3>
    ${pd?`<p class="spad">Quando você dá ${n}, costuma escolher <b>${esc(pd)}</b>.</p>`:""}
    <div class="scols">${col("Mais calmas",[].concat(...lista.map(x=>x.calmas)))}${col("Mais agitadas",[].concat(...lista.map(x=>x.agitadas)))}</div>
    <div class="soutro"><input id="sout" maxlength="30" placeholder="Ou escreva a sua palavra" aria-label="Escreva a sua palavra"><button type="button" onclick="const v=document.getElementById('sout').value.trim(); if(v) escolheSent(null,'${k}',${n},v)">OK</button></div>
    <div class="sbaixo">${todas?"":`<button type="button" class="slink" onclick="click();mostraSent(${n},'${k}',true)">Ver outras palavras</button>`}<button type="button" class="slink" onclick="seguirSemSent('${k}')">Seguir sem escolher</button></div></div>`; }

  eb.insertAdjacentHTML("beforeend",sentimentos(n,k,todas)); const sb=eb.querySelector(".sentbox"); if(sb&&sb.scrollIntoView) setTimeout(()=>sb.scrollIntoView({behavior:"smooth",block:"center"}),60); }
function escolheSent(b,k,n,w){ click(); vibra(10); const f=faixaDe(n); const coluna=f.calmas.includes(w)?"calma":f.agitadas.includes(w)?"agitada":(FAIXAS.some(x=>x.calmas.includes(w))?"calma":FAIXAS.some(x=>x.agitadas.includes(w))?"agitada":"propria");
  resp["sent_"+k]={nota:n,palavra:w,coluna}; guardaIndice(n,w,k==="escala_chegada"?"entrada":"saida");
  document.querySelectorAll(".sentbox button").forEach(x=>x.classList.toggle("sel",x===b)); terminaEscala(k); }

const RESUMO_TXT = {
 1:"Parabéns! Você escolheu, com calma, uma imagem para cada um dos 7 sentidos, e não é todo mundo que chega até aqui. A Fase 1 serve para eu conhecer do que você gosta. Na Fase 2, você vai viver essas escolhas em pequenos jogos, e eu vou te entender ainda melhor.",

/* Saborear: uma imagem (a foto favorita do sentido de que mais curtiu) com uma frase curta */
let saborTm=null;
/* monta a composição do Saborear (usada na tela e na imagem para baixar no fim) */
function montaSabor(){
  const v=SENT.map(s=>resp["curtiu_"+s.id]||0), max=Math.max(...v);
  let i=v.indexOf(max); if(SENT[i] && SENT[i].o.indexOf(resp["gosto_"+SENT[i].id])<0) i=SENT.findIndex(s=>s.o.indexOf(resp["gosto_"+s.id])>=0);
  if(i<0) return null;
  const s=SENT[i], j=Math.max(0,s.o.indexOf(resp["gosto_"+s.id]));
  const outros=SENT.map((x,k)=>({x,k,j:x.o.indexOf(resp["gosto_"+x.id]),v:v[k]})).filter(o=>o.j>=0&&o.x!==s).sort((a,b)=>b.v-a.v||a.k-b.k).slice(0,6);
  const nomes=[s.o[j]].concat(outros.slice(0,2).map(o=>o.x.o[o.j])).map(t=>t.charAt(0).toLowerCase()+t.slice(1));
  const lista=nomes.length>1?nomes.slice(0,-1).join(", ")+" e "+nomes[nomes.length-1]:nomes[0];
  return {v,s,j,outros,frase:`O que te faz bem tem nome: ${lista}.`};
}
/* Bloco A: quando a pessoa não tem escolhas (ex.: entrou pelo "Ver" do painel ou pulou tudo), a tela final mostra uma imagem de EXEMPLO */
function saborExemplo(){ const s=SENT[0], outros=[SENT[1],SENT[2],SENT[3]].map((x,k)=>({x,k:k+1,j:0,v:0}));
  return {v:SENT.map(()=>0),s,j:0,outros,exemplo:true,frase:`O que te faz bem tem nome: ${s.o[0].toLowerCase()}, ${SENT[1].o[0].toLowerCase()} e ${SENT[2].o[0].toLowerCase()}.`}; }
/* desenha a imagem do Saborear num quadro 1080 x 1350 (formato de post) para a pessoa baixar */
function imagemSabor(m){
  m=m||montaSabor(); if(!m) return Promise.reject();
  const W=1080,H=1350,cv=document.createElement("canvas"); cv.width=W; cv.height=H; const g=cv.getContext("2d");
  const carrega=src=>new Promise(ok=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=()=>ok(null); im.src=src; });
  const lista=[{x:m.s,j:m.j}].concat(m.outros.map(o=>({x:o.x,j:o.j})));
  const fontes=(document.fonts&&document.fonts.ready)?document.fonts.ready.catch(()=>{}):Promise.resolve();
  return Promise.all([fontes].concat(lista.map(o=>carrega(foto(o.x.id,o.j))))).then(r=>{ const ims=r.slice(1);
    const fundo=g.createLinearGradient(0,0,0,H); fundo.addColorStop(0,"#0a1128"); fundo.addColorStop(1,"#141a45"); g.fillStyle=fundo; g.fillRect(0,0,W,H);
    const caixa=(x,y,w,h,rr)=>{ g.beginPath(); g.moveTo(x+rr,y); g.arcTo(x+w,y,x+w,y+h,rr); g.arcTo(x+w,y+h,x,y+h,rr); g.arcTo(x,y+h,x,y,rr); g.arcTo(x,y,x+w,y,rr); g.closePath(); };
    const cobre=(im,x,y,w,h,rr,cor,rot)=>{ g.save(); caixa(x,y,w,h,rr); g.clip(); g.fillStyle="#1d2654"; g.fillRect(x,y,w,h);
      if(im){ const e=Math.max(w/im.width,h/im.height), iw=im.width*e, ih=im.height*e; g.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih); }
      const sb=g.createLinearGradient(0,y+h*.55,0,y+h); sb.addColorStop(0,"rgba(0,0,0,0)"); sb.addColorStop(1,"rgba(0,0,0,.75)"); g.fillStyle=sb; g.fillRect(x,y,w,h); g.restore();
      g.save(); caixa(x,y,w,h,rr); g.lineWidth=4; g.strokeStyle=cor; g.stroke(); g.restore();
      g.fillStyle="#fff"; g.font=`800 ${h>400?44:28}px Manrope, system-ui, sans-serif`; g.textBaseline="bottom"; g.fillText(rot,x+(h>400?28:16),y+h-(h>400?24:14),w-32); };
    g.fillStyle="#f5c542"; g.font='700 30px "Space Mono", monospace'; g.textAlign="center"; g.textBaseline="top"; g.fillText(m.exemplo?"7ENTIDOS · EXEMPLO":"7ENTIDOS · MEU MOMENTO",W/2,56); g.textAlign="left";
    cobre(ims[0],60,120,960,540,34,"#f5c542",m.s.o[m.j]);
    const n=m.outros.length, col=n<=2?n:3, lin=Math.ceil(n/3)||0, gap=20, tw=col?(960-gap*(col-1))/col:0, th=lin>1?160:220;
    m.outros.forEach((o,i)=>{ const r=Math.floor(i/3), c=i%3, nr=r===lin-1?(n-r*3):3, w2=(960-gap*(nr-1))/nr; cobre(ims[i+1],60+c*(w2+gap),690+r*(th+gap),w2,th,24,o.x.cor,o.x.o[o.j]); });
    const yF=690+lin*(th+gap)+(lin?24:10);
    g.fillStyle="#f4ecdc"; g.textAlign="center"; g.font='600 48px Fraunces, Georgia, serif'; g.textBaseline="top";
    const pal=m.frase.split(" "), linhas=[]; let l=""; pal.forEach(w=>{ const t=l?l+" "+w:w; if(g.measureText(t).width>940&&l){ linhas.push(l); l=w; } else l=t; }); if(l) linhas.push(l);
    linhas.slice(0,3).forEach((t,i)=>g.fillText(t,W/2,yF+i*60));
    g.fillStyle="#a9b3d1"; g.font='700 30px "Space Mono", monospace'; g.textBaseline="bottom"; g.fillText("7entidos.com.br",W/2,H-40);
    return new Promise((ok,ruim)=>cv.toBlob(b=>b?ok(b):ruim(),"image/jpeg",.9)); });
}
function saborear(p){
  const m=montaSabor(); if(!m){ ocupado=false; avanca(); return; }
  const {v,s,j}=m, img=foto(s.id,j); resp.saborear_sentido=s.s;
  /* a imagem vira a carta dourada (aparece no resultado em cartões, como antes) */
  resp.carta_dourada={sentido:s.s,escolha:s.o[j],foto:j};
  clearTimeout(saborTm);
  /* imagem montada com as preferências: a foto principal em cima e as outras escolhas da pessoa embaixo (as que ela mais curtiu primeiro) */
  const outros=m.outros;

/* chutou MENOS do que passou = o tempo voou (Flow); chutou MAIS = o tempo passou devagar; diferença menor que 1 minuto = acertou em cheio */
function fraseFlow(){

  return ch<real ? "O tempo voou." : "O tempo passou devagar.";
}

  SENT.forEach((s,i)=>{ const v=g[i], id=v&&SIT_FASE1[v]; if(id&&!lista.includes(id)){ lista.push(id); orig[id]={sid:s.id,j:s.o.indexOf(v),foto:v}; } });

  gerais.sort((a,b)=>b.p-a.p||a.k-b.k);

/* 19/11 (pedido do Daniel): o mapa mostra SÓ as casinhas que já se pintaram (sem quadrados vazios) e já traz uma conclusão curta.
   Durante as 15, a conclusão fala só de sentidos (sem entregar o nome do motivo); depois do "Por trás das perguntas", fala do motivo também. Sempre como pista. */
function f3Conclusao(comNomes){ const c=f3Casas(), porS={}, porM={}; Object.entries(c).forEach(([k,n])=>{ const [sid,mid]=k.split("|"); porS[sid]=(porS[sid]||0)+n; porM[mid]=(porM[mid]||0)+n; });
  const tot=Object.values(porS).reduce((x,y)=>x+y,0); if(!tot) return "";
  const topo=o=>{ const e=Object.entries(o).sort((x,y)=>y[1]-x[1]); return e[1]&&e[1][1]===e[0][1]?null:e[0][0]; };
  const sTop=topo(porS), mTop=topo(porM), S=sTop&&SENT.find(x=>x.id===sTop);
  let t;
  if(tot<2) t="Primeira pista guardada. A cada resposta, o seu mapa ganha mais cor.";
  else if(comNomes&&mTop&&S) t=`Pista até aqui: o que mais aparece é <b>${MOTIVO_NOME[mTop]}</b>, e quem mais acende é ${S.s==="Noção do corpo"?"a":"o"} <b style="color:${claro(S.cor)}">${S.s}</b>.`;
  else if(S) t=`Até aqui, ${S.s==="Noção do corpo"?"a":"o"} <b style="color:${claro(S.cor)}">${S.s}</b> é o sentido que mais acende nas suas respostas.`;
  else t="Até aqui, as suas respostas estão bem espalhadas: vários sentidos acendem por igual.";
  return `<p class="f3conc">${t}</p>`; }

/* ============ FASE 3 · CÉREBRO DO AKINATOR (20/11) ============
   O "caderno": linhas = os 5 motivos; perguntas = as situações (e, no Bloco C, as perguntas-desempate).
   Cada quadradinho guarda a chance de a pessoa escolher aquela opção, se aquele for o motivo dela.
   Estimativa (sem estudo com esse número): quem tem o motivo escolhe a opção dele em 45 de 100 vezes; cada uma das outras 4 fica com cerca de 14.
   Nada é eliminado de vez: cada resposta só sobe ou desce as chances, para aguentar resposta "torta".
   A conta roda toda no celular, sem IA paga. */
const F3_TH=.45, F3_OUT=(1-F3_TH)/4;      /* quadradinho padrão do caderno */
const F3_CELULA={};                        /* aqui o caderno aprende depois: {"situação|motivo": chance}. Vazio por enquanto. */
const F3_CERTEZA=.75, F3_MIN=6, F3_MAX=15, F3_POR_DIA=5;
const f3Cel=(sid,mid,escolhido)=>{ const k=sid+"|"+mid; if(F3_CELULA[k]!=null) return escolhido?F3_CELULA[k]:(1-F3_CELULA[k])/4; return escolhido?F3_TH:F3_OUT; };
/* as chances dos 5 motivos agora: todos começam iguais (20%); a 1ª opção puxa forte, a 2ª puxa pela metade, "Nenhuma dessas" não mexe */
function f3Chances(){ f3Carrega(); let P=Object.fromEntries(MOTIVOS.map(m=>[m.id,1/MOTIVOS.length]));
  const norm=()=>{ const t=Object.values(P).reduce((a,b)=>a+b,0)||1; Object.keys(P).forEach(k=>P[k]/=t); };
  (F3.seq||[]).forEach(id=>{ const v=F3.r[id]; if(!v||v.n) return;
    MOTIVOS.forEach(m=>{ P[m.id]*=f3Cel(id,m.id,m.id===v.a); });                          /* 1ª opção: força inteira */
    if(v.b) MOTIVOS.forEach(m=>{ P[m.id]*=Math.sqrt(f3Cel(id,m.id,m.id===v.b)); });     /* 2ª opção: metade da força */
    norm(); });
  (F3.des||[]).forEach(d=>{ MOTIVOS.forEach(m=>{ P[m.id]*=(m.id===d.m?F3_DES_SIM:F3_DES_NAO)[d.nv]; }); norm(); });
  (F3.palpites||[]).forEach(p=>{ if(p.resp==="nao") { P[p.m]*=.1; norm(); } });
  return P; }
/* os motivos em ordem de chance */
function f3Ranking(){ const P=f3Chances(); return MOTIVOS.map(m=>({id:m.id,nome:m.nome,p:P[m.id]})).sort((a,b)=>b.p-a.p); }
/* para o palpite e a mistura: tira os motivos a que ela já disse "Não" e reparte a chance entre os outros */
function f3Validos(){ const nao=new Set((F3.palpites||[]).filter(p=>p.resp==="nao").map(p=>p.m)); const rk=f3Ranking().filter(m=>!nao.has(m.id)); const t=rk.reduce((a,b)=>a+b.p,0)||1; return rk.map(m=>({...m,p:m.p/t})); }
/* respostas da pergunta-desempate (Bloco C): Sim, muito · Um pouco · Tanto faz · Pouco · Não. Estimativa. */
const F3_DES_SIM=[.45,.30,.13,.07,.05], F3_DES_NAO=[.10,.17,.23,.25,.25];
const f3Feitas=()=>(F3.seq||[]).length;
/* ---- a próxima situação ----
   1º as que nasceram das fotos da Fase 1; depois a que mais separa os 2 motivos da frente.
   Enquanto o caderno não aprendeu, todas separam igual: então desempata variando o sentido (nunca 2 seguidas do mesmo)
   e começando pelos sentidos de que ela mais curtiu os jogos da Fase 2. Sempre com as 5 opções. */
function f3Separa(id,a,b){ return Math.abs(f3Cel(id,a,true)-f3Cel(id,a,false)) + Math.abs(f3Cel(id,b,true)-f3Cel(id,b,false)) - 2*(F3_TH-F3_OUT); }
function f3Proxima(){ if(!F3.lista) f3MontaLista();
  if(F3.atual && !F3.r[F3.atual]) return SIT[F3.atual];
  const feitas=new Set(F3.seq||[]);
  const fotos=Object.keys(F3.orig||{}).filter(id=>!feitas.has(id));
  let id=fotos[0];
  if(!id){ const [a,b]=f3Ranking(); const ult=SIT[(F3.seq||[]).slice(-1)[0]]; const ultS=ult?f3SentidoDe(ult):null;
    const curtiu=Object.fromEntries(SENT.map(s=>[s.id,+(resp["curtiu_"+s.id]||0)]));
    const cand=SITUACOES.filter(s=>s.dia>0&&!feitas.has(s.id)).map((s,k)=>({s,k,
      n:f3Separa(s.id,a.id,b.id)*10 + (s.sent[0]===ultS?-1:0) + Math.max(...s.sent.map(x=>curtiu[x]||0))/100}));
    cand.sort((x,y)=>y.n-x.n||x.k-y.k); id=cand[0]&&cand[0].s.id; }
  F3.atual=id||null; f3Salva(); return id?SIT[id]:null; }

      <div class="bb"><button class="v ${v.s==="validado"?"on":""}" onclick="marca('${id}','validado')">Validado</button><button class="r ${v.s==="revisar"?"on":""}" onclick="marca('${id}','revisar')">Revisar</button><button class="ir" onclick="ir(${typeof alvo==="string"?"'"+alvo+"'":alvo})">Ver</button></div>
      <div class="rev ${v.s==="revisar"?"on":""}">${REVISAR.map(o=>`<button class="${v.o===o?"on":""}" onclick="marcaRev('${id}','${o}')">${o}</button>`).join("")}</div></div>`; }).join("")}
    <p class="vsalvo" id="vsalvo">${VDOC?"As marcações ficam guardadas: o Claude lê direto.":"As marcações ficam guardadas neste aparelho."}</p>
    <button class="btn sec" style="margin-bottom:12px" onclick="irInicio()">Ir para o começo do app (Fase 1)</button><button class="btn sec" style="margin-bottom:12px" onclick="f3Zera();ir('f3')">Recomeçar a Fase 3 do zero</button><div class="rot" style="margin:6px 0">V22 · cérebro do Akinator</div><button class="btn sec" style="margin-bottom:12px" onclick="ir('f4')">Ir para a Fase 4 (O seu 10)</button><button class="btn sec" style="margin-bottom:12px" onclick="ir('f5')">Ir para a Fase 5 (ofertas)</button><button class="btn sec" style="margin-bottom:12px" onclick="ir('f6')">Ir para a Fase 6 (o que a Brisa já descobriu)</button><button class="btn" onclick="fechaPainel()">Voltar ao app</button></div>`;
  el.classList.add("on");
}
function fraseIdx(){ return FRASES_AB.indexOf(fraseAbertura()); }
function escolhe(id,k){ click(); val[id]={...(val[id]||{}),e:k}; try{ localStorage.setItem("7e_frase_abertura",String(k)); }catch(e){} salvaVal(); painel(); if(!entrou&&pos===0) desenha(); }
function fechaPainel(){ const el=document.getElementById("vp"); if(el) el.classList.remove("on"); }
function marca(id,s){ val[id]={...(val[id]||{}),s}; if(s==="validado") delete val[id].o; salvaVal(); painel(); }
function marcaRev(id,o){ val[id]={...(val[id]||{}),s:"revisar",o}; salvaVal(); painel(); }
function salvaVal(){ try{ localStorage.setItem("7e_app_novo_val_b4",JSON.stringify(val)); }catch(e){}
  if(VDOC) VDOC.set({atualizado:new Date().toISOString(), itens:ITENS.map(x=>({id:x[0],item:x[1]+" · "+x[2],situacao:(val[x[0]]||{}).s||null,revisar:(val[x[0]]||{}).o||null,escolha:x[5]&&(val[x[0]]||{}).e!=null?x[5][val[x[0]].e]:null}))}).catch(()=>{}); }

/* ============ INÍCIO ============ */
try{ const s=JSON.parse(localStorage.getItem("7e_app_novo")||"null"); if(s&&s.resp&&s.r===R.length&&s.pos>0&&s.pos<R.length-2){ resp=s.resp; pos=s.pos; inicio=s.inicio||Date.now(); inicio2=s.inicio2||null; } }catch(e){}
try{ val=JSON.parse(localStorage.getItem("7e_app_novo_val_b4")||"{}")||{}; }catch(e){}
if(PREVIA){ const b=document.createElement("button"); b.className="vbtn"; b.type="button"; b.textContent="Validar a prévia"; b.onclick=()=>{ click(); painel(); }; document.body.appendChild(b); }
let f3Ativa=false; try{ f3Ativa=localStorage.getItem("7e_fase3_ativa")==="1"; }catch(e){}

const voltou = f3Ativa || pos>0;
function seguirDeOnde(){ click(); if(f3Ativa) f3Abre(); else { entrou=true; desenha(); } }
function boasVindas(){ const r=R[pos]||{}, sx=r.i!=null?SENT[r.i]:null;
  const onde = f3Ativa ? "Fase 3 · a sua régua" : (r.f===2||r.t==="jogo") ? `Fase 2${sx?" · "+sx.s:""}` : `Fase 1${sx?" · "+sx.s:""}`;
  mostra(`<div class="bvolta"><img class="bvmand" src="${MANDALA}" alt=""><h2>${comNome("Que bom te ver, {n}.","Que bom te ver.")}</h2>
    <p class="sub">Vamos continuar de onde você parou.</p><p class="bvonde">Você parou em: <b>${esc(onde)}</b></p>
    <button class="btn" type="button" onclick="seguirDeOnde()">Continuar</button>
    <div style="margin-top:14px"><button class="btn sec" type="button" onclick="recomecar()">Prefiro começar do zero</button></div></div>`); const vb=document.getElementById("voltar"); if(vb) vb.hidden=true; }
if(resp.inicio && resp.local_campanha==null) resp.local_campanha=etiquetaApp;
if(voltou) boasVindas(); else desenha();
registraPassoApp("app_abriu", {campanha:resp.local_campanha??etiquetaApp});
if(PREVIA && window.claude && claude.use){ claude.use("db").then(db=>{ if(!db) return; VDOC=db.doc("validacao/app-novo-b4"); return VDOC.get().then(sn=>{ const d=sn&&(sn.data?sn.data():sn); if(d&&d.itens&&!Object.keys(val).length){ d.itens.forEach(x=>{ if(x.situacao||x.escolha){ const k=x.escolha?FRASES_AB.indexOf(x.escolha):-1; val[x.id]={s:x.situacao||undefined,o:x.revisar||undefined,e:k>=0?k:undefined}; if(k>=0){ try{ localStorage.setItem("7e_frase_abertura",String(k)); }catch(e){} } } }); if(!entrou&&pos===0) desenha(); } }); }).catch(()=>{}); }
</script>
