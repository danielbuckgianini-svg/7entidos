function hueQuente(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx-mn<.08)return null;let h;if(mx===r)h=((g-b)/(mx-mn))%6;else if(mx===g)h=(b-r)/(mx-mn)+2;else h=(r-g)/(mx-mn)+4;h=(h*60+360)%360;return h<70||h>300;}

function plim(i,big){const c=ac();if(!c)return;const go=()=>{const t=c.currentTime,f=587*Math.pow(1.06,i||0);tom(c,c.destination,f,t,.22,'sine',.16);tom(c,c.destination,f*2,t+.03,.14,'sine',.05);if(big){tom(c,c.destination,f*1.25,t+.12,.3,'sine',.12);tom(c,c.destination,f*1.5,t+.24,.45,'sine',.12);}};c.state!=='running'?c.resume().then(go):go();}

 box.innerHTML=(o.topo||'')+`<div class="tb"></div>`+(o.rodape||'');draw();
 box.querySelector('.tb').onclick=e=>{const b=e.target.closest('.tt');if(!b)return;const n=b.dataset.n;if(ord.includes(n)){if(o.travado)return;ord=ord.filter(x=>x!==n);draw();o.mudou&&o.mudou(ord);return;}

document.addEventListener('click',e=>{const b=e.target.closest('[data-j]');if(!b||!GM)return;const a=b.dataset.j;const F=GM.F;
 if(a==='sair'){fechaJogo();return;}
 if(a==='denovo'){const f=GM.F;fechaJogo();abreJogo(f);return;}
 if(a==='vai'){GM.i=0;GM.etapa=F.ctrl==='livre'?'escolhe':'sentido';if(F.ctrl==='fav'){const k=GM.seq.indexOf('aud');GM.seq.splice(k,1);GM.seq.unshift('aud');}jr();return;}
 if(a==='sen'){GM.i=GM.seq.indexOf(b.dataset.k);GM.etapa='sentido';jr();return;}
 if(a==='adv'){GM.adv[GM.seq[GM.i]]=b.dataset.n;plim(3);jr();return;}
 if(a==='toc'){const id=GM.seq[GM.i],n=b.dataset.n,o=GM.ord[id];const p=o.indexOf(n);if(p>=0){o.splice(p,1);return jr();}if(o.length>=GM.toques)return;o.push(n);
  if(F.fb==='som'||F.fb==null){plim(o.length);vib();}else if(F.fb==='item'){para();const t=tileDe(id,n);t&&t.som&&toca(t.som);vib();setTimeout(para,1500);}
  jr();const nb=[...document.querySelectorAll('#jg .tt')].find(x=>x.dataset.n===n);F.fb!=='nada'&&nb&&nb.classList.add('pop');if(F.rec==='toque'){}
  if(o.length>=GM.toques){setTimeout(depoisSentido,450);}return;}
 if(a==='du'){const d=GM.du,x=d.P[0],m=Math.floor((d.lo+d.hi)/2);plim(3);vib();if(b.dataset.n===x)d.hi=m;else d.lo=m+1;if(d.lo>=d.hi){d.S.splice(d.lo,0,x);d.P.shift();d.lo=0;d.hi=d.S.length;}jr();return;}
 if(a==='pula'){const id=GM.seq.splice(GM.i,1)[0];GM.seq.push(id);GM.etapa='sentido';jr();return;}
 if(a==='lac'){const s=document.querySelector('#jg .blur');s&&s.classList.add('vis');b.remove();plim(5,1);return;}
 if(a==='seg'){proximo();return;}
 if(a==='ws'){GM.ws++;plim(GM.ws);jr();return;}
 if(a==='nomeia'){GM.nome=(document.getElementById('nm')||{}).value||'';fim();return;}});

/* ---------- a sala ---------- */
let RS={},DB=null,ALA=0,ABERTA=null,PRONTO=false;
try{RS=JSON.parse(localStorage.getItem('salaf2')||'{}');}catch(e){}
const salvaL=()=>{try{localStorage.setItem('salaf2',JSON.stringify(RS));}catch(e){}};
async function grava(id){salvaL();if(!DB)return;try{await DB.doc('salaf2/'+id).set(Object.assign({em:new Date().toISOString(),pergunta:PERGS.find(p=>p.id===id).q},RS[id]));}catch(e){aviso('Não consegui salvar agora; fica guardado neste aparelho.');}}
function aviso(t){const a=document.getElementById('av');if(a){a.textContent=t;a.hidden=false;}}
const feitas=a=>PERGS.filter(p=>p.a===a&&RS[p.id]&&(RS[p.id].sel!=null||(RS[p.id].nao||[]).length)).length;
const total=()=>PERGS.filter(p=>RS[p.id]&&(RS[p.id].sel!=null||(RS[p.id].nao||[]).length)).length;
function topo(){return `<div class="tp7">${ALAS.map((al,k)=>{const f=feitas(k);return `<button class="pb${k===ALA?' at':''}${f>=7?' ok':''}" style="--c:${al.c}" data-a="ala" data-k="${k}"><b>${f>=7?'✓':al.ic}</b><small>${f}/7</small></button>`;}).join('')}<button class="pb${ALA===7?' at':''}" style="--c:#F9CB39" data-a="ala" data-k="7"><b>🎮</b><small>jogar</small></button></div><div class="tot"><i style="width:${total()/49*100}%"></i></div>`;}
function card(p){const r=RS[p.id]||{};const nao=r.nao||[];
 return `<div class="pq${r.sel!=null?' feito':''}${p.z?' z':''}" style="--c:${ALAS[p.a].c}"><div class="pqh"><span class="num">${PERGS.indexOf(p)+1}</span><div><b class="qt">${esc(p.q)}</b><p class="por">🧠 ${esc(p.d)}</p></div></div>
 ${p.o.map((o,i)=>{const sel=r.sel===i,nq=nao.includes(i),ab=ABERTA===p.id+'|'+i;return `<div class="op${sel?' on':''}${nq?' nq':''}"><div class="opr"><button class="opb" data-a="sel" data-p="${p.id}" data-i="${i}"><span class="rd"></span><span><b>${esc(o.t)}</b>${o.por?`<small>${esc(o.por)}</small>`:''}</span></button><button class="tst${ab?' on':''}" data-a="testa" data-p="${p.id}" data-i="${i}">${ab?'■ fechar':'▶ testar'}</button><button class="nqb${nq?' on':''}" data-a="nao" data-p="${p.id}" data-i="${i}" title="Não quero">✕</button></div>${ab?`<div class="demo" id="dm-${p.id}-${i}"></div>`:''}</div>`;}).join('')}
 <input class="nota" data-p="${p.id}" placeholder="Anotação (opcional)" value="${esc(r.nota||'')}" maxlength="200"></div>`;}
function tela(){if(ALA===7)return telaJogo();const al=ALAS[ALA];
 return `<div class="alah" style="--c:${al.c}"><div class="k" style="color:${al.c}">Ala ${ALA+1} de 7 · ${al.ic}</div><h1 class="f">${al.n}</h1><p class="mute">${al.sub}</p>${ALA===6?'<p class="zinfo">Esta ala mostra o que NÃO fazer. Teste para conhecer e escolha "Entendi, descarto" ou a versão suave.</p>':''}</div>
 ${PERGS.filter(p=>p.a===ALA).map(card).join('')}
 <div class="row navfix"><button class="btn" data-a="ant" ${ALA===0?'disabled':''}>← Ala anterior</button><button class="btn pri" data-a="prox">${ALA<6?'Próxima ala →':'Montar o meu protótipo 🎮'}</button></div>`;}
function flags(){const F={};PERGS.forEach(p=>{const r=RS[p.id];if(!r||r.sel==null)return;Object.assign(F,p.o[r.sel].set);});return F;}
function resumoFlags(F){const L=[];const nm={fb:'Toque',rec:'Recompensa',susp:'Suspense',surp:'Surpresa',desafio:'Desafio',prog:'Progresso',final:'Final',social:'Gente como eu',toques:'Decisões por sentido',gancho:'Gancho',teaser:'Prévia da Fase 3',brisa:'Brisa',abre:'Começo',lacuna:'Meia revelação',misterio:'Mistério',pausa:'Respirar',ritmo:'Ritmo',col:'Coleção'};
 Object.keys(nm).forEach(k=>{if(F[k]!=null&&F[k]!==0)L.push(`<span class="tg">${nm[k]}: <b>${F[k]===1?'sim':F[k]}</b></span>`);});return L.join('')||'<span class="mute">Responda as alas para montar.</span>';}
function telaJogo(){const F=flags();const ruins=Object.keys(F).filter(k=>k.startsWith('proibido_'));
 return `<div class="alah"><div class="k">Protótipo automático</div><h1 class="f">A sua Fase 2, montada com as suas escolhas</h1><p class="mute">${total()} de 49 respondidas. O protótipo usa o que você escolheu e ignora o que marcou com ✕.</p></div>
 <div class="tags">${resumoFlags(F)}</div>${ruins.length?`<p class="zinfo">⚠️ Você escolheu ${ruins.length} técnica(s) da Zona Proibida. Elas NÃO entram no protótipo: vão contra as regras do 7entidos. Vamos conversar sobre elas.</p>`:''}
 <button class="btn pri big" data-a="joga">▶ Jogar o meu protótipo</button><p class="small mute">Usa as escolhas da Fase 1 do Daniel como exemplo.</p>`;}
function render(){const y=scrollY;document.getElementById('app').innerHTML=`<div class="bar0"><b class="f" style="font-size:19px"><span style="color:#F9CB39">7</span>entidos · Sala da Fase 2</b><span class="small mute">${PRONTO?'salvo ✓':'…'}</span></div><p id="av" class="aviso" hidden></p>${topo()}${tela()}`;
 if(ABERTA){const [pid,i]=ABERTA.split('|');const box=document.getElementById(`dm-${pid}-${i}`);if(box)demo(PERGS.find(p=>p.id===pid).o[+i].demo,box);}return y;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='play'){e.stopImmediatePropagation();para();if(!b.classList.contains('on')){toca(b.dataset.som);b.classList.add('on');}else b.classList.remove('on');return;}
 if(a==='ala'){para();ALA=+b.dataset.k;ABERTA=null;render();scrollTo(0,0);return;}
 if(a==='prox'){para();ALA=Math.min(7,ALA+1);ABERTA=null;render();scrollTo(0,0);return;}
 if(a==='ant'){para();ALA=Math.max(0,ALA-1);ABERTA=null;render();scrollTo(0,0);return;}
 if(a==='testa'){para();const k=b.dataset.p+'|'+b.dataset.i;ABERTA=ABERTA===k?null:k;const y=render();scrollTo(0,y);return;}
 if(a==='sel'){const id=b.dataset.p,i=+b.dataset.i;RS[id]=RS[id]||{nao:[]};RS[id].sel=RS[id].sel===i?null:i;RS[id].nao=(RS[id].nao||[]).filter(x=>x!==i);const p=PERGS.find(x=>x.id===id);RS[id].escolha=RS[id].sel==null?null:p.o[i].t;const y=render();scrollTo(0,y);grava(id);return;}
 if(a==='nao'){const id=b.dataset.p,i=+b.dataset.i;RS[id]=RS[id]||{nao:[]};const n=new Set(RS[id].nao||[]);n.has(i)?n.delete(i):n.add(i);RS[id].nao=[...n];if(RS[id].sel===i){RS[id].sel=null;RS[id].escolha=null;}const p=PERGS.find(x=>x.id===id);RS[id].naoquero=RS[id].nao.map(k=>p.o[k].t);const y=render();scrollTo(0,y);grava(id);return;}
 if(a==='joga'){abreJogo(flags());return;}});
document.addEventListener('change',e=>{const i=e.target.closest('.nota');if(!i)return;const id=i.dataset.p;RS[id]=RS[id]||{nao:[]};RS[id].nota=i.value.slice(0,200);grava(id);});
render();
(async()=>{const t=setTimeout(()=>{if(!PRONTO){PRONTO=true;render();}},10000);
 try{const c=window.claude&&await window.claude.use('db');DB=c;if(!c){clearTimeout(t);PRONTO=true;render();return;}
  c.collection('salaf2').onSnapshot(s=>{s.docs.forEach(d=>{const x=d.data();RS[d.id]={sel:x.sel??null,nao:x.nao||[],nota:x.nota||'',escolha:x.escolha||null,naoquero:x.naoquero||[]};});salvaL();clearTimeout(t);PRONTO=true;if(!(document.activeElement&&document.activeElement.classList.contains('nota'))){const y=render();scrollTo(0,y);}},()=>{clearTimeout(t);PRONTO=true;render();});}
 catch(e){clearTimeout(t);PRONTO=true;render();}})();
</script></body></html>
