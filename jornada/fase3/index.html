<script>/* ---------- estímulos sensoriais (sons feitos aqui, sem arquivos) ---------- */
let AC=null,TOCANDO=null;
function ac(){try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}if(AC.state!=='running')AC.resume();return AC;}
function destrava(){const c=ac();if(!c)return;try{const b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0);}catch(e){}}
['touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,function f(){destrava();if(AC&&AC.state==='running')['touchend','click','keydown'].forEach(x=>document.removeEventListener(x,f,true));},true));
function para(){if(TOCANDO){try{TOCANDO.g.gain.setTargetAtTime(0,AC.currentTime,.08);const n=TOCANDO.nodes;setTimeout(()=>n.forEach(x=>{try{x.stop&&x.stop();}catch(e){}}),400);}catch(e){}TOCANDO=null;document.querySelectorAll('.play.on').forEach(b=>{b.classList.remove('on');b.textContent='▶';});}}
function ruido(c,d){const b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;return s;}
function tom(c,dest,f,t,dur,tipo,vol){const o=c.createOscillator(),g=c.createGain();o.type=tipo||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.3,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.05);return o;}
function toca(k){const c0=ac();if(!c0)return;if(c0.state!=='running'){c0.resume().then(()=>toca1(k)).catch(()=>{});return;}toca1(k);}
function toca1(k){const c=ac();if(!c)return;para();const t=c.currentTime,D=5,g=c.createGain();g.gain.value=.9;g.connect(c.destination);const N=[];const filt=(tp,f,q)=>{const x=c.createBiquadFilter();x.type=tp;x.frequency.value=f;if(q)x.Q.value=q;return x;};
 if(k==='chuva'){const n=ruido(c,D),h=filt('highpass',900),l=filt('lowpass',7000),v=c.createGain();v.gain.value=.22;n.connect(h);h.connect(l);l.connect(v);v.connect(g);n.start(t);N.push(n);for(let i=0;i<40;i++)N.push(tom(c,g,1800+Math.random()*2500,t+Math.random()*D,.05,'sine',.05));}
 if(k==='mar'){const n=ruido(c,D),l=filt('lowpass',600),v=c.createGain();v.gain.setValueAtTime(.05,t);[0,2.5].forEach(o=>{v.gain.linearRampToValueAtTime(.45,t+o+1.4);v.gain.linearRampToValueAtTime(.06,t+o+2.5);});n.connect(l);l.connect(v);v.connect(g);n.start(t);N.push(n);}
 if(k==='passaros'){for(let i=0;i<14;i++){const s=t+Math.random()*(D-.4),o=c.createOscillator(),e=c.createGain();o.frequency.setValueAtTime(2600+Math.random()*800,s);o.frequency.exponentialRampToValueAtTime(4200+Math.random()*900,s+.08);o.frequency.exponentialRampToValueAtTime(3000,s+.16);e.gain.setValueAtTime(0,s);e.gain.linearRampToValueAtTime(.12,s+.02);e.gain.exponentialRampToValueAtTime(.001,s+.18);o.connect(e);e.connect(g);o.start(s);o.stop(s+.2);N.push(o);}}
 if(k==='piano'){[[261.6,0],[329.6,.5],[392,1],[523.3,1.5],[392,2.2],[329.6,2.7],[261.6,3.2]].forEach(([f,o])=>{N.push(tom(c,g,f,t+o,1.8,'triangle',.18));N.push(tom(c,g,f*2,t+o,1,'sine',.05));});}
 if(k==='violao'){[[196,0],[246.9,.35],[293.7,.7],[392,1.05],[293.7,1.6],[246.9,1.95],[196,2.5],[246.9,2.85]].forEach(([f,o])=>{const sr=c.sampleRate,p=Math.round(sr/f),b=c.createBuffer(1,sr*1.6,sr),x=b.getChannelData(0);for(let i=0;i<p;i++)x[i]=Math.random()*2-1;for(let i=p;i<x.length;i++)x[i]=.996*.5*(x[i-p]+x[i-p+1]);const s=c.createBufferSource(),v=c.createGain();v.gain.value=.35;s.buffer=b;s.connect(v);v.connect(g);s.start(t+o);N.push(s);});}
 if(k==='batida'){for(let i=0;i<8;i++){const s=t+i*.6667;const o=c.createOscillator(),e=c.createGain();o.frequency.setValueAtTime(130,s);o.frequency.exponentialRampToValueAtTime(45,s+.18);e.gain.setValueAtTime(.7,s);e.gain.exponentialRampToValueAtTime(.001,s+.3);o.connect(e);e.connect(g);o.start(s);o.stop(s+.32);N.push(o);const h=ruido(c,.06),hf=filt('highpass',7000),hv=c.createGain();hv.gain.value=.12;h.connect(hf);hf.connect(hv);hv.connect(g);h.start(s+.333);N.push(h);}}
 if(k==='cafe'){const n=ruido(c,D),b=filt('bandpass',400,.8),v=c.createGain();v.gain.value=.08;n.connect(b);b.connect(v);v.connect(g);n.start(t);N.push(n);for(let i=0;i<28;i++){const s=t+Math.random()*D,o=c.createOscillator(),e=c.createGain();o.frequency.setValueAtTime(250+Math.random()*200,s);o.frequency.exponentialRampToValueAtTime(700+Math.random()*400,s+.06);e.gain.setValueAtTime(.12,s);e.gain.exponentialRampToValueAtTime(.001,s+.08);o.connect(e);e.connect(g);o.start(s);o.stop(s+.1);N.push(o);}}
 if(k==='panela'){const n=ruido(c,D),h=filt('highpass',2500),v=c.createGain();v.gain.setValueAtTime(.2,t);for(let i=0;i<60;i++)v.gain.setValueAtTime(.08+Math.random()*.25,t+i*D/60);n.connect(h);h.connect(v);v.connect(g);n.start(t);N.push(n);}
 if(k==='respiracao'){const n=ruido(c,D),b=filt('bandpass',700,.7),v=c.createGain();v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(.35,t+2);v.gain.linearRampToValueAtTime(0,t+4.5);n.connect(b);b.connect(v);v.connect(g);n.start(t);N.push(n);}
 if(k==='coracao'){const per=60/64;for(let i=0;i*per<10;i++){[0,.28].forEach((o,j)=>{const s=t+i*per+o,x=c.createOscillator(),e=c.createGain();x.frequency.setValueAtTime(j?55:65,s);x.frequency.exponentialRampToValueAtTime(35,s+.12);e.gain.setValueAtTime(j?.5:.8,s);e.gain.exponentialRampToValueAtTime(.001,s+.18);x.connect(e);e.connect(g);x.start(s);x.stop(s+.2);N.push(x);});}}
 if(k==='vento'){const n=ruido(c,D),b=filt('bandpass',500,.6),v=c.createGain();v.gain.setValueAtTime(.05,t);for(let i=1;i<=5;i++){v.gain.linearRampToValueAtTime(.12+Math.random()*.35,t+i);b.frequency.linearRampToValueAtTime(300+Math.random()*700,t+i);}n.connect(b);b.connect(v);v.connect(g);n.start(t);N.push(n);}
 if(k==='fogueira'){const n=ruido(c,D),l=filt('lowpass',700),v=c.createGain();v.gain.value=.18;n.connect(l);l.connect(v);v.connect(g);n.start(t);N.push(n);for(let i=0;i<45;i++){const s=t+Math.random()*D,h=ruido(c,.03),hf=filt('highpass',1800),hv=c.createGain();hv.gain.value=.15+Math.random()*.3;h.connect(hf);hf.connect(hv);hv.connect(g);h.start(s);N.push(h);}}
 if(k==='tigela'){[[196,.22],[523,.09],[934,.05],[1430,.03]].forEach(([f,vv])=>{const o=c.createOscillator(),e=c.createGain();o.frequency.value=f;e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(vv,t+.02);e.gain.exponentialRampToValueAtTime(.0001,t+4.8);const l=c.createOscillator(),lg=c.createGain();l.frequency.value=3;lg.gain.value=vv*.3;l.connect(lg);lg.connect(e.gain);o.connect(e);e.connect(g);o.start(t);l.start(t);o.stop(t+5);l.stop(t+5);N.push(o,l);});}
 if(k==='grilos'){for(let i=0;i<9;i++)for(let j=0;j<3;j++)N.push(tom(c,g,4400+Math.random()*200,t+i*.55+j*.06+Math.random()*.05,.035,'sine',.07));}
 if(k==='riacho'){const n=ruido(c,D),b=filt('bandpass',1400,.5),v=c.createGain();v.gain.setValueAtTime(.15,t);for(let i=0;i<80;i++)v.gain.setValueAtTime(.08+Math.random()*.16,t+i*D/80);n.connect(b);b.connect(v);v.connect(g);n.start(t);N.push(n);for(let i=0;i<20;i++)N.push(tom(c,g,700+Math.random()*900,t+Math.random()*D,.07,'sine',.05));}

 const low=P.sc.indexOf(Math.min(...P.sc));sur.push({s:1,t:'O que quase não apareceu: '+T[low][0],d:'Nas suas 49 escolhas, '+FORCA_BAIXA[low]+' Vale testar uma experiência desse lado, só para ver.'});
 const cores=SEN.map(s=>{const n=fav[SEN.indexOf(s)];const m=n&&META[s[0]][n];return m?hueQuente(m[1]):null;}).filter(x=>x!==null);const q=cores.filter(x=>x).length;if(cores.length>=5)sur.push({s:1,t:q>=cores.length-1?'Sua paleta é quente':q<=1?'Sua paleta é fria':'Sua paleta mistura quente e frio',d:`${q} das ${cores.length} cores das suas favoritas são quentes (amarelos, laranjas, vermelhos). É essa paleta que pinta a sua imagem.`});
 const cons=SEN.filter((s,i)=>fav[i]&&META[s[0]][fav[i]]&&META[s[0]][fav[i]][0]===P.top).length;if(cons>=2)sur.push({s:1,t:'Não foi acaso',d:`Em ${cons} dos 7 sentidos, a sua escolha nº 1 foi do tipo ${T[P.top][0]}. Sem combinar, os sentidos repetiram o mesmo pedido.`});
 const inf=tem.find(x=>x.n==='infância');if(inf&&inf.hits.length>=2&&!sur.some(x=>x.t.includes('infância')))sur.push({s:1,t:'Uma criança no mapa',d:`${inf.hits.length} sentidos trouxeram coisas de infância (${inf.hits.slice(0,3).map(([,L])=>L[0]).join(', ')}). Parte do que te faz bem hoje parece vir de muito tempo atrás.`});
 return out.concat(sur.slice(0,5));}

const CONVITE='7s0a4653';const PLANILHA_URL=window.PLANILHA_URL||'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let J=null;try{J=JSON.parse(localStorage.getItem('jornada7')||'null');}catch(e){}
const temConvite=true;/* 05/11 (noite): o Daniel tirou a senha (código de convite). Qualquer pessoa com o link entra. */
const fase1Ok=()=>J&&J.esc&&SEN.every(s=>(J.esc[s[0]]||[]).length>=7);
function salvaJ(){try{localStorage.setItem('jornada7',JSON.stringify(J));}catch(e){}}
function post(tipo,extra){if(!PLANILHA_URL||!J)return;const corpo=Object.assign({c:CONVITE,tipo,id:J.id,nome:J.nome,cel:J.cel,em:new Date().toISOString()},extra||{});try{fetch(PLANILHA_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(corpo),keepalive:true});}catch(e){}}
const topoLogo=()=>`<div class="bar0"><a class="logo" href="/" aria-label="7entidos"><img src="/assets/simbolo-contando-7.svg?v=20261102-novo" alt="" width="30" height="30"><b class="f"><span style="color:#FFD43B">7</span>entidos</b></a></div>`;
function bloqueio(fase){if(!temConvite)return `<div class="hero"><div class="k">Jornada dos 7entidos</div><h1 class="f">Esta jornada é por convite.</h1><p class="mute">Use o link que você recebeu do 7entidos.</p><a class="btn" href="/">Conhecer o 7entidos</a></div>`;
 if(!fase1Ok())return `<div class="hero"><div class="k">Fase ${fase}</div><h1 class="f">Primeiro, a Fase 1</h1><p class="mute">Não encontramos a sua Fase 1 neste celular. Se você fez em outro aparelho, abra este link nele. Se ainda não fez, comece por ela: leva uns 7 minutos.</p><a class="btn pri big" style="display:block;text-decoration:none" href="/jornada/?c=${CONVITE}">Fazer a Fase 1 →</a></div>`;return '';}
const DEF_A=['#E9B10E','#2F7FD1','#E8643A','#3E9E5E','#D9487E','#7457C9','#17A99B'];

const TIPOS=[['lugar','📍 Um lugar',['Casa','Praia ou mar','Natureza','Cidade','Uma viagem']],['pessoa','🤝 Uma pessoa',['Família','Amigos','Um amor','Só eu']],['epoca','⏳ Uma época',['Infância','Adolescência','Hoje em dia','Sempre']],['momento','🌗 Um momento do dia',['Manhã','Tarde','Noite','Fim de semana']]];
let G=(J&&J.f3)||{i:-1,ass:{},sens:null,fim:false};
const salva3=()=>{if(J){J.f3=G;salvaJ();}};
function itens(){const out=[];SEN.forEach(([id,sen,ic,cor])=>{const L=(J.esc[id]||[]).slice();const N=(J.f2&&J.f2.notas)||{};L.sort((a,b)=>(N[id+'|'+b]??(7-L.indexOf(b)))-(N[id+'|'+a]??(7-L.indexOf(a))));out.push([id,sen,ic,cor,L[0]]);});return out;}
function padroes(){const c={};Object.values(G.ass).forEach(a=>{if(a&&a.v)c[a.v]=(c[a.v]||0)+1;});return Object.entries(c).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>=2).slice(0,3).map(([v,n])=>`"${v}" aparece em ${n} das suas 7 lembranças.`);}
function v3(){const b=bloqueio(3);if(b)return b;const nome=(J.nome||'').split(' ')[0];const I=itens();
 if(G.i<0)return `<div class="hero"><div class="luzes">${C.map(c=>`<i style="background:${c};box-shadow:0 0 10px ${c}"></i>`).join('')}</div><div class="k">Jornada dos 7entidos · Fase 3</div><h1 class="f">As suas lembranças.</h1><p class="mute">Vamos olhar para a sua escolha favorita de cada sentido e descobrir o que ela te lembra: um lugar, uma pessoa, uma época ou um momento do dia. São 7 toques, e uma palavra é opcional.</p><button class="btn pri big" data-a="ini">Começar a Fase 3 →</button></div>`;
 if(G.i<7){const [id,sen,ic,cor,n]=I[G.i];const t=SEN.find(s=>s[0]===id)[5].find(x=>x.n===n);const a=G.ass[id]||{};A=DEF_A.slice();
  return `<div class="topo2"><div class="dots">${I.map(([sid,,,c],k)=>`<i style="${G.ass[sid]&&G.ass[sid].v?`background:${c};box-shadow:0 0 8px ${c}`:''}${k===G.i?';outline:2px solid #F4F1EA':''}"></i>`).join('')}</div><div class="small mute">Lembrança ${G.i+1} de 7</div></div>
  <div class="k" style="color:${cor}">${ic} ${esc(sen)}</div><div class="fav3"><svg viewBox="0 0 300 300">${t?t.art():''}</svg><div><h1 style="font-size:24px;margin:0">${esc(n)}</h1><p class="mute" style="margin:4px 0 0">Isso te lembra…</p></div></div>
  ${TIPOS.map(([k,lab,ops])=>`<div class="avq"><b>${lab}</b><div class="avo">${ops.map(o=>`<button class="${a.t===k&&a.v===o?'on':''}" data-a="ass" data-id="${id}" data-t="${k}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`).join('')}
  <label class="avq"><b>Uma palavra sobre essa lembrança (opcional)</b><input id="pal" type="text" maxlength="40" value="${esc(a.p||'')}" style="font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);margin-top:6px"></label>
  <div class="row navfix"><button class="btn" data-a="volta">← Voltar</button><button class="btn pri" data-a="prox" ${a.v?'':'disabled'}>${G.i<6?'Próxima →':'Ver as minhas lembranças →'}</button></div>`;}
 if(!G.fim){const Pd=padroes();
  return `<div class="k">As suas lembranças</div><h1 class="f" style="font-size:30px">O que te faz bem tem história</h1>
  ${I.map(([id,sen,ic,cor,n])=>{const a=G.ass[id]||{};return `<div class="lem" style="--c:${cor}"><span>${ic}</span><div><b>${esc(n)}</b><div class="small mute">${esc(a.v||'—')}${a.p?' · “'+esc(a.p)+'”':''}</div></div></div>`;}).join('')}
  ${Pd.length?`<h2>✨ O que se repete</h2>${Pd.map(t=>`<div class="ins5"><b>${esc(t)}</b></div>`).join('')}`:''}
  <h2>Depois desta fase, qual é a sua sensação agora?</h2><div class="c11 grande">${[...Array(11)].map((_,k)=>`<button class="${G.sens===k?'on':''}" data-a="sens" data-n="${k}">${k}</button>`).join('')}</div><div class="small mute" style="display:flex;justify-content:space-between"><span>0 = nada bem</span><span>10 = muito bem</span></div>
  <p class="erro" id="er3"></p><button class="btn pri big" data-a="fim3">Finalizar a Fase 3 ✓</button>`;}
 return `<div class="hero"><div class="k">Fase 3 finalizada ✓</div><h1 class="f">Obrigado!</h1><p class="mute">Na Fase 4, tudo se junta numa imagem completa sua. Vamos te avisar quando ela abrir.</p><button class="btn" data-a="convida">📲 Convidar alguém pelo WhatsApp</button></div>`;}
function render(){document.getElementById('app').innerHTML=topoLogo()+v3();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='ini'){G.i=0;salva3();post('fase3_inicio');render();scrollTo(0,0);return;}
 if(a==='ass'){const id=b.dataset.id;const p=document.getElementById('pal');G.ass[id]={t:b.dataset.t,v:b.dataset.v,p:p?p.value.trim():''};salva3();const y=scrollY;render();scrollTo(0,y);return;}
 if(a==='prox'){const id=itens()[G.i][0];const p=document.getElementById('pal');if(G.ass[id])G.ass[id].p=p?p.value.trim():'';G.i++;salva3();render();scrollTo(0,0);return;}
 if(a==='volta'){G.i=Math.max(-1,G.i-1);salva3();render();scrollTo(0,0);return;}
 if(a==='sens'){G.sens=+b.dataset.n;salva3();const y=scrollY;render();scrollTo(0,y);return;}
 if(a==='convida'){const t='Fiz a Jornada dos 7entidos e descobri a imagem dos meus 7 sentidos. Faz também: https://7entidos.com.br/jornada/?c='+CONVITE;window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');post('convite');return;}
 if(a==='fim3'){if(G.sens==null){document.getElementById('er3').textContent='Dê a sua nota de 0 a 10 antes de finalizar.';return;}G.fim=true;salva3();
  post('fase3',{lembrancas:itens().map(([id,sen,,,n])=>{const x=G.ass[id]||{};return sen+': '+n+' → '+(x.v||'-')+(x.p?' ("'+x.p+'")':'');}),padroes:padroes(),sensacao:G.sens});render();scrollTo(0,0);return;}});
render();
