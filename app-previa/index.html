.nc-btn:disabled{opacity:.35;cursor:default}.nc-btn.ghost{background:transparent;color:#f4f4f4;border:1.5px solid #4a4a4a;width:auto;flex:none}
.nc-acoes{display:flex;gap:10px;align-items:center;margin-top:6px}.nc-acoes .nc-btn:not(.ghost){flex:1}
.nc-destaque{border-left:3px solid #ffd43b;background:#222;border-radius:10px;padding:12px 14px;color:#f4f4f4;font-size:16px;line-height:1.5;margin:16px 0}

.modal .nc-escala .nc-op,.nc-claro .nc-sent{background:var(--surface);color:var(--text);border-color:var(--line)}

.gh-trofeu{width:150px;margin:6px auto 0;animation:ghrevela .9s ease}

.gh-sec{background:#0A0F24;color:#F4F1EA}.gh-sec .muted{color:#AEB5D6!important}
.gh-nave{position:relative;width:220px;height:200px;margin:10px auto 0}
.gh-nave i{position:absolute;left:104px;top:90px;width:14px;height:14px;border-radius:50%;animation:ghjunta 1.6s cubic-bezier(.5,0,.3,1) both}
@keyframes ghjunta{from{transform:translate(var(--x),var(--y)) scale(1.4)}to{transform:translate(0,0) scale(.3);opacity:0}}
.gh-nave svg{position:absolute;inset:0;width:100%;height:100%;animation:ghpousa 1s ease 1.4s both}
@keyframes ghpousa{from{opacity:0;transform:translateY(-40px) scale(.8)}}
.pv-btn{position:fixed;left:10px;bottom:10px;z-index:95;font:inherit;font-size:12px;font-weight:800;border-radius:999px;border:1px solid #F9CB39;background:#0A0F24;color:#F9CB39;padding:8px 12px;cursor:pointer}
.pv-menu{position:fixed;left:10px;bottom:52px;z-index:95;background:#0A0F24;border:1px solid #3A4680;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:220px;box-shadow:0 10px 30px rgba(0,0,0,.5)}

.pv-menu button{font:inherit;font-size:14px;font-weight:700;text-align:left;border-radius:10px;border:0;background:#18224A;color:#F4F1EA;padding:10px 12px;cursor:pointer}
.pv-menu small{color:#AEB5D6;font-size:11px;padding:0 4px}
@media (prefers-reduced-motion:reduce){.gh-nave i,.gh-nave svg{animation:none}.gh-nave i{display:none}}
.cj-guard{display:inline-block;width:22px;height:22px;vertical-align:middle;margin-left:4px}
@media (prefers-reduced-motion:reduce){.gh-fig.revela,.gh-balao,.gh-trofeu{animation:none}}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRÉVIA · 7entidos</title><meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --violet:#342052;--purple:#7954C7;--lavender:#BDA8EB;--lilac:#F4EFFC;--gold:#E5BC74;--gold-ink:#8A6420;--white:#fff;--ink:#251D31;
  --bg:#FBF9FE;--surface:#FFFFFF;--surface-2:#F4EFFC;--line:#E6DDF5;--muted:#6A5F7C;--text:#251D31;--accent:#7954C7;--accent-ink:#5B3BA6;
  --fact:#7954C7;--hyp:#BDA8EB;--unk:#B7B0C2;--danger:#B3364A;--ok:#2E7D5B;
  --radius:18px;--shadow:0 1px 2px rgba(52,32,82,.06),0 8px 24px rgba(52,32,82,.07);
  --serif:'Fraunces',Georgia,serif;--sans:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;
}
[data-theme="dark"]{
  --bg:#17111F;--surface:#221A2E;--surface-2:#2B2140;--line:#3A2E52;--muted:#B5A9C8;--text:#F4EFFC;--accent:#BDA8EB;--accent-ink:#D9CCF6;
  --fact:#BDA8EB;--hyp:#7954C7;--unk:#6E6580;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--gold-ink:#E5BC74;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0 0 .4em;line-height:1.2}
h1{font-size:2rem}h2{font-size:1.45rem}h3{font-size:1.1rem}
p{margin:0 0 .8em}
a{color:var(--accent-ink)}
.layout{display:flex;min-height:100vh}
.side{width:248px;flex:none;padding:22px 16px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand b{font-family:var(--serif);font-size:1.12rem;letter-spacing:.04em;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.76rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;color:var(--muted);font-weight:600;font-size:.93rem}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button[aria-current="page"]{background:var(--surface-2);color:var(--accent-ink)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.main{flex:1;min-width:0;padding:26px clamp(16px,4vw,44px) 110px;max-width:1180px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:5px 11px;border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--unk)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--gold)}.dot.err{background:var(--danger)}
.bottomnav{display:none}
@media (max-width:860px){
  .side{display:none}
  .main{padding-top:16px}
  .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);overflow-x:auto;z-index:20;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottomnav button{all:unset;cursor:pointer;flex:1 0 auto;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;font-weight:600;color:var(--muted);padding:4px 6px;border-radius:10px}
  .bottomnav button[aria-current="page"]{color:var(--accent-ink);background:var(--surface-2)}
  .bottomnav svg{width:20px;height:20px}
  h1{font-size:1.6rem}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:12px;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:8px;transition:transform .12s ease,background .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.primary:hover{background:#6A45B8}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.fact{background:color-mix(in srgb,var(--fact) 16%,transparent);color:var(--accent-ink);border-color:color-mix(in srgb,var(--fact) 40%,transparent)}
.chip.hyp{background:transparent;color:var(--accent-ink);border:1.5px dashed var(--hyp)}
.chip.unk{background:transparent;color:var(--muted);border:1.5px dotted var(--unk)}
.chip.gold{background:color-mix(in srgb,var(--gold) 25%,transparent);color:var(--gold-ink);border-color:color-mix(in srgb,var(--gold) 60%,transparent)}
.chip.paused{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold-ink);border-color:var(--gold)}
.chip.live{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.hero{position:relative;overflow:hidden;background:linear-gradient(140deg,#342052 0%,#4A2E78 100%);color:#fff;border:none}
.hero h1{color:#fff}
.hero .muted{color:#D9CCF6}
.hero .stars{position:absolute;right:-30px;top:-20px;opacity:.35;pointer-events:none}
.stat{font-family:var(--serif);font-size:2rem;font-weight:600;line-height:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}

label.f{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin:12px 0 5px}
input.i,textarea.i,select.i{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none}

textarea.i{min-height:88px;resize:vertical}
.opt{all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;padding:13px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);transition:border-color .15s,background .15s}

.opt[aria-checked="true"]{border-color:var(--purple);background:color-mix(in srgb,var(--purple) 9%,var(--surface))}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt b{font-weight:700}
.opt .k{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--surface-2);font-weight:800;font-size:.82rem;margin-right:10px;color:var(--accent-ink)}
.opt[aria-checked="true"] .k{background:var(--purple);color:#fff}
.quote{border-left:3px solid var(--gold);padding:6px 0 6px 14px;font-family:var(--serif);font-style:italic}
.list{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface)}
.item.gap{background:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--unk) 10%,transparent) 10px 20px);border-style:dashed}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem}
.memcard{all:unset;cursor:pointer;display:flex;flex-direction:column;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);transition:transform .15s}
.memcard:hover{transform:translateY(-2px)}
.memcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.memart{height:118px;position:relative}
.memart .tag{position:absolute;left:10px;top:10px}
.memcard .body{padding:14px 16px}
.blur{filter:blur(6px);user-select:none}
.modal-bg{position:fixed;inset:0;background:rgba(23,17,31,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:22px;max-width:680px;width:100%;max-height:90vh;overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.banner{border-radius:14px;padding:12px 16px;background:color-mix(in srgb,var(--gold) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);font-size:.9rem}
.banner.info{background:var(--surface-2);border-color:var(--line)}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--lavender),var(--purple))}
.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 14px;font-size:.92rem}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0}
@media (max-width:520px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin:0 0 8px}}
.toast{pointer-events:none;position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--violet);color:#fff;padding:10px 18px;border-radius:12px;z-index:60;font-weight:600;font-size:.9rem;box-shadow:var(--shadow)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mapwrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px}

.mapnode{cursor:pointer}
.mapnode:focus{outline:none}
.mapnode:focus-visible circle.ring{stroke:var(--gold);stroke-width:3}
.swatch{height:64px;border-radius:12px;border:1px solid var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.range{width:100%;accent-color:var(--purple)}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px}
.bars i{flex:1;background:var(--lavender);border-radius:6px 6px 2px 2px;min-height:3px}

/* Correção de 02/11/2026: a versão anterior deste app trazia, por engano, registros pessoais de exemplo.
   Esta limpeza roda uma única vez em cada navegador, remove só esses registros de exemplo
   e mantém tudo o que a pessoa registrou por conta própria. */
const SEED_ANTIGO_ORIGENS=["catálogo recuperado","referência adicional"];
function limparRegistrosDeExemplo(st){
  if(!st||st.cleanSeedV1)return st;
  const n=clone(st);
  const evRemovidas=new Set();
  n.evidences=(n.evidences||[]).filter(e=>{const ex=(e.status==="não recuperada"&&e.sourceType==="investigação original")||(e.status==="recuperada"&&e.sourceType==="material recuperado")||(e.id==="053"&&e.status==="não coletada"&&e.sourceType==="pendente");if(ex)evRemovidas.add(e.id);return !ex});
  n.memories=(n.memories||[]).filter(m=>!(/^M(0[1-9]|1[0-5])$/.test(m.id)&&SEED_ANTIGO_ORIGENS.includes(m.origin)));
  const hRemovidas=new Set();
  n.hypotheses=(n.hypotheses||[]).filter(h=>{const ex=/^H0[1-8]$/.test(h.id)&&h.createdIn==="5.4";if(ex)hRemovidas.add(h.id);return !ex});
  n.hypotheses.forEach(h=>{["supportingEvidenceIds","relatedEvidenceIds","contradictoryEvidenceIds"].forEach(k=>{if(Array.isArray(h[k]))h[k]=h[k].filter(x=>!evRemovidas.has(x))})});
  n.signatures=[];
  if(n.dossier){
    n.dossier.confirmedFacts=(n.dossier.confirmedFacts||[]).filter(f=>!((f.sourceEvidenceIds||[]).length&&f.sourceEvidenceIds.every(x=>evRemovidas.has(x))));
    n.dossier.unknowns=(n.dossier.unknowns||[]).filter(u=>!/^U0[1-7]$/.test(u.id));
    n.dossier.requirements=(n.dossier.requirements||[]).filter(r=>!/^REQ-020\.1[1-8]$/.test(r.id));
    n.dossier.requirementsNote="";
    n.dossier.changeHistory=(n.dossier.changeHistory||[]).filter(c=>c.version!=="5.4").concat([{version:vstr(n.dossier.version),at:nowISO(),text:"Removidos registros de exemplo que vieram por engano numa versão anterior do app. Os seus registros foram mantidos."}]);
  }
  (n.dims||[]).forEach(d=>{d.evidence=(d.evidence||[]).filter(x=>!evRemovidas.has(x));d.hyps=(d.hyps||[]).filter(x=>!hRemovidas.has(x))});
  (n.memories||[]).forEach(m=>{m.relatedEvidenceIds=(m.relatedEvidenceIds||[]).filter(x=>!evRemovidas.has(x));m.relatedHypothesisIds=(m.relatedHypothesisIds||[]).filter(x=>!hRemovidas.has(x))});
  if(n.lastDiscovery&&evRemovidas.has(n.lastDiscovery.evidenceId))n.lastDiscovery={text:"Ainda não há descobertas. A primeira vem com a sua primeira pista.",evidenceId:null};
  const temPropria=(n.evidences||[]).some(e=>["registrada","sincronizada"].includes(e.status));
  if(!temPropria&&n.investigation){n.evidences=[];n.investigation=Object.assign({},n.investigation,{roomName:"Primeira investigação",lastEvidence:"000",nextEvidence:"001",currentQuestion:20,pauseReason:""})}
  n.cleanSeedV1=true;
  try{const sn=localStorage.getItem(LS_SNAP);if(sn&&sn.indexOf("catálogo recuperado")>=0)localStorage.removeItem(LS_SNAP)}catch(e){}
  return n;
}

/* ============ INTEGRIDADE ============ */
function verifyIntegrity(s){
  const C=[];const add=(ok,label,detail)=>C.push({ok,label,detail:detail||""});
  const ids=s.evidences.map(e=>e.id);const idset=new Set(ids);
  add(idset.size===ids.length,"Evidências sem números repetidos",ids.length+" registros");
  const last=parseInt(s.investigation.lastEvidence,10);const missing=[];
  for(let i=1;i<=last;i++)if(!idset.has(pad3(i)))missing.push(pad3(i));
  add(missing.length===0,"Evidências 001–"+s.investigation.lastEvidence+" completas, sem saltos",missing.length?"Faltando: "+missing.join(", "):"");
  const after=s.evidences.filter(e=>parseInt(e.id,10)>last&&hasContent(e)).map(e=>e.id);
  add(after.length===0,"Nenhuma resposta registrada depois da última evidência concluída",after.join(", "));
  const notDone=s.evidences.filter(e=>parseInt(e.id,10)<=last&&parseInt(e.id,10)>33&&!hasContent(e)).map(e=>e.id);
  add(notDone.length===0,"Evidências 034–"+s.investigation.lastEvidence+" com conteúdo",notDone.join(", "));
  add(s.investigation.nextEvidence===pad3(last+1),"Próxima evidência é "+pad3(last+1),"Atual: "+s.investigation.nextEvidence);
  const badFacts=s.dossier.confirmedFacts.filter(f=>f.sourceEvidenceIds.some(x=>!idset.has(x))).map(f=>f.id);
  const fids=s.dossier.confirmedFacts.map(f=>f.id);
  add(badFacts.length===0&&new Set(fids).size===fids.length,"Todos os fatos apontam para evidências existentes e não se repetem",badFacts.join(", "));
  const hids=s.hypotheses.map(h=>h.id);const badH=s.hypotheses.filter(h=>[...h.supportingEvidenceIds,...(h.relatedEvidenceIds||[]),...h.contradictoryEvidenceIds].some(x=>!idset.has(x))).map(h=>h.id);
  add(new Set(hids).size===hids.length&&badH.length===0,"Hipóteses com números únicos e evidências existentes",badH.join(", "));
  const uids=s.dossier.unknowns.map(u=>u.id);const badU=s.dossier.unknowns.filter(u=>u.resolvedBy&&!idset.has(u.resolvedBy)).map(u=>u.id);
  add(new Set(uids).size===uids.length&&badU.length===0,"Desconhecidos com números únicos",badU.join(", "));
  const hset=new Set(hids);const badD=s.dims.filter(d=>d.evidence.some(x=>!idset.has(x))||d.hyps.some(x=>!hset.has(x))).map(d=>d.label);
  add(badD.length===0,"Mapa da Felicidade aponta só para evidências e hipóteses existentes",badD.join(", "));
  const rids=s.dossier.requirements.map(r=>r.id);add(new Set(rids).size===rids.length,"Requisitos sem repetição",rids.length+" requisitos");
  return C;
}

/* ============ PACOTE DE SINCRONIZAÇÃO ============ */
function validatePack(pack,s){
  const E=[];
  if(!pack||pack.app!=="APP GIANINI"||pack.kind!=="sync-pack")return["Este arquivo não é um pacote de sincronização do 7entidos."];
  if(typeof pack.packId!=="string"||!pack.packId)E.push("Pacote sem identificação.");
  ["evidences","facts","hypotheses","hypothesisLinks","resolveUnknowns","unknowns","requirements","dims","dimLinks","changeHistory"].forEach(k=>{if(!Array.isArray(pack[k]))E.push("Parte '"+k+"' ausente no pacote.")});
  if(!pack.requires||!pack.investigation||!pack.dossierVersion)E.push("Pacote incompleto (requisitos de estado).");
  if(E.length)return E;
  if((s.appliedPacks||[]).some(x=>x.packId===pack.packId))return["Este pacote já foi aplicado antes. Nada será duplicado."];
  if(vstr(s.dossier.version)!==pack.requires.version)E.push("O app está no Dossiê v"+vstr(s.dossier.version)+", mas o pacote exige v"+pack.requires.version+".");
  if(s.investigation.lastEvidence!==pack.requires.lastEvidence)E.push("A última evidência do app é "+s.investigation.lastEvidence+", mas o pacote exige "+pack.requires.lastEvidence+".");
  if(s.investigation.currentQuestion!==pack.requires.currentQuestion)E.push("O app está na Pergunta "+s.investigation.currentQuestion+", mas o pacote exige a Pergunta "+pack.requires.currentQuestion+".");
  let expect=parseInt(pack.requires.lastEvidence,10)+1;
  pack.evidences.forEach(pe=>{
    if(pe.id!==pad3(expect))E.push("Evidência fora de ordem no pacote: "+pe.id+" (esperada "+pad3(expect)+").");expect++;
    const ex=s.evidences.find(e=>e.id===pe.id);
    if(ex&&ex.status!=="não coletada")E.push("A Evidência "+pe.id+" já tem conteúdo no app ("+ex.status+"). Conflito — nada foi alterado.");
    if(!Array.isArray(pe.selectedOptions)||!pe.selectedOptions.length)E.push("Evidência "+pe.id+" sem alternativa escolhida.");
  });
  if(pack.evidences.length&&pack.evidences[pack.evidences.length-1].id!==pack.investigation.lastEvidence)E.push("Última evidência do pacote não confere com o estado final.");
  const packEv=new Set(pack.evidences.map(e=>e.id));const allEv=new Set([...s.evidences.map(e=>e.id),...packEv]);
  pack.facts.forEach(f=>{if(s.dossier.confirmedFacts.some(x=>x.id===f.id))E.push("Fato "+f.id+" já existe.");if(f.sourceEvidenceIds.some(x=>!allEv.has(x)))E.push("Fato "+f.id+" aponta para evidência inexistente.")});
  pack.hypotheses.forEach(h=>{if(s.hypotheses.some(x=>x.id===h.id))E.push("Hipótese "+h.id+" já existe no app (conflito de numeração).")});
  const allH=new Set([...s.hypotheses.map(h=>h.id),...pack.hypotheses.map(h=>h.id)]);
  pack.hypothesisLinks.forEach(l=>{if(!s.hypotheses.some(x=>x.id===l.hypothesisId))E.push("Vínculo para hipótese inexistente "+l.hypothesisId+".");if(!packEv.has(l.evidenceId))E.push("Vínculo com evidência fora do pacote: "+l.evidenceId+".")});
  pack.resolveUnknowns.forEach(r=>{const u=s.dossier.unknowns.find(x=>x.id===r.id);if(!u)E.push("Desconhecido "+r.id+" não existe.");else if(u.status!=="aberta")E.push("Desconhecido "+r.id+" já estava resolvido.")});
  pack.unknowns.forEach(u=>{if(s.dossier.unknowns.some(x=>x.id===u.id))E.push("Desconhecido "+u.id+" já existe (conflito de numeração).")});
  pack.requirements.forEach(r=>{if(s.dossier.requirements.some(x=>x.id===r.id))E.push("Requisito "+r.id+" já existe.")});
  pack.dims.forEach(d=>{if(s.dims.some(x=>x.key===d.key))E.push("Dimensão do mapa '"+d.key+"' já existe.");d.hyps.forEach(h=>{if(!allH.has(h))E.push("Dimensão '"+d.key+"' cita hipótese inexistente "+h+".")})});
  pack.dimLinks.forEach(d=>{if(!s.dims.some(x=>x.key===d.key))E.push("Dimensão do mapa '"+d.key+"' não existe.")});
  if(pack.questions)Object.keys(pack.questions).forEach(k=>{const q=pack.questions[k];if(!q.text||!Array.isArray(q.options)||q.options.length<2)E.push("Pergunta "+k+" incompleta no pacote.")});
  return E;
}
function applyPack(s,pack){
  const errs=validatePack(pack,s);if(errs.length)return{errors:errs};
  const st=clone(s);const at=nowISO();
  pack.evidences.forEach(pe=>{
    const i=st.evidences.findIndex(e=>e.id===pe.id);const ex=i>=0?st.evidences[i]:null;
    const rec={id:pe.id,questionNumber:pe.questionNumber,questionText:pe.questionText||(ex&&ex.questionText)||"Texto exato da pergunta não recuperado.",context:pe.context||null,options:pe.options||[],selectedOptions:pe.selectedOptions,originalComplement:pe.originalComplement===undefined?null:pe.originalComplement,summary:pe.summary,sourceType:pack.sourceLabel||"investigação no ChatGPT",recordedAt:null,importedAt:at,importedFrom:pack.packId,status:"sincronizada",theme:pe.theme||(ex&&ex.theme)||null,notes:pe.notes||"",revisions:ex?ex.revisions:[],versionAfter:pe.versionAfter||null};
    if(i>=0)st.evidences[i]=rec;else st.evidences.push(rec);
  });
  st.evidences.sort((a,b)=>parseInt(a.id,10)-parseInt(b.id,10));
  pack.facts.forEach(f=>st.dossier.confirmedFacts.push({id:f.id,text:f.text,type:"fato",sourceEvidenceIds:f.sourceEvidenceIds,date:null,confidence:"Relato do usuário (sincronizado do ChatGPT)",revisable:true}));
  pack.hypotheses.forEach(h=>st.hypotheses.push({id:h.id,title:h.title,statement:h.statement,supportingEvidenceIds:h.supportingEvidenceIds,contradictoryEvidenceIds:[],relatedEvidenceIds:[],status:"candidata",uncertaintyNotes:h.uncertaintyNotes||"Hipótese de investigação, não conclusão. Revisável.",createdIn:h.createdIn||vstr(pack.dossierVersion)}));
  pack.hypothesisLinks.forEach(l=>{const h=st.hypotheses.find(x=>x.id===l.hypothesisId);if(!h.relatedEvidenceIds.includes(l.evidenceId))h.relatedEvidenceIds.push(l.evidenceId);if(l.note)h.uncertaintyNotes+=" "+l.note});
  pack.resolveUnknowns.forEach(r=>{const u=st.dossier.unknowns.find(x=>x.id===r.id);u.status="respondida";u.resolvedBy=r.resolvedBy});
  pack.unknowns.forEach(u=>st.dossier.unknowns.push({id:u.id,text:u.text,status:"aberta"}));
  pack.requirements.forEach(r=>st.dossier.requirements.push({id:r.id,text:r.text}));
  pack.dims.forEach(d=>st.dims.push({key:d.key,label:d.label,evidence:d.evidence,hyps:d.hyps,group:d.group}));
  pack.dimLinks.forEach(l=>{const d=st.dims.find(x=>x.key===l.key);(l.evidence||[]).forEach(e=>{if(!d.evidence.includes(e))d.evidence.push(e)});(l.hyps||[]).forEach(h=>{if(!d.hyps.includes(h))d.hyps.push(h)})});
  pack.changeHistory.forEach(c=>st.dossier.changeHistory.push({version:c.version,at:null,text:c.text}));
  st.dossier.changeHistory.push({version:vstr(pack.dossierVersion),at,text:"Sincronização aplicada no APP GIANINI (pacote “"+pack.packId+"”). Dados anteriores preservados; cópia automática guardada antes da importação."});
  if(pack.questions){st.questions=Object.assign({},st.questions||{},pack.questions)}
  if(pack.questionMode)st.questionMode=pack.questionMode;
  st.investigation=Object.assign({},st.investigation,{currentQuestion:pack.investigation.currentQuestion,lastEvidence:pack.investigation.lastEvidence,nextEvidence:pack.investigation.nextEvidence,paused:true,pauseReason:pack.investigation.pauseReason||"Pausada após sincronização."});
  st.dossier.version={major:pack.dossierVersion.major,minor:pack.dossierVersion.minor};
  if(pack.lastDiscovery)st.lastDiscovery=pack.lastDiscovery;
  st.appliedPacks=(st.appliedPacks||[]).concat([{packId:pack.packId,appliedAt:at,source:pack.source||null}]);
  const checks=verifyIntegrity(st);const failed=checks.filter(c=>!c.ok);
  if(failed.length)return{errors:failed.map(c=>"Falha na verificação: "+c.label+(c.detail?" ("+c.detail+")":""))};
  if(st.memories.length!==s.memories.length)return{errors:["As lembranças não foram preservadas."]};
  return{state:st,checks};
}

/* ============ PACOTE DE JORNADA ============ */
function journeyOwned(j){return j.ownedQuestions||[].concat(...j.stations.map(x=>x.questions)).filter(n=>n>j.startQuestion)}
function validateJourneyPack(pack,s){
  const E=[];
  if(!pack||pack.app!=="APP GIANINI"||pack.kind!=="journey-pack")return["Este arquivo não é um pacote de jornada do 7entidos."];
  if(!pack.packId||!pack.journey||!Array.isArray(pack.journey.stations)||!pack.questions)return["Pacote de jornada incompleto."];
  if((s.appliedPacks||[]).some(x=>x.packId===pack.packId))return["Esta jornada já foi carregada antes. Nada será duplicado."];
  const old=(s.journeys||[]).find(j=>j.id===pack.journey.id);
  let owned=[];
  if(old){owned=journeyOwned(old);
    if(s.evidences.some(e=>owned.includes(e.questionNumber)&&hasContent(e)))return["Você já começou a responder a "+old.title+". A parte nova vai entrar numa próxima investigação — nada foi alterado."];}
  const sQ=Object.assign({},s.questions||{});owned.forEach(n=>{delete sQ[n]});
  const nums=[].concat(...pack.journey.stations.map(st=>st.questions||[]));
  if(!nums.length)return["A jornada não tem perguntas."];
  nums.forEach((n,i)=>{if(n!==nums[0]+i)E.push("Numeração da jornada fora de ordem na pergunta "+n+".")});
  const packNums=Object.keys(pack.questions).map(Number);const firstOwn=Math.min(...packNums);
  const cur=s.investigation.currentQuestion;
  if(cur<nums[0]||cur>firstOwn)E.push("O app está na Pergunta "+cur+"; esta jornada foi preparada para começar entre as Perguntas "+nums[0]+" e "+firstOwn+".");
  nums.filter(n=>n<cur).forEach(n=>{if(!s.evidences.some(e=>e.questionNumber===n&&hasContent(e)))E.push("A Pergunta "+n+" ainda não foi respondida.")});
  const dimKeys=new Set([...s.dims.map(d=>d.key),...(pack.dims||[]).map(d=>d.key)]);
  nums.forEach(n=>{
    const inState=sQ[n];const inPack=pack.questions[n];
    if(inState&&inPack)E.push("A Pergunta "+n+" já existe no app; a jornada não pode substituí-la.");
    if(!inState&&!inPack)E.push("A Pergunta "+n+" não existe nem no app nem na jornada.");
    if(inPack&&s.evidences.some(e=>e.questionNumber===n&&hasContent(e)))E.push("A Pergunta "+n+" já foi respondida.");
    const q=inPack;if(q){
      const t=q.type||"single";if(!Q_TYPES.includes(t))E.push("Pergunta "+n+": tipo desconhecido.");
      if(!q.text)E.push("Pergunta "+n+" sem texto.");
      if(["single","multi","photo"].includes(t)&&(!Array.isArray(q.options)||q.options.length<2))E.push("Pergunta "+n+" precisa de pelo menos 2 alternativas.");
      if(q.dim&&!dimKeys.has(q.dim))E.push("Pergunta "+n+" aponta para dimensão inexistente '"+q.dim+"'.");
      (q.options||[]).forEach(o=>(o.hyps||[]).forEach(h=>{if(!s.hypotheses.some(x=>x.id===h))E.push("Pergunta "+n+" cita hipótese inexistente "+h+".")}));
    }});
  packNums.forEach(k=>{if(!nums.includes(k))E.push("A Pergunta "+k+" não pertence a nenhuma estação.")});
  return E;
}
function applyJourneyPack(s,pack){
  const errs=validateJourneyPack(pack,s);if(errs.length)return{errors:errs};
  const st=clone(s);const at=nowISO();
  st.questions=Object.assign({},st.questions||{});
  const old=(st.journeys||[]).find(j=>j.id===pack.journey.id);
  if(old){journeyOwned(old).forEach(n=>{delete st.questions[n]});st.journeys=st.journeys.filter(j=>j!==old)}
  Object.keys(pack.questions).forEach(k=>{st.questions[k]=Object.assign({source:pack.source||"Jornada"},pack.questions[k])});
  (pack.dims||[]).forEach(d=>{if(!st.dims.some(x=>x.key===d.key))st.dims.push({key:d.key,label:d.label,evidence:[],hyps:d.hyps||[],group:d.group||"Outros"})});
  const nums=[].concat(...pack.journey.stations.map(x=>x.questions));
  st.journeys=(st.journeys||[]).concat([Object.assign({},pack.journey,{startQuestion:nums[0],endQuestion:nums[nums.length-1],ownedQuestions:Object.keys(pack.questions).map(Number),loadedAt:at})]);
  st.questionMode="external";
  st.dossier.changeHistory.push({version:vstr(st.dossier.version),at,text:"Jornada “"+pack.journey.title+"” carregada (Perguntas "+nums[0]+"–"+nums[nums.length-1]+")"+(old?", substituindo a versão anterior ainda não iniciada":"")+". Nenhuma resposta foi registrada; a investigação continua pausada."});
  st.appliedPacks=(st.appliedPacks||[]).concat([{packId:pack.packId,appliedAt:at,source:pack.source||null}]);
  const checks=verifyIntegrity(st);const failed=checks.filter(c=>!c.ok);
  if(failed.length)return{errors:failed.map(c=>"Falha na verificação: "+c.label)};
  if(st.evidences.length!==s.evidences.length||st.memories.length!==s.memories.length||vstr(st.dossier.version)!==vstr(s.dossier.version))return{errors:["A jornada tentaria alterar evidências, lembranças ou a versão do Dossiê — bloqueado."]};
  return{state:st,checks};
}

function toMarkdown(s){
  const L=[];const p=(x="")=>L.push(x);

  p("Exportado em "+fmtDate(nowISO())+". Sala "+s.investigation.room+" — "+s.investigation.roomName+". Investigação: "+(s.investigation.paused?"PAUSADA":"ATIVA")+". Última evidência: "+s.investigation.lastEvidence+". Próxima pergunta: "+s.investigation.currentQuestion+".");p();
  p("## Evidências");p();
  s.evidences.forEach(e=>{
    p("### Evidência "+e.id+(e.theme?" — "+e.theme:"")+" ["+e.status+"]");
    if(e.questionNumber)p("- Pergunta nº: "+e.questionNumber);
    p("- Pergunta: "+e.questionText);
    if(e.context)p("- Contexto: "+e.context);
    if(e.status==="sincronizada")p("- Origem: "+e.sourceType+(e.importedAt?" (importada em "+fmtDate(e.importedAt)+")":""));
    if(e.selectedOptions.length)p("- Resposta: "+e.selectedOptions.map(o=>(o.k?o.k+" — ":"")+o.label).join("; "));
    if(e.originalComplement!==null&&e.originalComplement!==undefined)p("- Complemento literal: "+(e.originalComplement===""?"Sem complemento.":"“"+e.originalComplement+"”"));
    if(e.status==="não recuperada")p("- Resposta: desconhecida\n- Complemento: desconhecido");
    p("- Síntese: "+e.summary);
    if(e.notes)p("- Nota: "+e.notes);
    if(e.recordedAt)p("- Registrada em: "+fmtDate(e.recordedAt));
    (e.revisions||[]).forEach(r=>p("- Revisão ("+fmtDate(r.at)+"): "+r.text));
    p();
  });
  p("## Fatos relatados");s.dossier.confirmedFacts.forEach(f=>p("- **"+f.id+"** "+f.text+" _(origem: "+f.sourceEvidenceIds.join(", ")+")_"));p();
  p("## Hipóteses");s.hypotheses.forEach(h=>p("- **"+h.id+" — "+(h.title||"")+"** "+h.statement+" _Apoio: "+(h.supportingEvidenceIds.join(", ")||"—")+". Status: "+h.status+". "+h.uncertaintyNotes+"_"));p();
  p("## Assinaturas emocionais candidatas");s.signatures.forEach(g=>p("- **"+g.id+" — "+g.title+":** "+g.elements.join("; ")+". "+g.note));p();
  p("## Questões desconhecidas");s.dossier.unknowns.forEach(u=>p("- **"+u.id+"** ["+u.status+"] "+u.text));p();
  p("## Requisitos");s.dossier.requirements.forEach(r=>p("- **"+r.id+"** "+r.text));p("_"+s.dossier.requirementsNote+"_");p();
  p("## Sensações 10 × 10");s.memories.forEach(m=>{p("### "+m.title);p("- Descrição original: "+m.originalDescription);if(m.people.length)p("- Presentes: "+m.people.join(", "));if(m.place)p("- Local: "+m.place);if(m.date)p("- Data: "+m.date);if(m.intensity!==null&&m.intensity!=="")p("- Intensidade: "+m.intensity+"/10");if(m.emotions.length)p("- Emoções: "+m.emotions.join(", "));if(m.sensoryElements.length)p("- Elementos sensoriais: "+m.sensoryElements.join(", "));["peakMoment:Momento do pico","anticipation:Antecipação","duration:Duração","afterEffect:Efeito posterior","environment:Ambiente","meaning:Significado"].forEach(x=>{const[k,l]=x.split(":");if(m[k])p("- "+l+": "+m[k])});if(m.notes)p("- Nota: "+m.notes);if(m.unknownFields.length)p("- Desconhecido: "+m.unknownFields.join(", "));p()});
  p("## Histórico de versões");s.dossier.changeHistory.forEach(c=>p("- v"+c.version+(c.at?" ("+fmtDate(c.at)+")":"")+": "+c.text));
  if(s.wellbeing.length){p();p("## Check-ins de bem-estar");s.wellbeing.forEach(w=>p("- "+fmtDate(w.at)+": humor "+w.mood+"/10, energia "+w.energy+"/10, sono "+w.sleep+"/10"+(w.note?" — "+w.note:"")))}
  return L.join("\n");
}
function validateImport(obj){
  const errs=[];
  if(!obj||typeof obj!=="object")return["O arquivo não contém um objeto JSON."];
  if(obj.app!=="APP GIANINI")errs.push("O arquivo não parece ser um backup do 7entidos (campo 'app').");
  if(typeof obj.schemaVersion!=="number")errs.push("Versão de esquema ausente.");
  else if(obj.schemaVersion>SCHEMA)errs.push("Backup criado por uma versão mais nova do app.");
  ["evidences","memories","hypotheses","dims"].forEach(k=>{if(!Array.isArray(obj[k]))errs.push("Lista '"+k+"' ausente ou inválida.")});
  if(!obj.dossier||!obj.dossier.version)errs.push("Dossiê ausente.");
  if(!obj.investigation)errs.push("Estado da investigação ausente.");
  if(Array.isArray(obj.evidences)){const ids=obj.evidences.map(e=>e&&e.id);if(new Set(ids).size!==ids.length)errs.push("Há evidências com IDs repetidos.")}
  return errs;
}

function MemArt({m}){
  // purely decorative, deterministic abstract constellation
  let h=0;for(const c of m.id+m.title)h=(h*31+c.charCodeAt(0))>>>0;
  const pts=[];for(let i=0;i<6;i++){h=(h*1103515245+12345)>>>0;const x=20+(h%260);h=(h*1103515245+12345)>>>0;const y=18+(h%80);pts.push([x,y])}
  const hue=m.substance?"#5C4A72":m.category==="Viagens"?"#4A2E78":m.category==="Cotidiano"?"#6B4BB0":m.category==="Referências"?"#3E3357":"#7954C7";
  return html`<svg viewBox="0 0 300 118" width="100%" height="118" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="300" height="118" fill=${hue}/>
    <polyline points=${pts.map(p=>p.join(",")).join(" ")} fill="none" stroke="#BDA8EB" stroke-opacity=".55" stroke-width="1.2"/>

}

  try{const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return true}catch(e){return false}
}

/* Registro de uma sensação (uma escolha por registro) */

    <div class="row" style=${{gap:6}}>${meus.map(x=>html`<button key=${x.id} type="button" class=${"btn small"+(sentido===x.id?" primary":"")} aria-pressed=${sentido===x.id} onClick=${()=>setSentido(sentido===x.id?null:x.id)}>${x.t}</button>`)}</div>`:null}

/* Primeira leitura do mapa (a partir do Dia 7), só com os dados que existem */
function NcPrimeiroMapa({s,onClose,go}){
  const regs=(s.sensacoes||[]);const meus=((s.novoComeco&&s.novoComeco.sentidos)||[]).map(ncSentido).filter(Boolean);
  const porSentido=meus.map(x=>{const r=regs.filter(g=>g.sentido===x.id);const media=r.length?r.reduce((a,g)=>a+g.v,0)/r.length:null;return {x,n:r.length,media}});
  const comDados=porSentido.filter(p=>p.n>0).sort((a,b)=>b.media-a.media);
  const poucos=regs.length<5||comDados.length<2;
  const esc=ncEscala(s);const rotulo=m=>{const e=esc.find(z=>z.v===Math.round(m));return e?e.t:""};
  return html`<${Modal} title="Seu primeiro mapa" onClose=${onClose}>
    <p style=${{marginTop:0}}>Esta é uma primeira leitura das experiências que você registrou. Não é uma conclusão sobre quem você é: o mapa continua mudando com você.</p>
    ${poucos?html`<p class="banner small" role="note">Seu mapa ainda está em construção: há poucos registros até agora. Ele fica mais claro a cada experiência registrada.</p>`:null}
    ${comDados.length?html`<div class="list" style=${{marginTop:10}}>${comDados.map(p=>html`<div key=${p.x.id} class="item row" style=${{flexWrap:"nowrap",gap:12}}><${NcIcon} ic=${p.x.ic} c=${p.x.c}/><div style=${{flex:1}}><b>${p.x.t}</b><div class="small muted">Em geral: ${rotulo(p.media)} · ${p.n} ${p.n===1?"registro":"registros"}</div></div></div>`)}</div>`:html`<p class="muted">Ainda não há registros ligados a um sentido. Ao registrar uma experiência, escolha por qual sentido ela passou.</p>`}
    ${porSentido.filter(p=>!p.n).length?html`<p class="small muted" style=${{marginTop:12}}>Ainda sem registros: ${porSentido.filter(p=>!p.n).map(p=>p.x.t).join(", ")}.</p>`:null}
    <div class="row" style=${{marginTop:14}}><button class="btn" onClick=${()=>{onClose();go("mapa")}}>Ver o mapa completo</button><button class="btn ghost" onClick=${onClose}>Fechar</button></div>
  <//>`;
}

function parseOptions(txt){
  const out=[];txt.split(/\n+/).forEach(line=>{const m=line.match(/^\s*\(?([A-Za-z])\s*[—–\-\).:]\s*(.+)$/);if(m){const k=m[1].toUpperCase();if(!out.some(o=>o.k===k)){const rest=m[2].trim();const i=rest.search(/[.!?]\s/);out.push(i>0?{k,label:rest.slice(0,i+1),desc:rest.slice(i+1).trim()}:{k,label:rest,desc:""})}}});
  return out;
}
function PasteQuestion({n,next,update,toast,pause}){
  const [text,setText]=useState("");const [opts,setOpts]=useState("");const [err,setErr]=useState("");
  const parsed=parseOptions(opts);
  function save(){
    if(!text.trim()){setErr("Cole o texto da pergunta.");return}
    if(parsed.length<2){setErr("Cole pelo menos duas alternativas, uma por linha, começando com a letra (ex.: “A — Texto”).");return}
    const ok=update(st=>{if(st.investigation.currentQuestion!==n)return false;st.questions=st.questions||{};if(st.questions[n])return false;st.questions[n]={text:text.trim().replace(/^[“"]|[”"]$/g,""),options:parsed,source:"Recebida do ChatGPT (colada pelo usuário)",addedAt:nowISO()}});
    if(!ok){setErr("Já existe uma pergunta para este número.");return}
    toast("Pergunta "+n+" adicionada");
  }
  return html`<div class="card" style=${{marginBottom:18}}>
    <div class="eyebrow">Pergunta ${n} · Evidência ${next}</div><h2>Aguardando a próxima pergunta</h2>
    <p class="muted">Quando o ChatGPT enviar a Pergunta ${n}, cole aqui o texto e as alternativas. Nada é registrado como resposta até você escolher uma alternativa.</p>
    <label class="f" for="pq-t">Texto da pergunta</label><textarea id="pq-t" class="i" value=${text} onInput=${e=>setText(e.target.value)}></textarea>
    <label class="f" for="pq-o">Alternativas (uma por linha, ex.: “A — Texto”)</label><textarea id="pq-o" class="i" style=${{minHeight:140}} value=${opts} onInput=${e=>setOpts(e.target.value)}></textarea>
    ${parsed.length?html`<p class="small muted">Reconhecidas: ${parsed.map(o=>o.k).join(", ")}</p>`:null}
    ${err?html`<p role="alert" style=${{color:"var(--danger)"}}>${err}</p>`:null}
    <div class="row" style=${{marginTop:12}}><button class="btn primary" onClick=${save}>Adicionar Pergunta ${n}</button><button class="btn" onClick=${pause}>⏸ Pausar</button></div></div>`;
}
function CorrectModal({e,onClose,update,toast}){
  const appReg=e.status==="registrada"&&e.options.length&&(!e.questionType||e.questionType==="single")&&!e.skipped;
  const [sel,setSel]=useState(appReg?e.selectedOptions[0].k:null);const [comp,setComp]=useState(e.originalComplement||"");const [note,setNote]=useState("");
  function save(){
    if(!note.trim()&&!appReg)return;
    update(st=>{
      const ev=st.evidences.find(x=>x.id===e.id);const at=nowISO();
      if(appReg){
        const opt=ev.options.find(o=>o.k===sel);
        if(opt.k===ev.selectedOptions[0].k&&comp===ev.originalComplement&&!note.trim())return;
        ev.revisions.push({at,text:"Anterior: "+ev.selectedOptions[0].k+" — "+ev.selectedOptions[0].label+"; complemento: “"+(ev.originalComplement||"")+"”. "+(note?"Motivo: "+note:""),previous:{selectedOptions:ev.selectedOptions,originalComplement:ev.originalComplement}});
        ev.selectedOptions=[opt];ev.originalComplement=comp;
        ev.summary="Em resposta à Pergunta "+ev.questionNumber+", selecionou "+opt.k+" — "+opt.label+" (“"+opt.desc+"”) [corrigida]";
        const f=st.dossier.confirmedFacts.find(x=>x.id==="F-"+ev.id);if(f)f.text=ev.summary+(comp?" Complemento literal: “"+comp+"”.":" Sem complemento.");
      }else ev.revisions.push({at,text:note});
      bumpVersion(st.dossier.version);
      st.dossier.changeHistory.push({version:vstr(st.dossier.version),at,text:"Correção na Evidência "+ev.id+". Registro original preservado no histórico de revisões."});
    },"correct");
    toast("Correção registrada");onClose();
  }
  return html`<${Modal} title=${"Corrigir Evidência "+e.id} onClose=${onClose}>
    ${appReg?html`<div class="list" role="radiogroup">${e.options.map(o=>html`<button key=${o.k} class="opt" role="radio" aria-checked=${sel===o.k} onClick=${()=>setSel(o.k)}><span class="k">${o.k}</span><b>${o.label}</b></button>`)}</div>
      <label class="f">Complemento</label><textarea class="i" value=${comp} onInput=${x=>setComp(x.target.value)}></textarea>`:
      html`<p class="muted small">Esta evidência veio do material recuperado. O registro original não é alterado; sua correção fica anexada como revisão.</p>`}
    <label class="f">${appReg?"Motivo (opcional)":"Nota de correção"}</label><textarea class="i" value=${note} onInput=${x=>setNote(x.target.value)}></textarea>
    <div class="row" style=${{marginTop:14}}><button class="btn primary" disabled=${!appReg&&!note.trim()} onClick=${save}>Salvar correção</button><button class="btn" onClick=${onClose}>Cancelar</button></div>
  <//>`;
}

}

function resizeImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=480;const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

  {t:"Uma viagem em que o trajeto seja parte do plano",base:["H02"],why:"A antecipação e o começo de uma experiência podem ser momentos especiais.",unc:"Não investigamos ainda o papel do movimento e da estrada (dimensão “Tipo de lugar”)."},
  {t:"Uma primeira vez a dois: uma atividade nova com alguém próximo",base:["H06","H02","H05"],why:"Intimidade e começo de experiências podem ser caminhos de boas sensações.",unc:"Não sabemos se novidade aumenta ou não sua felicidade (Pergunta 23 do banco)."},
  {t:"Uma noite de céu estrelado longe das luzes da cidade",base:["H03"],why:"Exploração a partir de luz e deslumbramento.",unc:"Totalmente exploratória."},
  {t:"Algo fora do seu repertório: um ateliê, uma aula prática, um esporte novo",base:[],why:"Sem evidência direta — serve para descobrir, não para repetir.",unc:"Nenhum dado de apoio. Avalie riscos e custos reais antes."}

function Descobridor({s,update,toast}){
  const [form,setForm]=useState(null);
  return html`<div class="fade"><div class="eyebrow">Módulo F</div><h1>Experiências</h1>
    <p class="muted" style=${{maxWidth:720}}>Territórios exploratórios a partir das suas hipóteses — sem notas inventadas, sem eventos, preços ou locais atuais. Quando você adota uma ideia, as estimativas de felicidade e viabilidade são suas, e o resultado posterior vira aprendizado.</p>
    <div class="banner info" style=${{marginBottom:16}}>Ainda há poucos dados: todas as sugestões abaixo são <b>exploratórias</b>. Potencial de felicidade: <b>não estimado</b>.</div>
    <div class="grid g2">${TERRITORIES.map((x,i)=>html`<div key=${i} class="card"><span class="chip hyp">◌ exploratória</span><h3 style=${{marginTop:10}}>${x.t}</h3>
      <p class="small" style=${{margin:"0 0 6px"}}><b>Por quê:</b> ${x.why}</p><p class="small muted"><b>Incertezas:</b> ${x.unc}</p>
      <div class="row"><span class="small muted">Base: ${x.base.join(", ")||"nenhuma"}</span><span style=${{flex:1}}></span><button class="btn small" onClick=${()=>setForm({experience:x.t,rationale:x.why,uncertainty:x.unc,supportingHypotheses:x.base})}>Adotar ideia</button></div></div>`)}</div>
    <div class="spread" style=${{marginTop:26}}><h2>Meu plano de experiências</h2><button class="btn primary" onClick=${()=>setForm({})}>＋ Ideia própria</button></div>
    ${s.recommendations.length===0?html`<div class="card muted">Nenhuma experiência no plano ainda. Adote um território acima ou crie a sua.</div>`:
    html`<div class="list">${s.recommendations.map(r=>html`<div key=${r.id} class="item"><div class="spread"><b>${r.experience}</b><div class="row">${r.estimatedHappiness!==""?html`<span class="chip gold">sua estimativa: ${r.estimatedHappiness}/10</span>`:html`<span class="chip unk">potencial não estimado</span>`}${r.feasibility!==""?html`<span class="chip">viabilidade ${r.feasibility}/10</span>`:null}<button class="btn small" onClick=${()=>setForm(r)}>Editar</button></div></div>
      <p class="small muted" style=${{margin:"6px 0 0"}}>${[r.effort&&"Esforço: "+r.effort,r.cost&&"Custo: "+r.cost,r.time&&"Tempo: "+r.time,r.context&&"Contexto: "+r.context,r.risks&&"Riscos: "+r.risks].filter(Boolean).join(" · ")||"Detalhes a preencher"}</p>
      ${r.outcome?html`<p class="small" style=${{margin:"6px 0 0"}}><b>Resultado posterior:</b> ${r.outcome}</p>`:null}</div>`)}</div>`}
    ${form?html`<${RecForm} r=${form} onClose=${()=>setForm(null)} update=${update} toast=${toast}/>`:null}
  </div>`;
}
function RecForm({r,onClose,update,toast}){
  const [f,setF]=useState(Object.assign({experience:"",estimatedHappiness:"",feasibility:"",effort:"",cost:"",time:"",context:"",risks:"",rationale:"",uncertainty:"",outcome:"",supportingHypotheses:[]},r));
  const [err,setErr]=useState("");const set=k=>e=>setF(Object.assign({},f,{[k]:e.target.value}));
  function save(){if(!f.experience.trim()){setErr("Descreva a experiência.");return}
    for(const k of["estimatedHappiness","feasibility"])if(f[k]!==""&&(isNaN(+f[k])||+f[k]<0||+f[k]>10)){setErr("Use valores de 0 a 10.");return}
    update(st=>{if(f.id){Object.assign(st.recommendations.find(x=>x.id===f.id),f)}else st.recommendations.push(Object.assign({},f,{id:uid("R"),createdAt:nowISO()}))},"rec");toast("Plano atualizado");onClose()}
  const T=(k,l,ph)=>html`<div><label class="f">${l}</label><input class="i" value=${f[k]} onInput=${set(k)} placeholder=${ph||""}/></div>`;
  return html`<${Modal} title=${f.id?"Editar experiência":"Nova experiência"} onClose=${onClose} wide>
    ${T("experience","Experiência *")}
    <div class="grid g2" style=${{gap:"0 16px"}}>${T("estimatedHappiness","Sua estimativa de felicidade (0–10)","deixe vazio se não souber")}${T("feasibility","Viabilidade (0–10)")}${T("effort","Esforço")}${T("cost","Custo")}${T("time","Tempo necessário")}${T("context","Contexto")}${T("risks","Possíveis riscos")}${T("uncertainty","Incertezas")}</div>
    ${T("rationale","Evidências / motivo")}
    <label class="f">Resultado posterior (depois de viver)</label><textarea class="i" value=${f.outcome} onInput=${set("outcome")}></textarea>
    <p class="small muted">Estimativas são palpites seus, não previsões objetivas.</p>
    ${err?html`<p role="alert" style=${{color:"var(--danger)"}}>${err}</p>`:null}
    <div class="row" style=${{marginTop:10}}><button class="btn primary" onClick=${save}>Salvar</button>${f.id?html`<button class="btn danger" onClick=${()=>{update(st=>{st.recommendations=st.recommendations.filter(x=>x.id!==f.id)},"rec");onClose()}}>Remover</button>`:null}<button class="btn" onClick=${onClose}>Cancelar</button></div><//>`;
}

  {t:"Aterramento 5-4-3-2-1",tag:"Regulação",steps:["Nomeie 5 coisas que você vê.","4 que você pode tocar.","3 sons que você ouve.","2 cheiros.","1 sabor ou uma coisa boa sobre você agora."]},
  {t:"Registro de pensamento",tag:"TCC",steps:["Situação: o que aconteceu?","Pensamento automático: o que passou pela cabeça?","Emoção e intensidade (0–10).","Evidências a favor e contra esse pensamento.","Um pensamento alternativo mais equilibrado — e a nova intensidade."]},

  {t:"Ação guiada por valores",tag:"ACT",steps:["O que importa para você hoje (ex.: conexão, beleza, cuidado)?","Qual é uma ação de 5 minutos alinhada a isso?","Faça-a, mesmo que o desconforto continue junto."]},

function Apoio({s,update,toast}){
  const [f,setF]=useState({mood:5,energy:5,sleep:5,note:"",p1:"",p2:"",p3:"",reflection:""});const [tool,setTool]=useState(null);
  const set=k=>e=>setF(Object.assign({},f,{[k]:e.target.value}));
  function save(){update(st=>{st.wellbeing.push({id:uid("W"),at:nowISO(),mood:+f.mood,energy:+f.energy,sleep:+f.sleep,note:f.note,positives:[f.p1,f.p2,f.p3].filter(Boolean),reflection:f.reflection})},"wellbeing");toast("Check-in salvo");setF({mood:5,energy:5,sleep:5,note:"",p1:"",p2:"",p3:"",reflection:""})}
  const week=s.wellbeing.filter(w=>Date.now()-new Date(w.at).getTime()<7*864e5);
  const avg=k=>{const v=week.filter(w=>typeof w[k]==="number");return v.length?(v.reduce((a,w)=>a+w[k],0)/v.length).toFixed(1):"—"};
  const low=+f.mood<=2;
  return html`<div class="fade"><div class="eyebrow">Módulo G</div><h1>Bem-estar</h1>
    <p class="muted">Um espaço complementar para cuidar do dia a dia. Não substitui terapia nem acompanhamento médico, e não faz diagnósticos.</p>
    <div class="banner" style=${{marginBottom:16}} role="note"><b>Se você estiver em risco imediato</b>, procure ajuda humana agora: <b>SAMU 192</b> · <b>CVV 188</b> (apoio emocional, 24 h, ligação gratuita) · chat em <a href="https://cvv.org.br" target="_blank" rel="noopener">cvv.org.br</a> · ou alguém de confiança perto de você.</div>
    <div class="grid g2">
      <div class="card"><h3>Check-in de hoje</h3>
        ${[["mood","Humor"],["energy","Energia"],["sleep","Sono (qualidade)"]].map(([k,l])=>html`<label key=${k} class="f">${l}: ${f[k]}/10</label><input class="range" type="range" min="0" max="10" value=${f[k]} onInput=${set(k)}/>`)}
        ${low?html`<p class="banner info small" style=${{marginTop:10}}>Parece um dia pesado. Você não precisa atravessar sozinho — falar com alguém de confiança ou com um profissional pode ajudar. A Caixa de Primeiros Socorros abaixo tem exercícios curtos.</p>`:null}
        <label class="f">Nota do dia</label><textarea class="i" value=${f.note} onInput=${set("note")} placeholder="Como foi o dia, em poucas palavras?"></textarea>
        <label class="f">Três coisas boas de ontem</label>
        ${["p1","p2","p3"].map((k,i)=>html`<input key=${k} class="i" style=${{marginBottom:6}} value=${f[k]} onInput=${set(k)} placeholder=${(i+1)+"."}/>`)}
        <label class="f">Reflexão pessoal (opcional)</label><textarea class="i" value=${f.reflection} onInput=${set("reflection")}></textarea>
        <button class="btn primary" style=${{marginTop:12}} onClick=${save}>Salvar check-in</button></div>
      <div class="grid" style=${{alignContent:"start"}}>
        <div class="card"><h3>Revisão semanal</h3>${week.length?html`<dl class="kv"><dt>Check-ins (7 dias)</dt><dd>${week.length}</dd><dt>Humor médio</dt><dd>${avg("mood")}</dd><dt>Energia média</dt><dd>${avg("energy")}</dd><dt>Sono médio</dt><dd>${avg("sleep")}</dd></dl>
          <div class="bars" style=${{marginTop:12}} aria-label="Humor dos últimos check-ins">${week.slice(-10).map(w=>html`<i key=${w.id} title=${fmtDate(w.at)+": humor "+w.mood} style=${{height:(w.mood*10)+"%"}}></i>`)}</div>
          <p class="small muted" style=${{marginTop:6}}>Médias apenas dos seus próprios registros.</p>`:html`<p class="muted">Ainda sem check-ins nesta semana. O primeiro aparece aqui.</p>`}</div>
        <div class="card"><h3>Caixa de Primeiros Socorros Emocionais</h3><div class="list">${TOOLS.map((t,i)=>html`<button key=${i} class="opt" onClick=${()=>setTool(t)}><span class="chip" style=${{marginRight:8}}>${t.tag}</span><b>${t.t}</b></button>`)}</div></div>
      </div></div>
    ${s.wellbeing.length?html`<h2 style=${{marginTop:22}}>Registros</h2><div class="list">${s.wellbeing.slice().reverse().slice(0,20).map(w=>html`<div key=${w.id} class="item small"><div class="spread"><b>${fmtDate(w.at)}</b><span class="muted">humor ${w.mood}${typeof w.energy==="number"?" · energia "+w.energy:""}${typeof w.sleep==="number"?" · sono "+w.sleep:" · check-in rápido"}</span></div>${w.note?html`<p style=${{margin:"4px 0 0"}}>${w.note}</p>`:null}${w.positives.length?html`<p class="muted" style=${{margin:"4px 0 0"}}>✦ ${w.positives.join(" · ")}</p>`:null}</div>`)}</div>`:null}
    ${tool?html`<${Modal} title=${tool.t} onClose=${()=>setTool(null)}><span class="chip">${tool.tag}</span><ol style=${{marginTop:12}}>${tool.steps.map((x,i)=>html`<li key=${i} style=${{marginBottom:8}}>${x}</li>`)}</ol><p class="small muted">Se nada disso ajudar e você sentir que pode se machucar, ligue 188 (CVV) ou 192 (SAMU).</p><//>`:null}
  </div>`;
}

/* ============ DADOS ============ */
function Dados({s,setState,saveInfo,update,toast,downloads}){
  const [syncPrev,setSyncPrev]=useState(null);const [syncErrs,setSyncErrs]=useState([]);const [checks,setChecks]=useState(null);const [snap,setSnap]=useState(null);const [working,setWorking]=useState(false);
  function onPack(e){const file=e.target.files[0];e.target.value="";if(!file)return;setSyncErrs([]);
    const r=new FileReader();r.onload=()=>{let pack;try{pack=JSON.parse(r.result)}catch(x){setSyncErrs(["O arquivo não pôde ser lido (não é um JSON válido)."]);return}
      const isJ=pack&&pack.kind==="journey-pack";const res=isJ?applyJourneyPack(s,pack):applyPack(s,pack);if(res.errors){setSyncErrs(res.errors);return}setSyncPrev({pack,result:res.state,journey:isJ})};r.readAsText(file)}
  async function confirmSync(){
    if(working)return;setWorking(true);
    const res=syncPrev.journey?applyJourneyPack(s,syncPrev.pack):applyPack(s,syncPrev.pack);
    if(res.errors){setSyncErrs(res.errors);setSyncPrev(null);setWorking(false);return}
    const ok=await saveSnapshot(s,"Antes de aplicar o pacote "+syncPrev.pack.packId);
    if(!ok){setSyncErrs(["Não consegui guardar a cópia automática de segurança. Por precaução, nada foi alterado."]);setSyncPrev(null);setWorking(false);return}
    setState(res.state,"sync");setChecks(verifyIntegrity(res.state));const wasJ=syncPrev.journey;setSyncPrev(null);setWorking(false);toast(wasJ?"Jornada carregada! Vá até a Sala de Detetive.":"Sincronização aplicada · Dossiê v"+vstr(res.state.dossier.version));
  }
  async function openSnap(){const d=await loadSnapshot();if(!d){toast("Nenhuma cópia automática encontrada");return}setSnap(d)}
  function restoreSnap(){try{const obj=JSON.parse(snap.payload);const v=validateImport(obj);if(v.length){toast("A cópia automática está ilegível");return}setState(obj,"restore");setSnap(null);toast("Cópia automática restaurada")}catch(e){toast("A cópia automática está ilegível")}}
  const [exportText,setExportText]=useState(null);const [pending,setPending]=useState(null);const [errs,setErrs]=useState([]);const [confirmReset,setConfirmReset]=useState(false);const [typed,setTyped]=useState("");
  const fileRef=useRef();
  const stamp=new Date().toISOString().slice(0,10);
  async function exportLivro(){const data=livroHTML(s);const filename="livro-boas-sensacoes-"+stamp+".html";
    if(downloads){try{await downloads.save({filename,data});update(st=>{st.settings.exportPreferences.lastExportAt=nowISO()},"export");toast("Livro pronto para baixar");return}catch(e){if(e&&e.code==="declined")return;console.warn(e)}}
    setExportText({kind:"html",data,filename})}
  async function doExport(kind){
    const data=kind==="json"?JSON.stringify(s,null,2):toMarkdown(s);
    const filename="app-gianini-dossie-v"+vstr(s.dossier.version)+"-"+stamp+(kind==="json"?".json":".md");
    if(downloads){try{await downloads.save({filename,data});update(st=>{st.settings.exportPreferences.lastExportAt=nowISO()},"export");toast("Arquivo oferecido para download");return}catch(e){console.warn(e)}}
    setExportText({kind,data,filename});
  }
  async function copyExport(){try{await navigator.clipboard.writeText(exportText.data);toast("Copiado");update(st=>{st.settings.exportPreferences.lastExportAt=nowISO()},"export")}catch(e){toast("Selecione o texto e copie manualmente")}}
  function onFile(e){const file=e.target.files[0];if(!file)return;setErrs([]);
    if(file.size>15e6){setErrs(["Arquivo grande demais."]);return}
    const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);const v=validateImport(obj);if(v.length){setErrs(v);return}setPending(obj)}catch(x){setErrs(["Não é um JSON válido."])}};r.readAsText(file);e.target.value=""}
  async function applyImport(){const obj=pending;const ok=await saveSnapshot(s,"Antes de importar backup");if(!ok){toast("Não consegui guardar a cópia automática — nada foi alterado");return}setState(obj,"import");setPending(null);toast("Backup importado")}
  const last=s.settings.exportPreferences.lastExportAt;
  return html`<div class="fade"><div class="eyebrow">Persistência e segurança</div><h1>Seus dados</h1>
    <div class="card" style=${{marginBottom:16}}><h3>Onde seus dados ficam</h3>
      <div class="row" style=${{marginBottom:8}}><span class=${"dot "+saveInfo.dot}></span><b>${saveInfo.label}</b></div>
      <p class="small">${saveInfo.mode==="cloud"?"Seus dados ficam guardados num espaço privado da sua conta, nesta página: só você, conectado, consegue lê-los — nem quem compartilhar o link com você vê. Também guardo uma cópia neste navegador.":saveInfo.mode==="local"?"O armazenamento da conta não está disponível nesta visualização. Seus dados estão só neste navegador, que pode apagá-los (modo anônimo, limpeza de dados, outro aparelho). Exporte backups com frequência.":"Não consegui salvar em lugar nenhum nesta visualização. Os dados existem apenas enquanto esta aba estiver aberta — exporte um backup antes de fechar."}</p>
      <p class="small muted" style=${{margin:0}}>Nada é enviado a serviços externos. Mesmo com o salvamento automático, um backup em arquivo é a sua garantia final. ${last?"Último backup: "+fmtDate(last)+".":"Você ainda não fez nenhum backup."}</p></div>
    <div class="grid g2">
      <div class="card"><h3>Exportar</h3><p class="small muted">JSON é o backup completo (restaurável). Markdown é a versão legível do Dossiê.</p><div class="row"><button class="btn primary" onClick=${()=>doExport("json")}>Exportar backup JSON</button><button class="btn" onClick=${exportLivro}>📖 Livro das boas sensações</button><button class="btn" onClick=${()=>doExport("md")}>Exportar Markdown</button></div></div>
      <div class="card"><h3>Importar backup</h3><p class="small muted">O arquivo é validado antes. Nada é substituído sem sua confirmação.</p><input ref=${fileRef} type="file" accept=".json,application/json" onChange=${onFile} aria-label="Escolher arquivo de backup"/>
        ${errs.length?html`<ul role="alert" style=${{color:"var(--danger)"}} class="small">${errs.map((x,i)=>html`<li key=${i}>${x}</li>`)}</ul>`:null}</div>
      <div class="card" style=${{gridColumn:"1 / -1",borderColor:"var(--lavender)"}}><h3>Sincronização e jornadas</h3>
        <p class="small muted">Carregue aqui um pacote de sincronização ou de jornada. O app confere tudo antes, mostra o que vai mudar e só aplica com a sua confirmação. Se qualquer verificação falhar, nada é alterado. Antes de aplicar, uma cópia automática do estado atual é guardada.</p>
        <input type="file" accept=".json,application/json" onChange=${onPack} aria-label="Escolher pacote"/>
        ${syncErrs.length?html`<div role="alert" class="banner" style=${{marginTop:12}}><b>Nada foi alterado.</b><ul class="small" style=${{margin:"6px 0 0"}}>${syncErrs.map((x,i)=>html`<li key=${i}>${x}</li>`)}</ul></div>`:null}
        ${(s.appliedPacks||[]).length?html`<p class="small muted" style=${{marginTop:10}}>Pacotes já aplicados: ${s.appliedPacks.map(p=>p.packId+" ("+fmtDate(p.appliedAt)+")").join("; ")}</p>`:null}</div>

function wrapLines(ctx,text,maxW){const words=String(text).split(/\s+/);const lines=[];let cur="";words.forEach(w=>{const t=cur?cur+" "+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t});if(cur)lines.push(cur);return lines}
async function drawRetro(canvas,{monthLabel,count,items,dims}){

function Retro({s,onClose,downloads,toast}){

    quick.map(q=>({id:"q"+q.id,t:q.moment||q.text,src:"Descoberta rápida"})),

  const count=quick.length+wb.reduce((a,w)=>a+(w.positives||[]).length,0)+mems.length;
  const cv=useRef(null);const [img,setImg]=useState(null);
  const items=candidates.filter(c=>sel.includes(c.id)).map(c=>c.t);
  useEffect(()=>{let alive=true;if(!cv.current)return;drawRetro(cv.current,{monthLabel,count,items,dims:dimLabels}).then(()=>{if(alive)setImg(cv.current.toDataURL("image/png"))});return()=>{alive=false}},[off,sel.join("|"),count]);
  async function save(){
    if(!cv.current)return;const blob=await new Promise(r=>cv.current.toBlob(r,"image/png"));
    if(downloads&&blob){try{await downloads.save({filename:"retrospectiva-"+MONTHS_PT[m]+"-"+y+".png",data:blob});toast("Imagem pronta para postar");return}catch(e){if(e&&e.code==="declined")return;console.warn(e)}}

  }
  const toggle=id=>{const base=sel.slice();const i=base.indexOf(id);if(i>=0)base.splice(i,1);else if(base.length<5)base.push(id);else{toast("Escolha até 5 itens");return}setChosen(base)};

    <div class="grid g2" style=${{alignItems:"start"}}>
      <div>${candidates.length?html`<div class="eyebrow">O que mostrar (até 5)</div><div class="list">${candidates.map(c=>html`<label key=${c.id} class="item small row" style=${{gap:10,flexWrap:"nowrap",cursor:"pointer"}}><input type="checkbox" checked=${sel.includes(c.id)} onChange=${()=>toggle(c.id)}/><span style=${{flex:1}}>${c.t}<br/><span class="muted">${c.src}</span></span></label>`)}</div>`
        :html`<p class="banner info small">Ainda não há registros em ${monthLabel}. Faça a descoberta rápida ou um check-in com “três coisas boas” e volte aqui.</p>`}
        <div class="row" style=${{marginTop:14}}><button class="btn gold" onClick=${save} disabled=${!img}>Baixar imagem para o Instagram</button></div>
        <p class="small muted">Formato Stories (1080 × 1920). Se o download não abrir, toque e segure a imagem ao lado para salvar.</p></div>
      <div style=${{textAlign:"center"}}><canvas ref=${cv} style=${{display:"none"}}></canvas>${img?html`<img src=${img} alt=${"Retrospectiva de "+monthLabel} style=${{width:"100%",maxWidth:300,borderRadius:16,boxShadow:"var(--shadow)"}}/>`:html`<p class="muted">Preparando a imagem…</p>`}</div>

/* ============ APP ============ */
const NAV=[["inicio","Hoje",I.home],["sala","Investigar",I.sala],["mapa","Mapa",I.mapa],["eu","Eu",I.id]];
const ALIAS={apoio:"bemestar",dados:"perfil",sensacoes:"lembrancas",descobridor:"experiencias",identidade:"marca"};
const SHORT={inicio:"Início",sala:"Sala",dossie:"Dossiê",sensacoes:"Museu",mapa:"Mapa",descobridor:"Descobrir",apoio:"Apoio",identidade:"Marca",dados:"Dados"};
const VIEWS=NAV.map(n=>n[0]).concat(Object.keys(ALIAS));
function App(){
  const [state,setStateRaw]=useState(()=>{const l=lsGet();if(l&&validateImport(l).length===0){const c=limparRegistrosDeExemplo(l);if(c!==l)lsSet(c);return c}return seed()});
  const [view,setView]=useState(()=>{const h=(location.hash||"").slice(1);return VIEWS.includes(h)?h:"inicio"});
  const [viewOpts,setViewOpts]=useState({});
  const [save,setSave]=useState({mode:"pending",status:"loading"});
  const [toastMsg,setToastMsg]=useState(null);
  const [downloads,setDownloads]=useState(null);
  const [celebra,setCelebra]=useState(null);
  const [pvMenu,setPvMenu]=useState(false);const [pvFase,setPvFase]=useState(null);
  const dirty=useRef(false);const timer=useRef(null);const ready=useRef(false);const stateRef=useRef(state);
  stateRef.current=state;
  const toast=useCallback(m=>{setToastMsg(m);clearTimeout(toast.t);toast.t=setTimeout(()=>setToastMsg(null),2600)},[]);
  useEffect(()=>{document.documentElement.setAttribute("data-theme",state.settings.theme)},[state.settings.theme]);
  useEffect(()=>{const h=()=>{const v=(location.hash||"").slice(1);if(VIEWS.includes(v))setView(v)};window.addEventListener("hashchange",h);return()=>window.removeEventListener("hashchange",h)},[]);
  // init cloud
  useEffect(()=>{let alive=true;(async()=>{
    try{if(window.claude&&window.claude.use){window.claude.use("downloads").then(d=>{if(alive&&d)setDownloads(d)}).catch(()=>{})}}catch(e){}
    const hadLocal=!!lsGet();
    const r=await cloudInit();if(!alive)return;
    if(r&&r.ok){
      const cloud=r.data&&validateImport(r.data.payload).length===0?limparRegistrosDeExemplo(r.data.payload):null;
      if(r.data&&!cloud){Store.mode="local";lsSet(stateRef.current);setSave({mode:"local",status:"saved"})}
      else{Store.mode="cloud";const local=stateRef.current;
        if(cloud&&(!hadLocal||!local.updatedAt||new Date(cloud.updatedAt)>=new Date(local.updatedAt))){stateRef.current=cloud;setStateRaw(cloud);lsSet(cloud);setSave({mode:"cloud",status:"saved"})}
        else{setSave({mode:"cloud",status:"saving"});dirty.current=true;flush()}}
    }else{const okLocal=lsSet(stateRef.current);Store.mode=okLocal?"local":"none";setSave({mode:Store.mode,status:okLocal?"saved":"unsaved"})}
    ready.current=true;
  })();
  const bu=e=>{if(dirty.current){e.preventDefault();e.returnValue=""}};window.addEventListener("beforeunload",bu);
  return()=>{alive=false;window.removeEventListener("beforeunload",bu)}},[]);
  async function flush(){
    const st=stateRef.current;const okLocal=lsSet(st);
    if(Store.mode==="cloud"){setSave(x=>Object.assign({},x,{status:"saving"}));try{await cloudSave(st);dirty.current=false;setSave({mode:"cloud",status:"saved",at:nowISO()})}catch(e){console.warn(e);setSave({mode:"cloud",status:"error",at:null,local:okLocal})}}
    else{dirty.current=!okLocal;setSave({mode:okLocal?"local":"none",status:okLocal?"saved":"unsaved"})}
  }
  const schedule=()=>{dirty.current=true;setSave(x=>Object.assign({},x,{status:"dirty"}));clearTimeout(timer.current);timer.current=setTimeout(flush,900)};
  const update=useCallback((fn)=>{const n=clone(stateRef.current);const r=fn(n);if(r===false)return false;n.updatedAt=nowISO();stateRef.current=n;setStateRaw(n);schedule();return true},[]);
  const setState=useCallback((n)=>{n.updatedAt=nowISO();stateRef.current=n;setStateRaw(n);schedule()},[]);
  const go=(v,opts)=>{if(ALIAS[v]){opts=Object.assign({},opts||{},{sub:ALIAS[v]});v="eu"}setView(v);setViewOpts(opts||{});try{history.replaceState(null,"","#"+v)}catch(e){location.hash=v}window.scrollTo({top:0})};
  const resume=()=>{update(st=>{st.investigation.paused=false;st.investigation.resumedAt=nowISO()});go("sala")};
  const pause=()=>{update(st=>{st.investigation.paused=true;st.investigation.pausedAt=nowISO()});toast("Investigação pausada. Pode voltar quando quiser.")};
  const info=(()=>{const m=save.mode,st=save.status;
    if(st==="loading")return{dot:"",label:"Carregando seus dados…",mode:m};
    if(st==="dirty"||st==="saving")return{dot:"warn",label:"Alterações não salvas…",mode:m};
    if(st==="error")return{dot:"err",label:"Falha ao salvar na conta"+(save.local?" — cópia neste navegador":""),mode:m};
    if(m==="cloud")return{dot:"ok",label:"Salvo na sua conta (privado)",mode:m};
    if(m==="local")return{dot:"warn",label:"Salvo só neste navegador",mode:m};
    return{dot:"err",label:"Sem armazenamento — exporte um backup",mode:m}})();
  useEffect(()=>{const t=setInterval(()=>{if(document.querySelector(".modal-bg"))return;const st=stateRef.current;if(!st)return;
    const got=new Set((st.achievements||[]).map(a=>a.id));const nw=CONQ.find(c=>!got.has(c.id)&&c.ok(st));if(!nw)return;
    update(x=>{if(!Array.isArray(x.achievements))x.achievements=[];x.achievements.push({id:nw.id,at:nowISO()})},"conquista");if(!nw.silent)setCelebra(nw)},1500);return()=>clearInterval(t)},[]);
  const okConsent=!!(state&&state.consent&&state.consent.accepted&&state.consent.version>=CONSENT_VERSION);
  const okStats=okConsent&&!!state.consent.analytics;
  useEffect(()=>{if(okStats){window["ga-disable-"+GA_ID]=false;gaStart();gaEvent("app_aberto")}else gaStop()},[okStats]);
  useEffect(()=>{if(okStats)gaEvent("tela",{tela:String(view||"inicio")})},[view,okStats]);
  const props={s:state,update,toast,go,resume,pause};
  if(save.status==="loading")return html`<div style=${{minHeight:"100vh",display:"grid",placeItems:"center",textAlign:"center"}}><div><${LogoMark} size=${64}/><p class="muted" style=${{marginTop:12}}>Carregando seus dados com segurança…</p></div></div>`;
  const V0=ALIAS[view]?"eu":view;const V={inicio:Home,sala:Sala,mapa:Mapa,eu:Eu}[V0]||Home;const vopts=ALIAS[view]?{sub:ALIAS[view]}:viewOpts;
  return html`<div class="layout">
    <main class="main">
      <div class="topbar"><div class="row" style=${{gap:8}}><span class="mobile-only"></span><button class="status" style=${{cursor:"pointer"}} onClick=${()=>go("eu",{sub:"perfil"})} title="Ver detalhes do armazenamento"><span class=${"dot "+info.dot}></span>${info.label}</button></div>
        <div class="row"><button class="btn ghost small" onClick=${()=>update(st=>{st.settings.theme=st.settings.theme==="dark"?"light":"dark"})} aria-label="Alternar tema">${state.settings.theme==="dark"?"☀":"☾"}</button>
        <span class=${"chip "+(state.investigation.paused?"paused":"live")}>${state.investigation.paused?"⏸ PAUSADA":"● ATIVA"}</span></div></div>
      <nav class="toptabs" aria-label="Menu">${NAV.map(([k,l,d])=>html`<button key=${k} aria-current=${V0===k?"page":null} onClick=${()=>go(k)}><${Icon} d=${d}/><span>${l}</span></button>`)}</nav>
      <${V} key=${V0} ...${props} setState=${setState} saveInfo=${info} downloads=${downloads} initialAdd=${!!vopts.add} opts=${vopts}/>
    </main>
    ${toastMsg?html`<div class="toast" role="status">${toastMsg}</div>`:null}
    ${celebra?html`<${Celebra} s=${state} c=${celebra} onClose=${()=>setCelebra(null)}/>`:null}
    ${pvFase==="hall"?html`<${GuardiaoHall} s=${state} downloads=${downloads} toast=${toast} onClose=${()=>setPvFase(null)}/>`
      :pvFase!==null?html`<${NovoComeco} key=${"pv-"+pvFase} s=${state} update=${update} inicio=${pvFase}/>`
      :okConsent?(state.novoComeco&&state.novoComeco.concluidoEm?null:html`<${NovoComeco} s=${state} update=${update}/>`):html`<${ConsentGate} s=${state} update=${update}/>`}
    <${AtalhosPrevia} aberto=${pvMenu} setAberto=${setPvMenu} ir=${f=>{setPvMenu(false);if(f==="app"){pularTudo(update);setPvFase(null)}else setPvFase(f)}}/>
  </div>`;
}
