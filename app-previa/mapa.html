<script>/* ---------- estímulos sensoriais (sons feitos aqui, sem arquivos) ---------- */

function para(){if(TOCANDO){try{TOCANDO.g.gain.setTargetAtTime(0,AC.currentTime,.08);const n=TOCANDO.nodes;setTimeout(()=>n.forEach(x=>{try{x.stop&&x.stop();}catch(e){}}),400);}catch(e){}TOCANDO=null;document.querySelectorAll('.play.on').forEach(b=>{b.classList.remove('on');b.textContent='▶';});}}
function ruido(c,d){const b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;return s;}

 if(k==='mar'){const n=ruido(c,D),l=filt('lowpass',600),v=c.createGain();v.gain.setValueAtTime(.05,t);[0,2.5].forEach(o=>{v.gain.linearRampToValueAtTime(.45,t+o+1.4);v.gain.linearRampToValueAtTime(.06,t+o+2.5);});n.connect(l);l.connect(v);v.connect(g);n.start(t);N.push(n);}
 if(k==='passaros'){for(let i=0;i<14;i++){const s=t+Math.random()*(D-.4),o=c.createOscillator(),e=c.createGain();o.frequency.setValueAtTime(2600+Math.random()*800,s);o.frequency.exponentialRampToValueAtTime(4200+Math.random()*900,s+.08);o.frequency.exponentialRampToValueAtTime(3000,s+.16);e.gain.setValueAtTime(0,s);e.gain.linearRampToValueAtTime(.12,s+.02);e.gain.exponentialRampToValueAtTime(.001,s+.18);o.connect(e);e.connect(g);o.start(s);o.stop(s+.2);N.push(o);}}
 if(k==='piano'){[[261.6,0],[329.6,.5],[392,1],[523.3,1.5],[392,2.2],[329.6,2.7],[261.6,3.2]].forEach(([f,o])=>{N.push(tom(c,g,f,t+o,1.8,'triangle',.18));N.push(tom(c,g,f*2,t+o,1,'sine',.05));});}
 if(k==='violao'){[[196,0],[246.9,.35],[293.7,.7],[392,1.05],[293.7,1.6],[246.9,1.95],[196,2.5],[246.9,2.85]].forEach(([f,o])=>{const sr=c.sampleRate,p=Math.round(sr/f),b=c.createBuffer(1,sr*1.6,sr),x=b.getChannelData(0);for(let i=0;i<p;i++)x[i]=Math.random()*2-1;for(let i=p;i<x.length;i++)x[i]=.996*.5*(x[i-p]+x[i-p+1]);const s=c.createBufferSource(),v=c.createGain();v.gain.value=.35;s.buffer=b;s.connect(v);v.connect(g);s.start(t+o);N.push(s);});}

 if(k==='cafe'){const n=ruido(c,D),b=filt('bandpass',400,.8),v=c.createGain();v.gain.value=.08;n.connect(b);b.connect(v);v.connect(g);n.start(t);N.push(n);for(let i=0;i<28;i++){const s=t+Math.random()*D,o=c.createOscillator(),e=c.createGain();o.frequency.setValueAtTime(250+Math.random()*200,s);o.frequency.exponentialRampToValueAtTime(700+Math.random()*400,s+.06);e.gain.setValueAtTime(.12,s);e.gain.exponentialRampToValueAtTime(.001,s+.08);o.connect(e);e.connect(g);o.start(s);o.stop(s+.1);N.push(o);}}

 if(k==='vento'){const n=ruido(c,D),b=filt('bandpass',500,.6),v=c.createGain();v.gain.setValueAtTime(.05,t);for(let i=1;i<=5;i++){v.gain.linearRampToValueAtTime(.12+Math.random()*.35,t+i);b.frequency.linearRampToValueAtTime(300+Math.random()*700,t+i);}n.connect(b);b.connect(v);v.connect(g);n.start(t);N.push(n);}
 if(k==='fogueira'){const n=ruido(c,D),l=filt('lowpass',700),v=c.createGain();v.gain.value=.18;n.connect(l);l.connect(v);v.connect(g);n.start(t);N.push(n);for(let i=0;i<45;i++){const s=t+Math.random()*D,h=ruido(c,.03),hf=filt('highpass',1800),hv=c.createGain();hv.gain.value=.15+Math.random()*.3;h.connect(hf);hf.connect(hv);hv.connect(g);h.start(s);N.push(h);}}

 if(k==='grilos'){for(let i=0;i<9;i++)for(let j=0;j<3;j++)N.push(tom(c,g,4400+Math.random()*200,t+i*.55+j*.06+Math.random()*.05,.035,'sine',.07));}
 if(k==='riacho'){const n=ruido(c,D),b=filt('bandpass',1400,.5),v=c.createGain();v.gain.setValueAtTime(.15,t);for(let i=0;i<80;i++)v.gain.setValueAtTime(.08+Math.random()*.16,t+i*D/80);n.connect(b);b.connect(v);v.connect(g);n.start(t);N.push(n);for(let i=0;i<20;i++)N.push(tom(c,g,700+Math.random()*900,t+Math.random()*D,.07,'sine',.05));}
 if(k==='flauta'){[[523,0,.6],[587,.6,.6],[659,1.2,.9],[587,2.1,.5],[523,2.6,1.1],[440,3.7,1.2]].forEach(([f,o,d])=>{const x=c.createOscillator(),e=c.createGain(),l=c.createOscillator(),lg=c.createGain();x.frequency.value=f;l.frequency.value=5;lg.gain.value=f*.012;l.connect(lg);lg.connect(x.frequency);const s=t+o;e.gain.setValueAtTime(0,s);e.gain.linearRampToValueAtTime(.16,s+.08);e.gain.setValueAtTime(.16,s+d-.1);e.gain.linearRampToValueAtTime(0,s+d);x.connect(e);e.connect(g);x.start(s);l.start(s);x.stop(s+d+.05);l.stop(s+d+.05);N.push(x,l);});}

 if(k==='ronronar'){const n=ruido(c,D),l=filt('lowpass',260),v=c.createGain(),lfo=c.createOscillator(),lg=c.createGain();v.gain.value=.3;lfo.frequency.value=25;lg.gain.value=.28;lfo.connect(lg);lg.connect(v.gain);n.connect(l);l.connect(v);v.connect(g);n.start(t);lfo.start(t);lfo.stop(t+D);N.push(n,lfo);}
 if(k==='trovao'){const n=ruido(c,D),l=filt('lowpass',180),v=c.createGain();v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(.9,t+.5);v.gain.linearRampToValueAtTime(.35,t+1.6);v.gain.linearRampToValueAtTime(.7,t+2.2);v.gain.exponentialRampToValueAtTime(.01,t+4.8);n.connect(l);l.connect(v);v.connect(g);n.start(t);N.push(n);}
 if(k==='caixinha'){[[1047,0],[1319,.35],[1568,.7],[2093,1.05],[1976,1.6],[1568,1.95],[1319,2.3],[1568,2.65],[1047,3.2]].forEach(([f,o])=>{N.push(tom(c,g,f,t+o,1.1,'sine',.12));N.push(tom(c,g,f*3,t+o,.3,'sine',.02));});}
 TOCANDO={g,nodes:N};const dur=k==='coracao'?10:D;const me=TOCANDO;setTimeout(()=>{if(TOCANDO===me)para();},dur*1000+200);}</script>
<script>const C=['#FFD23F','#5AB8FF','#FF8A5C','#7DDB8B','#FF6FA3','#A98BFF','#3FE0D0'],W='#F4F1EA',cx=150,cy=150,R=Math.PI/180;

function cJunina(){let s=bg('#1E2A5A');for(let r=0;r<5;r++){const y=40+r*52;s+=`<path d="M0 ${y} Q150 ${y+22} 300 ${y}" fill="none" stroke="#C9B48E" stroke-width="1.5"/>`;for(let i=0;i<9;i++){const x=10+i*33,yy=y+22*Math.sin(Math.PI*x/300)*.9;s+=`<path d="M${x} ${yy} l26 0 l-13 26z" fill="${A[(i+r*2)%7]}"/>`;}}return s;}

function cFogos(){let s=bg('#0E0F26');for(let k=0;k<7;k++){const [x,y]=pt(k?88:0,k);for(let j=0;j<14;j++){const a=j/14*6.28,r1=8,r2=34;s+=`<line x1="${x+r1*Math.cos(a)}" y1="${y+r1*Math.sin(a)}" x2="${x+r2*Math.cos(a)}" y2="${y+r2*Math.sin(a)}" stroke="${A[k]}" stroke-width="2.5" stroke-linecap="round"/><circle cx="${x+(r2+5)*Math.cos(a)}" cy="${y+(r2+5)*Math.sin(a)}" r="2" fill="${A[k]}"/>`;}}return s;}

function hueQuente(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx-mn<.08)return null;let h;if(mx===r)h=((g-b)/(mx-mn))%6;else if(mx===g)h=(b-r)/(mx-mn)+2;else h=(r-g)/(mx-mn)+4;h=(h*60+360)%360;return h<70||h>300;}

   - um mini-jogo diferente em cada sentido, e a ordem sai sozinha: duelos (Visão), só ouvindo (Audição),

   - antes de cada sentido: "Na Fase 1, a sua nº 1 era X. Ainda é?". Se acertar: festa "Você se conhece bem!".
   - cada toque: imagem + som + vibração. 1 segundo de brilho antes de cada revelação. Celebração ao fim de cada sentido.
   - cada sentido revela algo de um jeito diferente.
   - álbum com 7 espaços: cada sentido dá 1 pedaço da pintura. "Falta só 1!" no último. Surpresa no 4º sentido.
   - rápido dentro do sentido, calmo entre eles (uma respiração com música, dá para pular).

function dIni(itens){const f=itens.slice();const G={tipo:'duelo',ord:[f.shift()],fila:f,cur:null,lo:0,hi:0,n:0};dProx(G);return G;}
function dProx(G){if(!G.fila.length){G.cur=null;return;}G.cur=G.fila.shift();G.lo=0;G.hi=G.ord.length;}
function dPar(G){if(G.cur==null)return null;const mid=(G.lo+G.hi)>>1;return [G.cur,G.ord[mid],mid];}
function dEscolhe(G,v){const p=dPar(G);if(!p)return;G.n++;if(v===p[0])G.hi=p[2];else G.lo=p[2]+1;if(G.lo>=G.hi){G.ord.splice(G.lo,0,p[0]);dProx(G);}}

function embaralha(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

 const err=embaralha(meus).slice(0,nMeus).concat(embaralha(outros)).slice(0,5);

function hash7(t){let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0)||7;}
