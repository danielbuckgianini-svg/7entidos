<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7entidos — A vida é feita de boas sensações.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --violet:#342052;--purple:#7954C7;--lavender:#BDA8EB;--lilac:#F4EFFC;--gold:#E5BC74;--gold-ink:#8A6420;--white:#fff;--ink:#251D31;
  --bg:#FBF9FE;--surface:#FFFFFF;--surface-2:#F4EFFC;--line:#E6DDF5;--muted:#6A5F7C;--text:#251D31;--accent:#7954C7;--accent-ink:#5B3BA6;
  --fact:#7954C7;--hyp:#BDA8EB;--unk:#B7B0C2;--danger:#B3364A;--ok:#2E7D5B;
  --radius:18px;--shadow:0 1px 2px rgba(52,32,82,.06),0 8px 24px rgba(52,32,82,.07);
  --serif:'Fraunces',Georgia,serif;--sans:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;
}
[data-theme="dark"]{
  --bg:#17111F;--surface:#221A2E;--surface-2:#2B2140;--line:#3A2E52;--muted:#B5A9C8;--text:#F4EFFC;--accent:#BDA8EB;--accent-ink:#D9CCF6;
  --fact:#BDA8EB;--hyp:#7954C7;--unk:#6E6580;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--gold-ink:#E5BC74;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0 0 .4em;line-height:1.2}
h1{font-size:2rem}h2{font-size:1.45rem}h3{font-size:1.1rem}
p{margin:0 0 .8em}
a{color:var(--accent-ink)}
.layout{display:flex;min-height:100vh}
.side{width:248px;flex:none;padding:22px 16px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand b{font-family:var(--serif);font-size:1.12rem;letter-spacing:.04em;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.76rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;color:var(--muted);font-weight:600;font-size:.93rem}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button[aria-current="page"]{background:var(--surface-2);color:var(--accent-ink)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.main{flex:1;min-width:0;padding:26px clamp(16px,4vw,44px) 110px;max-width:1180px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:5px 11px;border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--unk)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--gold)}.dot.err{background:var(--danger)}
.bottomnav{display:none}
@media (max-width:860px){
  .side{display:none}
  .main{padding-top:16px}
  .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);overflow-x:auto;z-index:20;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottomnav button{all:unset;cursor:pointer;flex:1 0 auto;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;font-weight:600;color:var(--muted);padding:4px 6px;border-radius:10px}
  .bottomnav button[aria-current="page"]{color:var(--accent-ink);background:var(--surface-2)}
  .bottomnav svg{width:20px;height:20px}
  h1{font-size:1.6rem}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:12px;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:8px;transition:transform .12s ease,background .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.primary:hover{background:#6A45B8}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.fact{background:color-mix(in srgb,var(--fact) 16%,transparent);color:var(--accent-ink);border-color:color-mix(in srgb,var(--fact) 40%,transparent)}
.chip.hyp{background:transparent;color:var(--accent-ink);border:1.5px dashed var(--hyp)}
.chip.unk{background:transparent;color:var(--muted);border:1.5px dotted var(--unk)}
.chip.gold{background:color-mix(in srgb,var(--gold) 25%,transparent);color:var(--gold-ink);border-color:color-mix(in srgb,var(--gold) 60%,transparent)}
.chip.paused{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold-ink);border-color:var(--gold)}
.chip.live{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.hero{position:relative;overflow:hidden;background:linear-gradient(140deg,#342052 0%,#4A2E78 100%);color:#fff;border:none}
.hero h1{color:#fff}
.hero .muted{color:#D9CCF6}
.hero .stars{position:absolute;right:-30px;top:-20px;opacity:.35;pointer-events:none}
.stat{font-family:var(--serif);font-size:2rem;font-weight:600;line-height:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;font-size:.9rem;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent-ink);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
label.f{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin:12px 0 5px}
input.i,textarea.i,select.i{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none}
input.i:focus,textarea.i:focus,select.i:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
textarea.i{min-height:88px;resize:vertical}
.opt{all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;padding:13px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--lavender)}
.opt[aria-checked="true"]{border-color:var(--purple);background:color-mix(in srgb,var(--purple) 9%,var(--surface))}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt b{font-weight:700}
.opt .k{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--surface-2);font-weight:800;font-size:.82rem;margin-right:10px;color:var(--accent-ink)}
.opt[aria-checked="true"] .k{background:var(--purple);color:#fff}
.quote{border-left:3px solid var(--gold);padding:6px 0 6px 14px;font-family:var(--serif);font-style:italic}
.list{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface)}
.item.gap{background:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--unk) 10%,transparent) 10px 20px);border-style:dashed}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem}
.memcard{all:unset;cursor:pointer;display:flex;flex-direction:column;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);transition:transform .15s}
.memcard:hover{transform:translateY(-2px)}
.memcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.memart{height:118px;position:relative}
.memart .tag{position:absolute;left:10px;top:10px}
.memcard .body{padding:14px 16px}
.blur{filter:blur(6px);user-select:none}
.modal-bg{position:fixed;inset:0;background:rgba(23,17,31,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:22px;max-width:680px;width:100%;max-height:90vh;overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.banner{border-radius:14px;padding:12px 16px;background:color-mix(in srgb,var(--gold) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);font-size:.9rem}
.banner.info{background:var(--surface-2);border-color:var(--line)}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--lavender),var(--purple))}
.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 14px;font-size:.92rem}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0}
@media (max-width:520px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin:0 0 8px}}
.toast{pointer-events:none;position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--violet);color:#fff;padding:10px 18px;border-radius:12px;z-index:60;font-weight:600;font-size:.9rem;box-shadow:var(--shadow)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mapwrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px}
@media (max-width:960px){.mapwrap{grid-template-columns:1fr}}
.mapnode{cursor:pointer}
.mapnode:focus{outline:none}
.mapnode:focus-visible circle.ring{stroke:var(--gold);stroke-width:3}
.swatch{height:64px;border-radius:12px;border:1px solid var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.range{width:100%;accent-color:var(--purple)}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px}
.bars i{flex:1;background:var(--lavender);border-radius:6px 6px 2px 2px;min-height:3px}

/* ===== 7entidos · War Room 1º/11: grafite e luz (D09), base clara editorial com toques imersivos (D01), linguagem direta ===== */
:root{
  --ink:#1d1d1b;--text:#1d1d1b;--bg:#f4f3ef;--surface:#ffffff;--surface-2:#ecebe5;--line:#dedcd3;--muted:#5e5c55;
  --purple:#1d1d1b;--accent:#1d1d1b;--accent-ink:#1d1d1b;--on-primary:#f4f3ef;--lavender:#c9c4b5;--lilac:#ecebe5;
  --gold:#c99400;--gold-ink:#7a5a00;--fact:#1d1d1b;--hyp:#8a8578;--unk:#b9b5aa;
  --radius:14px;--shadow:0 1px 2px rgba(29,29,27,.05);
  --serif:'Instrument Serif',Georgia,serif;--sans:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;
}
[data-theme="dark"]{
  --ink:#ecebe6;--text:#ecebe6;--bg:#141413;--surface:#1e1e1c;--surface-2:#2a2a27;--line:#34332f;--muted:#a8a69e;
  --purple:#ecebe6;--accent:#f0c23a;--accent-ink:#f0c23a;--on-primary:#141413;--lavender:#4a4843;
  --gold:#f0c23a;--gold-ink:#f0c23a;--fact:#ecebe6;--hyp:#a8a69e;--unk:#5e5c55;--shadow:none;color-scheme:dark;
}
html,body{font-size:17.5px;background:var(--bg);color:var(--text)}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.005em;line-height:1.1;text-wrap:balance}
h1{font-size:2.5rem}h2{font-size:1.75rem}h3{font-size:1.35rem}
.layout{display:block}.main{margin:0 auto;max-width:1040px;padding:16px max(16px,env(safe-area-inset-left,0px)) 64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.item{border-radius:12px;background:var(--surface)}
.grid{gap:18px}
.btn{border-radius:999px;padding:10px 18px}
.btn.primary{background:var(--purple);border-color:var(--purple);color:var(--on-primary)}
.btn.primary:hover{background:var(--purple);opacity:.88}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1d1d1b}
.btn.light{background:#f4f3ef;border-color:#f4f3ef;color:#1d1d1b}
.btn.light:hover{background:#fff}
.opt{border-radius:12px;border-width:1px}
.opt:hover{border-color:var(--muted)}
.opt[aria-checked="true"]{border-color:var(--purple);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--purple)}
.opt .k{background:var(--surface-2);color:var(--text)}
.opt[aria-checked="true"] .k{background:var(--purple);color:var(--on-primary)}
.chip.fact{background:var(--surface-2);color:var(--text);border-color:var(--line)}
.chip.hyp{color:var(--text);border-color:var(--hyp)}
.chip.gold{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold-ink);border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.chip.live{background:var(--surface-2);color:var(--text);border-color:var(--line)}
.tabs button[aria-selected="true"]{color:var(--text);border-color:var(--gold)}
.banner{background:color-mix(in srgb,var(--gold) 10%,var(--surface));border-color:color-mix(in srgb,var(--gold) 35%,transparent)}
.modal{border-radius:18px}
.eyebrow{letter-spacing:.14em;font-weight:600}
/* topo e jornada */
.topbar{margin-bottom:14px;gap:10px}
.brandrow{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem}
.status{padding:6px 10px}
.you{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:3px 12px 3px 3px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;font-size:.85rem}
.you[aria-current="page"]{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.you:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:620px){.st-label{display:none}.status{padding:8px}}
.toptabs{display:flex;gap:4px;margin:0 0 22px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:15}
.toptabs button{all:unset;cursor:pointer;flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 6px;border-radius:12px;font-weight:600;font-size:.92rem;color:var(--muted)}
.toptabs button .n{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:.72rem;font-weight:700}
.toptabs button[aria-current="page"]{background:var(--text);color:var(--bg)}
.toptabs button:focus-visible{outline:2px solid var(--gold)}
@media (max-width:520px){.toptabs button{flex-direction:column;gap:3px;font-size:.78rem;padding:8px 2px}}
.subtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:18px;padding-bottom:4px}
.subtabs button{all:unset;cursor:pointer;white-space:nowrap;padding:8px 15px;border-radius:999px;font-weight:600;font-size:.88rem;border:1px solid var(--line);background:var(--surface)}
.subtabs button[aria-selected="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.subtabs button:focus-visible{outline:2px solid var(--gold)}
/* tela inicial (painel pessoal) */
.home{display:grid;gap:18px}
.home-head h1{font-size:2.9rem;margin:4px 0 6px}
.home-head .frase{font-family:var(--serif);font-style:italic;font-size:1.45rem;line-height:1.3;color:var(--muted);margin:0;max-width:34ch}
.words{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.words{grid-template-columns:1fr 1fr}}
.opt.word{text-align:center;font-weight:600;padding:13px 6px}
.hero.discovery{position:relative;overflow:hidden;border-radius:18px;padding:28px 24px;background:#141316;color:#f2efe8;border:0;min-height:230px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px}
.hero.discovery .aura{position:absolute;inset:-35%;background:radial-gradient(38% 34% at 28% 30%,rgba(231,150,80,.65),transparent 70%),radial-gradient(34% 32% at 72% 48%,rgba(120,95,200,.5),transparent 70%),radial-gradient(36% 32% at 45% 78%,rgba(60,150,150,.35),transparent 70%);filter:blur(30px);animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) rotate(8deg) scale(1.06)}}
@media (prefers-reduced-motion:reduce){.hero.discovery .aura{animation:none}}
.hero.discovery>*{position:relative}
.hero.discovery h2{color:#f2efe8;font-size:2rem;margin:0;max-width:24ch}
.hero.discovery .btn{align-self:flex-start}
.hero.discovery .last{margin:4px 0 0;font-size:.9rem;color:rgba(242,239,232,.82)}
.dark-card{background:#141316;color:#f2efe8;border-color:#141316}
.dark-card b{font-size:1rem}
.tiles{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.tile{all:unset;cursor:pointer;flex:none;width:128px;height:138px;border-radius:12px;padding:10px;box-sizing:border-box;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;font-weight:700;font-size:.82rem;line-height:1.25}
.tile small{font-weight:500;opacity:.85;font-size:.72rem;margin-top:3px}
.tile:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 0;border-top:1px solid var(--line)}
.row-line:first-child{border-top:0}
.row-line b{flex:1 1 220px}
.card.quiet{padding-top:8px;padding-bottom:8px}
/* memórias em linha do tempo */
.timeline{margin-top:10px}
.tl-year{position:relative;padding-left:26px;margin-bottom:8px}
.tl-year:before{content:"";position:absolute;left:8px;top:8px;bottom:0;width:2px;background:var(--line)}
.tl-year h2{font-size:1.5rem;margin:6px 0 10px}
.tl-ev{all:unset;cursor:pointer;position:relative;display:flex;align-items:flex-start;gap:12px;width:100%;box-sizing:border-box;padding:10px 12px;margin:0 0 6px -12px;border-radius:12px}
.tl-ev:hover{background:var(--surface)}
.tl-ev:focus-visible{outline:2px solid var(--gold)}
.tl-dot{position:absolute;left:-23px;top:15px;width:14px;height:14px;border-radius:50%;background:var(--c);border:2px solid var(--bg)}
.tl-ev b{display:block;font-family:var(--serif);font-weight:400;font-size:1.3rem;line-height:1.15}
.tl-ev small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
/* constelação */
.const-card{background:#0f0e12;border-color:#0f0e12}
.lg{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:2px}
.lg.fato{background:#f0c23a}.lg.palpite{border:2px solid var(--text);width:6px;height:6px}.lg.nada{background:var(--unk)}.lg.pista{border:2px dashed #c99400;width:6px;height:6px}
.chapters{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.chapter{border-radius:16px;padding:18px;color:#f2efe8}
.chapter h3{color:#f2efe8;margin:2px 0 6px;font-size:1.5rem}
.chapter p{margin:0;font-size:.9rem;opacity:.9}
.exp-card h3{margin:0 0 8px}
.regua-card{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.regua-mini{display:flex;gap:4px;margin:0 0 14px}.regua-mini i{flex:1;font-style:normal;text-align:center;font-size:.72rem;font-weight:700;padding:5px 0;border-radius:6px;background:var(--surface-2);color:var(--muted)}

/* ===== Novo Começo · grafite e amarelo ===== */
.nc{position:fixed;inset:0;z-index:55;background:#141413;color:#ecebe6;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(12px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));color-scheme:dark}

/* ===== 7entidos · Nova identidade (2/11): noite, luz por trás, anel de sete luzes ===== */
:root{--serif:'Fraunces',Georgia,serif;--sans:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif}

  --ink:#F4F4F4;--text:#F4F4F4;--bg:#111113;--surface:#1a1a1c;--surface-2:#2C2C2C;--line:#2f2f33;--muted:#C4C4C4;

  --gold:#FFD43B;--gold-ink:#FFD43B;--fact:#F4F4F4;--hyp:#C4C4C4;--unk:#5e5c55;--shadow:none;color-scheme:dark;
}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
em.y{font-style:normal;color:var(--gold)}

.an-d{animation:an-in .7s cubic-bezier(.2,.7,.2,1) both}
.an-draw{animation:an-draw 1.6s ease-out .6s forwards}

function getQuestion(n,state){
  if(state.questions&&state.questions[n])return Object.assign({n},state.questions[n]);
  if(state.questionMode==="external")return null;
  if(n===20)return Q20;
  if(n===21){
    const ev=state.evidences.find(e=>e.questionNumber===20&&e.status==="registrada");
    const k=ev&&ev.selectedOptions[0]&&ev.selectedOptions[0].k;
    const v=k==="C"?"seek":k==="D"?"drop":k==="F"?"vary":"calm";
    return Object.assign({n:21,source:"Banco local de perguntas da Gianini (adaptada à resposta da Pergunta 20)"},Q21[v]);
  }
  if(BANK[n])return Object.assign({n,source:"Banco local de perguntas da Gianini"},BANK[n]);
  return null;
}

const vstr=(v)=>v.major+"."+v.minor;
const bumpVersion=(v)=>{v.minor+=1;if(v.minor>9){v.major+=1;v.minor=0}return v};
const vnum=(v)=>v.major*100+v.minor;
const HAS_CONTENT=["recuperada","registrada","sincronizada"];

/* ============ PERSISTENCE ============ */
const Store={db:null,uid:null,mode:"none"};
function lsGet(){try{const s=localStorage.getItem(LS_KEY);return s?JSON.parse(s):null}catch(e){return null}}
function lsSet(obj){try{localStorage.setItem(LS_KEY,JSON.stringify(obj));return true}catch(e){return false}}
function snapData(r){if(!r)return null;if(typeof r.data==="function")return r.data();if(r.exists===false)return null;return r}
async function cloudInit(){
  try{
    if(!window.claude||typeof window.claude.use!=="function")return null;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return null;
    const id=await user.id();if(!id)return null;
    Store.db=db;Store.uid=id;
    const ref=db.collection("data/users/"+id).doc("gianini");
    const r=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),10000))]);
    const d=snapData(r);
    return {ok:true,data:d&&d.payload?{payload:JSON.parse(d.payload),savedAt:d.savedAt}:null};
  }catch(e){console.warn("cloud init",e);return {ok:false,error:String(e&&e.message||e)}}
}
async function cloudSave(state){
  if(!Store.db||!Store.uid)throw new Error("sem nuvem");
  const ref=Store.db.collection("data/users/"+Store.uid).doc("gianini");
  await ref.set({payload:JSON.stringify(state),savedAt:state.updatedAt});
}

const LS_SNAP="app-gianini-snapshot-v1";
async function saveSnapshot(state,reason){
  const snap={payload:JSON.stringify(state),savedAt:nowISO(),reason,version:vstr(state.dossier.version)};
  let ok=false;
  try{localStorage.setItem(LS_SNAP,JSON.stringify(snap));ok=true}catch(e){}
  if(Store.db&&Store.uid){try{await Store.db.collection("data/users/"+Store.uid).doc("gianini-snapshot").set(snap);ok=true}catch(e){console.warn("snapshot",e)}}
  return ok;
}
async function loadSnapshot(){
  if(Store.db&&Store.uid){try{const d=snapData(await Store.db.collection("data/users/"+Store.uid).doc("gianini-snapshot").get());if(d&&d.payload)return d}catch(e){}}
  try{const x=localStorage.getItem(LS_SNAP);if(x)return JSON.parse(x)}catch(e){}
  return null;
}

/* ============ INTEGRIDADE ============ */
function verifyIntegrity(s){
  const C=[];const add=(ok,label,detail)=>C.push({ok,label,detail:detail||""});
  const ids=s.evidences.map(e=>e.id);const idset=new Set(ids);
  add(idset.size===ids.length,"Evidências sem números repetidos",ids.length+" registros");
  const last=parseInt(s.investigation.lastEvidence,10);const missing=[];
  for(let i=1;i<=last;i++)if(!idset.has(pad3(i)))missing.push(pad3(i));
  add(missing.length===0,"Evidências 001–"+s.investigation.lastEvidence+" completas, sem saltos",missing.length?"Faltando: "+missing.join(", "):"");
  const after=s.evidences.filter(e=>parseInt(e.id,10)>last&&hasContent(e)).map(e=>e.id);
  add(after.length===0,"Nenhuma resposta registrada depois da última evidência concluída",after.join(", "));
  const notDone=s.evidences.filter(e=>parseInt(e.id,10)<=last&&parseInt(e.id,10)>33&&!hasContent(e)).map(e=>e.id);
  add(notDone.length===0,"Evidências 034–"+s.investigation.lastEvidence+" com conteúdo",notDone.join(", "));
  add(s.investigation.nextEvidence===pad3(last+1),"Próxima evidência é "+pad3(last+1),"Atual: "+s.investigation.nextEvidence);
  const badFacts=s.dossier.confirmedFacts.filter(f=>f.sourceEvidenceIds.some(x=>!idset.has(x))).map(f=>f.id);
  const fids=s.dossier.confirmedFacts.map(f=>f.id);
  add(badFacts.length===0&&new Set(fids).size===fids.length,"Todos os fatos apontam para evidências existentes e não se repetem",badFacts.join(", "));
  const hids=s.hypotheses.map(h=>h.id);const badH=s.hypotheses.filter(h=>[...h.supportingEvidenceIds,...(h.relatedEvidenceIds||[]),...h.contradictoryEvidenceIds].some(x=>!idset.has(x))).map(h=>h.id);
  add(new Set(hids).size===hids.length&&badH.length===0,"Hipóteses com números únicos e evidências existentes",badH.join(", "));
  const uids=s.dossier.unknowns.map(u=>u.id);const badU=s.dossier.unknowns.filter(u=>u.resolvedBy&&!idset.has(u.resolvedBy)).map(u=>u.id);
  add(new Set(uids).size===uids.length&&badU.length===0,"Desconhecidos com números únicos",badU.join(", "));
  const hset=new Set(hids);const badD=s.dims.filter(d=>d.evidence.some(x=>!idset.has(x))||d.hyps.some(x=>!hset.has(x))).map(d=>d.label);
  add(badD.length===0,"Mapa da Felicidade aponta só para evidências e hipóteses existentes",badD.join(", "));
  const rids=s.dossier.requirements.map(r=>r.id);add(new Set(rids).size===rids.length,"Requisitos sem repetição",rids.length+" requisitos");
  return C;
}

/* ============ PACOTE DE SINCRONIZAÇÃO ============ */
function validatePack(pack,s){
  const E=[];
  if(!pack||pack.app!=="APP GIANINI"||pack.kind!=="sync-pack")return["Este arquivo não é um pacote de sincronização do 7entidos."];
  if(typeof pack.packId!=="string"||!pack.packId)E.push("Pacote sem identificação.");
  ["evidences","facts","hypotheses","hypothesisLinks","resolveUnknowns","unknowns","requirements","dims","dimLinks","changeHistory"].forEach(k=>{if(!Array.isArray(pack[k]))E.push("Parte '"+k+"' ausente no pacote.")});
  if(!pack.requires||!pack.investigation||!pack.dossierVersion)E.push("Pacote incompleto (requisitos de estado).");
  if(E.length)return E;
  if((s.appliedPacks||[]).some(x=>x.packId===pack.packId))return["Este pacote já foi aplicado antes. Nada será duplicado."];
  if(vstr(s.dossier.version)!==pack.requires.version)E.push("O app está no Dossiê v"+vstr(s.dossier.version)+", mas o pacote exige v"+pack.requires.version+".");
  if(s.investigation.lastEvidence!==pack.requires.lastEvidence)E.push("A última evidência do app é "+s.investigation.lastEvidence+", mas o pacote exige "+pack.requires.lastEvidence+".");
  if(s.investigation.currentQuestion!==pack.requires.currentQuestion)E.push("O app está na Pergunta "+s.investigation.currentQuestion+", mas o pacote exige a Pergunta "+pack.requires.currentQuestion+".");
  let expect=parseInt(pack.requires.lastEvidence,10)+1;
  pack.evidences.forEach(pe=>{

  pack.facts.forEach(f=>{if(s.dossier.confirmedFacts.some(x=>x.id===f.id))E.push("Fato "+f.id+" já existe.");if(f.sourceEvidenceIds.some(x=>!allEv.has(x)))E.push("Fato "+f.id+" aponta para evidência inexistente.")});
  pack.hypotheses.forEach(h=>{if(s.hypotheses.some(x=>x.id===h.id))E.push("Hipótese "+h.id+" já existe no app (conflito de numeração).")});
  const allH=new Set([...s.hypotheses.map(h=>h.id),...pack.hypotheses.map(h=>h.id)]);
  pack.hypothesisLinks.forEach(l=>{if(!s.hypotheses.some(x=>x.id===l.hypothesisId))E.push("Vínculo para hipótese inexistente "+l.hypothesisId+".");if(!packEv.has(l.evidenceId))E.push("Vínculo com evidência fora do pacote: "+l.evidenceId+".")});
  pack.resolveUnknowns.forEach(r=>{const u=s.dossier.unknowns.find(x=>x.id===r.id);if(!u)E.push("Desconhecido "+r.id+" não existe.");else if(u.status!=="aberta")E.push("Desconhecido "+r.id+" já estava resolvido.")});
  pack.unknowns.forEach(u=>{if(s.dossier.unknowns.some(x=>x.id===u.id))E.push("Desconhecido "+u.id+" já existe (conflito de numeração).")});
  pack.requirements.forEach(r=>{if(s.dossier.requirements.some(x=>x.id===r.id))E.push("Requisito "+r.id+" já existe.")});
  pack.dims.forEach(d=>{if(s.dims.some(x=>x.key===d.key))E.push("Dimensão do mapa '"+d.key+"' já existe.");d.hyps.forEach(h=>{if(!allH.has(h))E.push("Dimensão '"+d.key+"' cita hipótese inexistente "+h+".")})});

function applyPack(s,pack){

  pack.dimLinks.forEach(l=>{const d=st.dims.find(x=>x.key===l.key);(l.evidence||[]).forEach(e=>{if(!d.evidence.includes(e))d.evidence.push(e)});(l.hyps||[]).forEach(h=>{if(!d.hyps.includes(h))d.hyps.push(h)})});

  st.dossier.changeHistory.push({version:vstr(pack.dossierVersion),at,text:"Sincronização aplicada no APP GIANINI (pacote “"+pack.packId+"”). Dados anteriores preservados; cópia automática guardada antes da importação."});
  if(pack.questions){st.questions=Object.assign({},st.questions||{},pack.questions)}
  if(pack.questionMode)st.questionMode=pack.questionMode;

/* ============ PACOTE DE JORNADA ============ */
function journeyOwned(j){return j.ownedQuestions||[].concat(...j.stations.map(x=>x.questions)).filter(n=>n>j.startQuestion)}
function validateJourneyPack(pack,s){
  const E=[];
  if(!pack||pack.app!=="APP GIANINI"||pack.kind!=="journey-pack")return["Este arquivo não é um pacote de jornada do 7entidos."];
  if(!pack.packId||!pack.journey||!Array.isArray(pack.journey.stations)||!pack.questions)return["Pacote de jornada incompleto."];
  if((s.appliedPacks||[]).some(x=>x.packId===pack.packId))return["Esta jornada já foi carregada antes. Nada será duplicado."];
  const old=(s.journeys||[]).find(j=>j.id===pack.journey.id);
  let owned=[];
  if(old){owned=journeyOwned(old);
    if(s.evidences.some(e=>owned.includes(e.questionNumber)&&hasContent(e)))return["Você já começou a responder a "+old.title+". A parte nova vai entrar numa próxima investigação — nada foi alterado."];}
  const sQ=Object.assign({},s.questions||{});owned.forEach(n=>{delete sQ[n]});
  const nums=[].concat(...pack.journey.stations.map(st=>st.questions||[]));
  if(!nums.length)return["A jornada não tem perguntas."];
  nums.forEach((n,i)=>{if(n!==nums[0]+i)E.push("Numeração da jornada fora de ordem na pergunta "+n+".")});
  const packNums=Object.keys(pack.questions).map(Number);const firstOwn=Math.min(...packNums);
  const cur=s.investigation.currentQuestion;
  if(cur<nums[0]||cur>firstOwn)E.push("O app está na Pergunta "+cur+"; esta jornada foi preparada para começar entre as Perguntas "+nums[0]+" e "+firstOwn+".");
  nums.filter(n=>n<cur).forEach(n=>{if(!s.evidences.some(e=>e.questionNumber===n&&hasContent(e)))E.push("A Pergunta "+n+" ainda não foi respondida.")});
  const dimKeys=new Set([...s.dims.map(d=>d.key),...(pack.dims||[]).map(d=>d.key)]);
  nums.forEach(n=>{
    const inState=sQ[n];const inPack=pack.questions[n];
    if(inState&&inPack)E.push("A Pergunta "+n+" já existe no app; a jornada não pode substituí-la.");
    if(!inState&&!inPack)E.push("A Pergunta "+n+" não existe nem no app nem na jornada.");
    if(inPack&&s.evidences.some(e=>e.questionNumber===n&&hasContent(e)))E.push("A Pergunta "+n+" já foi respondida.");
    const q=inPack;if(q){
      const t=q.type||"single";if(!Q_TYPES.includes(t))E.push("Pergunta "+n+": tipo desconhecido.");
      if(!q.text)E.push("Pergunta "+n+" sem texto.");
      if(["single","multi","photo"].includes(t)&&(!Array.isArray(q.options)||q.options.length<2))E.push("Pergunta "+n+" precisa de pelo menos 2 alternativas.");
      if(q.dim&&!dimKeys.has(q.dim))E.push("Pergunta "+n+" aponta para dimensão inexistente '"+q.dim+"'.");
      (q.options||[]).forEach(o=>(o.hyps||[]).forEach(h=>{if(!s.hypotheses.some(x=>x.id===h))E.push("Pergunta "+n+" cita hipótese inexistente "+h+".")}));
    }});
  packNums.forEach(k=>{if(!nums.includes(k))E.push("A Pergunta "+k+" não pertence a nenhuma estação.")});
  return E;
}
function applyJourneyPack(s,pack){
  const errs=validateJourneyPack(pack,s);if(errs.length)return{errors:errs};
  const st=clone(s);const at=nowISO();
  st.questions=Object.assign({},st.questions||{});
  const old=(st.journeys||[]).find(j=>j.id===pack.journey.id);
  if(old){journeyOwned(old).forEach(n=>{delete st.questions[n]});st.journeys=st.journeys.filter(j=>j!==old)}
  Object.keys(pack.questions).forEach(k=>{st.questions[k]=Object.assign({source:pack.source||"Jornada"},pack.questions[k])});
  (pack.dims||[]).forEach(d=>{if(!st.dims.some(x=>x.key===d.key))st.dims.push({key:d.key,label:d.label,evidence:[],hyps:d.hyps||[],group:d.group||"Outros"})});
  const nums=[].concat(...pack.journey.stations.map(x=>x.questions));
  st.journeys=(st.journeys||[]).concat([Object.assign({},pack.journey,{startQuestion:nums[0],endQuestion:nums[nums.length-1],ownedQuestions:Object.keys(pack.questions).map(Number),loadedAt:at})]);
  st.questionMode="external";
  st.dossier.changeHistory.push({version:vstr(st.dossier.version),at,text:"Jornada “"+pack.journey.title+"” carregada (Perguntas "+nums[0]+"–"+nums[nums.length-1]+")"+(old?", substituindo a versão anterior ainda não iniciada":"")+". Nenhuma resposta foi registrada; a investigação continua pausada."});
  st.appliedPacks=(st.appliedPacks||[]).concat([{packId:pack.packId,appliedAt:at,source:pack.source||null}]);
  const checks=verifyIntegrity(st);const failed=checks.filter(c=>!c.ok);
  if(failed.length)return{errors:failed.map(c=>"Falha na verificação: "+c.label)};
  if(st.evidences.length!==s.evidences.length||st.memories.length!==s.memories.length||vstr(st.dossier.version)!==vstr(s.dossier.version))return{errors:["A jornada tentaria alterar evidências, lembranças ou a versão do Dossiê — bloqueado."]};
  return{state:st,checks};
}

function validateImport(obj){
  const errs=[];
  if(!obj||typeof obj!=="object")return["O arquivo não contém um objeto JSON."];
  if(obj.app!=="APP GIANINI")errs.push("O arquivo não parece ser um backup do 7entidos (campo 'app').");
  if(typeof obj.schemaVersion!=="number")errs.push("Versão de esquema ausente.");
  else if(obj.schemaVersion>SCHEMA)errs.push("Backup criado por uma versão mais nova do app.");
  ["evidences","memories","hypotheses","dims"].forEach(k=>{if(!Array.isArray(obj[k]))errs.push("Lista '"+k+"' ausente ou inválida.")});
  if(!obj.dossier||!obj.dossier.version)errs.push("Dossiê ausente.");

function MemArt({m}){

function ReguaPerfil({s,update,toast}){const [open,setOpen]=useState(false);const f=reguaFeitas(s);

/* ---- raspadinha da descoberta ---- */
function Raspadinha({children}){
  const ref=useRef(null);const [aberto,setAberto]=useState(false);
  useEffect(()=>{const c=ref.current;if(!c)return;const w=c.offsetWidth,h=c.offsetHeight;c.width=w;c.height=h;const x=c.getContext("2d");
    const g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,"#8a8578");g.addColorStop(1,"#b5b0a3");x.fillStyle=g;x.fillRect(0,0,w,h);
    x.fillStyle="rgba(255,255,255,.85)";x.font="600 15px Manrope, sans-serif";x.textAlign="center";x.fillText("Raspe aqui com o dedo",w/2,h/2+5);
    let down=false,count=0;const pt=e=>{const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return[t.clientX-r.left,t.clientY-r.top]};
    const scratch=e=>{if(!down)return;e.preventDefault();const [px,py]=pt(e);x.globalCompositeOperation="destination-out";x.beginPath();x.arc(px,py,22,0,Math.PI*2);x.fill();count++;if(count%8===0)vibrar(6);if(count>45)setAberto(true)};
    const on=e=>{down=true;scratch(e)},off=()=>{down=false};
    c.addEventListener("pointerdown",on);c.addEventListener("pointermove",scratch);window.addEventListener("pointerup",off);
    return()=>{c.removeEventListener("pointerdown",on);c.removeEventListener("pointermove",scratch);window.removeEventListener("pointerup",off)}},[]);
  return html`<div class="scratch"><div class="scratch-in">${children}</div>${aberto?null:html`<canvas ref=${ref} aria-hidden="true"></canvas>`}
    ${aberto?null:html`<button class="btn ghost small scratch-btn" onClick=${()=>{setAberto(true);vibrar()}}>Revelar sem raspar</button>`}</div>`;
}

/* ---- som simples do sentido (só quando a pessoa toca) ---- */
function useSom(){const ctx=useRef(null);const node=useRef(null);const [on,setOn]=useState(false);
  function toggle(){try{if(on){node.current&&node.current.stop();setOn(false);return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=ctx.current||(ctx.current=new AC());
    const len=c.sampleRate*4;const buf=c.createBuffer(1,len,c.sampleRate);const d=buf.getChannelData(0);let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.2}
    const src=c.createBufferSource();src.buffer=buf;src.loop=true;const g=c.createGain();g.gain.value=.25;const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=900;src.connect(f);f.connect(g);g.connect(c.destination);src.start();node.current=src;setOn(true)}catch(e){}}
  useEffect(()=>()=>{try{node.current&&node.current.stop()}catch(e){}},[]);
  return [on,toggle];
}

function Capitulos({s}){

function MiniConst({s,size=96}){
  const dims=s.dims;const n=dims.length||1;const c=size/2,R=size*.4;
  const pos=dims.map((d,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[c+R*Math.cos(a),c+R*Math.sin(a)]});
  const links=[];dims.forEach((a,i)=>dims.forEach((b,j)=>{if(j>i&&a.hyps.some(h=>b.hyps.includes(h)))links.push([i,j])}));
  return html`<svg width=${size} height=${size} viewBox=${"0 0 "+size+" "+size} aria-hidden="true">${links.map(([i,j],k)=>html`<line key=${"l"+k} x1=${pos[i][0]} y1=${pos[i][1]} x2=${pos[j][0]} y2=${pos[j][1]} stroke="rgba(242,239,232,.22)"/>`)}${dims.map((d,i)=>{const st=dimStatus(d);return html`<circle key=${d.key} cx=${pos[i][0]} cy=${pos[i][1]} r=${st==="fato"?3.2:2.2} fill=${st==="fato"?"#f0c23a":st==="hipótese"?"#f2efe8":"rgba(242,239,232,.35)"}/>`})}</svg>`;
}

      <label class="f">Complemento</label><textarea class="i" value=${comp} onInput=${x=>setComp(x.target.value)}></textarea>`:
      html`<p class="muted small">Esta evidência veio do material recuperado. O registro original não é alterado; sua correção fica anexada como revisão.</p>`}

    ${tab==="fatos"&&html`<div class="list">${s.dossier.confirmedFacts.map(f=>html`<div key=${f.id} class="item"><div class="spread"><b class="mono">${f.id}</b><${TypeChip} t="fato"/></div><p style=${{margin:"6px 0"}}>${f.text}</p><p class="small muted" style=${{margin:0}}>Origem: Evidência ${f.sourceEvidenceIds.join(", ")} · ${f.date?fmtDate(f.date):"Data desconhecida"} · ${f.confidence} · revisável</p></div>`)}</div>`}

    ${tab==="req"&&html`<div class="list">${s.dossier.requirements.map(r=>html`<div key=${r.id} class="item"><b class="mono">${r.id}</b><p style=${{margin:"4px 0 0"}}>${r.text}</p></div>`)}<div class="item gap"><span class="chip unk">? Desconhecido</span><p style=${{margin:"6px 0 0"}}>${s.dossier.requirementsNote} Não foram reconstruídos.</p></div></div>`}
    ${tab==="hist"&&html`<div class="list">${s.dossier.changeHistory.slice().reverse().map((c,i)=>html`<div key=${i} class="item"><div class="spread"><b>v${c.version}</b><span class="small muted">${c.at?fmtDate(c.at):"Data original desconhecida"}</span></div><p style=${{margin:"4px 0 0"}}>${c.text}</p></div>`)}</div>`}

function HypModal({h,s,onClose,update,toast}){
  const [status,setStatus]=useState(h.status);const [contra,setContra]=useState(h.contradictoryEvidenceIds.join(", "));const [note,setNote]=useState("");
  function save(){
    const ids=contra.split(/[,\s]+/).filter(Boolean).map(x=>pad3(parseInt(x,10))).filter(x=>s.evidences.some(e=>e.id===x));
    update(st=>{const x=st.hypotheses.find(y=>y.id===h.id);const at=nowISO();x.status=status;x.contradictoryEvidenceIds=ids;if(note.trim())x.uncertaintyNotes+=" Revisão ("+new Date().toLocaleDateString("pt-BR")+"): "+note.trim();
      bumpVersion(st.dossier.version);st.dossier.changeHistory.push({version:vstr(st.dossier.version),at,text:"Revisão manual da hipótese "+h.id+" (status: "+status+")."})},"hyp");
    toast("Hipótese "+h.id+" revisada");onClose();
  }
  return html`<${Modal} title=${"Revisar "+h.id} onClose=${onClose}><p>${h.statement}</p>
    <label class="f">Status</label><select class="i" value=${status} onChange=${e=>setStatus(e.target.value)}>${["candidata","em investigação","fortalecida pelo relato","enfraquecida","descartada"].map(o=>html`<option key=${o}>${o}</option>`)}</select>
    <label class="f">Evidências contrárias (IDs, ex.: 037, 053)</label><input class="i" value=${contra} onInput=${e=>setContra(e.target.value)}/>
    <label class="f">Nota de revisão</label><textarea class="i" value=${note} onInput=${e=>setNote(e.target.value)}></textarea>
    <div class="row" style=${{marginTop:14}}><button class="btn primary" onClick=${save}>Salvar</button><button class="btn" onClick=${onClose}>Cancelar</button></div><//>`;
}

const CATS=["Todas","Pessoas e afetos","Viagens","Cotidiano","Lembradas na investigação","Referências","Relatos autobiográficos com substâncias"];

    </div>

      <div class="memart">${m.photos&&m.photos[0]?html`<img src=${m.photos[0]} alt="" style=${{width:"100%",height:118,objectFit:"cover"}}/>`:html`<${MemArt} m=${m}/>`}<span class="tag chip" style=${{background:"rgba(255,255,255,.88)",color:"#342052"}}>${m.category}</span></div>
      <div class="body"><div class=${hidden?"blur":""}><b style=${{fontFamily:"var(--serif)",fontSize:"1.05rem"}}>${m.title}</b>
      <p class="small muted" style=${{margin:"4px 0 8px"}}>${m.people.length?m.people.join(", "):"Presentes: não informado"} · ${m.place||"Local não informado"}</p></div>
      <div class="row">${m.intensity!==null&&m.intensity!==""?html`<span class="chip gold">${m.intensity}/10</span>`:html`<span class="chip unk">intensidade ?</span>`}${m.relatedEvidenceIds.length?html`<span class="chip fact">${m.relatedEvidenceIds.length} evid.</span>`:null}${hidden?html`<span class="chip">toque para revelar</span>`:null}</div></div>
    </button>`})}</div>
    ${open?html`<${MemDetail} m=${s.memories.find(x=>x.id===open)} s=${s} onClose=${()=>setOpen(null)} onEdit=${m=>{setOpen(null);setEditing(m)}}/>`:null}

  if(!m)return null;
  const F=(l,v)=>v&&(Array.isArray(v)?v.length:true)?html`<dt>${l}</dt><dd>${Array.isArray(v)?v.join(", "):v}</dd>`:html`<dt>${l}</dt><dd class="muted">não informado</dd>`;

function resizeImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=480;const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function MemForm({m,s,onClose,update,toast}){
  const isNew=!m.id;
  const [f,setF]=useState(()=>({title:m.title||"",originalDescription:m.originalDescription||"",people:(m.people||[]).join(", "),place:m.place||"",date:m.date||"",emotions:(m.emotions||[]).join(", "),sensoryElements:(m.sensoryElements||[]).join(", "),intensity:m.intensity===null||m.intensity===undefined?"":String(m.intensity),anticipation:m.anticipation||"",peakMoment:m.peakMoment||"",duration:m.duration||"",afterEffect:m.afterEffect||"",environment:m.environment||"",meaning:m.meaning||"",category:m.category||"Pessoas e afetos",sensitive:!!m.sensitive,highlight:!!m.highlight,photos:m.photos||[],relatedEvidenceIds:(m.relatedEvidenceIds||[]).join(", ")}));
  const [err,setErr]=useState("");
  const set=(k)=>(e)=>setF(Object.assign({},f,{[k]:e.target.type==="checkbox"?e.target.checked:e.target.value}));
  async function addPhoto(e){const files=[...e.target.files].slice(0,3-f.photos.length);try{const out=[];for(const fl of files)out.push(await resizeImage(fl));setF(Object.assign({},f,{photos:f.photos.concat(out)}))}catch(x){setErr("Não consegui ler essa imagem.")}}
  function save(){
    if(!f.title.trim()){setErr("Dê um título à lembrança.");return}
    if(!f.originalDescription.trim()){setErr("Descreva a lembrança com suas palavras.");return}
    if(f.intensity!==""&&(isNaN(+f.intensity)||+f.intensity<0||+f.intensity>10)){setErr("Intensidade deve estar entre 0 e 10.");return}
    const split=x=>x.split(",").map(y=>y.trim()).filter(Boolean);
    update(st=>{
      const data={title:f.title.trim(),originalDescription:f.originalDescription.trim(),people:split(f.people),place:f.place.trim()||null,date:f.date.trim()||null,emotions:split(f.emotions),sensoryElements:split(f.sensoryElements),intensity:f.intensity===""?null:+f.intensity,anticipation:f.anticipation||null,peakMoment:f.peakMoment||null,duration:f.duration||null,afterEffect:f.afterEffect||null,environment:f.environment||null,meaning:f.meaning||null,category:f.category,sensitive:f.sensitive,highlight:f.highlight,photos:f.photos,relatedEvidenceIds:split(f.relatedEvidenceIds).map(x=>pad3(parseInt(x,10))).filter(x=>st.evidences.some(e=>e.id===x))};
      if(isNew){const n=st.memories.length+1;let id="M"+String(n).padStart(2,"0");while(st.memories.some(x=>x.id===id))id="M"+String(parseInt(id.slice(1))+1).padStart(2,"0");
        st.memories.push(Object.assign({id,relatedHypothesisIds:[],unknownFields:[],substance:false,notes:"",origin:"registrada no APP GIANINI",createdAt:nowISO()},data))}
      else{const x=st.memories.find(y=>y.id===m.id);if(!x.originalSnapshot&&x.originalDescription!==data.originalDescription)x.originalSnapshot=x.originalDescription;Object.assign(x,data);
        const filled={data:data.date,intensidade:data.intensity!==null,emoções:data.emotions.length,"sensações físicas":data.sensoryElements.length,antecipação:data.anticipation,"momento do pico":data.peakMoment,duração:data.duration,"efeito posterior":data.afterEffect,"significado pessoal":data.meaning};
        x.unknownFields=x.unknownFields.filter(u=>!filled[u])}
    },"memory");
    toast(isNew?"Lembrança adicionada ao museu":"Lembrança atualizada");onClose();
  }
  const T=(k,l,ph,ta)=>html`<label class="f">${l}</label>${ta?html`<textarea class="i" value=${f[k]} onInput=${set(k)} placeholder=${ph||""}></textarea>`:html`<input class="i" value=${f[k]} onInput=${set(k)} placeholder=${ph||""}/>`}`;
  return html`<${Modal} title=${isNew?"Nova lembrança":"Editar: "+m.title} onClose=${onClose} wide>
    <p class="small muted">Preencha só o que souber. Campos vazios ficam marcados como “não informado” — nada é inventado.</p>
    ${!isNew&&m.originalSnapshot?html`<p class="small">Descrição original preservada: <span class="quote">${m.originalSnapshot}</span></p>`:null}
    ${T("title","Título *")}${T("originalDescription","Descrição original (com suas palavras) *","",true)}
    <div class="grid g2" style=${{gap:"0 16px"}}>
      <div>${T("people","Pessoas e animais presentes","separados por vírgula")}</div><div>${T("place","Local")}</div>
      <div>${T("date","Data ou período")}</div><div><label class="f">Intensidade (0–10)</label><input class="i" type="number" min="0" max="10" value=${f.intensity} onInput=${set("intensity")}/></div>
      <div>${T("emotions","Emoções","separadas por vírgula")}</div><div>${T("sensoryElements","Sensações físicas e elementos sensoriais","separados por vírgula")}</div>
      <div>${T("anticipation","Antecipação")}</div><div>${T("peakMoment","Momento do pico")}</div>
      <div>${T("duration","Duração")}</div><div>${T("afterEffect","Efeito posterior")}</div>
      <div>${T("environment","Características do ambiente")}</div><div>${T("meaning","Significado pessoal")}</div>
      <div>${T("relatedEvidenceIds","Evidências relacionadas","ex.: 046, 047")}</div>
      <div><label class="f">Categoria</label><select class="i" value=${f.category} onChange=${set("category")}>${CATS.slice(1).map(c=>html`<option key=${c}>${c}</option>`)}</select></div>
    </div>
    <label class="f">Fotos opcionais (até 3, reduzidas e guardadas só com seus dados)</label>
    <div class="row">${f.photos.map((p,i)=>html`<div key=${i} style=${{position:"relative"}}><img src=${p} alt="" style=${{width:90,height:70,objectFit:"cover",borderRadius:8}}/><button class="btn small" style=${{position:"absolute",top:2,right:2,padding:"0 6px"}} aria-label="Remover foto" onClick=${()=>setF(Object.assign({},f,{photos:f.photos.filter((_,j)=>j!==i)}))}>✕</button></div>`)}
      ${f.photos.length<3?html`<input type="file" accept="image/*" multiple onChange=${addPhoto}/>`:null}</div>

function Dados({s,setState,saveInfo,update,toast,downloads}){
  const [syncPrev,setSyncPrev]=useState(null);const [syncErrs,setSyncErrs]=useState([]);const [checks,setChecks]=useState(null);const [snap,setSnap]=useState(null);const [working,setWorking]=useState(false);
  function onPack(e){const file=e.target.files[0];e.target.value="";if(!file)return;setSyncErrs([]);
    const r=new FileReader();r.onload=()=>{let pack;try{pack=JSON.parse(r.result)}catch(x){setSyncErrs(["O arquivo não pôde ser lido (não é um JSON válido)."]);return}
      const isJ=pack&&pack.kind==="journey-pack";const res=isJ?applyJourneyPack(s,pack):applyPack(s,pack);if(res.errors){setSyncErrs(res.errors);return}setSyncPrev({pack,result:res.state,journey:isJ})};r.readAsText(file)}
  async function confirmSync(){
    if(working)return;setWorking(true);
    const res=syncPrev.journey?applyJourneyPack(s,syncPrev.pack):applyPack(s,syncPrev.pack);
    if(res.errors){setSyncErrs(res.errors);setSyncPrev(null);setWorking(false);return}
    const ok=await saveSnapshot(s,"Antes de aplicar o pacote "+syncPrev.pack.packId);
    if(!ok){setSyncErrs(["Não consegui guardar a cópia automática de segurança. Por precaução, nada foi alterado."]);setSyncPrev(null);setWorking(false);return}
    setState(res.state,"sync");setChecks(verifyIntegrity(res.state));const wasJ=syncPrev.journey;setSyncPrev(null);setWorking(false);toast(wasJ?"Jornada carregada! Vá até a Sala de Detetive.":"Sincronização aplicada · Dossiê v"+vstr(res.state.dossier.version));
  }
  async function openSnap(){const d=await loadSnapshot();if(!d){toast("Nenhuma cópia automática encontrada");return}setSnap(d)}
  function restoreSnap(){try{const obj=JSON.parse(snap.payload);const v=validateImport(obj);if(v.length){toast("A cópia automática está ilegível");return}setState(obj,"restore");setSnap(null);toast("Cópia automática restaurada")}catch(e){toast("A cópia automática está ilegível")}}
  const [exportText,setExportText]=useState(null);const [pending,setPending]=useState(null);const [errs,setErrs]=useState([]);const [confirmReset,setConfirmReset]=useState(false);const [typed,setTyped]=useState("");
  const fileRef=useRef();
  const stamp=new Date().toISOString().slice(0,10);
  async function exportLivro(){const data=livroHTML(s);const filename="livro-boas-sensacoes-"+stamp+".html";
    if(downloads){try{await downloads.save({filename,data});update(st=>{st.settings.exportPreferences.lastExportAt=nowISO()},"export");toast("Livro pronto para baixar");return}catch(e){if(e&&e.code==="declined")return;console.warn(e)}}
    setExportText({kind:"html",data,filename})}
  async function doExport(kind){
    const data=kind==="json"?JSON.stringify(s,null,2):toMarkdown(s);
    const filename="app-gianini-dossie-v"+vstr(s.dossier.version)+"-"+stamp+(kind==="json"?".json":".md");
    if(downloads){try{await downloads.save({filename,data});update(st=>{st.settings.exportPreferences.lastExportAt=nowISO()},"export");toast("Arquivo oferecido para download");return}catch(e){console.warn(e)}}
    setExportText({kind,data,filename});
  }
  async function copyExport(){try{await navigator.clipboard.writeText(exportText.data);toast("Copiado");update(st=>{st.settings.exportPreferences.lastExportAt=nowISO()},"export")}catch(e){toast("Selecione o texto e copie manualmente")}}
  function onFile(e){const file=e.target.files[0];if(!file)return;setErrs([]);
    if(file.size>15e6){setErrs(["Arquivo grande demais."]);return}
    const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);const v=validateImport(obj);if(v.length){setErrs(v);return}setPending(obj)}catch(x){setErrs(["Não é um JSON válido."])}};r.readAsText(file);e.target.value=""}
  async function applyImport(){const obj=pending;const ok=await saveSnapshot(s,"Antes de importar backup");if(!ok){toast("Não consegui guardar a cópia automática — nada foi alterado");return}setState(obj,"import");setPending(null);toast("Backup importado")}
  const last=s.settings.exportPreferences.lastExportAt;
  return html`<div class="fade"><h1 style=${{marginTop:10}}>Seus dados</h1>
    <div class="card" style=${{marginBottom:16}}><h3>Onde seus dados ficam</h3>
      <div class="row" style=${{marginBottom:8}}><span class=${"dot "+saveInfo.dot}></span><b>${saveInfo.label}</b></div>
      <p class="small">${saveInfo.mode==="cloud"?"Seus dados ficam guardados num espaço privado da sua conta, nesta página: só você, conectado, consegue lê-los — nem quem compartilhar o link com você vê. Também guardo uma cópia neste navegador.":saveInfo.mode==="local"?"O armazenamento da conta não está disponível nesta visualização. Seus dados estão só neste navegador, que pode apagá-los (modo anônimo, limpeza de dados, outro aparelho). Exporte backups com frequência.":"Não consegui salvar em lugar nenhum nesta visualização. Os dados existem apenas enquanto esta aba estiver aberta — exporte um backup antes de fechar."}</p>
      <p class="small muted" style=${{margin:0}}>Nada é enviado a serviços externos. Mesmo com o salvamento automático, um backup em arquivo é a sua garantia final. ${last?"Último backup: "+fmtDate(last)+".":"Você ainda não fez nenhum backup."}</p></div>
    <div class="grid g2">
      <div class="card"><h3>Exportar</h3><p class="small muted">A cópia completa pode ser restaurada depois. A versão em texto é para ler.</p><div class="row"><button class="btn primary" onClick=${()=>doExport("json")}>Baixar cópia completa</button><button class="btn" onClick=${exportLivro}>Livro das boas sensações</button><button class="btn" onClick=${()=>doExport("md")}>Baixar versão em texto</button></div></div>
      <div class="card"><h3>Importar backup</h3><p class="small muted">O arquivo é validado antes. Nada é substituído sem sua confirmação.</p><input ref=${fileRef} type="file" accept=".json,application/json" onChange=${onFile} aria-label="Escolher arquivo de backup"/>
        ${errs.length?html`<ul role="alert" style=${{color:"var(--danger)"}} class="small">${errs.map((x,i)=>html`<li key=${i}>${x}</li>`)}</ul>`:null}</div>
      <div class="card" style=${{gridColumn:"1 / -1",borderColor:"var(--lavender)"}}><h3>Sincronização e jornadas</h3>
        <p class="small muted">Carregue aqui um pacote de sincronização ou de jornada. O app confere tudo antes, mostra o que vai mudar e só aplica com a sua confirmação. Se qualquer verificação falhar, nada é alterado. Antes de aplicar, uma cópia automática do estado atual é guardada.</p>
        <input type="file" accept=".json,application/json" onChange=${onPack} aria-label="Escolher pacote"/>

function wrapLines(ctx,text,maxW){const words=String(text).split(/\s+/);const lines=[];let cur="";words.forEach(w=>{const t=cur?cur+" "+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t});if(cur)lines.push(cur);return lines}
async function drawRetro(canvas,{monthLabel,count,items,dims}){
  try{await document.fonts.ready}catch(e){}
  const W=1080,H=1920;canvas.width=W;canvas.height=H;const c=canvas.getContext("2d");
  const g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,"#342052");g.addColorStop(.55,"#7954C7");g.addColorStop(1,"#E9A98B");c.fillStyle=g;c.fillRect(0,0,W,H);
  c.fillStyle="rgba(244,239,252,.5)";[[120,180,4],[300,120,3],[860,220,5],[960,420,3],[780,140,3],[180,420,3]].forEach(([x,y,r])=>{c.beginPath();c.arc(x,y,r,0,7);c.fill()});
  c.textAlign="center";c.fillStyle="#E5BC74";c.font="700 34px Manrope, sans-serif";c.fillText("MINHA RETROSPECTIVA",W/2,300);

  let y=880;c.textAlign="left";
  items.slice(0,5).forEach(t=>{c.font="500 40px Manrope, sans-serif";const lines=wrapLines(c,t,820).slice(0,2);c.fillStyle="#E5BC74";c.fillText("✦",110,y);c.fillStyle="#fff";lines.forEach((l,i)=>c.fillText(l,170,y+i*52));y+=lines.length*52+38});
  if(dims.length){y=Math.max(y+20,1500);c.textAlign="center";c.fillStyle="#F4EFFC";c.font="700 30px Manrope, sans-serif";c.fillText("O QUE MAIS ME FEZ BEM",W/2,y);
    c.font="600 40px Manrope, sans-serif";c.fillStyle="#fff";c.fillText(dims.slice(0,3).join(" · "),W/2,y+64)}
  c.textAlign="center";c.fillStyle="#fff";c.font="600 46px Fraunces, Georgia, serif";c.fillText("A vida é feita de boas sensações.",W/2,1760);
  c.fillStyle="#F4EFFC";c.font="600 32px Manrope, sans-serif";c.fillText("7entidos · by Gianini   @bsgianini",W/2,1830);

function Retro({s,onClose,downloads,toast}){
  const now=new Date();const [off,setOff]=useState(0);
  const ref=new Date(now.getFullYear(),now.getMonth()-off,1);const y=ref.getFullYear(),m=ref.getMonth();
  const monthLabel=MONTHS_PT[m].charAt(0).toUpperCase()+MONTHS_PT[m].slice(1)+" "+y;
  const quick=quickList(s).filter(q=>inMonth(q.at,y,m));
  const wb=(s.wellbeing||[]).filter(w=>inMonth(w.at,y,m));
  const mems=(s.memories||[]).filter(x=>inMonth(x.createdAt,y,m));
  const candidates=[].concat(
    quick.map(q=>({id:"q"+q.id,t:q.moment||q.text,src:"Descoberta rápida"})),
    ...wb.map(w=>(w.positives||[]).map((p,i)=>({id:"w"+w.id+i,t:p,src:"Check-in"}))),
    mems.map(x=>({id:"m"+x.id,t:x.title,src:"Lembrança"})));
  const [chosen,setChosen]=useState(null);
  const sel=chosen||candidates.slice(0,5).map(c=>c.id);
  const dimLabels=(()=>{const cnt={};quick.forEach(q=>(q.dims||[]).forEach(k=>cnt[k]=(cnt[k]||0)+1));return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).map(k=>{const d=s.dims.find(x=>x.key===k);return d?d.label:null}).filter(Boolean)})();
  const count=quick.length+wb.reduce((a,w)=>a+(w.positives||[]).length,0)+mems.length;
  const cv=useRef(null);const [img,setImg]=useState(null);
  const items=candidates.filter(c=>sel.includes(c.id)).map(c=>c.t);
  useEffect(()=>{let alive=true;if(!cv.current)return;drawRetro(cv.current,{monthLabel,count,items,dims:dimLabels}).then(()=>{if(alive)setImg(cv.current.toDataURL("image/png"))});return()=>{alive=false}},[off,sel.join("|"),count]);
  async function save(){
    if(!cv.current)return;const blob=await new Promise(r=>cv.current.toBlob(r,"image/png"));
    if(downloads&&blob){try{await downloads.save({filename:"retrospectiva-"+MONTHS_PT[m]+"-"+y+".png",data:blob});toast("Imagem pronta para postar");return}catch(e){if(e&&e.code==="declined")return;console.warn(e)}}
    toast("Toque e segure a imagem para salvar");
  }
  const toggle=id=>{const base=sel.slice();const i=base.indexOf(id);if(i>=0)base.splice(i,1);else if(base.length<5)base.push(id);else{toast("Escolha até 5 itens");return}setChosen(base)};
  return html`<${Modal} title="Retrospectiva do mês" onClose=${onClose} wide>

    <div class="grid g2" style=${{alignItems:"start"}}>
      <div>${candidates.length?html`<div class="eyebrow">O que mostrar (até 5)</div><div class="list">${candidates.map(c=>html`<label key=${c.id} class="item small row" style=${{gap:10,flexWrap:"nowrap",cursor:"pointer"}}><input type="checkbox" checked=${sel.includes(c.id)} onChange=${()=>toggle(c.id)}/><span style=${{flex:1}}>${c.t}<br/><span class="muted">${c.src}</span></span></label>`)}</div>`
        :html`<p class="banner info small">Ainda não há registros em ${monthLabel}. Faça a descoberta rápida ou um check-in com “três coisas boas” e volte aqui.</p>`}
        <div class="row" style=${{marginTop:14}}><button class="btn gold" onClick=${save} disabled=${!img}>Baixar imagem para o Instagram</button></div>
        <p class="small muted">Formato Stories (1080 × 1920). Se o download não abrir, toque e segure a imagem ao lado para salvar.</p></div>
      <div style=${{textAlign:"center"}}><canvas ref=${cv} style=${{display:"none"}}></canvas>${img?html`<img src=${img} alt=${"Retrospectiva de "+monthLabel} style=${{width:"100%",maxWidth:300,borderRadius:16,boxShadow:"var(--shadow)"}}/>`:html`<p class="muted">Preparando a imagem…</p>`}</div>
    </div>
  <//>`;
}

function NovoComeco({s,update}){

  useEffect(()=>{try{ref.current&&ref.current.scrollTo({top:0})}catch(e){}},[passo]);
  function comecar(){vibrar(14);update(st=>{const at=nowISO();
    st.novoComeco={version:1,startedAt:(st.novoComeco&&st.novoComeco.startedAt)||at,completedAt:at,
      escala:{valor,label:escalaLabel(valor),at},sentidos:sel.slice(),
      jornada:{startedAt:at,startDate:hojeKey()}};
    if(!st.settings.person)st.settings.person={};st.settings.person.sentidos=sel.slice();},"novo-comeco")}
  return html`<div class="nc" role="dialog" aria-modal="true" aria-label="Novo começo" ref=${ref}>

    ${passo<3?html`<${NCIntro} key=${passo} n=${passo} onNext=${()=>setPasso(passo+1)}/>`:null}
    ${passo===3?html`<${NCEscala} valor=${valor} setValor=${setValor} onNext=${()=>setPasso(4)}/>`:null}
    ${passo===4?html`<${NCSentidos} sel=${sel} setSel=${setSel} onNext=${()=>setPasso(5)}/>`:null}

const ANEL_ORDEM=["corpo","audicao","visao","equilibrio","olfato","tato","paladar"];/* de cima para baixo, como nos slides */
const NOME_SENT={visao:"Visão",audicao:"Audição",tato:"Tato",olfato:"Olfato",paladar:"Paladar",equilibrio:"Movimento e posição do corpo",corpo:"Sinais internos"};

let __anelId=0;
function anelSVG(size,lit,anim){const id="an"+(__anelId++);const r=size*0.42,cx=size/2,cy=size/2,a0=-62,a1=62;
  const pt=a=>{const t=a*Math.PI/180;return [cx+r*Math.cos(t),cy+r*Math.sin(t)]};const ds=size*0.018+1.4;
  const cor=k=>(SENTIDOS.find(x=>x.k===k)||{}).c||"#888";
  let dots="";ANEL_ORDEM.forEach((k,i)=>{const [x,y]=pt(a0+(a1-a0)*(i/6));const on=!lit||lit.includes(k);
    dots+=`<g class="${anim?'an-d':''}" style="animation-delay:${anim?(1.2+i*.22):0}s;transform-origin:${x}px ${y}px">`+(on?`<circle cx="${x}" cy="${y}" r="${ds*3.2}" fill="${cor(k)}" opacity=".3" filter="url(#${id})"/>`:"")+`<circle cx="${x}" cy="${y}" r="${ds}" fill="${cor(k)}" opacity="${on?1:.25}"/></g>`});
  const gold=(a,d)=>{const [x,y]=pt(a);return `<g class="${anim?'an-d':''}" style="animation-delay:${d}s;transform-origin:${x}px ${y}px"><circle cx="${x}" cy="${y}" r="${ds*3}" fill="#FFD43B" opacity=".25" filter="url(#${id})"/><circle cx="${x}" cy="${y}" r="${ds*.9}" fill="#FFE58A"/></g>`};
  const circ=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true" style="max-width:100%;overflow:visible"><defs><filter id="${id}" x="-2" y="-2" width="5" height="5"><feGaussianBlur stdDeviation="${ds*1.4}"/></filter></defs><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#c9a24a" stroke-opacity=".7" stroke-width="${Math.max(1,size/260)}" ${anim?`stroke-dasharray="${circ}" stroke-dashoffset="${circ}" class="an-draw"`:""}/>`+gold(a0-38,anim?1:0)+dots+gold(a1+48,anim?2.8:0)+`</svg>`}
function Anel({size=220,lit,anim}){return html`<div class="anel" aria-hidden="true" dangerouslySetInnerHTML=${{__html:anelSVG(size,lit,anim)}}></div>`}
function sentidosAcesos(s){const set=new Set();(s.dias||[]).forEach(d=>d&&d.sense&&set.add(d.sense));return [...set]}
function Simbolo({size=40,variant="dark"}){const w=variant==="dark"?"#FFFFFF":"#161616",y=variant==="dark"?"#FFC81A":"#E0A800";

function App(){
  const [state,setStateRaw]=useState(()=>{const l=lsGet();return l&&validateImport(l).length===0?l:seed()});
  const [view,setView]=useState(()=>{const h=(location.hash||"").slice(1);return VIEWS.includes(h)?h:"inicio"});
  const [viewOpts,setViewOpts]=useState({});
  const [save,setSave]=useState({mode:"pending",status:"loading"});
  const [toastMsg,setToastMsg]=useState(null);
  const [downloads,setDownloads]=useState(null);
  const [celebra,setCelebra]=useState(null);
  const [mais,setMais]=useState(false);
  const [abertura,setAbertura]=useState(()=>{const l=lsGet();if(!(l&&l.consent&&l.consent.accepted))return true;try{return !sessionStorage.getItem("7e-abertura")}catch(e){return true}});
  const [hora,setHora]=useState(new Date().getHours());
  const dirty=useRef(false);const timer=useRef(null);const ready=useRef(false);const stateRef=useRef(state);
  stateRef.current=state;
  const toast=useCallback(m=>{setToastMsg(m);clearTimeout(toast.t);toast.t=setTimeout(()=>setToastMsg(null),2600)},[]);
  const temaAtual=state.settings.themeChosen&&state.settings.theme==="light"&&state.settings.temaNovo?"light":"dark";
  useEffect(()=>{document.documentElement.setAttribute("data-theme",temaAtual)},[temaAtual]);
  useEffect(()=>{const t=setInterval(()=>setHora(new Date().getHours()),60000);return()=>clearInterval(t)},[]);
  useEffect(()=>{const h=()=>{const v=(location.hash||"").slice(1);if(VIEWS.includes(v))setView(v)};window.addEventListener("hashchange",h);return()=>window.removeEventListener("hashchange",h)},[]);
  // init cloud
  useEffect(()=>{let alive=true;(async()=>{
    try{if(window.claude&&window.claude.use){window.claude.use("downloads").then(d=>{if(alive&&d)setDownloads(d)}).catch(()=>{})}}catch(e){}
    const hadLocal=!!lsGet();
    const r=await cloudInit();if(!alive)return;
    if(r&&r.ok){
      const cloud=r.data&&validateImport(r.data.payload).length===0?r.data.payload:null;
      if(r.data&&!cloud){Store.mode="local";lsSet(stateRef.current);setSave({mode:"local",status:"saved"})}
      else{Store.mode="cloud";const local=stateRef.current;
        if(cloud&&(!hadLocal||!local.updatedAt||new Date(cloud.updatedAt)>=new Date(local.updatedAt))){stateRef.current=cloud;setStateRaw(cloud);lsSet(cloud);setSave({mode:"cloud",status:"saved"})}
        else{setSave({mode:"cloud",status:"saving"});dirty.current=true;flush()}}
    }else{const okLocal=lsSet(stateRef.current);Store.mode=okLocal?"local":"none";setSave({mode:Store.mode,status:okLocal?"saved":"unsaved"})}
    ready.current=true;
  })();
  const bu=e=>{if(dirty.current){e.preventDefault();e.returnValue=""}};window.addEventListener("beforeunload",bu);
  return()=>{alive=false;window.removeEventListener("beforeunload",bu)}},[]);
  async function flush(){
    const st=stateRef.current;const okLocal=lsSet(st);
    if(Store.mode==="cloud"){setSave(x=>Object.assign({},x,{status:"saving"}));try{await cloudSave(st);dirty.current=false;setSave({mode:"cloud",status:"saved",at:nowISO()})}catch(e){console.warn(e);setSave({mode:"cloud",status:"error",at:null,local:okLocal})}}
    else{dirty.current=!okLocal;setSave({mode:okLocal?"local":"none",status:okLocal?"saved":"unsaved"})}
  }
  const schedule=()=>{dirty.current=true;setSave(x=>Object.assign({},x,{status:"dirty"}));clearTimeout(timer.current);timer.current=setTimeout(flush,900)};
  const update=useCallback((fn)=>{const n=clone(stateRef.current);const r=fn(n);if(r===false)return false;n.updatedAt=nowISO();stateRef.current=n;setStateRaw(n);schedule();return true},[]);
  const setState=useCallback((n)=>{n.updatedAt=nowISO();stateRef.current=n;setStateRaw(n);schedule()},[]);
  const go=(v,opts)=>{if(ALIAS[v]){const al=ALIAS[v];opts=Object.assign({},opts||{},al[1]?{sub:al[1]}:{});v=al[0]}setView(v);setViewOpts(opts||{});try{history.replaceState(null,"","#"+v)}catch(e){location.hash=v}window.scrollTo({top:0})};
  const resume=()=>{update(st=>{st.investigation.paused=false;st.investigation.resumedAt=nowISO()});go("sala")};
  const pause=()=>{update(st=>{st.investigation.paused=true;st.investigation.pausedAt=nowISO()});toast("Investigação pausada. Pode voltar quando quiser.")};
  const info=(()=>{const m=save.mode,st=save.status;
    if(st==="loading")return{dot:"",label:"Carregando seus dados…",mode:m};
    if(st==="dirty"||st==="saving")return{dot:"warn",label:"Alterações não salvas…",mode:m};
    if(st==="error")return{dot:"err",label:"Falha ao salvar na conta"+(save.local?" — cópia neste navegador":""),mode:m};
    if(m==="cloud")return{dot:"ok",label:"Salvo na sua conta (privado)",mode:m};
    if(m==="local")return{dot:"warn",label:"Salvo só neste navegador",mode:m};
    return{dot:"err",label:"Sem armazenamento — exporte um backup",mode:m}})();
  useEffect(()=>{const t=setInterval(()=>{if(document.querySelector(".modal-bg"))return;const st=stateRef.current;if(!st)return;
    return;const got=new Set((st.achievements||[]).map(a=>a.id));const nw=CONQ.find(c=>!got.has(c.id)&&c.ok(st));if(!nw)return;
    update(x=>{if(!Array.isArray(x.achievements))x.achievements=[];x.achievements.push({id:nw.id,at:nowISO()})},"conquista");},1500);return()=>clearInterval(t)},[]);
  const okConsent=!!(state&&state.consent&&state.consent.accepted&&state.consent.version>=CONSENT_VERSION);
  const okStats=okConsent&&!!state.consent.analytics;
  useEffect(()=>{if(okStats){window["ga-disable-"+GA_ID]=false;gaStart();gaEvent("app_aberto")}else gaStop()},[okStats]);
  useEffect(()=>{if(okStats)gaEvent("tela",{tela:String(view||"inicio")})},[view,okStats]);
  const props={s:state,update,toast,go,resume,pause};
  if(save.status==="loading")return html`<div style=${{minHeight:"100vh",display:"grid",placeItems:"center",textAlign:"center"}}><div><${LogoMark} size=${64}/><p class="muted" style=${{marginTop:12}}>Carregando seus dados com segurança…</p></div></div>`;
  const AL=ALIAS[view];const V0=AL?AL[0]:view;const V={inicio:Hoje,sentidos:Sentidos,memorias:Memorias,eu:Eu}[V0]||Hoje;const vopts=AL?Object.assign({},viewOpts,AL[1]?{sub:AL[1]}:{}):viewOpts;
  return html`<div class="layout">
    <main class="main">
      <div class="topbar"><div class="brandrow"><${LogoMark} size=${30} variant=${temaAtual==="dark"?"dark":"light"}/><b><i>7</i>entidos</b></div>
        <div class="row" style=${{gap:6}}><button class="status" style=${{cursor:"pointer"}} onClick=${()=>go("dados")} title=${info.label} aria-label=${info.label}><span class=${"dot "+info.dot}></span><span class="st-label">${info.label}</span></button>
        <button class="btn ghost small" onClick=${()=>update(st=>{st.settings.theme=temaAtual==="dark"?"light":"dark";st.settings.themeChosen=true;st.settings.temaNovo=true})} aria-label="Alternar tema">${temaAtual==="dark"?"☀":"☾"}</button>
</div></div>
      <${V} key=${V0} ...${props} setState=${setState} saveInfo=${info} downloads=${downloads} initialAdd=${!!vopts.add} opts=${vopts}/>
    </main>
    <${BottomNav} cur=${V0} go=${go} onMais=${()=>{vibrar();setMais(true)}}/>
    ${mais?html`<${MaisSheet} s=${state} update=${update} toast=${toast} go=${go} onClose=${()=>setMais(false)}/>`:null}
    ${!(state.consent&&state.consent.accepted&&state.consent.version>=CONSENT_VERSION)?html`<${ConsentGate} s=${state} update=${update}/>`:!ncPronto(state)?html`<${NovoComeco} s=${state} update=${update}/>`:null}
    ${abertura?html`<${Abertura} primeira=${!(state.consent&&state.consent.accepted)} onDone=${()=>{setAbertura(false);try{sessionStorage.setItem("7e-abertura","1")}catch(e){}}}/>`:null}
    ${toastMsg?html`<div class="toast" role="status">${toastMsg}</div>`:null}
    ${celebra?html`<${Celebra} s=${state} c=${celebra} onClose=${()=>setCelebra(null)}/>`:null}
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
