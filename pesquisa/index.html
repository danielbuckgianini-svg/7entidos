<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>7entidos · Jornada da Pesquisa</title>
<meta name="robots" content="noindex">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--noite:#0A0F24;--card:#141c40;--linha:#2a3570;--txt:#F4F1EA;--suave:#b4bbdf;--ouro:#F5C542;--ok:#5fd39a;
 --c1:#4dabf7;--c2:#9775fa;--c3:#69db7c;--c4:#ff5f6d;--c5:#ffa94d;--c6:#ffd43b;--c7:#f783ac}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--noite);color:var(--txt);font:19px/1.45 Manrope,system-ui,sans-serif;min-height:100%}
body{background:radial-gradient(900px 500px at 85% -10%,#26326e 0%,transparent 60%),radial-gradient(800px 500px at -10% 110%,#2b1f58 0%,transparent 55%),var(--noite);min-height:100vh}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.1}}
.wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:14px 16px 120px}
header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ring{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 20px Fraunces,serif;color:var(--ouro);background:conic-gradient(var(--c1),var(--c2),var(--c3),var(--c4),var(--c5),var(--c6),var(--c7),var(--c1));padding:3px;flex:none}
.ring>div{width:100%;height:100%;border-radius:50%;background:var(--noite);display:grid;place-items:center}
header b{font:600 20px Fraunces,serif}header small{display:block;font-size:13px;color:var(--suave)}
.anon{margin-left:auto;font-size:13px;color:var(--ok);border:1.5px solid #5fd39a66;border-radius:99px;padding:4px 10px;white-space:nowrap}
/* trilha dos blocos */
.trail{display:flex;gap:6px;margin:4px 0 14px}
.trail div{flex:1;text-align:center;font-size:12px;color:var(--suave)}
.trail i{display:block;height:8px;border-radius:9px;background:#232c5c;margin-bottom:4px;overflow:hidden}
.trail i b{display:block;height:100%;background:var(--ouro);transition:width .5s}
.trail div.done i b{background:var(--ok)}
.trail div.cur{color:var(--txt);font-weight:800}
/* cartão */
.card{background:linear-gradient(180deg,#18214a,#121a3d);border:1px solid var(--linha);border-radius:24px;padding:20px 18px;box-shadow:0 18px 50px #0007;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.qn{display:inline-block;font-size:14px;font-weight:800;color:var(--noite);background:var(--ouro);border-radius:99px;padding:3px 12px;margin-bottom:10px}
.bk{font-size:14px;color:var(--suave);margin-left:6px}
h1,h2{font-family:Fraunces,serif;font-weight:600;line-height:1.2;margin:0 0 10px}
h1{font-size:32px}h2{font-size:27px}
p{margin:0 0 12px}.sv{color:var(--suave)}
.ctx{background:#0d1433;border:1.5px dashed #4a57a0;border-radius:18px;padding:14px 16px;margin:0 0 14px;font-size:18px}
.ctx b{color:var(--ouro)}
/* opções */
.opts{display:grid;gap:10px;margin-top:6px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#1b2554;border:2px solid #34408a;color:var(--txt);border-radius:18px;padding:14px 16px;font:700 19px Manrope,sans-serif;cursor:pointer;transition:transform .12s,border-color .2s,background .2s}
.opt:active{transform:scale(.98)}
.opt .em{font-size:28px;flex:none;width:36px;text-align:center}
.opt small{display:block;font-weight:600;font-size:15px;color:var(--suave)}
.opt.on{border-color:var(--ouro);background:#2a2a4f;box-shadow:0 0 0 3px #f5c54233}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:#1b2554;border:2px solid #34408a;color:var(--txt);border-radius:16px;padding:12px 6px;font:700 16px Manrope,sans-serif;cursor:pointer;text-align:center;line-height:1.2}
.tile .em{display:block;font-size:30px;margin-bottom:4px}
.tile.on{border-color:var(--ouro);background:#2a2a4f}
.row{margin:12px 0}.row>b{display:block;font-size:16px;margin-bottom:6px}
.row .rn{color:var(--ouro);margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#1b2554;border:2px solid #34408a;color:var(--txt);border-radius:99px;padding:10px 14px;font:700 16px Manrope,sans-serif;cursor:pointer}
.chip.on{border-color:var(--ouro);background:var(--ouro);color:var(--noite)}
.go{display:block;width:100%;margin-top:16px;background:var(--ouro);color:var(--noite);border:0;border-radius:18px;padding:16px;font:800 20px Manrope,sans-serif;cursor:pointer;box-shadow:0 10px 30px #f5c54233}
.go:disabled{opacity:.4;box-shadow:none}
.go.ghost{background:transparent;color:var(--txt);border:2px solid #3a4685;box-shadow:none}
.back{background:none;border:0;color:var(--suave);font:700 15px Manrope,sans-serif;padding:8px 0;cursor:pointer;margin-top:6px}
.err{color:#ff8fa3;font-size:15px;margin-top:8px;min-height:1px}
/* apresentadores */
.apres{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.ap{background:#1b2554;border:2px solid #34408a;border-radius:20px;padding:10px 6px;text-align:center;cursor:pointer;color:var(--txt);font:800 16px Manrope,sans-serif}
.ap svg,.ap img{width:100%;max-width:120px;aspect-ratio:1;border-radius:50%;object-fit:cover;display:block;margin:0 auto 6px}
.ap.on{border-color:var(--ouro);box-shadow:0 0 0 3px #f5c54233}
.apstrip{display:flex;justify-content:center;gap:-10px;margin:6px 0 14px}
.apstrip svg,.apstrip img{width:86px;height:86px;border-radius:50%;margin:0 -8px;border:3px solid var(--noite);object-fit:cover}
/* blocos com presentes */
.blocks{display:grid;gap:10px;margin:10px 0}
.blkx{display:flex;align-items:center;gap:12px;background:#1b2554;border:2px solid #34408a;border-radius:18px;padding:12px 14px}
.blkx .gift{font-size:32px;flex:none;transition:transform .4s}
.blkx b{font-size:18px}.blkx small{display:block;color:var(--suave);font-size:14px}
.blkx.done{border-color:var(--ok)}.blkx.cur{border-color:var(--ouro)}
.blkx.done .gift{transform:rotate(-8deg)}
/* céu */
.sky{height:150px;border-radius:20px;margin:10px 0;position:relative;overflow:hidden;transition:background .5s;border:1px solid var(--linha)}
.sky .sun{position:absolute;left:50%;width:56px;height:56px;margin-left:-28px;border-radius:50%;background:#ffd43b;box-shadow:0 0 40px #ffd43b;transition:all .6s}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.scale button{aspect-ratio:1;border-radius:10px;border:2px solid #34408a;background:#1b2554;color:var(--txt);font:800 16px Manrope,sans-serif;cursor:pointer;padding:0}
.scale button.on{background:var(--ouro);color:var(--noite);border-color:var(--ouro)}
.sl{display:flex;justify-content:space-between;font-size:14px;color:var(--suave);margin-top:4px}
/* personagem */
.pers{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.pers svg{width:96px;height:96px;flex:none;border-radius:50%}
.pers b{font:600 26px Fraunces,serif;display:block}
.tag{display:inline-block;font-size:14px;font-weight:800;border-radius:99px;padding:3px 10px;margin:2px 4px 0 0;background:color-mix(in srgb,var(--c) 22%,#141c40);color:var(--c);border:1.5px solid var(--c)}
/* presente aberto */
.prize{text-align:center}
.prize .big{font-size:90px;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.code{display:inline-block;font:800 22px Manrope,monospace;letter-spacing:.06em;background:#0d1433;border:2px dashed var(--ouro);border-radius:14px;padding:8px 14px;margin:8px 0}
.conf{position:fixed;top:-10px;width:9px;height:14px;z-index:50;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
/* vídeo */
.vid{aspect-ratio:9/12;max-height:52vh;margin:0 auto 12px;border-radius:20px;background:#0d1433;border:1px solid var(--linha);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;position:relative;overflow:hidden}
.vid svg{width:110px;height:110px;border-radius:50%;margin-bottom:10px}
.vid .leg{font:600 21px Fraunces,serif;min-height:3.6em}
.vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* trocar jeito de responder */
#modo{position:fixed;right:14px;bottom:16px;z-index:20;background:#1b2554;border:2px solid #3a4685;color:var(--txt);border-radius:99px;padding:6px 10px;font:800 13px Manrope,sans-serif;cursor:pointer;transition:transform .18s,padding .18s;box-shadow:0 8px 22px #0008}
#modo:hover,#modo:active,#modo:focus-visible{transform:scale(1.35);padding:8px 14px}
.mic{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:#ff6b8b22;border:2px solid #ff6b8b;color:var(--txt);border-radius:99px;padding:10px 16px;font:800 16px Manrope,sans-serif;cursor:pointer}
.mic.rec{background:#ff6b8b;color:#fff;animation:pul 1s infinite}
@keyframes pul{50%{transform:scale(1.05)}}
input[type=text],input[type=tel],textarea{width:100%;background:#0d1433;border:2px solid #3a4685;color:var(--txt);border-radius:14px;padding:12px 14px;font:600 18px Manrope,sans-serif}
.zap{display:flex;align-items:center;justify-content:center;gap:10px;background:#25D366;color:#06290f;text-decoration:none;border-radius:18px;padding:16px;font:800 20px Manrope,sans-serif;margin-top:14px}
.small{font-size:15px}
a{color:var(--ouro)}
@media (max-width:420px){h1{font-size:28px}h2{font-size:24px}.opt{font-size:18px}.scale button{font-size:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

R.ceu=s=>{const v=P.a[s.id];return `<div class="card">${head(s,s.t,s.sub)}
 <div class="sky" id="sky"><div class="sun" id="sun"></div></div>
 <div class="scale">${[...Array(11).keys()].map(n=>`<button class="${v===n?'on':''}" data-n="${n}">${n}</button>`).join('')}</div><div class="sl"><span>0 · nada bem</span><span>10 · muito bem</span></div>
 ${s.id==='ceu1'&&P.a.ceu0!=null?`<p class="sv small" style="margin-top:8px">Na chegada você deu <b style="color:var(--txt)">${P.a.ceu0}</b>.</p>`:''}
 <button class="go" id="okc" ${v==null?'disabled':''}>Continuar</button>${voltar()}</div>`};
R.premio=s=>{const b=blk(s.b);if(!P.done[b.k]){P.done[b.k]=1;guarda();enviar();setTimeout(festa,200)}
 const cod=b.k==='f2'?codigo('3M'):b.k==='reality'?codigo('T2'):b.k==='dinheiro'?codigo('AMIGO'):'';
 const prox2=BLOCOS[BLOCOS.indexOf(b)+1];
 return `<div class="card prize"><p class="sv">Você terminou o bloco <b style="color:var(--txt)">${b.n}</b>!</p><div class="big">${b.pr}</div><h2>${b.prT}</h2>
 ${cod?`<p class="sv small">Guarde este código (tire um print). Ele é seu e continua anônimo:</p><div class="code">${cod}</div><p class="sv small">Vale a partir do lançamento do app, em 1º de dezembro.</p>`:''}
 ${b.k==='f1'?'<p class="sv small">Suas 10 descobertas ficam no fim da Fase 1, neste aparelho.</p>':''}
 ${b.k==='dinheiro'?`<a class="zap" href="https://wa.me/?text=${encodeURIComponent('Ganhei um presente para você: 1 mês grátis do app 7entidos, que sai em 1º/12. Seu código: '+cod+' ✦ Conheça: @7entidoss no Instagram')}" target="_blank" rel="noopener">💝 Mandar o presente no WhatsApp</a>`:''}
 <button class="go" onclick="prox()">${prox2?'Seguir para '+prox2.n+' →':'Seguir para o final →'}</button>
 <button class="go ghost" onclick="pausa()">Parar por aqui (volto depois)</button></div>`};
R.ir=s=>{const f1=s.fase==='f1';const pronto=f1?fase1Pronta():P.a.f2_volta;return `<div class="card"><span class="qn">${f1?'Fase 1':'Fase 2'}</span>
 <h2>${f1?'🗺️ O mapa dos seus 7 sentidos':'🎮 Os mini jogos dos sentidos'}</h2>
 <p>${f1?'Em cada um dos 7 sentidos, escolha o que você mais gosta. No fim, você ganha a sua imagem e 10 descobertas sobre você.':'Que som é esse?, Carinho, Esteira de sushi, Corpo que acende e uma respiração para fechar.'}</p>
 <p class="sv small">A fase abre nesta mesma tela. Quando terminar, toque em <b style="color:var(--txt)">“↩ Voltar para a pesquisa”</b>, que fica embaixo.</p>
 <a class="go" style="text-align:center;text-decoration:none" href="${SITE}${f1?'/jornada/?c=7s0a4653':'/jornada/fase2/?c=7s0a4653'}" onclick="P.fase='${s.fase}';guarda()">Abrir a ${f1?'Fase 1':'Fase 2'} →</a>
 ${pronto||P.fase===s.fase?`<button class="go ghost" onclick="${f1?'':"P.a.f2_volta=1;"}P.fase=null;guarda();prox()">Já terminei a ${f1?'Fase 1':'Fase 2'} ✓</button>`:''}${voltar()}</div>`};
R.ctx=s=>`<div class="card" style="text-align:center"><h1>${s.titulo}</h1><div class="ctx" style="text-align:left">${s.txt}</div><button class="go" onclick="festa();prox()">${s.bt}</button>${voltar()}</div>`;
R.quais=s=>{const sel=P.a.r_sel||[];return `<div class="card">${head(s,'Quantos personagens você quer montar?','São 7 moradores, um por sentido.')}
 <div class="opts"><button class="opt ${P.a.r_quais==='todos'?'on':''}" data-q="todos"><span class="em">🎬</span><span>Todos os 7<small>Uns 6 minutos</small></span></button>
 <button class="opt ${P.a.r_quais==='tres'?'on':''}" data-q="tres"><span class="em">⭐</span><span>Só os meus 3 favoritos<small>Uns 3 minutos</small></span></button></div>
 <div id="pick" ${P.a.r_quais==='tres'?'':'hidden'}><p class="sv" style="margin:12px 0 6px">Escolha 3:</p><div class="grid3">${CAST.map(p=>`<button class="tile ${sel.includes(p.k)?'on':''}" data-pk="${p.k}" style="--c:${p.cor}"><div style="width:58px;margin:0 auto 4px">${rosto(p.cor,p.sombra)}</div>${p.n}<small style="display:block;color:${p.cor};font-size:13px">${p.sen}</small></button>`).join('')}</div>
 <button class="go" id="ok3" ${sel.length===3?'':'disabled'}>Montar esses 3</button></div>${voltar()}</div>`};
const persHead=p=>`<div class="pers">${rosto(p.cor,p.sombra)}<div><b>${p.n}</b><span class="tag" style="--c:${p.cor}">${SEN.find(x=>x[1]===p.sen)[0]} ${p.sen}</span><span class="tag" style="--c:#F5C542">${p.arq}</span></div></div>`;
function linhas(rows,pfx){return rows.map(([lab,ops,f],i)=>`<div class="row"><b><span class="rn">${i+1}.</span>${lab}</b><div class="chips">${ops.map(o=>`<button class="chip ${P.a[pfx+f]===o?'on':''}" data-f="${f}" data-v="${esc(o)}">${o}</button>`).join('')}</div></div>`).join('')}
R.monta=s=>{const p=s.p;return `<div class="card"><span class="qn">Monte o personagem</span>${persHead(p)}
 ${linhas([['Cabelo',p.cab,'cab'],['Rosto',p.ros,'ros'],[p.corLabel||'Corpo',p.cor2,'cor2'],['Nome',p.nom,'nom']],'r_'+p.k+'_')}
 <button class="go" id="okr">Próximo →</button><div class="err" id="err"></div>${voltar()}</div>`};
R.arq=s=>{const p=s.p;return `<div class="card"><span class="qn">Quem é ${p.n} por dentro?</span>${persHead(p)}
 ${linhas(p.aq.map((x,i)=>[x[0],x[1],'aq'+i]),'r_'+p.k+'_')}
 <button class="go" id="okr">Próximo →</button><div class="err" id="err"></div>${voltar()}</div>`};
R.estilo=s=>{const p=s.p;return `<div class="card"><span class="qn">Estilo e dor</span>${persHead(p)}
 ${linhas([['Qual o estilo de '+p.n+'?',p.est,'est'],['Qual a dor de '+p.n+'? (o app vai ajudar nela)',p.dor,'dor']],'r_'+p.k+'_')}
 <button class="go" id="okr">${p.k==='leo'||(P.a.r_quais==='tres'&&(P.a.r_sel||[]).slice(-1)[0]===p.k)?'Elenco pronto! →':'Próximo personagem →'}</button><div class="err" id="err"></div>${voltar()}</div>`};
R.preco=s=>`<div class="card">${head(s,'Você compraria hoje?')}
 <div style="background:#0d1433;border:2px solid var(--ouro);border-radius:20px;padding:18px;text-align:center;margin:8px 0 14px">
  <div class="ring" style="margin:0 auto 8px;width:54px;height:54px"><div>7</div></div><b style="font:600 22px Fraunces,serif">App 7entidos</b>
  <div class="sv small">3 meses de acesso · pagamento único · sem assinatura</div>
  <div style="font:800 40px Manrope,sans-serif;color:var(--ouro);margin-top:6px">${P.preco}</div></div>
 <div class="grid3">${[['🛒','Sim'],['🤔','Talvez'],['🙅','Não']].map(([e,t])=>`<button class="tile ${P.a.d_compra===t?'on':''}" data-v="${t}"><span class="em">${e}</span>${t}</button>`).join('')}</div>${voltar()}</div>`;
R.cidade=s=>`<div class="card">${head(s,'Em que cidade você mora?')}
 <div class="chips" style="margin-bottom:10px">${['Santos','São Vicente','Guarujá','Praia Grande','São Paulo'].map(c=>`<button class="chip ${P.a.z_cidade===c?'on':''}" data-c="${c}">${c}</button>`).join('')}</div>
 <input type="text" id="cid" placeholder="Outra cidade (opcional)" value="${esc(['Santos','São Vicente','Guarujá','Praia Grande','São Paulo'].includes(P.a.z_cidade)?'':P.a.z_cidade||'')}">${P.modo==='audio'?'<button class="mic" id="mic">🎙 Falar</button>':''}
 <button class="go" id="okcid">Continuar</button><button class="back" onclick="resp('z_cidade','Prefiro não dizer')">Prefiro não dizer</button>${voltar()}</div>`;
R.comunidade=s=>`<div class="card">${head(s,'Quer entrar na comunidade do 7entidos?','Novidades, testes antes de todo mundo e o aviso do lançamento.')}
 <div class="opts"><button class="opt ${P.a.z_com==='Sim'?'on':''}" data-cm="Sim"><span class="em">🙋</span>Quero entrar</button><button class="opt ${P.a.z_com==='Não'?'on':''}" data-cm="Não"><span class="em">👋</span>Agora não</button></div>
 <div id="cform" ${P.a.z_com==='Sim'?'':'hidden'} style="margin-top:12px"><p class="sv small">Nome e telefone são opcionais e ficam numa lista separada, <b style="color:var(--txt)">sem ligação com as suas respostas</b>. A pesquisa continua anônima.</p>
  <input type="text" id="cnome" placeholder="Seu nome (opcional)" style="margin-bottom:8px"><input type="tel" id="ctel" placeholder="WhatsApp com DDD (opcional)">
  <button class="go" id="okcm">Entrar e continuar</button></div>${voltar()}</div>`;
R.fim=s=>{if(!P.done.final){P.done.final=1;guarda();enviar();setTimeout(festa,200)}
 const msg='Tá chovendo, tá frio, todo mundo parado em casa... então me ajuda! 🌧️ Fiz uma pesquisa diferente, sobre sensações, que vai construir um app que pode ajudar muita gente. É anônima, divertida e tem presente no final 🎁 A meta é 100 pessoas: '+LINK_PESQUISA+' ✦ E segue o @7entidoss no Instagram!';
 const pr=BLOCOS.filter(b=>P.done[b.k]);
 return `<div class="card prize"><div class="big">🌟</div><h1>Obrigado por sentir com a gente!</h1>
 <p>Você ajudou a construir o 7entidos. Seus presentes:</p>
 <div class="blocks" style="text-align:left">${pr.map(b=>`<div class="blkx done"><span class="gift">${b.pr}</span><div><b>${b.prT}</b>${b.k==='f2'?`<small>${codigo('3M')}</small>`:b.k==='reality'?`<small>${codigo('T2')}</small>`:b.k==='dinheiro'?`<small>${codigo('AMIGO')}</small>`:''}</div></div>`).join('')||'<p class="sv">Faça os blocos para ganhar os presentes.</p>'}</div>
 <p style="font:600 21px Fraunces,serif;margin-top:14px">Falta pouco para 100 pessoas. Chama mais gente?</p>
 <a class="zap" id="zap" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">📲 Mandar no WhatsApp</a>
 <a class="go ghost" style="display:block;text-align:center;text-decoration:none;margin-top:10px" href="https://www.instagram.com/7entidoss/" target="_blank" rel="noopener">📸 Seguir o @7entidoss</a>
 ${BLOCOS.some(b=>!P.done[b.k])?`<button class="go ghost" onclick="irPara(BLOCOS.find(b=>!P.done[b.k]).k)">Fazer o bloco que falta</button>`:''}</div>`};
function pausa(){document.getElementById('app').innerHTML=`<div class="card" style="text-align:center"><div style="font-size:60px">🌙</div><h2>Tudo guardado!</h2><p class="sv">Quando quiser continuar, abra o mesmo link neste aparelho e você volta exatamente daqui.</p><button class="go" onclick="render()">Continuar agora</button></div>`}
function irPara(b){const i=S.findIndex(s=>s.b===b);if(i>=0){P.i=i;guarda();render()}}
function fase1Pronta(){try{const j=JSON.parse(localStorage.getItem('jornada7')||'null');return j&&j.esc&&Object.keys(j.esc).filter(k=>(j.esc[k]||[]).length).length>=7}catch(e){return false}}

/* ---------- ligar os toques ---------- */
function bind(s){const app=document.getElementById('app');
 app.querySelectorAll('[data-v]').forEach(b=>{if(b.closest('.row'))return;b.onclick=()=>{if(s.tipo==='cor'){P.a.cor=b.dataset.v;resp('cor',b.dataset.v)}else resp(s.id,b.dataset.v)}});
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const cur=P.a[s.id]||[];const v=b.dataset.m;P.a[s.id]=cur.includes(v)?cur.filter(x=>x!==v):cur.concat([v]);b.classList.toggle('on');guarda();bip(280,.05)});
 const okm=document.getElementById('okm');if(okm)okm.onclick=()=>{const t=document.getElementById('aberto');if(t)P.a[s.id+'_txt']=t.value.trim();if(!(P.a[s.id]||[]).length&&!(t&&t.value.trim())){document.getElementById('err').textContent='Marque pelo menos uma opção.';return}if(t&&t.value.trim())P.a[s.id]=(P.a[s.id]||[]).filter(x=>!x.startsWith('✍️')).concat(['✍️ '+t.value.trim()]);guarda();prox()};
 app.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{P.modo=b.dataset.md;P.a.modo=P.modo;guarda();modoBtn();resp('modo',P.modo)});
 app.querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>{const d=P.pd;bip(360);if(d.r<2){d.v.push(b.dataset.pc);d.r++;guarda();render()}else{P.a.pincel=b.dataset.pc;guarda();festa();setTimeout(prox,500)}});
 app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;P.a[s.id]=n;guarda();bip(260+n*40);app.querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('on',x===b));ceuPinta(n);document.getElementById('okc').disabled=false});
 const okc=document.getElementById('okc');if(okc){okc.onclick=prox;if(P.a[s.id]!=null)ceuPinta(P.a[s.id]);else ceuPinta(5)}
 app.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{P.a.r_quais=b.dataset.q;guarda();bip();if(b.dataset.q==='todos'){P.a.r_sel=CAST.map(p=>p.k);prox()}else{P.a.r_sel=[];render()}});
 app.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{let sel=P.a.r_sel||[];const k=b.dataset.pk;sel=sel.includes(k)?sel.filter(x=>x!==k):sel.length<3?sel.concat([k]):sel;P.a.r_sel=CAST.map(p=>p.k).filter(k2=>sel.includes(k2));guarda();bip();render()});
 const ok3=document.getElementById('ok3');if(ok3)ok3.onclick=prox;
 app.querySelectorAll('.row [data-f]').forEach(b=>b.onclick=()=>{const k='r_'+s.p.k+'_'+b.dataset.f;P.a[k]=b.dataset.v;guarda();bip(300,.05);b.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b))});
 const okr=document.getElementById('okr');if(okr)okr.onclick=()=>{const fs=[...new Set([...app.querySelectorAll('.row [data-f]')].map(x=>x.dataset.f))];const falta=fs.filter(f=>!P.a['r_'+s.p.k+'_'+f]);if(falta.length){document.getElementById('err').textContent='Escolha uma opção em cada linha ('+falta.length+' faltando).';return}prox()};
 app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>resp('z_cidade',b.dataset.c));
 const okcid=document.getElementById('okcid');if(okcid)okcid.onclick=()=>{const v=document.getElementById('cid').value.trim();if(v)resp('z_cidade',v,false);prox()};
 app.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>{P.a.z_com=b.dataset.cm;guarda();bip();if(b.dataset.cm==='Não')prox();else render()});
 const okcm=document.getElementById('okcm');if(okcm)okcm.onclick=()=>{const n=document.getElementById('cnome').value.trim(),t=document.getElementById('ctel').value.trim();if(n||t)enviarComunidade(n,t);prox()};
 const pular=document.getElementById('pular');if(pular)pular.onclick=()=>{const e=document.getElementById('err');if(!pular.dataset.arm){pular.dataset.arm=1;e.textContent='Tem certeza? Sem o recado, algumas partes podem ficar confusas. Toque de novo para pular.';return}resp('video','Pulou')};
 const leg=document.getElementById('leg');if(leg){let i=0;const go=()=>{if(!document.body.contains(leg))return;leg.style.opacity=0;setTimeout(()=>{leg.textContent=FALA[i%FALA.length];leg.style.opacity=1;i++},250);setTimeout(go,3200)};leg.style.transition='opacity .25s';go()}
 const zap=document.getElementById('zap');if(zap)zap.addEventListener('click',()=>{P.compartilhou=1;guarda();enviar()});
 const mic=document.getElementById('mic');if(mic)mic.onclick=()=>ouvir(mic,document.getElementById('aberto')||document.getElementById('cid'));
}
function ceuPinta(n){const sky=document.getElementById('sky'),sun=document.getElementById('sun');if(!sky)return;const t=n/10;
 sky.style.background=`linear-gradient(180deg, hsl(${215-t*20} ${30+t*40}% ${10+t*45}%), hsl(${30+t*15} ${40+t*50}% ${15+t*45}%))`;sun.style.top=(110-t*80)+'px';sun.style.opacity=.25+t*.75}
let REC=null;function ouvir(btn,campo){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){campo.focus();campo.placeholder='Use o 🎤 do teclado do celular';return}
 if(REC){REC.stop();return}try{REC=new SR();REC.lang='pt-BR';REC.interimResults=true;const base=campo.value?campo.value+' ':'';REC.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;campo.value=base+t};
  REC.onend=()=>{btn.classList.remove('rec');btn.textContent='🎙 Falar';REC=null};REC.start();btn.classList.add('rec');btn.textContent='● Ouvindo… toque para parar'}catch(e){campo.focus()}}
function modoBtn(){const b=document.getElementById('modo');if(!P.a.modo){b.hidden=true;return}b.hidden=false;b.textContent=P.modo==='audio'?'🎙️ áudio · trocar':'👆 botões · trocar';
 b.onclick=()=>{P.modo=P.modo==='audio'?'botoes':'audio';guarda();modoBtn();render()}}
function render(){if(!visivel(P.i)){let i=P.i;while(i<S.length-1&&!visivel(i))i++;P.i=i}
 const s=S[P.i];trail();document.getElementById('app').innerHTML=R[s.tipo](s);bind(s);modoBtn()}

/* voltou de uma fase? */
(function(){const q=new URLSearchParams(location.search);const v=q.get('volta');if(v){const i=S.findIndex(s=>s.tipo==='ir'&&s.fase===v);if(i>=0){P.i=i;if(v==='f2')P.a.f2_volta=1;guarda()}try{history.replaceState(null,'',location.pathname)}catch(e){}}})();
(function(){const st=document.getElementById('stars');for(let i=0;i<60;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*3+'s';st.appendChild(s)}})();
render();
</script>
</body>
</html>
