<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pesquisa 7entidos · A Casa dos 7 Sentidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&family=Inter:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500;1,9..144,700&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&family=Syne:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#100e12;--panel:#1c1920;--paper:#f3ead7;--ink:#231f1a;--tape:#e9d48a;--red:#e2483d;--muted:#a69fae;--line:#2e2a33;--accent:#f5c542}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse 70% 55% at 50% 0%,rgba(255,236,190,.14),transparent 70%),var(--bg);color:#f4f1f6;font-family:Inter,system-ui,sans-serif;font-size:21px;line-height:1.45;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:18px 18px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo-top{font-family:"Bebas Neue";font-size:34px;letter-spacing:2px;margin-left:auto;line-height:1}
.logo-top i,.logo i{font-style:normal;color:var(--accent)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--accent));transition:width .4s}
/* trilha por blocos */
.trail{display:flex;align-items:flex-end;gap:4px;margin:4px 0 2px;padding-top:30px;position:relative}
.tb{flex:1;position:relative;text-align:center}
.tb .bar{height:10px;border-radius:99px;background:#3a3540}
.tb.done .bar{background:linear-gradient(90deg,var(--red),var(--accent))}
.tb.now .bar{background:repeating-linear-gradient(90deg,var(--accent) 0 8px,#3a3540 8px 14px)}
.tb small{display:block;font-size:11px;color:var(--muted);font-weight:800;margin-top:4px;line-height:1.1}
.tb.now small{color:var(--accent)}
.tlock{font-size:13px;flex:none;margin-bottom:16px;opacity:.85}
.tlock.open{opacity:.35}
.walker{position:absolute;top:-30px;font-size:26px;left:50%;transform:translateX(-50%)}
.tend{flex:none;text-align:center;font-size:28px;line-height:1;margin-left:4px}
.tend small{display:block;font-size:10px;color:var(--accent);font-weight:800}
.meta{color:var(--muted);font-size:15px;margin:6px 0 18px}
.scene{animation:in .45s ease}
/* Monte o App: uma pergunta por vez, no meio da tela */
.scene.um{min-height:calc(100svh - 200px);display:flex;flex-direction:column;justify-content:center}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fade{animation:fd .35s ease}
@keyframes fd{from{opacity:0}to{opacity:1}}
.qnum{font-family:"Bebas Neue";font-size:22px;letter-spacing:2px;color:var(--accent)}
h1{font-family:"Bebas Neue";font-weight:400;font-size:54px;line-height:.95;margin:4px 0 10px;letter-spacing:1px}
h2{font-family:"Bebas Neue";font-weight:400;font-size:42px;line-height:1;margin:2px 0 10px;letter-spacing:1px}
h3{font-family:"Bebas Neue";font-weight:400;font-size:30px;margin:22px 0 8px;letter-spacing:1px}
.sub{color:var(--accent);font-size:20px;font-weight:600;margin:0 0 18px}
.opts{display:grid;gap:12px}
.opt{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px 18px;font-size:21px;font-weight:600;transition:transform .15s,border-color .15s,background .15s}
.opt:hover,.opt:focus-visible{border-color:var(--accent);transform:translateY(-2px)}
.opt.sel{border-color:var(--accent);background:#2b2410}
.opt .k{font-family:"Bebas Neue";font-size:26px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#2a2630;color:var(--accent);flex:none}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:16px;margin-top:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .opt{justify-content:center;text-align:center;padding:14px 8px}
.ficha{background:var(--paper);color:var(--ink);border-radius:6px;padding:22px 20px 20px;margin:8px 0 18px;font-family:"Special Elite",monospace;position:relative;transform:rotate(-.5deg);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.ficha:before,.ficha:after{content:"";position:absolute;top:-12px;width:90px;height:26px;background:var(--tape);opacity:.85}
.ficha:before{left:22px;transform:rotate(-6deg)}.ficha:after{right:22px;transform:rotate(5deg)}
.ficha .nm{font-family:"Bebas Neue";font-size:40px;line-height:1;letter-spacing:1px}
.ficha p{margin:10px 0 0;font-size:18px;line-height:1.5}
.stamp{position:absolute;right:14px;bottom:10px;font-family:"Bebas Neue";color:var(--red);border:3px solid var(--red);padding:0 8px;font-size:22px;transform:rotate(-8deg);opacity:.85}
.chip{display:inline-block;font-size:15px;padding:3px 10px;border-radius:99px;font-weight:800;color:#141216;margin-right:6px;font-family:Inter}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:460px;margin:0 auto}
.photos .ph:last-child:nth-child(3n+1){grid-column:2}
.ph{all:unset;cursor:pointer;background:#fff;padding:6px 6px 22px;border-radius:3px;box-shadow:0 4px 10px rgba(0,0,0,.4);position:relative;transition:transform .15s}
.photos .ph:nth-child(odd){transform:rotate(-2deg)}.photos .ph:nth-child(even){transform:rotate(2deg)}
.photos .ph:hover{transform:rotate(0) scale(1.04)}
.ph.sel{outline:4px solid var(--accent)}
.ph .img{aspect-ratio:3/4;display:grid;place-items:center;background:#3a3540;overflow:hidden}
.ph .img svg{width:60%;height:60%}
.ph .img img{width:100%;height:100%;object-fit:cover}
.ph span{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-family:"Special Elite";font-size:13px;color:#333}
.pick{display:flex;gap:16px;align-items:center;margin:4px 0 18px}
.pick .ph{width:110px;flex:none;cursor:default}
.btn{all:unset;cursor:pointer;display:inline-block;background:var(--accent);color:#141216;font-weight:800;padding:16px 26px;border-radius:12px;font-size:21px;text-align:center}
.btn.ghost{background:transparent;color:#fff;border:2px solid var(--line)}
.btn:focus-visible{outline:3px solid #fff}
.err{color:#ff8a80;font-size:17px;margin-top:10px;min-height:22px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px}
/* botão de confirmar sempre à vista (perguntas de várias opções / jogos) */
.nav.fixa{position:sticky;bottom:0;z-index:30;padding:14px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,rgba(16,14,18,0),rgba(16,14,18,.92) 28%,rgba(16,14,18,.97))}
/* o botão acende na hora do toque */
.opt:active,.scale .opt:active{filter:brightness(1.35)}
.back{all:unset;cursor:pointer;color:var(--muted);font-size:17px;padding:8px}
.back:hover,.skip:hover{color:#fff}
.skip{all:unset;cursor:pointer;color:var(--muted);font-size:17px;text-decoration:underline;padding:8px}
.center{text-align:center}
.big-emoji{font-size:0;width:78px;height:78px;margin:6px auto 10px;border-radius:50%;position:relative;background:conic-gradient(#f5c542,#4aa8ff,#ff8a3d,#ff5a6e,#5ccf8a,#b48cff,#3fd6d0,#f5c542);-webkit-mask:radial-gradient(circle,transparent 54%,#000 56%);mask:radial-gradient(circle,transparent 54%,#000 56%);filter:drop-shadow(0 0 14px rgba(245,197,66,.55));animation:anel 7s linear infinite}
@keyframes anel{to{transform:rotate(360deg)}}
/* logo oficial junto dos vídeos de explicação: anel de sete luzes + 7ENTIDOS, fora da imagem (não cobre o rosto) */
.vlogo{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px auto 6px}
.vlogo .anel7{width:34px;height:34px;border-radius:50%;flex:none;background:conic-gradient(#f5c542,#4aa8ff,#ff8a3d,#ff5a6e,#5ccf8a,#b48cff,#3fd6d0,#f5c542);-webkit-mask:radial-gradient(circle,transparent 52%,#000 55%);mask:radial-gradient(circle,transparent 52%,#000 55%);box-shadow:0 0 14px rgba(245,197,66,.45)}
.vlogo b{font-family:"Bebas Neue",sans-serif;font-size:28px;letter-spacing:3px;line-height:1;color:#f4f1f6}
.vlogo b i{font-style:normal;color:#f5c542}
.card-dark{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:18px}
.stack{display:grid;gap:12px;margin:18px 0}
.seal{display:flex;gap:12px;align-items:center;background:#000;color:var(--accent);border:2px solid var(--accent);border-radius:14px;padding:8px 14px;flex:1}
.seal b{font-size:17px}
/* selo anônimo piscando em preto e amarelo */
.seal-pisca{animation:selo 1.2s steps(1,end) infinite}
@keyframes selo{0%{background:#000;color:var(--accent);border-color:var(--accent)}50%{background:var(--accent);color:#000;border-color:#000}100%{background:#000;color:var(--accent);border-color:var(--accent)}}
.blink{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.55}}
.host{display:flex;gap:14px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px;overflow-wrap:anywhere}
.host.sel{border-color:var(--accent);background:#2b2410}
.hosts{display:grid;gap:14px}
.logo{font-family:"Bebas Neue";font-size:56px;letter-spacing:3px;line-height:1}
a{color:var(--accent)}
.flowtxt{background:#141216;border-radius:12px;padding:16px;margin:10px 0 14px;font-size:19px;text-align:left}
.video{display:flex;gap:14px;align-items:center;background:#000;border:2px solid var(--line);border-radius:14px;padding:16px;margin:16px 0 6px;text-align:left}
.vplay{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#141216;display:grid;place-items:center;font-size:24px;flex:none}
.video small{display:block;color:var(--muted);font-size:15px}
.fala{font-style:italic;color:#fff;font-size:18px;margin-top:8px}
.share{margin:18px 0}
.share p{margin:6px 0 14px;font-size:18px;color:var(--muted)}
.share .row2 .btn{padding:14px 10px;font-size:19px}
.abert-video{width:min(380px,100%);max-height:74vh;border-radius:16px;display:block;margin:0 auto;background:#000}
.abert-ph{text-decoration:none;color:#fff;display:grid;place-items:center;width:min(340px,88vw);aspect-ratio:9/16;max-height:70vh;margin:0 auto;border-radius:16px;background:radial-gradient(circle at 50% 40%,#2b2410,#000);border:2px solid var(--line)}
.abert-ph .vplay{margin:0 auto 14px;width:84px;height:84px;font-size:36px}
.pesq{all:unset;cursor:pointer;display:block;border-radius:18px;padding:20px;border:2px solid var(--line);background:linear-gradient(135deg,#2b2410,#1c1920);transition:transform .15s,border-color .15s}
.pesq:hover,.pesq:focus-visible{transform:translateY(-3px);border-color:var(--accent)}
.pesq .tag{display:inline-block;background:var(--red);color:#fff;font-weight:800;font-size:14px;padding:4px 10px;border-radius:99px;margin-bottom:8px;letter-spacing:.5px}
.pesq b{display:block;font-family:"Bebas Neue";font-weight:400;font-size:38px;line-height:1;letter-spacing:1px}
.pesq p{margin:8px 0 0;font-size:18px;color:#d9d3df}
.pesq.lock{background:var(--panel);opacity:.75}
.elenco{display:grid;gap:12px}
.elrow{display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px}
.elrow .ph{width:70px;padding:4px 4px 4px;cursor:default}
.elrow .row2 .opt{font-size:17px;padding:10px 6px}
.elrow b{font-size:19px}
.room{border-radius:20px;padding:22px;border:3px solid;margin-bottom:16px;text-align:center}
.room .rn{font-family:"Bebas Neue";font-size:44px;line-height:1;letter-spacing:1px}
.etapa{display:inline-block;font-size:14px;font-weight:800;color:var(--muted);letter-spacing:1px}
.redo{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
.done-tag{display:inline-block;background:#16251b;border:2px solid #3fae6a;color:#9be7b0;font-weight:800;padding:8px 14px;border-radius:10px}
input.txt{all:unset;box-sizing:border-box;width:100%;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:16px;font-size:21px}
input.txt:focus{border-color:var(--accent)}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:6px}
.scale .opt{justify-content:center;padding:14px 0;font-family:"Bebas Neue";font-size:28px}
.scale-legend{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-top:6px}
.gamebox{background:#141216;border:2px solid var(--line);border-radius:16px;padding:16px;margin:10px 0}
.gtip{margin:0 0 12px;font-weight:600}
.ggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px}
.ggrid.g3{grid-template-columns:repeat(3,1fr)}
.ggrid.g2{grid-template-columns:repeat(2,1fr);max-width:none}
.gcell{all:unset;cursor:pointer;aspect-ratio:1;border-radius:10px}
.gcard{all:unset;cursor:pointer;aspect-ratio:1;border-radius:12px;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;font-size:38px}
.bal{position:relative;height:40px;background:var(--panel);border-radius:99px;border:2px solid var(--line)}
.bal .zone{position:absolute;left:41%;width:18%;top:0;bottom:0;background:rgba(245,197,66,.25);border-left:2px solid var(--accent);border-right:2px solid var(--accent)}
.bal .dot{position:absolute;top:6px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#b48cff}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips .opt{padding:12px 16px;font-size:19px}
.chips.mini{gap:8px}
.chips.mini .opt{padding:8px 12px;font-size:16px;border-radius:10px;gap:6px}
.f1q{margin:0 0 18px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.f1q h3{margin:6px 0 2px;font-family:Inter;font-size:20px;font-weight:800;letter-spacing:0}
.f1q small{display:block;color:var(--muted);font-size:14px;margin-bottom:8px}
.gsec{margin:0 0 20px}
.round{margin-bottom:16px}
.round .gtip{margin-bottom:8px}
.gcell.ok{outline:4px solid #3fae6a;outline-offset:-4px}
.gcell.bad{opacity:.3}
.rres{font-size:15px;font-weight:800;margin-top:6px;min-height:20px}
.notarow{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center;margin:14px 0;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px}
.notarow .scale{grid-template-columns:repeat(6,1fr)}
.gimg{width:84px;height:84px;border-radius:16px;display:grid;place-items:center;font-size:42px;border:3px solid}
/* versos das cartas, estilo pintura (provisório até entrarem as cartas do Museu) */
.gcard.pint{border:3px solid #f3ead7;box-shadow:inset 0 0 0 4px #231f1a}
.gcard.p0{background:radial-gradient(circle at 70% 25%,#f5c542 0 10%,transparent 11%),repeating-radial-gradient(circle at 35% 70%,#1d3b8a 0 5px,#3a6fd8 5px 9px,#7fa6ff 9px 11px)}
.gcard.p1{background:radial-gradient(#ff8a3d 28%,transparent 31%) 0 0/9px 9px,radial-gradient(#e2483d 22%,transparent 25%) 4px 4px/9px 9px,#5ccf8a}
.gcard.p2{background:linear-gradient(#231f1a,#231f1a) 0 58%/100% 5px no-repeat,linear-gradient(#231f1a,#231f1a) 55% 0/5px 100% no-repeat,conic-gradient(from 90deg at 55% 58%,#f3ead7 0 25%,#4aa8ff 0 50%,#f5c542 0 75%,#e2483d 0)}
/* mini jogos compactos: nenhuma tela precisa rolar */
.f2h{font-size:30px!important;margin:0 0 6px!important}
.gamebox{padding:12px}
.rounds3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rounds3 .round{margin:0}
.rounds3 .ggrid{gap:3px;max-width:none}
.rounds3 .gcell{border-radius:4px}
.rounds3 .rlab{font-family:"Bebas Neue";font-size:18px;letter-spacing:1px;color:var(--accent);margin-bottom:4px}
.rounds3 .rres{font-size:13px}
.sround{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px}
.sround .rlab{font-weight:800;font-size:15px;min-width:74px}
.sround .rres{margin:0;font-size:14px}
.gcard{font-size:30px}
.ggrid.g3{max-width:250px}
.olfwrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
/* pergunta 13: imagens grandes, uma de cada referência */
.refimgs{display:grid;gap:22px}
.refimg{display:grid;gap:10px;justify-items:center}
.refq-n{font-weight:800;font-size:18px;color:var(--muted)}
.refpic{width:min(300px,82vw);aspect-ratio:1;border-radius:16px;overflow:hidden;border:3px solid #f3ead7;box-shadow:inset 0 0 0 4px #231f1a,0 10px 30px rgba(0,0,0,.35)}
.refpic svg{width:100%;height:100%;display:block}
.refpic.gcard{display:block;cursor:default}
.refops{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.refops .opt{font-size:17px;padding:10px 14px}
.olfwrap .refq{flex:1;min-width:200px}
.refq h3{font-family:Inter;font-size:18px;font-weight:800;letter-spacing:0;margin:0 0 8px}
.chip.pisca{animation:chipPisca 1s steps(1,end) infinite}
@keyframes chipPisca{0%{background:var(--c);color:#141216}50%{background:#000;color:var(--c)}100%{background:var(--c);color:#141216}}
/* blocos de preço */
.planos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:stretch}
.plano{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.plano.dest{border-color:var(--accent);background:linear-gradient(180deg,#2b2410,#1c1920)}
.plano .pn{font-family:"Bebas Neue";font-size:26px;letter-spacing:1px;color:var(--muted)}
.plano .pp{font-family:"Bebas Neue";font-size:40px;line-height:1}
.plano .pp small{font-family:Inter;font-size:15px;color:var(--muted)}
.plano ul{margin:0;padding-left:18px;font-size:16px;color:#d9d3df;flex:1}
.plano .opt{font-size:16px;padding:10px 12px;justify-content:center;text-align:center}
.grafico{display:grid;gap:10px;margin:14px 0}
.gbar{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;font-size:16px}
.gbar .tr{height:22px;background:#2a2630;border-radius:99px;overflow:hidden}
.gbar .tr i{display:block;height:100%;border-radius:99px}
.gbar b{font-family:"Bebas Neue";font-size:24px;text-align:right}
@media (max-width:620px){.planos{grid-template-columns:1fr}.gbar{grid-template-columns:110px 1fr 30px;font-size:14px}}
@media (prefers-reduced-motion:reduce){.chip.pisca{animation:none}}
.feed{margin-top:20px}
.opt.zap{background:linear-gradient(#2fe27a,#1fae55);border-color:#25d366;color:#04230f;font-weight:800}
.opt.ciente{width:100%;justify-content:flex-start}
.lado{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin:18px 0}
@media (max-width:620px){.lado{grid-template-columns:1fr}}
.eagora{display:flex;flex-direction:column;justify-content:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;font-style:normal}
.flowvid{margin-top:4px}.vidph{margin-top:10px;aspect-ratio:16/9;border-radius:12px;display:grid;place-items:center;text-align:center;color:var(--muted);background:linear-gradient(135deg,#2a1d55,#0f2d5c)}
.fontes{font-size:14px;color:var(--muted);margin:12px 0 0;line-height:1.5}.fontes b{color:#f4f1f6}
.feed h3{margin:16px 0 8px}
@media (prefers-reduced-motion:reduce){.blink,.scene,.fade{animation:none}}
@media (max-width:520px){h1{font-size:44px}h2{font-size:34px}.scale{grid-template-columns:repeat(6,1fr)}.seal b{font-size:15px}.tb small{font-size:9px}}
.popup-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:16px}

function startFlow(f){

/* ============ PEÇAS ============ */
function shareBox(onde){
  const wa = "https://wa.me/?text="+encodeURIComponent(SHARE_MSG);
  return `<div class="card-dark share fade"><b style="font-size:22px">📣 Convide alguém</b>
    <p>Quem você convidar também ganha a temporada 2 de graça, enquanto tiver vaga.</p>
    <div class="row2"><a class="btn" href="${wa}" target="_blank" rel="noopener" onclick="shared('${onde}','whatsapp')">Mandar no WhatsApp</a>
    <button class="btn ghost" onclick="copyLink(this,'${onde}')">Copiar link</button></div></div>`;
}
function shared(onde,canal){ (answers.compartilhou=answers.compartilhou||[]).push({pesquisa:cur,onde,canal,quando:new Date().toISOString()}); enviar({evento:"compartilhou",pesquisa:cur,onde,canal}); }
function copyLink(btn,onde){ try{ navigator.clipboard.writeText(SHARE_MSG).then(()=>{btn.textContent="Copiado ✓"; shared(onde,"copiou");},()=>btn.textContent="Não deu para copiar"); }catch(e){ btn.textContent="Não deu para copiar"; } }
function scale(key, val, legend){
  return `<div class="scale">${Array.from({length:11},(_,v)=>`<button class="opt ${val===v?"sel":""}" onclick="setN('${key}',${v})">${v}</button>`).join("")}</div>
    ${legend?`<div class="scale-legend"><span>${esc(legend[0])}</span><span>${esc(legend[1])}</span></div>`:""}`;
}
function thumbs(key){
  const v=answers[key];
  return `<div class="row2"><button class="opt ${v==="Gostei"?"sel":""}" onclick="setA('${key}','Gostei')">👍 Gostei</button>
    <button class="opt ${v==="Não gostei"?"sel":""}" onclick="setA('${key}','Não gostei')">👎 Não gostei</button></div>`;
}
function redoBox(s){
  const n=(answers[s.id+"_refez"]||[]).length;
  if(refazAsk!==s.id) return `<div class="redo"><button class="back" onclick="refazAsk='${s.id}';rr()">↺ Quero refazer esta parte${n?` (já refez ${n}x)`:""}</button></div>`;
  return `<div class="redo"><p class="sub" style="margin-bottom:10px">Por que você quer refazer?</p>
    <div class="opts">${MOTIVOS.map((m,i)=>`<button class="opt" onclick="refazer(${i})"><span class="k">${L(i)}</span>${m}</button>`).join("")}</div>
    <button class="back" onclick="refazAsk=null;rr()">cancelar</button></div>`;
}
function refazer(i){
  const s=S[idx];
  const ids = s.type==="f2" ? s.gs.map(g=>"f2_"+g.id) : [s.id];
  ids.forEach(id=>{ (answers[id+"_refez"]=answers[id+"_refez"]||[]).push(MOTIVOS[i]);
    ["","_gostou","_nota","_fim","_prato","_acertos"].forEach(k=>{ if(k!==""||s.type==="f1") delete answers[id+k]; }); });
  refazAsk=null; click(); render(); window.scrollTo({top:0});
}
function pickCard(fotoId, cor, sentido, nome){
  return `<div class="pick fade"><div class="ph sel"><div class="img">${fotoHTML(fotoId)}</div><span>${esc(ok(fotoId)?fotoId:"")}</span></div>
    <div><span class="chip" style="background:${cor}">${esc(sentido)}</span>${ok(nome)?`<div class="logo" style="font-size:46px;margin-top:6px">${esc(nome)}</div>`:""}</div></div>`;
}

/* ============ TRILHA ============ */
function drawTrail(s){
  const b = s.bloco==null?0:s.bloco;
  let h="";
  BLOCOS.forEach((nm,i)=>{
    const cls = i<b?"done":i===b?"now":"";
    h+=`<div class="tb ${cls}">${i===b?'<div class="walker">🚶</div>':""}<div class="bar"></div><small>${nm}</small></div>`;
    if(i<BLOCOS.length-1) h+=`<div class="tlock ${i<b?"open":""}">${i<b?"🔓":"🔒"}</div>`;
  });
  h+=`<div class="tend">${b>=BLOCOS.length?'<div style="font-size:22px">🏃</div>':""}🏆<small>Hall da<br>Fama</small></div>`;
  document.getElementById("trail").innerHTML=h;
}

/* visual novo (Sala do Visual, 10/11): estilo escolhido para cada tela */
function aplicaTema(){
  if(!window.TEMA) return;
  if(view==="abertura") return TEMA.set("C","#F5C542","s01","Vídeo de abertura");
  if(view==="escolha") return TEMA.set("C","#4aa8ff","s02","Escolha da pesquisa");
  if(view==="escolhas"||view==="fim") return TEMA.set("M","#3fd6d0","s24b","Minhas escolhas / fim");
  const s=S[idx]||{};
  if(cur==="app"){
    if(s.id==="app_chegada") return TEMA.set("C","#ff8a3d","s03","Como você está agora");
    if(s.type==="f1one") return TEMA.set("C",s.f.cor,"f1_"+s.f.id,"Fase 1 · "+s.f.s);
    if(s.type==="f1page") return TEMA.set("C","#F5C542","f1page","Fase 1");
    if(s.type==="f2") return TEMA.set("X",s.gs[0].cor,"f2_"+s.gs[0].id,"Jogo · "+s.gs.map(g=>g.nome).join(" + "));
    if(s.id==="proposito") return TEMA.set("X","#F5C542","s18","Pra que serve o 7entidos");
    if(s.id==="confianca") return TEMA.set("X","#4aa8ff","s19","Confiança");
    if(s.id==="motivos_nao_comprar"||s.type==="combo") return TEMA.set("M","#ff8a3d","s20","Motivos para não comprar");
    if(s.id==="app_tempo_chute") return TEMA.set("M","#ff5a6e","s21","Quanto tempo passou");
    if(s.type==="revela") return TEMA.set("M","#5ccf8a","s22","Tela do tempo e do Flow");
    if(s.type==="hall2") return TEMA.set("M","#b48cff","s23","Hall da Fama · 100 primeiros");
    if(s.type==="portaoFinal") return TEMA.set("M","#3fd6d0","s24","Portão");
  }
  return TEMA.set("C","#F5C542","r_"+(s.id||s.type||idx),"Reality · "+(s.block||s.type||""));
}
function render(){
  aplicaTema();
  if(view==="abertura") return abertura();
  if(view==="escolha") return escolha();
  if(view==="escolhas") return escolhas();
  if(view==="fim") return fim();
  const s = S[idx]; enterStep();
  document.getElementById("anon").style.display="none";
  const prog=document.getElementById("prog");
  if(cur==="reality"){ prog.style.display="block"; drawTrail(s); document.getElementById("blockName").textContent = s.block || ""; }

    const qn = c.fixo?s.num:s.num+fase;

/* SOM NO CELULAR: o navegador (principalmente o iPhone) deixa o som "pausado" até um toque.
   somPronto() cria o som uma vez só, pede para tocar mesmo no modo silencioso do iPhone
   e manda o som voltar a tocar (resume) a cada toque. Deve ser chamada dentro do toque. */
function somPronto(){
  try{ if(navigator.audioSession && navigator.audioSession.type!=="playback") navigator.audioSession.type="playback"; }catch(e){}
  if(!ac){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    try{ const b=ac.createBuffer(1,1,22050), s=ac.createBufferSource(); s.buffer=b; s.connect(ac.destination); s.start(0); }catch(e){}
  }
  if(ac.state!=="running"){ try{ return ac.resume().then(()=>ac,()=>ac); }catch(e){} }
  return Promise.resolve(ac);
}

function fim(){
  document.getElementById("prog").style.display="none";
  stage.innerHTML = `<div class="scene center"><div class="big-emoji">⭐</div><h1>Valeu demais!</h1>
    <p class="sub">Suas respostas já ajudaram a construir o 7entidos.</p>${shareBox("fim")}
    <div class="stack"><button class="btn ghost" onclick="goEscolha()">Voltar para o início</button></div></div>`;
}
const tmin = s => s==null?"-":Math.floor(s/60)+" min "+(s%60)+" s";
function linhas(){
  const out=[];
  ["reality","app"].forEach(f=>{
    if(!done[f] && !FLOWS[f].some(s=>s.num && isDone(s))) return;
    out.push(""); out.push(f==="reality"?"PESQUISA DO REALITY":"PESQUISA DO APP");
    FLOWS[f].filter(s=>s.num).forEach(s=>{
      if(s.type==="cast") out.push("Perfil "+(s.i+1)+" ("+s.c.sentido+"): "+(answers[s.id+"_foto"]||"-")+" / "+(answers[s.id+"_nome"]||"-")+" / "+(answers[s.id+"_tipo"]||"-"));
      else if(s.type==="vilao") out.push("Vilão: "+(answers.vilao_foto||"-")+" / "+(answers.vilao_nome||"-")+" / "+(answers.vilao_tipo||"-"));
      else if(s.type==="elenco") out.push("Elenco: "+(answers.elenco||"-"));
      else if(s.type==="comodo") out.push("Cômodo "+s.r.nome+": "+(answers[s.id]||"-"));
      else if(s.type==="f1") out.push(s.num+". Fase 1 - "+s.f.s+": "+((Array.isArray(answers[s.id])?answers[s.id]:[]).join(", ")||"-")+" / "+(answers[s.id+"_gostou"]||"-"));
      else if(s.type==="f1one") out.push(s.num+". Fase 1 - "+s.f.s+": "+((Array.isArray(answers[s.id])?answers[s.id]:[]).join(", ")||"-"));
      else if(s.type==="f1page") FASE1.forEach((x,i)=>out.push((s.num+i)+". Fase 1 - "+x.s+": "+((Array.isArray(answers["f1_"+x.id])?answers["f1_"+x.id]:[]).join(", ")||"-")));
      else if(s.type==="f2") s.gs.forEach((g,i)=>{ const id="f2_"+g.id; out.push((s.num+i)+". Fase 2 - "+g.nome+": "+(answers[id+"_fim"]||"-")+(answers[id+"_acertos"]!=null?" ("+answers[id+"_acertos"]+"/3 acertos)":"")+" / nota "+(answers[id+"_nota"]??"-")+" / tempo "+tmin(answers[id+"_tempo_seg"])); });
      else if(s.type==="combo"){ out.push(s.num+". "+s.mt.title+": "+((answers.motivos_nao_comprar||[]).join(", ")||"-")); out.push("Tempo que achou: "+(answers.app_tempo_chute||"-")+" / tempo real: "+tmin(answers.app_tempo_real_seg)); }
      else if(s.type==="tempo") out.push("Tempo que achou: "+(answers[s.id]||"-")+" / tempo real: "+tmin(answers[f+"_tempo_real_seg"]));
      else out.push(s.title+": "+(answers[s.id]??"-"));
    });
    if(f==="app"){ out.push("Referência das imagens: "+(answers.f2_olfato_referencia||"-")); out.push("Flow: "+(answers.app_flow||"-")); out.push("Como você saiu (0 a 10): "+(answers.app_saida??"-")); }
    if(f==="app"){ const c=campeas(); out.push("Jogo campeão pelo que você falou: "+(c.pelo_que_falou?c.pelo_que_falou.nome:"-")+" / pelo que você fez: "+(c.pelo_que_fez?c.pelo_que_fez.nome:"-")); }
  });
  return out;
}
let downloads = null;
try{ window.claude && claude.use("downloads").then(d=>{ downloads=d; if(view==="escolhas") escolhas(); }).catch(()=>{}); }catch(e){}
function escolhas(){
  document.getElementById("prog").style.display="none";
  stage.innerHTML = `<div class="scene center">
    <div class="logo" style="margin:20px 0 6px"><i>7</i>ENTIDOS</div><p class="sub">Suas escolhas estão prontas.</p>
    <div class="stack" style="max-width:420px;margin:18px auto">
      ${downloads?`<button class="btn" onclick="baixarPDF()">Baixar minhas escolhas em PDF</button>`:`<button class="btn" onclick="copiar(this)">Copiar minhas escolhas</button>`}
      <div class="err" id="perr"></div></div>
    <div class="card-dark" style="text-align:left;max-width:420px;margin:0 auto">
      ${REDES.filter(r=>r.url).map(r=>`<div>${r.ic} <a href="${r.url}" target="_blank" rel="noopener">${esc(r.nome)}</a></div>`).join("")}</div>
    <div style="max-width:420px;margin:0 auto;text-align:left">${shareBox("escolhas")}</div>
    <div class="stack" style="max-width:420px;margin:18px auto"><button class="btn ghost" onclick="view='flow';render()">← Voltar ao portão</button></div></div>`;
}
async function baixarPDF(){
  const err=document.getElementById("perr");
  try{
    const { jsPDF } = window.jspdf; const doc = new jsPDF({unit:"mm",format:"a4"});
    doc.setFillColor(16,14,18); doc.rect(0,0,210,34,"F");
    doc.setTextColor(245,197,66); doc.setFont("helvetica","bold"); doc.setFontSize(26); doc.text("7ENTIDOS",15,20);
    doc.setTextColor(255,255,255); doc.setFontSize(11); doc.text("Minhas escolhas - pesquisa 7entidos",15,28);
    doc.setTextColor(30,30,30); doc.setFont("helvetica","normal"); doc.setFontSize(11);
    let y=46;
    linhas().forEach(l=>{ doc.splitTextToSize(l||" ",180).forEach(t=>{ if(y>275){doc.addPage();y=20;} doc.text(t,15,y); y+=6; }); y+=1; });
    await downloads.save({filename:"minhas-escolhas-7entidos.pdf", data:doc.output("blob")});
    err.style.color="#9be7b0"; err.textContent="PDF salvo ✓";
  }catch(e){ err.style.color=""; err.textContent = e && e.code==="declined" ? "Tudo bem, o PDF não foi salvo." : "Não deu para gerar o PDF aqui. Tente de novo."; }
}
function copiar(btn){ try{ navigator.clipboard.writeText(linhas().join("\n")).then(()=>btn.textContent="Copiado ✓",()=>btn.textContent="Não deu para copiar"); }catch(e){ btn.textContent="Não deu para copiar"; } }
/* CLIQUE DE CONFIRMAÇÃO: "tic" curto e grave, como a seta de carro novo (não incomoda) */
function click(){ try{ somPronto().then(c=>{ try{ const t=c.currentTime, o=c.createOscillator(), f=c.createBiquadFilter(), g=c.createGain(); o.type="square"; o.frequency.setValueAtTime(150,t); f.type="lowpass"; f.frequency.value=900; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.2,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+.07); o.connect(f).connect(g).connect(c.destination); o.start(t); o.stop(t+.08); }catch(e){} }); }catch(e){} }

if(location.hash==="#app"){ startFlow("app"); } else render();

<style>
#tranca{position:fixed;inset:0;z-index:9998;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px 20px;text-align:center;overflow:auto;
background:radial-gradient(ellipse 80% 60% at 50% 40%,#1b2a5c 0%,#0d1636 55%,#060a1c 100%);color:#f6e7b8;font-family:Inter,system-ui,sans-serif}
#tranca .t-logo{font-family:"Bebas Neue",sans-serif;font-size:clamp(30px,7vw,48px);letter-spacing:3px;background:linear-gradient(180deg,#fff1c2,#f5c542 45%,#b9821c);-webkit-background-clip:text;background-clip:text;color:transparent}
#tranca .t-tit{font-family:"Bebas Neue",sans-serif;font-size:clamp(36px,9vw,64px);line-height:1;color:#fff6dc;animation:t-pisca 1.6s ease-in-out infinite}
@keyframes t-pisca{0%,100%{opacity:1}50%{opacity:.45}}
#tranca p{max-width:460px;margin:0;font-size:19px;color:#e9dcb4}
#tranca form{width:min(420px,100%);display:flex;flex-direction:column;gap:12px;text-align:left}
#tranca input[type=text],#tranca input[type=email]{width:100%;padding:14px 16px;border-radius:12px;border:2px solid #f5c542;background:#0b1430;color:#fff;font-size:18px;box-sizing:border-box}
#tranca label.lg{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:#d9cfae;line-height:1.35}
#tranca label.lg input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:#f5c542}
#tranca button{padding:16px;border:0;border-radius:14px;background:linear-gradient(180deg,#ffe08a,#f5c542);color:#1a1405;font-weight:800;font-size:20px;cursor:pointer}
#tranca .t-err{color:#ff9a8a;font-size:15px;min-height:18px}
</style>
<div id="tranca" role="dialog" aria-label="As 100 vagas acabaram">
  <div class="t-logo">A Casa dos 7 Sentidos</div>
  <div class="t-tit">As 100 vagas desta sala acabaram</div>
  <p>Deixe seu nome e e-mail e seja avisado quando abrirem as próximas salas.</p>
  <form id="t-form" novalidate>
    <input type="text" id="t-nome" placeholder="Seu nome" autocomplete="name">
    <input type="email" id="t-email" placeholder="Seu e-mail" autocomplete="email">
    <label class="lg"><input type="checkbox" id="t-lgpd"> Estou ciente de que meu nome e e-mail serão usados só para me avisar sobre as próximas salas do 7entidos (LGPD).</label>
    <div class="t-err" id="t-err"></div>
    <button type="submit">Quero ser avisado</button>
  </form>
</div>
<script>
(function(){
  var URL=(window.PESQUISA_URL||""); if(!URL) return;
  try{ if(localStorage.getItem("7e_respondeu")==="1") return; }catch(e){}
  var tela=document.getElementById("tranca");
  function trancar(){ tela.style.display="flex"; document.body.style.overflow="hidden";
    document.querySelectorAll("video").forEach(function(v){ try{v.pause();}catch(e){} }); }
  fetch(URL+"?acao=vagas",{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){ if(d&&d.trancada) trancar(); }).catch(function(){});
  document.getElementById("t-form").addEventListener("submit",function(ev){
    ev.preventDefault();
    var n=document.getElementById("t-nome").value.trim(), m=document.getElementById("t-email").value.trim(), ok=document.getElementById("t-lgpd").checked, er=document.getElementById("t-err");
    if(!n){ er.textContent="Escreva seu nome."; return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){ er.textContent="Confira o e-mail."; return; }
    if(!ok){ er.textContent="Marque a caixinha de ciência para continuar."; return; }
    try{ fetch(URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({evento:"espera",nome:n,email:m,lgpd:true})}).catch(function(){}); }catch(e){}
    this.outerHTML='<p style="font-size:22px;color:#f5c542;font-weight:800">Pronto! Você está na lista. ✨</p><p>Assim que a próxima sala abrir, a gente te avisa por e-mail.</p>';
  });
})();
</script>
