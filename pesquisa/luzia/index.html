<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pesquisa 1 de 7 · Luzia · A Casa dos 7 Sentidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--y:#ffcf3a;--y2:#f5a623;--b:#1d3b8a;--b2:#0b1640;--b3:#2f5bd1;--ink:#fff;--muted:#c9d4f5}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;font-size:21px;line-height:1.4;color:var(--ink);min-height:100vh;
background:radial-gradient(circle at 88% 5%,rgba(255,207,58,.28) 0 30px,rgba(255,207,58,.07) 31px 120px,transparent 121px),
radial-gradient(ellipse at 50% -10%,rgba(47,91,209,.28),transparent 60%),
linear-gradient(180deg,#0b1640,#132a66 55%,#10245a);background-attachment:fixed}
/* redemoinho Van Gogh: mantido, mas so no canto e bem suave */
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
background:repeating-radial-gradient(circle at 10% 6%,rgba(150,180,255,.55) 0 1px,transparent 1px 30px);opacity:.16;
-webkit-mask-image:radial-gradient(circle at 10% 6%,#000 0,transparent 38%);mask-image:radial-gradient(circle at 10% 6%,#000 0,transparent 38%)}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
background:radial-gradient(circle at 22% 18%,rgba(255,255,255,.55) 0 1px,transparent 2px),radial-gradient(circle at 76% 30%,rgba(255,207,58,.5) 0 1.5px,transparent 2.5px),radial-gradient(circle at 92% 62%,rgba(255,255,255,.4) 0 1px,transparent 2px)}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px 150px}
/* topo */
.topo{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cont{font-family:"Bebas Neue";font-size:24px;letter-spacing:1.5px;background:var(--y);color:#0b1640;padding:4px 12px;border-radius:10px;box-shadow:0 4px 0 #b88a12}
.logo{margin-left:auto;font-family:"Bebas Neue";font-size:28px;letter-spacing:2px}
.logo i{font-style:normal;color:var(--y)}
.anon{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:#0b1640;background:var(--y);border-radius:12px;padding:6px 12px;margin:6px 0 10px;animation:anon 1.4s steps(1) infinite}
@keyframes anon{50%{background:#0b1640;color:var(--y)}}
/* trilha */
.trilha{display:flex;gap:6px;align-items:flex-end;margin:4px 0 12px;overflow-x:auto;padding:4px 2px 2px}
.mor{flex:1;min-width:60px;text-align:center;position:relative}
.mor .f{width:58px;height:58px;margin:0 auto;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.25);background:#2a3560;position:relative}
.mor .f img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.mor.off .f img,.mor.off .f svg{filter:grayscale(1) brightness(.55)}
.mor.on .f{border-color:var(--y);box-shadow:0 0 0 4px rgba(255,207,58,.3),0 0 22px rgba(255,207,58,.7);transform:scale(1.1)}
.mor .cad{position:absolute;right:calc(50% - 34px);top:34px;font-size:18px;filter:drop-shadow(0 2px 2px #000)}
.mor small{display:block;font-size:13px;font-weight:800;margin-top:4px;color:var(--muted)}
.mor.on small{color:var(--y)}
.passos{display:flex;gap:5px;margin:0 0 14px}
.passos i{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.18)}
.passos i.ok{background:var(--y)}
.passos i.agora{background:repeating-linear-gradient(90deg,var(--y) 0 6px,rgba(255,255,255,.2) 6px 11px)}
.vagas{display:inline-block;margin:0 0 10px;font-weight:800;font-size:17px;padding:6px 14px;border-radius:99px;background:#fff;color:#0b1640}
/* cena */
.cena{animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.qn{font-family:"Bebas Neue";font-size:24px;letter-spacing:2px;color:var(--y)}
h1{font-family:"Bebas Neue";font-weight:400;font-size:clamp(54px,12vw,86px);line-height:.9;margin:4px 0 4px;letter-spacing:1px;text-shadow:0 6px 24px rgba(0,0,0,.5)}
h2{font-family:"Bebas Neue";font-weight:400;font-size:clamp(38px,8vw,52px);line-height:1;margin:2px 0 8px;letter-spacing:1px}
.sub{color:var(--y);font-weight:700;font-size:20px;margin:0 0 14px}
/* briefing */
.brief{display:grid;grid-template-columns:1fr 1.05fr;gap:18px;align-items:center}
@media(max-width:600px){.brief{grid-template-columns:1fr}}
.retrato{position:relative;border-radius:22px;overflow:hidden;border:5px solid var(--y);box-shadow:0 26px 50px rgba(0,0,0,.55),0 0 40px rgba(255,207,58,.35);transform:rotate(-2deg);aspect-ratio:3/4}
.retrato img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.sentido{display:inline-flex;align-items:center;gap:8px;background:var(--y);color:#0b1640;font-weight:800;font-size:17px;padding:5px 14px;border-radius:99px}
.apelido{font-family:Caveat;font-size:30px;color:#fff;margin:4px 0 8px}
.ficha{background:rgba(11,22,64,.75);border:2px solid rgba(255,207,58,.5);border-radius:18px;padding:14px 16px;font-size:20px}
.ficha p{margin:0}
/* looks */
.looks{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.looks{gap:10px}}
.look{background:rgba(11,22,64,.7);border:3px solid rgba(255,255,255,.15);border-radius:20px;padding:10px;box-shadow:0 18px 36px rgba(0,0,0,.45)}
.look.ok{border-color:var(--y)}
.foto{aspect-ratio:3/4;border-radius:14px;overflow:hidden;position:relative;display:grid;place-items:center;text-align:center}
.foto img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.foto .ph{padding:10px;font-weight:800;font-size:16px;color:#0b1640;background:rgba(255,255,255,.85);border-radius:12px;margin:10px}
.look b{display:block;font-size:19px;margin:8px 2px 6px;line-height:1.15}
.nota10{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.nota10 button{all:unset;cursor:pointer;text-align:center;font-family:"Bebas Neue";font-size:24px;padding:6px 0;border-radius:9px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.18);transition:transform .1s}
.nota10 button:hover{transform:translateY(-2px);border-color:var(--y)}
.nota10 button.sel{background:var(--y);color:#0b1640;border-color:var(--y);transform:scale(1.08)}
.legenda{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px}
.linha-nome{display:flex;align-items:center;gap:10px;margin:0 0 4px}
.linha-nome span{font-size:30px}
/* opções */
.opts{display:grid;gap:12px}
.op{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;background:rgba(11,22,64,.75);border:3px solid rgba(255,255,255,.18);border-radius:18px;padding:16px 18px;font-size:22px;font-weight:800;box-shadow:0 8px 0 rgba(0,0,0,.35);transition:transform .12s,border-color .12s}
.op:hover,.op:focus-visible{border-color:var(--y);transform:translateY(-2px)}
.op.sel{background:var(--y);color:#0b1640;border-color:var(--y)}
.op .k{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:"Bebas Neue";font-size:28px;background:var(--y);color:#0b1640}
.op.sel .k{background:#0b1640;color:var(--y)}
.op small{display:block;font-weight:600;font-size:16px;opacity:.85}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo .op{flex-direction:column;justify-content:center;text-align:center;min-height:120px;font-size:24px;padding:18px 12px}
.duo .op .em{font-size:40px}
.duo .op .em svg{width:54px;height:54px;color:var(--y);display:block;margin:0 auto 4px}
.duo .op.sel .em svg{color:#0b1640}
.vs{font-family:"Bebas Neue";text-align:center;color:var(--y);font-size:22px;margin:-4px 0}
.linhas{display:grid;gap:18px;perspective:1200px}
.lin{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:grid;grid-template-columns:150px 1fr auto;gap:18px;align-items:center;padding:14px 18px 14px 14px;border-radius:24px;
background:linear-gradient(145deg,rgba(47,91,209,.30),rgba(11,22,64,.88) 60%);border:1px solid rgba(255,255,255,.16);
box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 0 rgba(255,255,255,.04),0 22px 40px -12px rgba(0,0,0,.75),0 8px 16px rgba(0,0,0,.35);
-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;transform:rotateX(4deg)}
.lin:hover,.lin:focus-visible{transform:rotateX(0) translateY(-4px);border-color:rgba(255,207,58,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 30px 50px -14px rgba(0,0,0,.85),0 0 0 1px rgba(255,207,58,.35),0 0 34px rgba(255,207,58,.18)}
.lin.sel{border-color:var(--y);background:linear-gradient(145deg,rgba(255,207,58,.30),rgba(11,22,64,.9) 65%);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 0 2px var(--y),0 26px 46px -12px rgba(0,0,0,.8),0 0 40px rgba(255,207,58,.35)}
.lin .mini{position:relative;height:150px}
.lin .mini div{position:absolute;top:6px;width:88px;aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.85);box-shadow:0 14px 24px rgba(0,0,0,.6);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.lin .mini div:first-child{left:0;transform:rotate(-8deg);z-index:1}
.lin .mini div:last-child{left:54px;transform:rotate(6deg) translateY(6px);z-index:2}
.lin:hover .mini div:first-child{transform:rotate(-12deg) translateX(-4px)}
.lin:hover .mini div:last-child{transform:rotate(10deg) translate(6px,2px)}
.lin .mini img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;display:block}
.lin .mini .vazio{display:grid;place-items:center;font-size:12px;font-weight:800;color:#0b1640;text-align:center;padding:4px}
.lin b{font-family:"Bebas Neue";font-size:38px;font-weight:400;letter-spacing:1.5px;display:block;line-height:1;text-shadow:0 3px 10px rgba(0,0,0,.5)}
.lin span{display:block;font-size:16px;color:var(--muted);margin-top:4px;line-height:1.3}
.lin .media{display:inline-block;margin-top:8px;font-size:14px;color:#0b1640;background:var(--y);font-weight:800;padding:3px 10px;border-radius:99px}
.lin .marca{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.35);display:grid;place-items:center;font-weight:800;color:transparent;background:rgba(255,255,255,.06);transition:.2s}
.lin.sel .marca{background:var(--y);border-color:var(--y);color:#0b1640;box-shadow:0 0 16px rgba(255,207,58,.7)}
@media(max-width:520px){.lin{grid-template-columns:118px 1fr;gap:12px}.lin .mini{height:126px}.lin .mini div{width:72px}.lin .mini div:last-child{left:42px}.lin .marca{position:absolute;top:10px;right:10px}.lin b{font-size:32px}}
/* rostos da Luzia nas perguntas do jeito dela */
.rosto{position:relative;width:118px;height:118px;margin:0 auto 10px;border-radius:50%;overflow:hidden;border:3px solid var(--y);box-shadow:0 14px 26px rgba(0,0,0,.55),0 0 0 6px rgba(255,207,58,.12)}
.op.sel .rosto{border-color:#0b1640;box-shadow:0 14px 26px rgba(0,0,0,.4),0 0 0 6px rgba(11,22,64,.18)}
.rosto img{width:100%;height:100%;object-fit:cover;display:block}
.rosto.ma img{filter:contrast(1.25) saturate(1.1) brightness(.82) hue-rotate(-8deg)}
.rosto.ma:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,transparent 30%,rgba(120,0,20,.55) 85%);mix-blend-mode:multiply}
.rosto.escondido img{filter:brightness(.62) saturate(.7)}
.rosto.escondido:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(5,10,30,.9) 0 26%,rgba(5,10,30,.35) 42%,transparent 60%)}
.rosto.chora img{filter:saturate(.85) brightness(.95)}
.rosto .lag{position:absolute;inset:0;z-index:2;pointer-events:none}
.rosto.desconfia img{filter:contrast(1.1) brightness(.9);transform:scale(1.12) translateX(-6%)}
.rosto.desconfia:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,10,30,.55) 0 22%,transparent 40%,transparent 70%,rgba(5,10,30,.5))}
.rosto.confia:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,207,58,.0) 40%,rgba(255,207,58,.35))}
/* balão */
.fala{display:flex;gap:12px;align-items:flex-start;margin:4px 0 16px}
.fala .av{flex:none;width:70px;height:70px;border-radius:50%;overflow:hidden;border:3px solid var(--y)}
.fala .av img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.balao{position:relative;background:#fff;color:#0b1640;border-radius:18px;padding:12px 16px;font-family:Caveat;font-size:28px;line-height:1.1;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.balao:before{content:"";position:absolute;left:-10px;top:22px;border:10px solid transparent;border-right-color:#fff;border-left:0}
/* botões */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;justify-content:center;align-items:center;gap:8px;background:var(--y);color:#0b1640;font-weight:800;font-size:22px;padding:16px 26px;border-radius:16px;box-shadow:0 7px 0 #b88a12,0 14px 24px rgba(0,0,0,.35);text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 3px 0 #b88a12}
.btn.full{width:100%}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;border:2px solid rgba(255,255,255,.3);box-shadow:none}
.btn.zap{background:#25d366;color:#04230f;box-shadow:0 7px 0 #128c45}
.btn:focus-visible,.op:focus-visible,.lin:focus-visible{outline:3px solid #fff;outline-offset:3px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px}
.link{all:unset;cursor:pointer;color:var(--muted);font-size:18px;padding:8px;text-decoration:underline}
.link:hover{color:#fff}
.err{min-height:24px;color:#ffd5cf;font-size:17px;margin-top:8px}
.center{text-align:center}
.stack{display:grid;gap:12px;margin-top:18px}
/* final */
.fotofim{width:150px;height:150px;margin:6px auto 8px;border-radius:50%;overflow:hidden;border:4px solid var(--y);box-shadow:0 0 0 8px rgba(255,207,58,.15),0 0 46px rgba(255,207,58,.55),0 20px 34px rgba(0,0,0,.55);animation:brilho2 2.2s ease-in-out infinite}
.fotofim img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
@keyframes brilho2{50%{box-shadow:0 0 0 12px rgba(255,207,58,.08),0 0 64px rgba(255,207,58,.75),0 20px 34px rgba(0,0,0,.55)}}
.btn.travado{flex-direction:column;gap:2px;background:rgba(255,255,255,.08);color:#dfe6ff;border:2px dashed rgba(255,255,255,.35);box-shadow:none;cursor:not-allowed}
.btn.travado small{font-size:16px;font-weight:600;color:var(--muted)}
.btn.travado b{font-family:"Bebas Neue";font-size:26px;letter-spacing:2px;color:var(--y);font-weight:400}
.mor .relogio{position:absolute;left:50%;top:21px;transform:translateX(-50%);font-family:"Bebas Neue";font-size:14px;letter-spacing:.5px;color:var(--y);background:rgba(11,22,64,.85);padding:1px 5px;border-radius:6px;white-space:nowrap;text-shadow:0 1px 2px #000}
.estrela{width:120px;height:120px;margin:10px auto;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,var(--y) 30%,rgba(255,207,58,0) 70%);animation:brilho 1.6s ease-in-out infinite}
@keyframes brilho{50%{transform:scale(1.15);filter:brightness(1.3)}}
.confete{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confete i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:cai 2.6s ease-in forwards}
@keyframes cai{to{transform:translateY(110vh) rotate(720deg)}}
.porta{width:160px;height:230px;margin:10px auto;border-radius:12px 12px 0 0;background:linear-gradient(90deg,#16306f,#2f5bd1,#16306f);border:6px solid #d9b56a;position:relative;box-shadow:0 0 40px rgba(255,207,58,.4)}
.porta:after{content:"🔒";position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:56px}
.trava{background:rgba(11,22,64,.85);border:3px solid var(--y);border-radius:22px;padding:22px;text-align:center}
/* lista de espera */
.espera{display:grid;gap:12px;text-align:left;margin-top:14px}
.txt{all:unset;box-sizing:border-box;width:100%;background:#fff;color:#0b1640;font-size:20px;padding:14px 16px;border-radius:14px;border:3px solid transparent}
.txt:focus{border-color:var(--y)}
.duo2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt2{all:unset;cursor:pointer;text-align:center;font-weight:800;font-size:19px;padding:12px;border-radius:14px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3)}
.opt2.sel{background:var(--y);color:#0b1640;border-color:var(--y)}
.lgpd{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.35;color:#dfe6ff;cursor:pointer}
.lgpd input{width:24px;height:24px;flex:none;margin-top:2px;accent-color:#ffcf3a}
.lgpd a{color:var(--y)}
/* barra de validação (só na prévia) */
.val{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#111018;border-top:3px solid #ff8a3d;padding:10px 14px;font-size:16px;color:#fff;box-shadow:0 -10px 30px rgba(0,0,0,.6)}
.val .row{max-width:760px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.val b{color:#ff8a3d}
.val button{all:unset;cursor:pointer;font-weight:800;font-size:15px;padding:8px 12px;border-radius:10px;background:#2a2533}
.val .v{background:#3fae6a;color:#04230f}.val .r{background:#ff8a3d;color:#1a0d02}
.val .t{background:transparent;text-decoration:underline;color:#cfc8d8;font-weight:600}
.val .chips{display:flex;flex-wrap:wrap;gap:6px;max-width:760px;margin:8px auto 0}
.val .chips button{background:#2a2533;border:1px solid #555}
.val .chips button.on{background:#ff8a3d;color:#1a0d02}
.val .st{margin-left:auto;font-weight:800}
.resumo{max-width:760px;margin:10px auto 0;max-height:46vh;overflow:auto;background:#1b1824;border-radius:12px;padding:12px}
.resumo li{margin:4px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="confete" id="confete"></div>
<div class="wrap">
  <div class="topo"><span class="cont">Pesquisa 1 de 7</span><div class="logo"><i>7</i>ENTIDOS</div></div>
  <div id="trilha"></div>
  <main id="tela"></main>
</div>
<div class="val" id="val"></div>
<script src="../config.js"></script>
<script>
/* ===== CONFIGURAÇÃO ===== */
const ENDPOINT=(window.PESQUISA_URL||"");  /* robô da planilha (endereço fica em ../config.js) */
const ABA="Luzia";
const LIMITE=100, MOSTRA_CONTADOR=60;
let RESPOSTAS_JA=0;         /* vem da planilha (aba "Reality · Respostas"); na prévia dá para simular embaixo */
const NO_SITE=/(^|\.)7entidos\.com\.br$/.test(location.hostname);
const ZAP="Respondi a pesquisa da Luzia, do reality A Casa dos 7 Sentidos (7entidos, app santista 013). É anônima e leva 2 minutos. Só 100 vagas: https://7entidos.com.br/pesquisa";

const MORADORES=[
  {n:"Luzia",f:"luzia.jpg"},{n:"Duda",f:"duda.jpg"},{n:"Yara",f:"yara.jpg"},{n:"Rafa",f:"rafa.jpg"},
  {n:"Tonho",f:"tonho.jpg"},{n:"Beto",f:"beto.jpg"},{n:"Lucas",f:""}];
/* fotos dos looks: quando chegarem, é só colocar o nome do arquivo em "f" */
const LINHAS=[
  {id:"aconchego",nome:"Aconchego",em:"🌻",frase:"Para as madrugadas de estudo.",looks:[
    {id:"cardiga_girassol",nome:"Cardigã girassol",f:"look-cardiga-girassol.jpg",bg:"linear-gradient(160deg,#ffcf3a,#f5a623 55%,#6b4a12)"},
    {id:"moletom_noite_estrelada",nome:"Moletom “Noite Estrelada”",f:"look-moletom-noite-estrelada.jpg",bg:"repeating-radial-gradient(circle at 30% 30%,#2f5bd1 0 8px,#0b1640 8px 16px),#0b1640"}]},
  {id:"trabalho",nome:"Trabalho",em:"🎨",frase:"Para o dia a dia, de mão na massa.",looks:[
    {id:"macacao_tinta",nome:"Macacão com manchas de tinta",f:"",bg:"radial-gradient(circle at 30% 30%,#ffcf3a 0 10%,transparent 11%),radial-gradient(circle at 70% 60%,#ff5a6e 0 8%,transparent 9%),radial-gradient(circle at 40% 80%,#2f5bd1 0 9%,transparent 10%),#c9b89a"},
    {id:"jaqueta_campo_trigo",nome:"Jaqueta “Campo de trigo”",f:"look-jaqueta-campo-trigo.jpg",bg:"repeating-linear-gradient(70deg,#e8b923 0 6px,#c98a12 6px 10px,#7fa36a 10px 13px)"}]},
  {id:"elegante",nome:"Elegante",em:"✨",frase:"Para a noite de festa na casa.",looks:[
    {id:"vestido_terraco_cafe",nome:"Vestido “Terraço do café à noite”",f:"look-vestido-terraco-cafe.jpg",bg:"linear-gradient(180deg,#0b1640 0 40%,#ffcf3a 40% 70%,#f5a623 70%)"},
    {id:"camisa_quarto_arles",nome:"Camisa “Quarto em Arles”",f:"look-camisa-quarto-arles.jpg",bg:"linear-gradient(90deg,#2f5bd1 0 33%,#ffcf3a 33% 66%,#ff8a3d 66%)"}]}
];
/* rostos da Luzia: para trocar por fotos novas, é só mudar o nome do arquivo em "f" */
const PERS=[
  {id:"perdoa_ou_troco",q:"Você acha que a Luzia é mais...",a:["Perdoa",{f:"rosto-serena.jpg",c:"serena"}],b:["Dá o troco",{f:"rosto-lado.jpg",c:"ma"}]},
  {id:"chora",q:"Quando dói, a Luzia...",a:["Chora escondido",{f:"rosto-serena.jpg",c:"escondido chora",lag:"<svg class='lag' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#fff' stop-opacity='.95'/><stop offset='1' stop-color='#9cc7ff' stop-opacity='.75'/></linearGradient></defs><path d='M74 54c0 0-4 6-4 9a4 4 0 0 0 8 0c0-3-4-9-4-9z' fill='url(#g)'/><path d='M74 68l0 10' stroke='#cfe3ff' stroke-opacity='.7' stroke-width='1.6' stroke-linecap='round'/></svg>"}],b:["Chora na frente",{f:"rosto-frente.jpg",c:"chora",lag:"<svg class='lag' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#fff' stop-opacity='.95'/><stop offset='1' stop-color='#9cc7ff' stop-opacity='.75'/></linearGradient></defs><path d='M38 50c0 0-4 6-4 9a4 4 0 0 0 8 0c0-3-4-9-4-9z' fill='url(#g)'/><path d='M66 52c0 0-4 6-4 9a4 4 0 0 0 8 0c0-3-4-9-4-9z' fill='url(#g)'/><path d='M38 63v14M66 65v12' stroke='#cfe3ff' stroke-opacity='.7' stroke-width='1.6' stroke-linecap='round'/></svg>"}]},
  {id:"confia",q:"Com as pessoas, a Luzia...",a:["Confia em todo mundo",{f:"rosto-sorriso.jpg",c:"confia"}],b:["Desconfia",{f:"rosto-lado.jpg",c:"desconfia"}]},
  {id:"sonha",q:"Sobre o futuro, a Luzia...",a:["Sonha alto",{f:"rosto-sonha.jpg",c:"sonha"}],b:["Pé no chão",{f:"rosto-frente.jpg",c:"chao"}]}
];
function rosto(r,nome){ return `<span class="rosto ${r.c}"><img src="${r.f}" alt="Luzia: ${esc(nome)}">${r.lag||""}</span>`; }
/* Duda libera em 10/11/2026 ao meio-dia (Brasília) */
const LIBERA_DUDA=new Date("2026-11-10T12:00:00-03:00").getTime();
function dudaLiberada(){ return Date.now()>=LIBERA_DUDA; }
function contagem(){ let t=Math.max(0,Math.floor((LIBERA_DUDA-Date.now())/1000)); const h=Math.floor(t/3600),m=Math.floor(t%3600/60),x=t%60; const p=n=>String(n).padStart(2,"0"); return `${p(h)}:${p(m)}:${p(x)}`; }
let _liberou=dudaLiberada();
setInterval(()=>{ if(PASSOS[idx]&&PASSOS[idx].t!=="fim"||extra) return; if(!_liberou&&dudaLiberada()){ _liberou=true; render(); return; } document.querySelectorAll(".cd").forEach(e=>e.textContent=contagem()); },1000);
/* roteiro: cada tela é um passo */
const PASSOS=[{t:"capa",nome:"Briefing da Luzia"},...LINHAS.map((l,i)=>({t:"linha",i,nome:"Looks · linha "+l.nome})),{t:"favorita",nome:"Linha favorita"},...PERS.map((p,i)=>({t:"pers",i,nome:"Personalidade "+(i+1)})),{t:"fim",nome:"Parabéns / sala liberada"}];

/* ===== ESTADO ===== */
let idx=0, R={}, extra=null, t0=Date.now();
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
let AC; function som(f,d=.12,v=.12){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d+.02)}catch(e){}}

function trilha(){
  const p=PASSOS[idx], fim=p.t==="fim";
  $("trilha").innerHTML=`<div class="trilha">${MORADORES.map((m,i)=>{const on=i===0;const foto=m.f?`<img src="${m.f}" alt="">`:`<svg viewBox="0 0 60 60"><circle cx="30" cy="24" r="12" fill="#8c8495"/><path d="M8 60c0-14 10-22 22-22s22 8 22 22z" fill="#8c8495"/></svg>`;
    const rel=fim&&i===1&&!dudaLiberada();
    return `<div class="mor ${on?"on":"off"}"><div class="f">${foto}</div>${rel?`<span class="relogio cd">${contagem()}</span>`:""}${on?(fim?'<span class="cad">✅</span>':""):(fim&&i===1&&dudaLiberada()?"":'<span class="cad">🔒</span>')}<small>${m.n}</small></div>`;}).join("")}</div>
  ${p.t!=="capa"&&p.t!=="fim"?`<div class="passos">${PASSOS.slice(1,-1).map((x,i)=>`<i class="${i+1<idx?"ok":i+1===idx?"agora":""}"></i>`).join("")}</div>`:""}`;
}
function vagas(){ return RESPOSTAS_JA>=MOSTRA_CONTADOR&&RESPOSTAS_JA<LIMITE?`<div class="vagas">⏳ Faltam ${LIMITE-RESPOSTAS_JA} das 100 vagas</div>`:""; }
function fotoLook(l){ return l.f?`<img src="${l.f}" alt="${esc(l.nome)}">`:`<div class="ph">📷 foto do look<br>${esc(l.nome)}</div>`; }
function nav(pulavel){ return `<div class="nav"><button class="link" onclick="voltar()">← voltar</button>${pulavel?`<button class="link" onclick="pular()">pular</button>`:""}</div>`; }

function render(){
  if(RESPOSTAS_JA>=LIMITE && idx===0 && !R._comecou){ return travada(); }
  trilha(); const p=PASSOS[idx]; let h="";
  if(extra==="sala") h=`<div class="center"><h2>A sala da Luzia</h2><div class="porta"></div><p class="sub">Em breve! A porta abre no episódio 2.</p><button class="btn ghost" onclick="extra=null;render()">← voltar</button></div>`;
  else if(extra==="duda") h=`<div class="center"><h2>Próximo morador: Duda</h2><div class="porta" style="background:linear-gradient(90deg,#3a2a6a,#b48cff,#3a2a6a)"></div><p class="sub">A pesquisa 2 de 7, da Duda, abre em breve.</p><button class="btn ghost" onclick="extra=null;render()">← voltar</button></div>`;
  else if(p.t==="capa"){
    h=`<div class="anon">🛡️ Pesquisa 100% anônima · ninguém vai saber quem respondeu</div>${vagas()}
    <div class="brief"><div class="retrato"><img src="luzia.jpg" alt="Luzia"></div>
      <div><span class="sentido">👁️ Visão</span><h1>Luzia</h1><div class="apelido">“Mas todo mundo me chama de Ju.”</div>
        <div class="ficha"><p>A heroína da casa. Rala de madrugada estudando e trabalhando, usa um terço no peito e quer voltar a sentir.</p></div>
        <p style="font-size:18px;color:var(--muted);margin:12px 0 0">Você vai escolher os looks e o jeito dela. Leva uns 2 minutos.</p></div></div>
    <div class="stack"><button class="btn full" onclick="R._comecou=true;ir(1)">Começar →</button></div>`;
  }
  else if(p.t==="linha"){
    const L=LINHAS[p.i];
    h=`<div class="qn">Pergunta ${p.i+1} de 8</div><div class="linha-nome"><span>${L.em}</span><h2>Linha ${L.nome}</h2></div><p class="sub">Dê uma nota de 0 a 10 para cada look. ${L.frase}</p>
    <div class="looks">${L.looks.map(l=>{const v=R[l.id];return `<div class="look ${v!=null&&v!=="pulou"?"ok":""}"><div class="foto" style="background:${l.bg}">${fotoLook(l)}</div><b>${esc(l.nome)}</b>
      <div class="nota10">${Array.from({length:11},(_,n)=>`<button class="${v===n?"sel":""}" onclick="nota('${l.id}',${n})" aria-label="nota ${n}">${n}</button>`).join("")}</div><div class="legenda"><span>0 · não gostei</span><span>10 · amei</span></div></div>`;}).join("")}</div>
    <div class="err" id="err"></div><div class="stack"><button class="btn full" onclick="seguirLinha(${p.i})">Próximo →</button></div>${nav(true)}`;
  }
  else if(p.t==="favorita"){
    h=`<div class="qn">Pergunta 4 de 8</div><h2>De qual linha você mais gosta?</h2><p class="sub">A linha vencedora vira a base de todos os looks da Luzia.</p>
    <div class="linhas">${LINHAS.map((L,i)=>{const ns=L.looks.map(l=>R[l.id]).filter(v=>typeof v==="number");const m=ns.length?(ns.reduce((a,b)=>a+b,0)/ns.length).toFixed(1).replace(".",","):null;
      return `<button class="lin ${R.linha_favorita===L.id?"sel":""}" onclick="escolhe('linha_favorita','${L.id}')"><div class="mini">${L.looks.map(l=>`<div style="background:${l.bg}">${l.f?`<img src="${l.f}" alt="${esc(l.nome)}">`:`<span class="vazio">📷</span>`}</div>`).join("")}</div><div><b>${L.em} ${L.nome}</b><span>${L.looks.map(l=>esc(l.nome)).join(" · ")}</span>${m?`<div class="media">Sua média: ${m}</div>`:""}</div><i class="marca">✓</i></button>`;}).join("")}</div>${nav(true)}`;
  }
  else if(p.t==="pers"){
    const P=PERS[p.i], v=R[P.id];
    h=`<div class="qn">Pergunta ${5+p.i} de 8 · o jeito da Luzia</div>
    ${p.i===0?`<div class="fala"><div class="av"><img src="luzia.jpg" alt=""></div><div class="balao">“Três da manhã e eu aqui, com café e marca-texto...”</div></div>`:""}
    <h2>${P.q}</h2>
    <div class="duo"><button class="op ${v===P.a[0]?"sel":""}" onclick="escolhe('${P.id}','${esc(P.a[0])}')">${rosto(P.a[1],P.a[0])}${P.a[0]}</button>
    <button class="op ${v===P.b[0]?"sel":""}" onclick="escolhe('${P.id}','${esc(P.b[0])}')">${rosto(P.b[1],P.b[0])}${P.b[0]}</button></div>${nav(true)}`;
  }
  else if(p.t==="fim"){
    h=`<div class="center"><div class="fotofim"><img src="luzia.jpg" alt="Luzia"></div><h1 style="font-size:clamp(44px,10vw,70px)">Parabéns!</h1><p class="sub" style="font-size:24px">Você liberou a sala da Luzia! 🔓</p>
    <p style="color:var(--muted);font-size:18px;margin:0">Os looks mais votados entram no episódio 2.</p></div>
    <div class="stack">${dudaLiberada()?`<button class="btn full ghost" onclick="extra='duda';render()">Seguir para o próximo morador: Duda →</button>`:`<button class="btn full travado" disabled aria-disabled="true"><span>🔒 Seguir para o próximo morador: Duda</span><small>libera em <b class="cd">${contagem()}</b></small></button>`}
      <a class="btn full zap" href="https://wa.me/?text=${encodeURIComponent(ZAP)}" target="_blank" rel="noopener">💬 Convidar alguém no WhatsApp</a></div>
    <div class="nav"><button class="link" onclick="voltar()">← voltar</button></div>`;
  }
  $("tela").innerHTML=`<div class="cena">${h}</div>`;
  barra();
}
let ESP={canal:null,lgpd:false,ok:false};
function travada(){ trilha();
  if(ESP.ok){ $("tela").innerHTML=`<div class="cena trava"><h2>Pronto, você está na lista!</h2><p>Assim que abrir uma vaga ou a próxima pesquisa, a gente te avisa.</p><p class="sub">Enquanto isso, acompanhe A Casa dos 7 Sentidos no @7entidoss.</p><a class="btn" href="https://www.instagram.com/7entidoss/" target="_blank" rel="noopener">Seguir o @7entidoss</a></div>`; return barra(); }
  const c=ESP.canal;
  $("tela").innerHTML=`<div class="cena trava"><div style="font-size:54px">🔒</div><h2>A sala da Luzia está trancada</h2>
    <p>As 100 vagas já foram preenchidas. Deixe seu contato e a gente te avisa quando abrir de novo.</p>
    <div class="espera">
      <input class="txt" id="espNome" maxlength="40" placeholder="Seu nome" value="${esc(ESP.nome||"")}">
      <div class="duo2"><button class="opt2 ${c==="whatsapp"?"sel":""}" onclick="espCanal('whatsapp')">💬 WhatsApp</button><button class="opt2 ${c==="email"?"sel":""}" onclick="espCanal('email')">✉️ E-mail</button></div>
      ${c?`<input class="txt" id="espCont" ${c==="email"?'type="email" inputmode="email" placeholder="seu@email.com"':'type="tel" inputmode="tel" placeholder="(13) 99999-9999"'} maxlength="80" value="${esc(ESP.cont||"")}">`:""}
      <label class="lgpd"><input type="checkbox" id="espLgpd" ${ESP.lgpd?"checked":""} onchange="ESP.lgpd=this.checked"> <span>Autorizo o 7entidos a guardar meu nome e contato só para me avisar sobre a pesquisa, conforme a LGPD. Meus dados não ficam ligados a nenhuma resposta e posso pedir para apagar quando quiser. <a href="/privacidade.html" target="_blank" rel="noopener">Política de privacidade</a></span></label>
      <button class="btn full" onclick="espOk()">Quero ser avisado</button>
      <div class="err" id="espErr"></div>
    </div></div>`; barra(); }
function espGuarda(){ const n=$("espNome"), c=$("espCont"); if(n) ESP.nome=n.value; if(c) ESP.cont=c.value; }
function espCanal(c){ espGuarda(); ESP.canal=c; som(600); travada(); }
function espOk(){ espGuarda(); const nome=(ESP.nome||"").trim(), cont=(ESP.cont||"").trim(), e=$("espErr");
  if(!nome){ e.textContent="Escreva o seu nome."; return; }
  if(!ESP.canal){ e.textContent="Escolha WhatsApp ou e-mail."; return; }
  if(ESP.canal==="email"&&!/^\S+@\S+\.\S+$/.test(cont)){ e.textContent="Digite um e-mail válido."; return; }
  if(ESP.canal==="whatsapp"&&cont.replace(/\D/g,"").length<10){ e.textContent="Digite o WhatsApp com DDD."; return; }
  if(!ESP.lgpd){ e.textContent="Marque a caixinha da LGPD para continuar."; return; }
  if(ENDPOINT){ try{ fetch(ENDPOINT,{method:"POST",mode:"no-cors",keepalive:true,headers:{"Content-Type":"text/plain"},body:JSON.stringify({tipo:"lista_espera",pesquisa:"luzia",quando:new Date().toISOString(),nome,canal:ESP.canal,whatsapp:ESP.canal==="whatsapp"?cont:"",email:ESP.canal==="email"?cont:"",lgpd:"autorizou"})}).catch(()=>{}); }catch(err){} }
  ESP.ok=true; [523,659,784].forEach((f,i)=>setTimeout(()=>som(f,.25,.1),i*110)); travada(); }

/* ===== AÇÕES ===== */
function ir(i){ idx=Math.max(0,Math.min(PASSOS.length-1,i)); extra=null; render(); window.scrollTo({top:0,behavior:"smooth"}); if(PASSOS[idx].t==="fim") terminar(); }
function voltar(){ if(extra){extra=null;return render();} ir(idx-1); }
function pular(){ const p=PASSOS[idx];
  if(p.t==="linha") LINHAS[p.i].looks.forEach(l=>{ if(R[l.id]==null) R[l.id]="pulou"; });
  if(p.t==="favorita"&&R.linha_favorita==null) R.linha_favorita="pulou";
  if(p.t==="pers"&&R[PERS[p.i].id]==null) R[PERS[p.i].id]="pulou";
  som(300); ir(idx+1); }
function nota(id,n){ R[id]=n; som(500+n*40); const y=window.scrollY; render(); window.scrollTo({top:y}); }
function seguirLinha(i){ const falta=LINHAS[i].looks.filter(l=>R[l.id]==null); if(falta.length){ $("err").textContent="Dê nota para os dois looks, ou toque em pular."; return; } ir(idx+1); }
function escolhe(k,v){ R[k]=v; som(700); render(); setTimeout(()=>ir(idx+1),330); }
function terminar(){
  if(R._enviado) return; R._enviado=true;
  const dados={aba:ABA,pesquisa:"luzia",quando:new Date().toISOString(),tempo_seg:Math.round((Date.now()-t0)/1000)};
  LINHAS.forEach(L=>L.looks.forEach(l=>dados["nota_"+l.id]=R[l.id]??"")); dados.linha_favorita=R.linha_favorita??""; PERS.forEach(p=>dados[p.id]=R[p.id]??"");
  if(ENDPOINT){ try{ fetch(ENDPOINT,{method:"POST",mode:"no-cors",keepalive:true,headers:{"Content-Type":"text/plain"},body:JSON.stringify(dados)}).catch(()=>{}); }catch(e){} }
  window._ultimoEnvio=dados;
  const c=$("confete"); c.innerHTML=Array.from({length:40},(_,i)=>`<i style="left:${Math.random()*100}%;background:${["#ffcf3a","#2f5bd1","#fff","#f5a623"][i%4]};animation-delay:${Math.random()*.6}s"></i>`).join("");
  [523,659,784,1046].forEach((f,i)=>setTimeout(()=>som(f,.3,.1),i*110)); setTimeout(()=>c.innerHTML="",3500);
}

/* ===== BARRA DE VALIDAÇÃO (só na prévia; sai quando for para o site) ===== */
const REV=["Texto","Fotos","Cores","Tamanho da letra","Ordem das telas","Botões","Tirar esta tela"];
let V={}, revOn=false, resumoOn=false;
function barra(){
  if(NO_SITE){ const el=$("val"); if(el){ el.innerHTML=""; el.style.display="none"; } return; }
  const p=extra?{nome:extra==="sala"?"Sala da Luzia (em breve)":"Próximo morador (Duda)"}:(RESPOSTAS_JA>=LIMITE&&!R._comecou?{nome:"Tela de pesquisa travada"}:PASSOS[idx]);
  const k=p.nome, v=V[k];
  let h=`<div class="row"><b>PRÉVIA ·</b> <span>Tela: ${esc(k)}</span>
    <button class="v" onclick="marca('${esc(k)}','validado')">✅ Validado</button><button class="r" onclick="revOn=!revOn;barra()">✏️ Revisar</button>
    <span class="st">${v?(v.s==="validado"?"✅ validado":"✏️ revisar: "+(v.rev.join(", ")||"—")):""}</span></div>`;
  if(revOn) h+=`<div class="chips">${REV.map(r=>`<button class="${v&&v.rev&&v.rev.includes(r)?"on":""}" onclick="togRev('${esc(k)}','${r}')">${r}</button>`).join("")}<button class="v" onclick="revOn=false;barra()">Pronto</button></div>`;
  h+=`<div class="row" style="margin-top:6px"><span>Simular respostas:</span><button onclick="RESPOSTAS_JA=0;R={};idx=0;render()">0</button><button onclick="RESPOSTAS_JA=72;render()">72 (mostra contador)</button><button onclick="RESPOSTAS_JA=100;R={};idx=0;render()">100 (trava)</button><button class="t" onclick="resumoOn=!resumoOn;barra()">${resumoOn?"fechar resumo":"ver resumo da validação"}</button></div>`;
  if(resumoOn){ const ks=Object.keys(V); h+=`<div class="resumo">${ks.length?`<ul>${ks.map(x=>`<li><b style="color:#fff">${esc(x)}</b>: ${V[x].s==="validado"?"✅ validado":"✏️ revisar ("+(V[x].rev.join(", ")||"sem detalhe")+")"}</li>`).join("")}</ul>`:"Nada marcado ainda."}
    <button class="v" onclick="copiar(this)">Copiar resumo para mandar ao Claude</button></div>`; }
  $("val").innerHTML=h;
}
function marca(k,s){ V[k]={s,rev:(V[k]&&V[k].rev)||[]}; if(s==="validado"){V[k].rev=[];revOn=false;} barra(); }
function togRev(k,r){ V[k]=V[k]||{s:"revisar",rev:[]}; V[k].s="revisar"; const i=V[k].rev.indexOf(r); i>=0?V[k].rev.splice(i,1):V[k].rev.push(r); barra(); }
function copiar(b){ const t="VALIDAÇÃO · Pesquisa 1 de 7 (Luzia)\n"+Object.keys(V).map(x=>`- ${x}: ${V[x].s==="validado"?"validado":"revisar ("+(V[x].rev.join(", ")||"sem detalhe")+")"}`).join("\n");
  try{ navigator.clipboard.writeText(t).then(()=>b.textContent="Copiado ✓",()=>b.textContent="Não deu para copiar"); }catch(e){ b.textContent="Não deu para copiar"; } }
render();
if(ENDPOINT){ fetch(ENDPOINT+"?acao=contagem").then(r=>r.json()).then(j=>{ if(j&&typeof j.luzia==="number"){ RESPOSTAS_JA=j.luzia; if(!R._comecou&&idx===0) render(); } }).catch(()=>{}); }
</script>
