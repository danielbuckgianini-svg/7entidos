<script>
/* Ambientes da família 7entidos. Cada pessoa entra pelo seu link (?t=código).

   Trilha 2 de brincadeira e prêmio = desenho dele no app. Mães: Fase 1 (como mãe, o que quer para o filho) e Fase 2
   (papel na formação), tom de irmão para irmã, perguntas de cena, duelo e imaginação. Cruzamento só para o Daniel e a mãe.
   Vídeo de entrada: texto animado com as 7 luzes, um por pessoa, depois vira botão "rever o vídeo". */
const URL_ROBO=window.FAMILIA_URL||'';
const T=new URLSearchParams(location.search).get('t')||'';
const C7=['#FFD23F','#5AB8FF','#FF8A5C','#7DDB8B','#FF6FA3','#A98BFF','#3FE0D0'];
const KIDS={ricardo:{nome:'Ricardo',cor:'#5AB8FF',mae:'juliana'},joao:{nome:'João',cor:'#7DDB8B',mae:'paola'},lucas:{nome:'Lucas',cor:'#FF6FA3',mae:'paola'}};

const AREAS={dir:['Direito e marca','Cuidar das regras, dos contratos e do nome 7entidos.'],com:['Comunicação e redes','Fazer o 7entidos ser conhecido: posts, vídeos e conversas.'],prod:['Experiência do app','Pensar como cada tela faz a pessoa se sentir bem.'],tec:['Tecnologia e IA','Construir o app e ensinar a inteligência artificial.'],neg:['Negócio e números','Vendas, dinheiro e para onde a empresa vai.'],pes:['Pesquisa sobre pessoas','Descobrir o que faz as pessoas se sentirem bem.'],int:['Internacional','Levar o 7entidos para outros países e idiomas.'],cri:['Criatividade e design','Cores, desenhos, sons e o jeito do app.']};
const E=(id,q,o,x)=>Object.assign({id,q,o},x||{});
/* ---------- Jornada 1 dos meninos (16 e 18): bate-papo sobre sonhos ---------- */
const J1=[
 E('a1','Pra começar: como você tá hoje?',['😄 Muito bem','🙂 De boa','😐 Mais ou menos','😴 Cansado']),

 E('a3','Um dia inteiro sem ninguém te cobrar nada. O que você faz?',['Jogo ou assisto algo','Crio alguma coisa','Fico com os amigos','Esporte ou movimento','Aprendo algo novo']),
 E('a4','Daqui a 10 anos, você se imagina…',['Com um negócio meu','Numa empresa grande','Viajando o mundo','Ainda descobrindo, e tá tudo bem']),
 E('a5','O que mais importa num trabalho?',['Fazer algo que eu amo','Ganhar bem','Liberdade de horário','Ajudar pessoas','Ser reconhecido']),
 E('a6','Qual tem mais a ver com você?',['Prefiro fazer','Prefiro entender antes'],{duelo:true}),
 E('a7','E essa?',['Fazer junto','Fazer sozinho'],{duelo:true}),
 E('a8','Quem você admira é alguém que…',['Construiu algo do zero','É muito bom no que faz','Cuida das pessoas','Ousa e arrisca']),
 E('a9','Qual desses sonhos é mais seu?',['Ser dono do meu tempo','Criar algo que muita gente usa','Morar fora','Ser referência no que faço','Ter uma família']),
 E('a10','Última: em uma palavra, o que você quer da vida?',null,{texto:true})];
/* ---------- Jornada 1 do Lucas: desafios de 1 minuto ---------- */
const J1L=[
 E('b1','⏱️ Desafio 1: feche os olhos e conte quantos sons você ouve agora. Quantos?',['1 ou 2','3 ou 4','5 ou mais']),
 E('b2','⏱️ Desafio 2: qual cheiro da sua casa você mais gosta?',['Comida gostosa','Bolo no forno','Perfume','Roupa limpa']),
 E('b3','⏱️ Desafio 3: qual brincadeira te deixa mais feliz?',['Videogame','Desenhar','Bola','Lego e blocos']),
 E('b4','⏱️ Desafio 4: se você tivesse um superpoder, qual seria?',['Voar','Ficar invisível','Super força','Falar com os animais']),
 E('b5','⏱️ Desafio 5: o que te faz rir muito?',['Piada','Vídeo engraçado','Cócegas','Brincar com os amigos']),
 E('b6','⏱️ Desafio 6: o que você quer ser quando crescer?',['Jogador','Cientista','Youtuber','Artista','Ainda não sei']),

/* ---------- Trilha 2 de brincadeira (Lucas) ---------- */
const MUNDOS=[['cri','🎨 Mundo dos Desenhos'],['tec','🕹️ Mundo dos Jogos'],['com','🎬 Mundo dos Vídeos'],['pes','🔍 Mundo dos Detetives'],['neg','🏪 Mundo da Lojinha'],['int','🌍 Mundo das Viagens'],['prod','🧩 Mundo das Invenções'],['dir','🛡️ Mundo dos Guardiões']];
/* ---------- Mães: Fase 1 e Fase 2 ({f} = filho ou filhos) ---------- */
const M1=[
 E('m1','Quando você pensa no {f} daqui a 10 anos, o que mais te deixaria feliz?',['Feliz com o que faz','Independente','Perto da família','Realizado e reconhecido']),
 E('m2','O que pesa mais para você?',['Ele seguro','Ele livre'],{duelo:true}),
 E('m3','E aqui?',['Ganhar bem','Amar o que faz'],{duelo:true}),
 E('m4','Cena: ele chega e diz "quero largar tudo e empreender". Sua primeira reação?',['"Bora, eu apoio!"','"Calma, vamos planejar"','Fico preocupada','Pergunto o que ele sentiu']),
 E('m5','Como você é como mãe, numa palavra?',['Protetora','Parceira','Exigente','Leve']),
 E('m6','O que você mais quer que ele aprenda com o 7entidos?',['Responsabilidade','Criatividade','Trabalhar em equipe','Lidar com dinheiro','Confiança nele mesmo']),
 E('m7','E você? O que faz bem para você?',['Tempo sozinha','Família reunida','Um trabalho que eu amo','Natureza e viagem']),
 E('m8','Um recado seu para mim sobre o {f}:',null,{texto:true})];
const M2=[
 E('n1','Imagine: daqui a 1 ano, o {f} apresenta algo que criou no 7entidos. Onde você está?',['Na primeira fila, aplaudindo','Nos bastidores, ajudando','Fui eu que dei a ideia','Em casa, orgulhosa']),
 E('n2','Qual papel combina mais com você nessa jornada?',['Torcedora','Conselheira','Parceira de missões','Quem cobra os combinados']),
 E('n3','O que você prefere?',['Participar das decisões','Só acompanhar'],{duelo:true}),
 E('n4','E aqui?',['Ajudar com tempo','Ajudar com ideias'],{duelo:true}),
 E('n5','Cena: ele trava numa missão. Você…',['Ajuda a fazer','Faz perguntas até ele achar o caminho','Chama o Daniel','Deixa ele resolver sozinho']),
 E('n6','Se você ajudasse o 7entidos em alguma coisa, seria em…',['Ideias para o app','A rotina dos meninos com as missões','Divulgar para as amigas','Organizar as coisas','Nada por enquanto']),
 E('n7','Quanto tempo por mês você teria para isso?',['Nada agora','Umas horas','Algumas tardes','O que precisar']),
 E('n8','O que você sonha para essa parceria nossa?',null,{texto:true})];
const MJ=[ /* olhar da Juliana sobre o João (decisão u5) */
 E('o1','No trabalho com você, o João é…',['Muito responsável','Criativo','Bom com pessoas','Ainda aprendendo']),
 E('o2','Onde ele brilha mais?',['Organização','Conversa com clientes','Resolver problemas','Aprender rápido']),
 E('o3','O que ele ainda pode desenvolver?',['Iniciativa','Organização','Confiança','Comunicação'])];
const MISSOES=[{id:'m1',t:'Missão 1 · Seguir os canais do 7entidos',links:[['📸 Instagram','https://www.instagram.com/7entidoss/'],['👍 Facebook','https://www.facebook.com/profile.php?id=61596119254628'],['💼 LinkedIn','https://www.linkedin.com/company/145418964/'],['🌐 Site','https://7entidos.com.br']]}];
const PREFS=[{id:'tempo',q:'Tempo por semana',o:['Até 15 minutos','Cerca de 1 hora','Mais de 1 hora']},{id:'tipo',q:'Tipo de participação',o:['Brincadeira e curiosidade','Aprender os bastidores','Pequenas tarefas de verdade']},{id:'expo',q:'Aparecer nas redes do 7entidos',o:['Não','Só o primeiro nome','Com autorização a cada vez']}];
const HUM=['😊','😐','😕'];
/* ---------- roteiro dos vídeos (1 minuto, 8 telas) ---------- */
function roteiro(){const n=EU.nome;
 if(EU.id==='lucas')return [`Oi, ${n}! 👋`,'Este é o seu cantinho no 7entidos.','Aqui tem desafios de 1 minuto. Bem rapidinhos!','Peça para a mamãe ficar do seu lado. Vocês jogam juntos.','Toque na resposta que tem a ver com você.','No fim, você faz um desenho…','…e ele pode virar parte do app! 🎨','Bora começar?'];
 if(EU.papel==='menino')return [`Oi, ${n}! 👋`,'Este é o seu espaço no 7entidos.','Primeiro, um bate-papo rápido para eu te conhecer melhor.','Não tem resposta certa. É sobre você e os seus sonhos.','É só tocar na resposta. Se uma não tiver nada a ver, toque no ✕.','Quando terminar, abre uma surpresa: a Trilha 2.','Toda semana chega coisa nova. Tudo fica salvo neste link, que é só seu.','Bora?'];
 const fs=EU.meninos.map(k=>KIDS[k].nome).join(' e o ');
 return [`Oi, ${n}! 💛`,`Este é o nosso cantinho para acompanhar o ${fs}.`,'Primeiro, eu quero te conhecer melhor como mãe.','Depois, abre a fase 2: o seu papel nessa história.','Algumas perguntas são cenas e escolhas. Vai no coração, sem pensar muito.',`Aqui você também vê a evolução do ${fs} e conversa comigo.`,'Tudo fica salvo neste link, que é só seu.','Vamos juntos? 🌱'];}

/* ---------- estado ---------- */
let EU=null,L=[],ABA=null,KID=null,ERRO='',VID=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);};
function ult(quem,menino,tipo,chave){for(let i=L.length-1;i>=0;i--){const r=L[i];if(r.quem===quem&&r.menino===menino&&r.tipo===tipo&&r.chave===chave)return r;}return null;}
const val=(quem,menino,chave)=>{const r=ult(quem,menino,'eu',chave);return r&&r.valor!==''?r:null;};
function salva(menino,tipo,chave,valor,texto){const r={em:new Date().toISOString(),quem:EU.id,menino,tipo,chave,valor:valor==null?'':String(valor),texto:texto||''};L.push(r);try{localStorage.setItem(window.PREVIA?'fam_prev_'+EU.id:'fam_'+T,JSON.stringify(L));}catch(e){}render(true);
 if(!URL_ROBO||window.PREVIA)return;try{fetch(URL_ROBO,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({t:T},r)),keepalive:true});}catch(e){toast('Não consegui enviar agora.');}}
const meuMenino=()=>EU.papel==='menino'?EU.id:'';
const fNome=()=>EU.meninos.map(k=>KIDS[k].nome).join(' e o ');
const fx=s=>s.replace(/\{f\}/g,fNome());

/* ---------- jornada (uma pergunta por vez, como conversa) ---------- */
function feitas(lista,pre,quem,menino){return lista.filter(p=>val(quem,menino,pre+p.id)).length;}
function jornada(lista,pre,titulo,cor){const quem=EU.id,men=meuMenino();const n=feitas(lista,pre,quem,men);
 const prog=`<div class="prog">${lista.map((p,i)=>`<i class="${i<n?'ok':''}"></i>`).join('')}</div>`;
 const hist=lista.slice(0,n).slice(-2).map(p=>{const r=val(quem,men,pre+p.id);return `<div class="bal">${esc(fx(p.q))}</div><div class="bal eu">${esc(p.texto?r.texto:p.o[+r.valor])}</div>`;}).join('');
 if(n>=lista.length)return `<h2>${titulo}</h2>${prog}<div class="fim"><div class="big">✨</div><b>Concluída!</b></div>`;
 const p=lista[n];const nr=ult(quem,men,'nao',pre+p.id);const nao=nr&&nr.valor?nr.valor.split(','):[];
 let corpo;
 if(p.texto)corpo=`<textarea id="jt" maxlength="300" placeholder="Escreva aqui…"></textarea><div style="margin-top:8px"><button class="btn pri" data-a="jtx" data-c="${pre+p.id}">Enviar</button></div>`;
 else if(p.duelo)corpo=`<div class="duelo"><button class="opb" data-a="jsel" data-c="${pre+p.id}" data-i="0">${esc(p.o[0])}</button><span>ou</span><button class="opb" data-a="jsel" data-c="${pre+p.id}" data-i="1">${esc(p.o[1])}</button></div>`;
 else corpo=`<div class="opts">${p.o.map((o,j)=>`<div class="op${nao.includes(String(j))?' nq':''}" style="--c:${cor}"><button class="opb" data-a="jsel" data-c="${pre+p.id}" data-i="${j}"><span class="rd"></span><b>${esc(o)}</b></button>${p.o.length>1?`<button class="nqb${nao.includes(String(j))?' on':''}" data-a="jnao" data-c="${pre+p.id}" data-i="${j}" aria-label="Não tem a ver">✕</button>`:''}</div>`).join('')}</div>`;
 return `<h2>${titulo}</h2>${prog}<div class="chat">${hist}<div class="bal">${esc(fx(p.q))}</div></div>${corpo}
 ${n>0?`<p style="margin-top:12px"><button class="btn" style="min-height:40px;padding:6px 12px" data-a="jvolta" data-c="${pre+lista[n-1].id}">← voltar uma</button></p>`:''}`;}
/* Trilha 2 dos meninos: as 8 áreas */
function trilha2(){const quem=EU.id,men=EU.id;const ks=Object.keys(AREAS);
 const nota=a=>{const r=val(quem,men,'t2_'+a);return r?+r.valor:null;};const n=ks.filter(a=>nota(a)!=null).length;
 const top=ks.filter(a=>nota(a)!=null).sort((x,y)=>nota(x)-nota(y)).slice(0,3);
 return `<h2>🧭 Trilha 2 · Os caminhos do 7entidos</h2><p class="small mute" style="margin:0">8 áreas da empresa. Diga o quanto cada uma tem a ver com você.</p><div class="prog">${ks.map(a=>`<i class="${nota(a)!=null?'ok':''}"></i>`).join('')}</div>
 ${ks.map((a,i)=>`<div class="ilha" style="--c:${C7[i%7]}"><b>${esc(AREAS[a][0])}</b><p>${esc(AREAS[a][1])}</p><div class="mini">${['😍 Muito','🙂 Um pouco','😐 Não muito'].map((o,j)=>`<button class="${nota(a)===j?'on':''}" data-a="t2" data-c="t2_${a}" data-i="${j}">${o}</button>`).join('')}</div></div>`).join('')}
 ${n===ks.length?`<div class="sec" style="margin-top:14px;border-color:var(--pe)"><h2>🌟 Seus 3 caminhos para testar</h2><div class="top3">${top.map((a,i)=>`<div>${i+1}. ${esc(AREAS[a][0])}</div>`).join('')}</div><p class="small mute">As próximas missões vão ser nesses caminhos.</p></div>`:''}`;}
function trilha2L(){const ch=MUNDOS.filter(([a])=>val('lucas','lucas','t2_'+a));
 return `<h2>🌍 Os mundos do 7entidos</h2><p class="small mute" style="margin:0">Escolha os 3 mundos mais legais!</p>
 <div class="opts" style="margin-top:10px">${MUNDOS.map(([a,n])=>{const on=!!val('lucas','lucas','t2_'+a);return `<div class="op${on?' on':''}" style="--c:var(--pe)"><button class="opb" data-a="mundo" data-c="t2_${a}" ${!on&&ch.length>=3?'disabled':''}><span class="rd"></span><b>${n}</b></button></div>`;}).join('')}</div>
 ${ch.length===3?`<div class="fim"><div class="big">🎉</div><b>Você é um explorador dos sentidos!</b></div>`:''}`;}

/* ---------- outros blocos ---------- */
function missoes(k,pode){return MISSOES.map(m=>{const r=ult(k,k,'missao',m.id);const feita=r&&r.valor==='feita';const h=ult(k,k,'humor',m.id);
 return `<div class="pq" style="--c:${feita?'var(--ok)':KIDS[k].cor}"><b class="qt">${esc(m.t)}</b>${pode?`<div class="chips">${m.links.map(([n,u])=>`<a class="ch" href="${u}" target="_blank" rel="noopener" style="text-decoration:none">${n}</a>`).join('')}</div><div style="margin-top:10px"><button class="btn ${feita?'ok':'pri'}" data-a="mis" data-k="${k}" data-m="${m.id}">${feita?'✓ Concluída':'Concluí!'}</button></div>${feita?`<div class="hum">${HUM.map((x,i)=>`<button class="${h&&h.valor===String(i)?'on':''}" data-a="hum" data-k="${k}" data-m="${m.id}" data-i="${i}">${x}</button>`).join('')}</div>`:''}`
 :`<span class="tag" style="background:${feita?'var(--ok)':'var(--soft)'};color:${feita?'#0A0F24':'var(--ink)'}">${feita?'✓ concluída'+(h?' '+HUM[+h.valor]:''):'ainda não'}</span>`}</div>`;}).join('');}
function conversa(com){const ids=[EU.id,com];const M=L.filter(r=>r.tipo==='recado'&&ids.includes(r.quem)&&ids.includes(r.chave));
 return `${M.length?M.map(r=>`<div class="msg ${r.quem===EU.id?'eu':'ele'}">${esc(r.texto)}<small>${esc(NOMEP[r.quem]||r.quem)} · ${esc((r.em||'').slice(8,10)+'/'+(r.em||'').slice(5,7))}</small></div>`).join(''):`<div class="vazio">Nenhuma mensagem ainda.</div>`}
 <textarea id="tx-${com}" maxlength="800" placeholder="Escreva para ${esc(NOMEP[com]||com)}…"></textarea><div style="margin-top:8px"><button class="btn pri" data-a="rec" data-to="${com}">Enviar</button></div>`;}
function respostas(quem,men,lista,pre){return lista.map(p=>{const r=val(quem,men,pre+p.id);if(!r)return '';return `<div class="pq" style="--c:var(--pe)"><span class="small mute">${esc(p.q.replace(/\{f\}/g,'filho'))}</span><br><b>${esc(p.texto?r.texto:p.o[+r.valor])}</b></div>`;}).join('')||`<div class="vazio">Ainda sem respostas.</div>`;}
function areasDe(k){if(k==='lucas')return MUNDOS.filter(([a])=>val('lucas','lucas','t2_'+a)).map(m=>m[1]);return Object.keys(AREAS).filter(a=>{const r=val(k,k,'t2_'+a);return r&&r.valor==='0';}).map(a=>AREAS[a][0]);}
function evolucao(k){const j=k==='lucas'?J1L:J1;const n=feitas(j,'j1_',k,k);const ar=areasDe(k);
 return `<div class="sec"><h2>🎯 Missões</h2>${missoes(k,false)}</div>
 <div class="sec"><h2>🗺️ Jornada</h2><p class="small" style="margin:0">Jornada 1: <b>${n}/${j.length}</b>${n>=j.length?' ✓':''}</p><p class="small" style="margin:4px 0 0">Trilha 2: ${ar.length?'<b>'+ar.map(esc).join(' · ')+'</b>':'ainda não'}</p></div>
 <div class="sec"><h2>💬 O que ${KIDS[k].nome} respondeu</h2>${respostas(k,k,j,'j1_')}</div>`;}
function prefs(k){return PREFS.map(p=>{const r=ult(EU.id,k,'pref',p.id);return `<div style="margin-top:10px"><b class="small">${esc(p.q)}</b><div class="chips">${p.o.map((o,i)=>`<button class="ch${r&&r.valor===String(i)?' on':''}" data-a="pref" data-k="${k}" data-p="${p.id}" data-i="${i}">${esc(o)}</button>`).join('')}</div></div>`;}).join('');}
const tabsHtml=t=>`<div class="tabs">${t.map(([a,x])=>`<button class="tab${ABA===a?' on':''}" data-a="aba" data-v="${a}">${x}</button>`).join('')}</div>`;
const rever=()=>`<button class="btn" style="min-height:38px;padding:6px 12px;font-size:14px" data-a="video">▶ Rever o vídeo</button>`;

/* ---------- telas ---------- */
function telaMenino(){const k=EU.id;const L1=k==='lucas'?J1L:J1;const fim1=!!window.LIBERA||feitas(L1,'j1_',k,k)>=L1.length;
 const tabs=[['j1','🗺️ Jornada 1'],['t2',fim1?'🧭 Trilha 2':'🔒 Trilha 2'],['mis','🎯 Missões'],['msg','💬 Daniel']];ABA=ABA||'j1';
 let c;if(ABA==='j1')c=jornada(L1,'j1_',k==='lucas'?'Desafios de 1 minuto':'Bate-papo para te conhecer',KIDS[k].cor)+(fim1?`<div class="sec" style="margin-top:12px;border-color:var(--pe);text-align:center"><b>🎁 Surpresa: a Trilha 2 abriu!</b><div style="margin-top:8px"><button class="btn pri" data-a="aba" data-v="t2">Abrir a Trilha 2 →</button></div></div>`:'');
 else if(ABA==='t2')c=fim1?(k==='lucas'?trilha2L():trilha2()):`<div class="vazio">🔒 Termine a Jornada 1 para abrir.</div>`;
 else if(ABA==='mis')c=`<h2>Suas missões</h2>${missoes(k,true)}`;else c=`<h2>Fale com o Daniel</h2>${conversa('daniel')}`;
 return `<h1 class="f">Oi, ${esc(EU.nome)}! 👋</h1>${rever()}${tabsHtml(tabs)}<div class="sec">${c}</div>`;}
function telaMae(){const ks=EU.meninos;KID=KID||ks[0];const fim1=!!window.LIBERA||feitas(M1,'f1_',EU.id,'')>=M1.length;
 const tabs=[['f1','💛 Fase 1'],['f2',fim1?'💼 Fase 2':'🔒 Fase 2'],['ev','📈 Os meninos'],['pref','⚙️ Preferências'],['msg','💬 Daniel']];if(EU.id==='juliana')tabs.splice(2,0,['oj','👀 O João']);ABA=ABA||'f1';
 let c;
 if(ABA==='f1')c=jornada(M1,'f1_','Fase 1 · Te conhecer','#FFD23F')+(fim1?`<div class="sec" style="margin-top:12px;border-color:var(--pe);text-align:center"><b>🎁 A Fase 2 abriu!</b><div style="margin-top:8px"><button class="btn pri" data-a="aba" data-v="f2">Abrir a Fase 2 →</button></div></div>`:'');
 else if(ABA==='f2')c=fim1?jornada(M2,'f2_','Fase 2 · O seu papel nessa história','#A98BFF'):`<div class="vazio">🔒 Termine a Fase 1 para abrir.</div>`;
 else if(ABA==='oj')c=jornada(MJ,'oj_','Seu olhar sobre o João','#7DDB8B');
 else if(ABA==='ev')c=`${ks.length>1?`<div class="chips">${ks.map(x=>`<button class="ch${x===KID?' on':''}" data-a="kid" data-k="${x}">${KIDS[x].nome}</button>`).join('')}</div>`:''}${evolucao(KID)}`;
 else if(ABA==='pref')c=`${ks.length>1?`<div class="chips">${ks.map(x=>`<button class="ch${x===KID?' on':''}" data-a="kid" data-k="${x}">${KIDS[x].nome}</button>`).join('')}</div>`:''}<h2 style="margin-top:10px">Para o ${KIDS[KID].nome}</h2>${prefs(KID)}`;
 else c=`<h2>Conversa com o Daniel</h2>${conversa('daniel')}`;
 return `<h1 class="f">Oi, ${esc(EU.nome)}! 💛</h1>${rever()}${tabsHtml(tabs)}<div class="sec">${c}</div>`;}
function telaDono(){const ks=['ricardo','joao','lucas','juliana','paola'];KID=KID||'ricardo';ABA=ABA||'ev';const k=KID;const mae=!KIDS[k];
 const tabs=[['ev',mae?'💛 Respostas':'📈 Evolução'],['msg','💬 Conversa']];
 let c;
 if(ABA==='msg')c=`<h2>Conversa com ${esc(NOMEP[k])}</h2>${conversa(k)}`;
 else if(mae)c=`<h2>Fase 1</h2>${respostas(k,'',M1,'f1_')}<h2 style="margin-top:14px">Fase 2</h2>${respostas(k,'',M2,'f2_')}${k==='juliana'?`<h2 style="margin-top:14px">Olhar sobre o João</h2>${respostas(k,'',MJ,'oj_')}`:''}`;
 else{const m=KIDS[k].mae;c=evolucao(k)+`<div class="sec"><h2>⚙️ Preferências da ${NOMEP[m]}</h2>${PREFS.map(p=>{const r=ult(m,k,'pref',p.id);return `<p class="small" style="margin:6px 0"><b>${esc(p.q)}:</b> ${r&&r.valor!==''?esc(p.o[+r.valor]):'—'}</p>`;}).join('')}</div>`;}
 return `<h1 class="f">Painel da família</h1><div class="chips">${ks.map(x=>`<button class="ch${x===k?' on':''}" data-a="kid" data-k="${x}">${NOMEP[x]}</button>`).join('')}</div>${tabsHtml(tabs)}<div class="sec">${c}</div>`;}
function render(keep){const y=scrollY;const app=document.getElementById('app');
 const topo=`<div style="display:flex;align-items:center;gap:10px"><b class="f" style="font-size:19px"><span style="color:var(--pe)">7</span>entidos</b><span class="luzes">${C7.map(c=>`<i style="background:${c}"></i>`).join('')}</span></div>`;
 if(!EU){app.innerHTML=topo+`<div class="sec" style="margin-top:16px"><h2>${ERRO?'Não consegui abrir':'Abrindo…'}</h2><p class="mute">${ERRO||'Um momento.'}</p></div>`;return;}
 app.innerHTML=topo+(EU.papel==='menino'?telaMenino():EU.papel==='mae'?telaMae():telaDono());if(keep)scrollTo(0,y);}

/* ---------- vídeo de entrada: 8 telas, cerca de 1 minuto ---------- */
function video(){if(VID)return;const R=roteiro();const D=7500;let i=0;const el=document.createElement('div');el.className='vid';el.setAttribute('role','dialog');el.setAttribute('aria-label','Vídeo de boas-vindas');
 el.innerHTML=`<div class="bar"><i></i></div><div class="an">${C7.map((c,k)=>{const a=(-90+k*360/7)*Math.PI/180;return `<i style="background:${c};color:${c};left:${67+Math.cos(a)*62}px;top:${67+Math.sin(a)*62}px"></i>`;}).join('')}</div><div class="tx"></div><div class="ctl"><button class="btn" data-v="pula">Pular</button><button class="btn pri" data-v="prox">Seguir →</button></div>`;
 document.body.appendChild(el);const tx=el.querySelector('.tx'),bar=el.querySelector('.bar i'),luz=[...el.querySelectorAll('.an i')];let tm=null;
 const fim=()=>{clearTimeout(tm);el.remove();VID=null;try{localStorage.setItem('fam_visto_'+T,'1');}catch(e){}if(EU&&!ult(EU.id,meuMenino(),'visto','video'))salva(meuMenino(),'visto','video','1');};
 const mostra=()=>{if(i>=R.length){fim();return;}tx.style.animation='none';void tx.offsetWidth;tx.style.animation='';tx.textContent=R[i];bar.style.width=((i+1)/R.length*100)+'%';luz.forEach((l,k)=>l.classList.toggle('on',k<=Math.round(i*6/(R.length-1))));el.querySelector('[data-v="prox"]').textContent=i===R.length-1?'Começar ✨':'Seguir →';clearTimeout(tm);tm=setTimeout(()=>{i++;mostra();},D);};
 el.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;if(b.dataset.v==='pula')fim();else{i++;mostra();}});VID=el;mostra();}

/* ---------- ações ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||!EU)return;const a=b.dataset.a,k=b.dataset.k,c=b.dataset.c;const men=meuMenino();
 if(a==='aba'){ABA=b.dataset.v;render();scrollTo(0,0);return;}
 if(a==='kid'){KID=k;render(true);return;}
 if(a==='video'){video();return;}
 if(a==='jsel'){salva(men,'eu',c,b.dataset.i);return;}
 if(a==='jtx'){const t=(document.getElementById('jt').value||'').trim();if(!t){toast('Escreva algo primeiro.');return;}salva(men,'eu',c,'texto',t.slice(0,300));return;}
 if(a==='jnao'){const r=ult(EU.id,men,'nao',c);const s=new Set(r&&r.valor?r.valor.split(','):[]);const i=b.dataset.i;s.has(i)?s.delete(i):s.add(i);salva(men,'nao',c,[...s].join(','));return;}
 if(a==='jvolta'){salva(men,'eu',c,'');return;}
 if(a==='t2'){const r=val(EU.id,men,c);salva(men,'eu',c,r&&r.valor===b.dataset.i?'':b.dataset.i);return;}
 if(a==='mundo'){const r=val(EU.id,men,c);salva(men,'eu',c,r?'':'1');return;}
 if(a==='mis'){const r=ult(k,k,'missao',b.dataset.m);salva(k,'missao',b.dataset.m,r&&r.valor==='feita'?'':'feita');if(!(r&&r.valor==='feita'))toast('Boa! 🎉');return;}
 if(a==='hum'){salva(k,'humor',b.dataset.m,b.dataset.i);return;}
 if(a==='pref'){const r=ult(EU.id,k,'pref',b.dataset.p);salva(k,'pref',b.dataset.p,r&&r.valor===b.dataset.i?'':b.dataset.i);return;}
 if(a==='rec'){const to=b.dataset.to;const t=(document.getElementById('tx-'+to).value||'').trim();if(!t)return;salva(EU.papel==='menino'?EU.id:(KIDS[to]?to:''),'recado',to,'',t.slice(0,800));toast('Enviado');return;}});

/* ---------- abrir ---------- */
(async()=>{render();
 if(window.PREVIA){EU=window.PREVIA.eu;try{const c=JSON.parse(localStorage.getItem('fam_prev_'+EU.id)||'null');if(Array.isArray(c))L=c;}catch(e){}render();if(EU.papel!=='dono')video();return;}
 if(!T){ERRO='Este link está incompleto. Peça ao Daniel o seu link.';render();return;}
 try{const c=JSON.parse(localStorage.getItem('fam_'+T)||'null');if(Array.isArray(c))L=c;}catch(e){}
 if(!URL_ROBO){ERRO='O espaço ainda está sendo preparado. Volte em breve.';render();return;}
 try{const r=await fetch(URL_ROBO+'?t='+encodeURIComponent(T));const j=await r.json();
  if(!j.ok){ERRO='Link não reconhecido. Peça ao Daniel o seu link.';render();return;}
  EU=j.eu;L=j.linhas||[];try{localStorage.setItem('fam_'+T,JSON.stringify(L));}catch(e){}render();
  let visto=false;try{visto=localStorage.getItem('fam_visto_'+T)==='1';}catch(e){}
  if(!visto&&EU.papel!=='dono'&&!ult(EU.id,meuMenino(),'visto','video'))video();}
 catch(e){ERRO='Sem conexão agora. Tente de novo em instantes.';render();}})();
</script></body></html>
