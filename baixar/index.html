<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baixe o app 7entidos</title>
<meta name="description" content="Baixe grátis o app 7entidos. A vida é feita de boas sensações.">
<link rel="icon" href="/app/mandala-icone.png" type="image/png">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a1128;color:#f6efe2;font:400 17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
img{width:120px;height:120px;border-radius:50%;box-shadow:0 0 50px rgba(245,197,66,.5)}
h1{font:400 30px Georgia,serif;margin:18px 0 6px}
a{display:block;margin:12px auto 0;max-width:300px;padding:16px;border-radius:16px;font-weight:700;text-decoration:none}
.p{background:#000;color:#fff;border:1px solid rgba(255,255,255,.35)}
.i{background:#f5c542;color:#111}
small{display:block;margin-top:16px;color:#a9b3d1}
</style>
</head>
<body>
<main>
  <img src="/assets/home/mandala-7.webp" alt="Mandala do 7entidos">
  <h1>Baixe o app 7entidos</h1>
  <p>É grátis.</p>
  <a class="p" href="https://play.google.com/store/apps/details?id=br.com.setentidos.app&referrer=utm_source%3Dqr_video%26utm_medium%3Dqr%26utm_campaign%3Dbaixar">Disponível no Google Play</a>
  <a class="i" href="/app/?iphone=1&origem=qr">Tenho iPhone</a>
  <small>Tem mais lá no nosso canal: <a style="display:inline;padding:0;color:#f5c542" href="https://www.youtube.com/@7Entidos">youtube.com/@7Entidos</a></small>
</main>
<script src="/pesquisa/config.js?v=20261124"></script>
<script>
/* QR code dos vídeos E anúncios: leva cada pessoa direto para o lugar certo do aparelho dela.
   - Link SEM utm_* (QR dos vídeos): comportamento de sempre, marca "qr_video" na Google Play
     e registra "qr-video" na planilha.
   - Link COM utm_source / utm_medium / utm_campaign (anúncios): repassa esses valores para a
     Google Play (referrer) e para a planilha (pesquisa "anuncio", onde = utm_source).
   - Contagem anônima: ANTES de redirecionar, manda para a planilha só "origem + tipo de aparelho
     + hora". Sem nome, sem cookie, sem rastreador. Outros parâmetros (fbclid, gclid...) são ignorados.
   Só grava no site oficial (prévias e ?teste=1 não gravam — trava do pesquisa/config.js). */
(function(){
  var ua=navigator.userAgent;
  var aparelho=/Android/i.test(ua)?"android":(/iPhone|iPad|iPod/i.test(ua)?"iphone":"computador");
  var URL=window.PESQUISA_URL||"";

  /* Lê um utm_* do endereço e limpa: só letras, números, "-", "_" e ".", no máximo 60 caracteres */
  function utm(nome){
    var m=new RegExp("[?&]"+nome+"=([^&#]*)").exec(location.search||"");
    if(!m) return "";
    var v; try{ v=decodeURIComponent(m[1].replace(/\+/g," ")); }catch(e){ v=m[1]; }
    try{ v=v.normalize("NFD").replace(/[\u0300-\u036f]/g,""); }catch(e){}
    return v.toLowerCase().replace(/[^a-z0-9_.-]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60);
  }
  var fonte=utm("utm_source"), meio=utm("utm_medium"), campanha=utm("utm_campaign");
  var anuncio=!!(fonte||meio||campanha);

  var ref;
  if(anuncio){
    ref=[];
    if(fonte) ref.push("utm_source="+fonte);
    if(meio) ref.push("utm_medium="+meio);
    if(campanha) ref.push("utm_campaign="+campanha);
    ref=ref.join("&");
  } else {
    ref="utm_source=qr_video&utm_medium=qr&utm_campaign=baixar";
  }
  var PLAY="https://play.google.com/store/apps/details?id=br.com.setentidos.app&referrer="+encodeURIComponent(ref);
  var IPHONE="/app/?iphone=1&origem="+encodeURIComponent(anuncio?(fonte||"anuncio"):"qr");

  /* os botões visíveis também passam a levar a origem certa */
  var bp=document.querySelector("a.p"), bi=document.querySelector("a.i");
  if(bp) bp.href=PLAY;
  if(bi) bi.href=IPHONE;

  if(URL){
    var dados=anuncio
      ? {evento:"compartilhou",pesquisa:"anuncio",onde:fonte||"sem-fonte",meio:meio,campanha:campanha,canal:aparelho,quando:new Date().toISOString()}
      : {evento:"compartilhou",pesquisa:"qr-video",onde:"baixar",canal:aparelho,quando:new Date().toISOString()};
    var corpo=JSON.stringify(dados);
    try{
      var ok=navigator.sendBeacon&&navigator.sendBeacon(URL,new Blob([corpo],{type:"text/plain"}));
      if(!ok) fetch(URL,{method:"POST",mode:"no-cors",keepalive:true,headers:{"Content-Type":"text/plain"},body:corpo}).catch(function(){});
    }catch(e){}
  }
  function ir(){
    if(aparelho==="android") location.replace(PLAY);
    else if(aparelho==="iphone") location.replace(IPHONE);
  }
  /* espera um instante para o recado sair antes de trocar de página */
  if(URL) setTimeout(ir,400); else ir();
})();
</script>
<script src="/js/consentimento.js?v=20261118"></script>
</body>
</html>
